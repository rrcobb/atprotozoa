name = "atprotozoa-apex"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Static landing/gallery page. The fetch handler in src/index.ts intercepts
# /.well-known/atproto-did and otherwise falls through to these assets.
assets = { directory = "./public", binding = "ASSETS" }

# Binds the apex domain to the Worker (provisions DNS + cert on deploy).
# NOTE: this must stay ABOVE the [vars] table — in TOML, keys after a table
# header belong to that table, so a `routes` line under [vars] silently becomes
# vars.routes and the domain never binds.
routes = [{ pattern = "bisks.net", custom_domain = true }]

# The apex IS Rob's Bluesky handle. This DID is served at
# /.well-known/atproto-did so Bluesky can verify bisks.net as the handle.
# See notes/30-identity-and-did.md. This is robcobbable.bsky.social's DID.
[vars]
ATPROTO_DID = "did:plc:f6n22z62adionrvb5s6n6vfk"

# redeploy nudge (2026-08-07): pnpm-lock.yaml fell out of sync with the workspace
# starting at the lovecoupons build and silently blocked every deploy since —
# CI's `pnpm install --frozen-lockfile` failed `check`, so `deploy` never ran
# for any site touched in that window. Lockfile fixed; this comment forces this
# site back into the changed-dirs diff so it actually redeploys. See notes/20-deploy.md.
