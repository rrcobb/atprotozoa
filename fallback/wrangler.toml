name = "atprotozoa-fallback"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Catch-all for unclaimed *.bisks.net hostnames.
#
# The zone has a wildcard DNS record and an ACM wildcard cert, so every possible
# subdomain resolves and completes TLS whether or not a site exists behind it.
# This route answers the ones nothing else claims, with a plain 404 instead of a
# raw Cloudflare error.
#
# NOT DEPLOYED YET — the route below is commented out on purpose.
#
# Tried deploying this 2026-07-31 and it took steamtags.bisks.net down (404).
# A wildcard route does NOT lose to a Custom Domain: sites bound via
# `custom_domain = true` got shadowed by `*.bisks.net/*`, while sites on an
# explicit hostname *route* (verbs, sepcheck) kept working. Rolled back
# immediately; all sites recovered.
#
# So the ordering constraint is: every site must be on an explicit
# `<name>.bisks.net/*` route BEFORE this wildcard goes live. The 36 sites still
# on `custom_domain = true` would each go dark otherwise. Uncomment once the
# migration is complete and re-verify a custom-domain site by hand.
#
# Note this would not cover the apex either way — `*.bisks.net` matches one
# level below it, so bisks.net keeps going to atprotozoa-apex.
# routes = [
#   { pattern = "*.bisks.net/*", zone_name = "bisks.net" },
# ]
