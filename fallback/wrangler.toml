name = "atprotozoa-fallback"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Catch-all for unclaimed *.bisks.net hostnames.
#
# The zone has a wildcard DNS record and an ACM wildcard cert, so every possible
# subdomain resolves and completes TLS whether or not a site exists behind it.
# This route answers the ones nothing else claims, with a plain 404 instead of a
# raw Cloudflare error.
#
# A wildcard route does NOT lose to a Custom Domain. Deploying this while 36
# sites were still bound via `custom_domain = true` took steamtags.bisks.net
# down (404) until it was rolled back; sites on an explicit hostname route were
# unaffected. So this can only be live while every real site holds its own
# `<name>.bisks.net/*` route — which is now the case, apex excepted.
#
# The apex stays safe because `*.bisks.net` matches one level BELOW the apex,
# so bisks.net itself never matches this pattern and keeps going to
# atprotozoa-apex. Verify that after any change here.
routes = [
  { pattern = "*.bisks.net/*", zone_name = "bisks.net" },
]
