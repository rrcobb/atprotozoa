name: deploy

# Deploy changed Workers on push to main. Each site under sites/*, plus apex/,
# is its own Cloudflare Worker. We diff the push to find which directories
# changed and deploy only those, so a one-line fix to one experiment doesn't
# redeploy all of them. See notes/20-deploy.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_all:
        description: "Deploy every site regardless of what changed"
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Repo-wide checks that don't depend on which dirs changed. Deploys wait on
  # this, so a broken asset path or a gallery that disagrees with the site
  # manifests stops the push rather than shipping.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Local <script src>/<link href>/import paths that won't resolve once
      # deployed. See notes/20-deploy.md.
      - name: import paths
        run: pnpm check:imports

      # The gallery is generated from sites/*/site.json. This exits non-zero if
      # apex/public/index.html has drifted from the manifests — which is how a
      # card for a site that was never built used to reach production.
      - name: gallery matches the site manifests
        run: node audit/build-gallery.mjs

  # Work out which deployable dirs changed. Each is a top-level unit: "apex" or
  # "sites/<name>". Outputs a JSON array for the matrix.
  changes:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.detect.outputs.dirs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        shell: bash
        run: |
          set -euo pipefail

          # Every deployable unit: any top-level dir with a wrangler.toml, plus
          # each "sites/<name>" that has one. One line per dir.
          #
          # Top-level Workers exist because not everything can be a site on the
          # zone: "apex" IS bisks.net, "fallback" answers unclaimed *.bisks.net
          # hostnames, and "watchtower" must stay OFF the zone entirely (an
          # on-zone Worker can't probe its own zone — see
          # watchtower/wrangler.toml). Globbing rather than listing them means a
          # new one deploys without editing this file; fallback/ was added by
          # hand and silently never deployed until this was generalised.
          all_dirs() {
            for d in */; do
              [ "$d" = "sites/" ] && continue
              if [ -f "${d}wrangler.toml" ]; then echo "${d%/}"; fi
            done
            for d in sites/*/; do
              if [ -f "${d}wrangler.toml" ]; then echo "${d%/}"; fi
            done
          }

          # Map a list of changed file paths (on stdin) to the deployable dirs
          # they belong to, keeping only dirs that still have a wrangler.toml —
          # which is also what filters out notes/, audit/ and the like, so this
          # doesn't need to know their names.
          changed_dirs() {
            sed -n -E -e 's#^(sites/[^/]+)/.*#\1#p' -e t -e 's#^([^/]+)/.*#\1#p' \
              | sort -u \
              | while IFS= read -r d; do
                  # `&& echo` alone makes the loop's exit status that of the
                  # LAST test, so a push touching only notes/ or .github/ exits
                  # non-zero under `set -e` and fails the job. Always end true.
                  if [ -f "$d/wrangler.toml" ]; then echo "$d"; fi
                done
          }

          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.deploy_all }}" = "true" ]; then
            selected=$(all_dirs)
          elif [ -z "$before" ] || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            # First push (before is all-zeros / unknown): deploy everything.
            selected=$(all_dirs)
          else
            selected=$(git diff --name-only "$before" "${{ github.sha }}" | changed_dirs)
          fi

          if [ -z "$selected" ]; then
            echo "No deployable dirs changed."
            echo 'dirs=[]' >> "$GITHUB_OUTPUT"
          else
            json=$(printf '%s\n' "$selected" | jq -R . | jq -sc .)
            echo "Deploying: $json"
            echo "dirs=$json" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: [check, changes]
    if: needs.changes.outputs.dirs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.changes.outputs.dirs) }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: deploy ${{ matrix.dir }}
        working-directory: ${{ matrix.dir }}
        run: pnpm dlx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
