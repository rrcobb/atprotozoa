name: buildthis

# The builder behind @buildthis.bisks.net. The watcher Worker (sites/buildthis)
# fires a repository_dispatch when one of Rob's mutuals tags the bot with an idea.
# This runs Claude Code headless to build it, pushes to main (which autodeploys
# the changed site), then replies in-thread with the result.
# See notes/80-buildthis-bot.md.

on:
  repository_dispatch:
    types: [buildthis]

# Serialize builds: two mentions in the same minute produce two dispatches, but
# they run one at a time so two agents never push to main at once. cancel is off
# so an in-flight build finishes rather than being killed mid-commit.
concurrency:
  group: buildthis
  cancel-in-progress: false

permissions:
  contents: write # commit + push to main; the deploy workflow takes it from there

jobs:
  build:
    runs-on: ubuntu-latest
    # Hard wall-clock ceiling on a single build — the outer bound on cost, since
    # the action has no USD/token budget flag (only --max-turns). If a build
    # wedges, it dies here.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + a PAT (not the default GITHUB_TOKEN) so the build's
          # push to main actually triggers the deploy workflow. GitHub deliberately
          # suppresses workflow runs for pushes made with GITHUB_TOKEN (loop
          # guard), which would leave every built site un-deployed. A PAT push is
          # treated as a normal push and fires deploy.yml. BUILDER_PAT is the same
          # repo-scoped Contents:write token the watcher uses.
          fetch-depth: 0
          token: ${{ secrets.BUILDER_PAT }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: git identity
        run: |
          git config user.name "buildthis"
          git config user.email "buildthis@bisks.net"

      # The build. We run the Claude Code CLI directly (not the GitHub Action) so
      # the model/endpoint is controlled by plain env vars — makes swapping the
      # builder's provider a one-line change. Currently Opus on the Anthropic
      # endpoint (Moonshot/Kimi K3 was the plan, but their signups are capacity-
      # throttled; to switch back, set ANTHROPIC_BASE_URL=https://api.moonshot.ai/
      # anthropic, ANTHROPIC_MODEL=kimi-k3, and swap the key for MOONSHOT_API_KEY).
      #
      # Spend is bounded by the ANTHROPIC_API_KEY's workspace spend cap (Console →
      # Settings → Limits — put the bot's key on a capped workspace). See notes/80.
      #
      # The house rules are loaded by telling the agent to read the instructions
      # file FIRST and treat it as binding. The brief (third-party post text) is
      # passed via env and the agent reads it with printenv, so it can never break
      # the prompt structure. --permission-mode bypassPermissions makes the run
      # fully unattended; --max-turns bounds a runaway; --allowedTools keeps the
      # agent to file edits + git/bash; the instructions file keeps edits in the
      # sandbox.
      - name: install claude code
        run: npm install -g @anthropic-ai/claude-code

      - name: build
        id: build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-opus-4-8
          BRIEF: ${{ github.event.client_payload.brief }}
          AUTHOR: ${{ github.event.client_payload.authorHandle }}
        run: |
          claude -p "$(cat .github/buildthis/BUILD_PROMPT.md)" \
            --max-turns 30 \
            --permission-mode bypassPermissions \
            --allowedTools Edit,Read,Write,Bash,Glob,Grep

      # Read what the agent built (if anything). BUILD_RESULT is untracked; empty
      # or absent => nothing built => the reply step sends the honest failure.
      - name: read result
        id: result
        if: always()
        run: |
          if [ -f BUILD_RESULT ]; then
            echo "name=$(head -n1 BUILD_RESULT | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
          else
            echo "name=" >> "$GITHUB_OUTPUT"
          fi

      # Reply in-thread as the bot. always() so a failed/empty build still gets an
      # honest reply rather than silence. BUILD_OK gates success vs. failure copy.
      - name: reply
        if: always()
        env:
          BOT_IDENTIFIER: ${{ secrets.BOT_IDENTIFIER }}
          BOT_APP_PASSWORD: ${{ secrets.BOT_APP_PASSWORD }}
          REPLY_ROOT_URI: ${{ github.event.client_payload.replyRootUri }}
          REPLY_ROOT_CID: ${{ github.event.client_payload.replyRootCid }}
          REPLY_PARENT_URI: ${{ github.event.client_payload.replyParentUri }}
          REPLY_PARENT_CID: ${{ github.event.client_payload.replyParentCid }}
          BUILD_OK: ${{ steps.build.outcome == 'success' && steps.result.outputs.name != '' }}
          BUILD_RESULT: ${{ steps.result.outputs.name }}
        run: node .github/buildthis/reply.mjs
