name = "atprotozoa-lost-highway"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — the whole game runs in the browser. lost-highway is a
# Night Driver-style pseudo-3D night drive down a straight black road that
# never ends, riffing on the opening titles of David Lynch's Lost Highway
# (rushing yellow lane-lines out of the dark) and the film's identity-swap
# plot: you're randomly FRED or PETE, the HUD flips between them, and every
# so often the whole screen glitches into video static while a line of
# dialogue flashes across it. Dodge oncoming headlights and the Mystery
# Man standing dead in your lane; grab the stray VHS tapes for points.
# All audio — drone pad, engine, static bursts, crash — is synthesized
# live with the Web Audio API, no files shipped. ver.ooo asked for this one.
# No secrets, no server, no build step.

routes = [
  { pattern = "lost-highway.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/games/lost-highway", zone_name = "bisks.net" },
  { pattern = "bisks.net/games/lost-highway/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
