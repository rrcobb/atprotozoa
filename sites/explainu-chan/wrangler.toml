name = "atprotozoa-explainu-chan"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @norvid-studies.bsky.social asked for an anime mascot who'll explain what a
# "libgrid" is, since @eternalism-when.bsky.social (who's building a MILP
# solver with a real mascot, libgrid-chan) refuses to explain until she has a
# full animation pipeline. explainu-chan jumps the queue. Pure static site —
# the character, the explanation, and the breakthrough generator are all
# client-side; nothing here needs a server.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
routes = [
  { pattern = "explainu-chan.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
