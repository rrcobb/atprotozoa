name = "atprotozoa-simcluster-levels"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Reads Bluesky's public
# AppView (resolveHandle / getFollows / getFollowers / getProfiles, all
# anonymous, CORS *) to build a handle's SimCluster (self + moots, via
# cluster.js — copied from sites/simcluster-gacha/public/lib/cluster.js,
# copy don't abstract), then ranks the pool by real followersCount into an
# Amazon-leveling-system parody: an "S-number" from S1 to S10, decile-based,
# with a satirical title per level and a mad-libs "field notes" paragraph
# generated from the handle's own real stats.

routes = [
  { pattern = "simcluster-levels.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
