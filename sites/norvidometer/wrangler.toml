name = "atprotozoa-norvidometer"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A quiz: a short post is
# on screen, is it a "claim" or a "heuristic"? Content and the definitional
# fuzziness are lifted straight from a @norvid-studies.bsky.social thread
# where norvid himself couldn't fully pin down the difference ("I think I
# basically mean rule of thumb. or I don't see what the difference is.").
# See public/lib/posts.js for the bank and which entries are deliberately
# unresolvable.
routes = [
  { pattern = "norvidometer.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
