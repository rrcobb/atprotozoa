name = "atprotozoa-norvidometer"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# A quiz: a short post is on screen, is it a "claim" or a "heuristic"?
# Content and the definitional fuzziness are lifted straight from a
# @norvid-studies.bsky.social thread where norvid himself couldn't fully pin
# down the difference ("I think I basically mean rule of thumb. or I don't
# see what the difference is."). See public/lib/posts.js for the bank and
# which entries are deliberately unresolvable.
#
# @gracekind.net asked (2026-09-06) to track every answer submitted per
# question and show the crowd's % breakdown alongside norvid's real answer,
# both right after each submission and again in a recap after the final
# question. That's shared cross-visitor state, so one KV namespace holds a
# best-effort {claim,heuristic,neither} tally per question (keyed by the
# quoted post's rkey) — approximate counters are exactly what KV is for (see
# notes/11-durable-objects.md); a lost increment from a simultaneous vote is
# an acceptable tradeoff, not a bug.
routes = [
  { pattern = "norvidometer.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[kv_namespaces]]
binding = "STATS"
