# @cee.wtf asked for "a Situation Detector, a sort of Geiger counter for
# situations, happenings, and circumstances using the bsky firehose." The
# browser owns the Jetstream connection and the rolling term-rate calculation;
# the tab closes the socket when hidden. There is no server state or API route.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
name = "atprotozoa-dosimeter"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [
  { pattern = "dosimeter.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = false

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Dosimeter"]

[[migrations]]
tag = "v2"
deleted_classes = ["Dosimeter"]
