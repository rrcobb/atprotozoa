name = "atprotozoa-followwall"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser. Type a Bluesky handle:
# reads Bluesky's public AppView anonymously (getFollowers, getProfile,
# CORS *) and lays out everyone who follows that account as a wall of
# avatar cards — "a website where some people follow this account."
# Forked from sites/clucktrack (copy, don't abstract) for the handle-input
# shell, share-card canvas, and chicken-mode footer; the actual fetch/render
# is new.

routes = [
  { pattern = "followwall.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
