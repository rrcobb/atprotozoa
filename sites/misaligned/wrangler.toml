name = "atprotozoa-misaligned"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A found-poetry generator
# for fictional rogue-AI "directives": client-side template + word-bank
# recombination, no backend, nothing here talks to a real model.

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# see notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "bisks.net/misaligned", zone_name = "bisks.net" },
  { pattern = "bisks.net/misaligned/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
