name = "atprotozoa-nasdoll"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser. A satirical doll-backed
# stock exchange: every "stock" is a doll archetype ($BJD, $TROLL, $REBRN...)
# and the "AI" behind the buy signal is a literal shelf of dolls — whichever
# one topples first each session is the day's pick. Fake portfolio grows the
# longer you "hold." No backend, no real market data, nothing to keep in
# sync. Requested by @dollspace.gay, riffing on @quinnslobodian.com's joke
# about doll stocks driving US market growth.

routes = [
  { pattern = "nasdoll.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
