name = "atprotozoa-simcluster-twin"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Reads Bluesky's public
# AppView anonymously (resolveHandle / getFollows / getFollowers / getProfile
# / getAuthorFeed, all CORS *). Resolves a handle's SimCluster (mutuals,
# widened to follows if too small — cluster.js, copied from
# grand-moot-auto/public/lib/cluster.js), pulls recent posts for the handle
# and everyone in the pool, and scores each pairwise match on vocabulary
# overlap, hashtag overlap, posting-style distance, and time-of-day rhythm to
# report your closest match ("twin") and your most-opposite match
# ("anti-twin"). twin.js is the scoring engine; app.js is the UI + share card.

routes = [
  { pattern = "simcluster-twin.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
