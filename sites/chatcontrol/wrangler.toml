name = "atprotozoa-chatcontrol2"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# A static explainer/advocacy site about the EU's "Chat Control" proposal
# (formally the CSAM Regulation) — what it is, why it threatens end-to-end
# encryption, a timeline through the current trilogue round, and links to
# real advocacy tools (fightchatcontrol.eu, EDRi, Patrick Breyer's tracker).
# No dynamic routes, no storage, no OAuth — every fact on the page is static
# copy, hand-checked against primary/tracker sources at build time.
#
# 2026-09-25: two straight pushes 404'd. The first blamed a missing
# pnpm-lock.yaml importer entry, but the GitHub check-runs API on both
# commits (116886ae, 41259f82) shows `check: success` / `deploy (chunk 0):
# failure` every time — the lockfile theory was wrong; check never failed,
# the wrangler deploy step itself did, specifically for this dir (other dirs
# in the same chunks, incl. sidenote, deployed fine before and after). Local
# `wrangler deploy --dry-run` is clean and the config has no duplicate name
# or route elsewhere in the repo, so this reads as Cloudflare-side stuck
# state on the "atprotozoa-chatcontrol" script after two broken create
# attempts, not a bug in this file. Renamed the script (name only — route
# stays chatcontrol.bisks.net/*, nothing else in the repo referenced the old
# script name) to force a genuinely fresh Worker creation instead of a third
# attempt to fix up whatever the old one got stuck in.

routes = [
  { pattern = "chatcontrol.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
