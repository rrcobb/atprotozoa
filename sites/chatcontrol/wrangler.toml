name = "atprotozoa-chatcontrol2"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# A static explainer/advocacy site about the EU's "Chat Control" proposal
# (formally the CSAM Regulation) — what it is, why it threatens end-to-end
# encryption, a timeline through the current trilogue round, and links to
# real advocacy tools (fightchatcontrol.eu, EDRi, Patrick Breyer's tracker).
# No dynamic routes, no storage, no OAuth — every fact on the page is static
# copy, hand-checked against primary/tracker sources at build time.
#
# 2026-09-25: two straight pushes 404'd. The first blamed a missing
# pnpm-lock.yaml importer entry, but the GitHub check-runs API on both
# commits (116886ae, 41259f82) shows `check: success` / `deploy (chunk 0):
# failure` every time — the lockfile theory was wrong; check never failed,
# the wrangler deploy step itself did, specifically for this dir (other dirs
# in the same chunks, incl. sidenote, deployed fine before and after). Local
# `wrangler deploy --dry-run` is clean and the config has no duplicate name
# or route elsewhere in the repo. Renamed the script (name only — route
# stays chatcontrol.bisks.net/*, nothing else in the repo referenced the old
# script name) on the theory this was Cloudflare-side stuck state on the old
# "atprotozoa-chatcontrol" script.
#
# 2026-09-26: still 404ing after the rename (same fallback-Worker 404 page,
# meaning the route itself never got created) — that theory was wrong too, or
# at best incomplete. Current best guess, also unconfirmed: the zone's
# 1000-route cap (notes/20-deploy.md) — the repo's wrangler.tomls sum to 1001
# declared route patterns right now, and this rename needed a genuinely NEW
# route (not just a re-deploy of an existing one), which is the one operation
# that cap blocks. It's also possible the *old* "atprotozoa-chatcontrol"
# script/route is still sitting there dangling from the rename above, itself
# occupying the slot this one needs. See notes/20-deploy.md's "Route cap
# likely hit again" for the check to run next (needs a CLOUDFLARE_API_TOKEN
# this builder doesn't have) before trying a third name.

routes = [
  { pattern = "chatcontrol.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
