name = "atprotozoa-thrashradar"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @fromthewestmeadow.com asked for a fork of sites/thrashmeter that fills its
# leaderboard automatically by watching the live firehose for thrashers,
# instead of only scoring handles someone manually searches. The scoring
# itself is untouched — computeThrash/fetchRepoRecords/computeScore below are
# copied verbatim from sites/thrashmeter/src/index.ts (same rules, same
# CAR-download re-derivation, "same scoring method" as asked). What's new is
# discovery: a bounded, in-memory live window over Jetstream's post stream
# (the WebSocket-from-a-Durable-Object pattern from sites/ratioed) flags
# bursty posters as candidates, and the alarm tick re-derives their real score
# the exact same way a manual search would, at a rate low enough to stay
# gentle on PDSs (about one CAR fetch per tick). See
# notes/ideas/store-ours-rederive-theirs.md: nothing from the firehose itself
# is ever persisted — only our own derived leaderboard entries are, same as
# thrashmeter already does. See notes/40-new-site-playbook.md.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [
  { pattern = "thrashradar.bisks.net/*", zone_name = "bisks.net" },
]

# run_worker_first: /api/* is dynamic (the leaderboard Durable Object), so the
# Worker must run BEFORE the static-asset router.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "BOARD"
class_name = "ThrashRadar"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ThrashRadar"]
