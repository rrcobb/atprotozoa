name = "atprotozoa-thrashradar"
compatibility_date = "2025-01-01"

# Static assets only. Jetstream discovery and scoring are intentionally local to
# each visitor's browser; no Worker, API routes, Durable Object, or alarm runs.
routes = [
  { pattern = "thrashradar.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ThrashRadar"]

[[migrations]]
tag = "v2"
deleted_classes = ["ThrashRadar"]
