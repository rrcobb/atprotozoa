name = "atprotozoa-intrigue"
compatibility_date = "2025-01-01"

# Brand-new site served at the root of its own hostname.
routes = [
  { pattern = "intrigue.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"

# Preserve the deployed DO history, then remove its class from the namespace.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Board"]

[[migrations]]
tag = "v2"
deleted_classes = ["Board"]
