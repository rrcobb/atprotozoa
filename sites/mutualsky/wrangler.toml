name = "atprotozoa-mutualsky"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# mutualsky (mutualsky.bisks.net): a skyclone fork (see sites/skyclone) whose
# home feed only ever shows posts from people who follow you back — the
# "shortcut to a breakthrough" a mutual suggested in reply to the original
# "build a complete bsky client that only shows Good Posts" ask. Same live,
# no-database AppView-backed client as skyclone underneath; the only real
# difference is loadTimeline's client-side mutuals filter in app.js.
routes = [
  { pattern = "mutualsky.bisks.net/*", zone_name = "bisks.net" },
]

# run_worker_first: the Worker renders per-profile and per-post OG tags
# dynamically (so shared links unfurl with the real person/post, not a
# generic card), and serves the SPA shell for client-side routes. Without it
# the assets router would serve static files directly and neither the OG
# injection nor the SPA fallback would ever run.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true
