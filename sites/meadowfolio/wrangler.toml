name = "atprotozoa-meadowfolio"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @fromthewestmeadow.com asked for a portfolio of their own best work: an
# image gallery, an index of the software they've shipped on the
# fromthewestmeadow.com domain, and a curated "favorites" pick from their
# post history. Pure static site — the gallery reads the public AppView
# anonymously client-side (public/lib/feed.js, copied from sites/portfolio),
# releases + curator picks are baked into public/data.js at build time. No
# dynamic routes, so the Worker is a straight passthrough to ASSETS.
routes = [
  { pattern = "meadowfolio.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = false
