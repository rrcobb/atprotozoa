# @dulanyw.bsky.social asked for "a browser-based art piece riffing on the
# concept of a cloud chamber": watch the firehose, sort posts into particle
# species, let each one streak a fading vapor trail across the canvas. Pure
# static site — the browser owns the Jetstream connection, the classification,
# and the whole physics sim. No server state, no API route.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
name = "atprotozoa-cloudchamber"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [
  { pattern = "cloudchamber.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
