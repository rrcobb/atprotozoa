name = "atprotozoa-vocoder"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser. Mic input is the
# modulator, a polyphonic keyboard-driven oscillator bank is the carrier,
# a bank of bandpass filters + envelope followers does the channel-vocoder
# analysis/resynthesis. No samples, no server, no accounts.

routes = [
  { pattern = "vocoder.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
