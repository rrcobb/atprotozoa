name = "atprotozoa-impostorbel"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# impostorbel (bisks.net/impostorbel): a Simple-English-Wikipedia-style
# "translation" of @abeliansoup.bsky.social's 100 most-liked posts, built
# because @norvid-studies joked in a thread that abel's jokes needed an
# "@impostorbel bot" to make them "perfectly tractable". The 100 posts and
# their simplified rewrites are baked into public/data.json at build time
# (fetched once from the public AppView, rewritten by the build agent) —
# there's no live AI call at request time, so the Worker's only job is the
# usual path-mount prefix strip plus per-article OG tags for sharing.
#
# Path route on the shared zone, not a dedicated custom domain — see
# notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "bisks.net/impostorbel", zone_name = "bisks.net" },
  { pattern = "bisks.net/impostorbel/*", zone_name = "bisks.net" },
]

# run_worker_first: /impostorbel/article/<rank> gets personalized OG tags
# (the simplified text of that one post) stamped onto the shell before it's
# served, so a shared link unfurls with the actual joke, not a generic card.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true
