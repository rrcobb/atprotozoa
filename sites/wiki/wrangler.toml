# bisks.net's own encyclopedia. Mounted at bisks.net/wiki — see
# notes/40-new-site-playbook.md ("Why paths, not subdomains") for why this
# isn't a wiki.bisks.net custom domain: the zone is at its Cloudflare
# custom-domain cap, so new sites mount as a path on the already-provisioned
# bisks.net zone instead.
name = "atprotozoa-wiki"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [
  { pattern = "bisks.net/wiki", zone_name = "bisks.net" },
  { pattern = "bisks.net/wiki/*", zone_name = "bisks.net" },
]

# run_worker_first: every /poster/* and /post/* path is a live, dynamically
# rendered article (fetched from the public AppView at request time), so the
# Worker has to run before the static-asset router, same as sites/logs and
# sites/didscope.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
