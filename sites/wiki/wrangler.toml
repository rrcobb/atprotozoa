# bisks.net's own encyclopedia. The founding request (norvid's #atproideasio
# post, relayed by @bisks.net) specifically asked for "wiki.bisks.net" — the
# first pass shipped it as a bisks.net/wiki path instead (the default per
# notes/40-new-site-playbook.md, since the zone was at its Cloudflare
# custom-domain cap), and Rob asked to put it back on the subdomain per the
# original request. This is that move: back to a real custom domain.
name = "atprotozoa-wiki"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [{ pattern = "wiki.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: every /poster/*, /post/*, and /feed/* path is a live,
# dynamically rendered article (fetched from the public AppView at request
# time), so the Worker has to run before the static-asset router, same as
# sites/logs and sites/didscope.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
