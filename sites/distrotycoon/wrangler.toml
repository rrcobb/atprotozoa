name = "atprotozoa-distrotycoon"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Everything lives client-side (public/index.html: distro build, the
# discourse-meter tycoon loop, localStorage save). No per-result share
# route — the share card is a generated PNG handed to navigator.share or
# downloaded, not a stamped URL, so the Worker is just the static template.
routes = [{ pattern = "distrotycoon.bisks.net/*", zone_name = "bisks.net" }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
