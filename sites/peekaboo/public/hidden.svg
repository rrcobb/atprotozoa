<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900">
  <defs>
    <radialGradient id="sky" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3b2560"/>
      <stop offset="55%" stop-color="#1c1240"/>
      <stop offset="100%" stop-color="#0a0620"/>
    </radialGradient>
    <radialGradient id="earth" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#5fb6e8"/>
      <stop offset="55%" stop-color="#2f7fc9"/>
      <stop offset="100%" stop-color="#1b4f8f"/>
    </radialGradient>
    <radialGradient id="bubble" cx="38%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#eafeff" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#bdeefc" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8fd9f2" stop-opacity="0.25"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="45%" stop-color="#ffb454"/>
      <stop offset="100%" stop-color="#ff6a3d" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="crust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd873"/>
      <stop offset="100%" stop-color="#f0a93e"/>
    </linearGradient>
  </defs>

  <rect width="900" height="900" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="70" cy="90" r="2.4" opacity="0.9"/>
    <circle cx="140" cy="220" r="1.6" opacity="0.7"/>
    <circle cx="230" cy="60" r="2" opacity="0.8"/>
    <circle cx="320" cy="150" r="1.4" opacity="0.6"/>
    <circle cx="60" cy="380" r="1.8" opacity="0.7"/>
    <circle cx="120" cy="470" r="1.4" opacity="0.55"/>
    <circle cx="770" cy="110" r="2.2" opacity="0.85"/>
    <circle cx="830" cy="230" r="1.6" opacity="0.7"/>
    <circle cx="700" cy="60" r="1.8" opacity="0.75"/>
    <circle cx="620" cy="140" r="1.3" opacity="0.55"/>
    <circle cx="850" cy="380" r="2" opacity="0.8"/>
    <circle cx="790" cy="470" r="1.4" opacity="0.6"/>
    <circle cx="450" cy="40" r="1.6" opacity="0.7"/>
    <circle cx="530" cy="90" r="1.2" opacity="0.5"/>
    <circle cx="380" cy="80" r="1.3" opacity="0.55"/>
    <circle cx="180" cy="640" r="1.6" opacity="0.6"/>
    <circle cx="740" cy="620" r="1.7" opacity="0.65"/>
    <circle cx="820" cy="700" r="1.3" opacity="0.5"/>
    <circle cx="60" cy="700" r="1.4" opacity="0.5"/>
  </g>
  <g fill="#fff7d6">
    <path d="M110 150 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 z" opacity="0.9"/>
    <path d="M780 320 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z" opacity="0.85"/>
    <path d="M420 130 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 z" opacity="0.8"/>
  </g>

  <!-- earth, tucked in the bottom-left corner -->
  <circle cx="120" cy="880" r="270" fill="url(#earth)"/>
  <g fill="#4caf6b" opacity="0.85">
    <ellipse cx="30" cy="760" rx="60" ry="34" transform="rotate(-18 30 760)"/>
    <ellipse cx="150" cy="820" rx="46" ry="26" transform="rotate(12 150 820)"/>
    <ellipse cx="60" cy="890" rx="70" ry="30" transform="rotate(-6 60 890)"/>
  </g>
  <g fill="#ffffff" opacity="0.35">
    <ellipse cx="180" cy="740" rx="50" ry="14"/>
    <ellipse cx="90" cy="960" rx="70" ry="16"/>
  </g>

  <!-- little floating hearts -->
  <g fill="#ff7ab3">
    <path d="M640 260 c-14-16-40-4-40 14 0 22 40 44 40 44s40-22 40-44c0-18-26-30-40-14z" opacity="0.9"/>
    <path d="M700 420 c-9-10-26-3-26 9 0 14 26 28 26 28s26-14 26-28c0-12-17-19-26-9z" opacity="0.8"/>
    <path d="M220 300 c-9-10-26-3-26 9 0 14 26 28 26 28s26-14 26-28c0-12-17-19-26-9z" opacity="0.75"/>
  </g>

  <!-- jetpack flames -->
  <path d="M370 700 q-14 60 6 100 q14-46 4-100z" fill="url(#flame)"/>
  <path d="M540 700 q14 60 -6 100 q-14-46 -4-100z" fill="url(#flame)"/>

  <!-- backpack -->
  <rect x="355" y="600" width="42" height="110" rx="12" fill="#d8dde6"/>
  <rect x="503" y="600" width="42" height="110" rx="12" fill="#d8dde6"/>

  <!-- suit body -->
  <ellipse cx="450" cy="660" rx="150" ry="150" fill="#f5f7fb"/>
  <path d="M320 640 a130 130 0 0 0 260 0 z" fill="#eef1f7"/>
  <rect x="405" y="615" width="90" height="26" rx="8" fill="#ff9b4a"/>
  <circle cx="450" cy="628" r="7" fill="#fff"/>

  <!-- arms hugging the pizza -->
  <ellipse cx="330" cy="640" rx="46" ry="66" fill="#f5f7fb" transform="rotate(24 330 640)"/>
  <ellipse cx="570" cy="640" rx="46" ry="66" fill="#f5f7fb" transform="rotate(-24 570 640)"/>
  <circle cx="300" cy="700" r="30" fill="#f5f7fb"/>
  <circle cx="600" cy="700" r="30" fill="#f5f7fb"/>

  <!-- pizza slice, held out front -->
  <g transform="translate(450 705) rotate(2)">
    <path d="M0 -18 L92 96 A100 100 0 0 1 -92 96 Z" fill="url(#crust)" stroke="#c9781f" stroke-width="4"/>
    <path d="M0 -18 L92 96 L-92 96 Z" fill="#ffcf4d"/>
    <path d="M0 -18 L92 96 L-92 96 Z" fill="#ffb238" opacity="0.4"/>
    <circle cx="-18" cy="28" r="13" fill="#c8402c"/>
    <circle cx="26" cy="18" r="12" fill="#c8402c"/>
    <circle cx="0" cy="62" r="13" fill="#c8402c"/>
    <circle cx="-36" cy="66" r="10" fill="#c8402c"/>
    <ellipse cx="10" cy="45" rx="6" ry="3" fill="#3f8f4f" transform="rotate(20 10 45)"/>
    <ellipse cx="-30" cy="10" rx="6" ry="3" fill="#3f8f4f" transform="rotate(-15 -30 10)"/>
  </g>

  <!-- helmet bubble -->
  <circle cx="450" cy="440" r="168" fill="url(#bubble)" stroke="#ffffff" stroke-width="10"/>

  <!-- dog head -->
  <g>
    <path d="M300 400 q-46-70 10-96 q40-18 64 30 z" fill="#e3a24d"/>
    <path d="M600 400 q46-70 -10-96 q-40-18 -64 30 z" fill="#e3a24d"/>
    <ellipse cx="450" cy="450" rx="132" ry="122" fill="#f0b967"/>
    <ellipse cx="450" cy="500" rx="86" ry="66" fill="#fbdca0"/>
    <ellipse cx="405" cy="430" rx="16" ry="20" fill="#2b1c12"/>
    <ellipse cx="495" cy="430" rx="16" ry="20" fill="#2b1c12"/>
    <circle cx="410" cy="423" r="4.5" fill="#fff"/>
    <circle cx="500" cy="423" r="4.5" fill="#fff"/>
    <ellipse cx="380" cy="478" rx="18" ry="11" fill="#f7a6a0" opacity="0.75"/>
    <ellipse cx="520" cy="478" rx="18" ry="11" fill="#f7a6a0" opacity="0.75"/>
    <ellipse cx="450" cy="468" rx="20" ry="14" fill="#2b1c12"/>
    <path d="M450 480 q0 14 -30 24 M450 480 q0 14 30 24" stroke="#2b1c12" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M410 508 q40 26 80 0" stroke="#8a5a24" stroke-width="0" fill="none"/>
  </g>

  <!-- helmet glass highlight -->
  <path d="M320 340 q60-60 150-58" stroke="#ffffff" stroke-width="14" fill="none" opacity="0.55" stroke-linecap="round"/>
</svg>
