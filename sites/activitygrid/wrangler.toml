name = "atprotozoa-activitygrid"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Served at activitygrid.bisks.net, with the bisks.net/activitygrid path route
# kept for links shared before the move to subdomains. routes MUST stay above
# [assets] — in TOML, keys after a table header join that table, so a routes
# line below [assets] silently becomes assets.routes (same gotcha called out in
# buildthis/logs/wrangler.toml).
#
# The two /skeetgrid patterns are this site's former name (renamed 2026-07-29 in
# 416c00a). They were still pointing at the orphaned pre-rename Worker, which
# went on serving frozen code to anyone with an old link; claiming them here
# lets src/index.ts 301 those visitors forward instead.
routes = [
  { pattern = "activitygrid.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/activitygrid", zone_name = "bisks.net" },
  { pattern = "bisks.net/activitygrid/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/skeetgrid", zone_name = "bisks.net" },
  { pattern = "bisks.net/skeetgrid/*", zone_name = "bisks.net" },
]

# run_worker_first: /activitygrid/s/<handle> is dynamic (personalized OG tags
# per share), and every request needs the "/activitygrid" mount prefix stripped
# before it reaches the ASSETS binding.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
