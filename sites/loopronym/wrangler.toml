# @shimmermathlabs.com tagged the bot in a thread riffing on TESCREAL-style
# backronyms ("T transfeminist, E emergent, S simcluster, C cognitohazard,
# R recursive..."), then a follow-up joke: "the r in recursive stands for
# recursive" / "75% of the time it is the second one, 25% of the time it is
# both". loopronym takes any word and expands it into a backronym in that
# exact voice, with the R slot literally implementing that probability split.
name = "atprotozoa-loopronym"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [{ pattern = "loopronym.bisks.net/*", zone_name = "bisks.net" }]

# /r/:encoded needs the Worker to run before the static router (personalized
# OG tags per shared result, same pattern as sites/spoonerism and didscope).
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
