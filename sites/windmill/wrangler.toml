name = "atprotozoa-windmill"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes
# (same gotcha noted in sites/didscope/wrangler.toml and buildthis/logs).
routes = [{ pattern = "windmill.bisks.net", custom_domain = true }]

# run_worker_first: /r/<code> is dynamic (personalized OG tags per shared
# result), so the Worker must run before the static-asset router.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
