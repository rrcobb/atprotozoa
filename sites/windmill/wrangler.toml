name = "atprotozoa-windmill"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Path-mounted at bisks.net/windmill — windmill.bisks.net never provisioned
# (the zone's custom-domain cap, see notes/20-deploy.md), so this Worker
# claims a path route on the already-live bisks.net zone instead of a
# dedicated custom domain. See notes/40-new-site-playbook.md ("Why paths,
# not subdomains"). routes MUST stay above [assets] — in TOML, keys after a
# table header join that table, so a routes line below [assets] silently
# becomes assets.routes.
routes = [
  { pattern = "windmill.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/windmill", zone_name = "bisks.net" },
  { pattern = "bisks.net/windmill/*", zone_name = "bisks.net" },
]

# run_worker_first: /windmill/r/<code> is dynamic (personalized OG tags per
# shared result), and every request needs the "/windmill" mount prefix
# stripped before it reaches the ASSETS binding.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
