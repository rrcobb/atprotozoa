name = "atprotozoa-emergypond"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs client-side. An Odum energy-systems-
# notation pond: sun, producers, consumers, storages, heat sinks, drawn as
# real Odum symbols and wired into a live simulation with parameter sliders.
# Built off @norvid-studies.bsky.social's "claim" on @words.bsky.social's
# "the simcluster needs to get emergy pilled," requested by
# @words.bsky.social.

routes = [
  { pattern = "emergypond.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
