name = "atprotozoa-bird-costumes"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A Halloween-costume tier
# list ranking the 20 most common North American birds by how cool they'd be as
# a costume (S/A/B/C/D + an "undisplayable" super-tier), with drag-to-reorder
# cards and one-line verdicts. Color criteria borrowed as an in-joke from
# @moultano.bsky.social's ongoing bird-color project: buntings & cardinals rank
# high, "mid yellows" get roasted, the pigeon gets cyberpunk-courier lore.
# Built after @cee.wtf tagged @buildthis. No secrets, no server.
assets = { directory = "./public" }

routes = [{ pattern = "bird-costumes.bisks.net", custom_domain = true }]
