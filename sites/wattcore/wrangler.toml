name = "atprotozoa-wattcore"
compatibility_date = "2025-01-01"

# @abeliansoup.bsky.social, replying in a thread that reacted to a post
# captioned only "wattcore" ("This is fucking beautiful" / "plugin that
# converts model COT into wattcore musings, I would unironically waste some
# time listening to these"): build that plugin as a site, demoed on the
# actual chain-of-thought used to build it, as the first thing the page
# shows. "wattcore" has no fixed definition anywhere findable — this build
# IS the definition it's offering: electricity/wattage imagery wrapped
# around an AI's literal build reasoning. No live model call happens here
# (house rule: no Workers AI) — the musing is the real trace, held still,
# then remixed client-side from fragments of it on request. Pure static
# site — the "hum" is Web Audio oscillators, not a sample; no server logic
# needed at all. See sites/abstractodo/wrangler.toml for the same
# assets-only shape.
assets = { directory = "./public" }

routes = [{ pattern = "wattcore.bisks.net/*", zone_name = "bisks.net" }]
