name = "atprotozoa-norvidfolio"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @norvid-studies.bsky.social asked for "the same thing" the meadowfolio site
# does for @fromthewestmeadow.com, scoped to their two named asks: a gallery
# of images and a set of best posts (no software-releases index — norvid
# doesn't ship tools on their own domain the way fromthewestmeadow.com does).
# Pure static site — the gallery reads the public AppView anonymously
# client-side (public/lib/feed.js, copied from sites/meadowfolio); curator
# picks are baked into public/data.js at build time, from a read of the
# account's last ~500 posts. No dynamic routes, so the Worker is a straight
# passthrough to ASSETS.
routes = [
  { pattern = "norvidfolio.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = false
