name = "atprotozoa-mootrider"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Type a Bluesky handle
# and it reads the public AppView (getFollows / getFollowers / a
# getProfiles batch, all anonymous, CORS *) to pull that handle's moots
# (mutuals, widened to follows if too small — moots-graph logic copied
# from pacmoot/lib/cluster.js, itself from mootdrone, itself from
# clustercrawl, itself from simcluster: copy, don't abstract). Then it's
# Line Rider: your own avatar sleds down a procedurally-generated hill
# track that scrolls forever, your moots' avatars sit on the slope as
# obstacles to jump over, and every so often a top chicken (a CluckTrade
# escapee, see cluckstonks.bisks.net) rolls through as a free bonus.
# Canvas + vanilla JS, no server, no build step.
assets = { directory = "./public" }

routes = [{ pattern = "mootrider.bisks.net", custom_domain = true }]
