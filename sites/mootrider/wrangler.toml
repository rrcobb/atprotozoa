name = "atprotozoa-mootrider"
compatibility_date = "2025-01-01"

# Client is still the whole game: type a Bluesky handle and it reads the
# public AppView (getFollows / getFollowers / a getProfiles batch, all
# anonymous, CORS *) to pull that handle's moots (mutuals, widened to
# follows if too small — moots-graph logic copied from
# pacmoot/lib/cluster.js, itself from mootdrone, itself from
# clustercrawl, itself from simcluster: copy, don't abstract). Then it's
# Line Rider: your own avatar sleds down a procedurally-generated hill
# track that scrolls forever and slowly steepens (gaps tighten, the bonus
# chicken gets rarer), your moots' avatars sit on the slope as obstacles
# to jump over, and every so often a top chicken (a CluckTrade escapee,
# see cluckstonks.bisks.net) rolls through as a free bonus.
#
# The game and its personal case file are entirely browser-side. Scores are
# kept in localStorage, so this site has no server state or login requirement.
#
# routes MUST stay above [assets] — in TOML, keys after a table header
# join that table, so a routes line below [assets] silently becomes
# assets.routes (gotcha called out in sites/ratioed/sites/logs/etc).
routes = [{ pattern = "mootrider.bisks.net/*", zone_name = "bisks.net" }]

[assets]
directory = "./public"
# new_sqlite_classes, not new_classes — legacy KV-backed DOs need Workers Paid;
# this account is on Free. See sites/the-place/wrangler.toml for the full story.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Leaderboard"]

[[migrations]]
tag = "v2"
deleted_classes = ["Leaderboard"]
