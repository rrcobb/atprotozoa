# @mensmachina.com asked for a place to record every number they see, drawn
# as a bingo board that figures out its own square size as numbers get added,
# with atproto OAuth + PDS storage and a shareable personal board. The post
# quoted @ponder.ooo asking "how many digits are the smallest number you
# haven't seen before" — that's the mex (minimum excludant) of the set, so
# the board surfaces it as a running stat: it's the same question, answered
# live off your own data.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
#
# Redeploy trigger (2026-08-14): the original build push added
# sites/numbergrid/package.json as a new pnpm workspace member without a
# matching pnpm-lock.yaml entry (see notes/20-deploy.md's "New workspace
# member needs a lockfile update" gotcha). That made deploy.yml's `check`
# job fail `pnpm install --frozen-lockfile`, which silently blocked that
# push's deploy — numbergrid.bisks.net never went live. A later, unrelated
# build regenerated the lockfile and picked up numbergrid's entry, but
# nothing re-touched this directory to trigger a redeploy until now. This
# comment is that touch.
name = "atprotozoa-numbergrid"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [
  { pattern = "numbergrid.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
