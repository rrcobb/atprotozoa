name = "atprotozoa-moot-bingo"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. It reads Bluesky's public
# AppView (resolveHandle / getFollows / getFollowers / getProfile, all anonymous,
# CORS *) to work out a handle's "moots" (mutuals), then plays bingo with them:
# the moots' profile pictures tumble as glossy spheres in a lottery drum, get
# drawn one at a time, and daub a 5×5 card. moots.js is copied from
# neighborhood/hood.js (copy, don't abstract).
main = "src/index.ts"

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# moot-bingo.bisks.net is being retired to free a slot against the zone's
# custom-domain cap (see notes/20-deploy.md). Migrated to bisks.net/games/moot-bingo
# as part of the new games/ cluster. See notes/40-new-site-playbook.md
# ("Why paths, not subdomains").
routes = [
  { pattern = "bisks.net/games/moot-bingo", zone_name = "bisks.net" },
  { pattern = "bisks.net/games/moot-bingo/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
