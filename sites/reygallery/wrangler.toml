name = "atprotozoa-reygallery"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @shimmermathlabs.com asked, in reply to a thread about
# @rey-notnecessarily.bsky.social's new profile picture: "a gallery for rey's
# art... link to bsky if possible. make it fancy". Rey turns out to have
# posted almost nothing image-shaped (1140 posts, one images-embed, one
# video), so rather than pad a gallery with content that isn't there, this
# reads Rey's own repo (com.atproto.sync.getRepo, see public/lib/car.js) at
# load time and builds the exhibit from whatever's genuinely visual: the
# current avatar (paired with Rey's own thread explaining it, whenever such a
# thread exists) plus any images/video Rey has actually posted. It grows on
# its own as Rey posts more.

routes = [
  { pattern = "reygallery.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
