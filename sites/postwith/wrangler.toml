name = "atprotozoa-postwith"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @antiali.as's idea: an atproto matchmaker, Lunchclub-style but peer-to-peer /
# ad hoc. Post an interest+goal profile, get auto-matched by topic (mentoring,
# gaming, foodie, ...), propose a meeting, the other side accepts or declines,
# and outcomes get logged as feedback for future re-match tuning.
#
# Fully atproto-native, same shape as sites/quadrants: every write (profile,
# meeting proposal, accept/decline response, feedback) is a plain record the
# author writes straight to their OWN PDS via browser-side OAuth (public
# client, PKCE + DPoP, copied from sites/padmoot) — there is no server-side
# write endpoint at all. "Match people across everyone's repos" needs an index
# the AppView doesn't provide, so one Durable Object (name "global") keeps a
# live Jetstream subscription filtered to the four net.bisks.postwith.*
# collections and maintains the cross-user index (profiles by topic, meetings
# by participant, responses, feedback) purely by watching the firehose — the
# DO's HTTP surface is read-only.
#
# Path route on the shared bisks.net zone, not a dedicated custom domain — new
# sites mount as a path now (the zone hit Cloudflare's custom-domain cap, see
# notes/20-deploy.md).
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes
# (same gotcha called out in sites/logs, sites/didscope, sites/quadrants).
routes = [
  { pattern = "bisks.net/postwith", zone_name = "bisks.net" },
  { pattern = "bisks.net/postwith/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "HUB"
class_name = "MatchHub"

# new_sqlite_classes, not new_classes — legacy KV-backed DOs need Workers Paid;
# this account is on Free. See sites/the-place/wrangler.toml for the full story.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchHub"]
