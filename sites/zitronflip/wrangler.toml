name = "atprotozoa-zitronflip"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @gracekind.net tagged the bot in a reply to a thread where @apex.atproto.ceo
# joked that betting against Ed Zitron's AI predictions is a free prophecy
# machine (quoting danluu.com's tally of his wrong calls). This is that joke,
# built: an archive of the real wrong calls plus a generator that flips any
# doomer-sounding AI take into its "guaranteed" opposite. Served at the root
# of its own hostname: no bisks.net/<name> path route, no prefix-stripping.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [
  { pattern = "zitronflip.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
