name = "atprotozoa-mootdrone"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Type a Bluesky handle and
# it reads the public AppView (getFollows / getFollowers / a getProfiles batch,
# all anonymous, CORS *) to pull that handle's moots (mutuals, widened to
# follows if too small — moots-graph logic copied from clustercrawl/lib
# cluster.js, itself from simcluster/lib/moots.js: copy, don't abstract). Each
# moot becomes one track on a generative ambient mixing board: an LFO rate
# hashed from their DID, an instrument/timbre hashed from their bio text
# (drumkit / horn / vox / bell / pad), and filter brightness driven by how
# often they post. Mute, solo, and loop per track, all synthesized live with
# Web Audio — no samples, no server.
assets = { directory = "./public" }

routes = [{ pattern = "mootdrone.bisks.net/*", zone_name = "bisks.net" }]
