name = "atprotozoa-reygiftshop"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @shimmermathlabs.com asked, replying in the reygallery thread: "we need a
# gift shop for the museum." reygallery (sites/reygallery) reads Rey's own
# repo live for whatever art actually exists; this reuses the same exhibit
# data (public/lib/gallery.js, copied in unmodified) and turns each piece
# into a little run of mocked-up merch -- tote, mug, poster, postcard, pin --
# with a joke cart and a joke checkout. Nothing is actually for sale; the
# receipt is the whole bit.

routes = [
  { pattern = "reygiftshop.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
