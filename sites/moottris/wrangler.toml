name = "atprotozoa-moottris"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Type a Bluesky handle
# and it reads the public AppView (getFollows / getFollowers / a
# getProfiles batch, all anonymous, CORS *) to pull that handle's moots
# (mutuals, widened to follows if too small — moots-graph logic copied from
# mootrider/lib/cluster.js, itself from pacmoot/mootdrone/clustercrawl/
# simcluster: copy, don't abstract). Each moot's account-creation date maps
# to a zodiac sign → classical planetary ruler → tetromino shape, and a
# getAuthorFeed call counts their posts in the last 48h to set that piece's
# fall speed. It's Tetris, played with your social graph. Canvas + vanilla
# JS, no server, no build step.
main = "src/index.ts"

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# moottris.bisks.net is being retired to free a slot against the zone's
# custom-domain cap (see notes/20-deploy.md). Migrated to bisks.net/games/moottris
# as part of the new games/ cluster. See notes/40-new-site-playbook.md
# ("Why paths, not subdomains").
routes = [
  { pattern = "moottris.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/games/moottris", zone_name = "bisks.net" },
  { pattern = "bisks.net/games/moottris/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
