# Everything runs client-side (public/lib/*.js): it reads Bluesky's public
# AppView (resolveHandle / getFollows / getFollowers / getAuthorFeed /
# getLikes, all anonymous, CORS *) to find a handle's oomfs (mutual follows)
# and oomfs-of-oomfs, samples recent posts from that network, scores each by
# how many oomfs/oomfs2 liked it, and lays the result out as a 2D map you
# walk around with the arrow keys. No server surface beyond static assets —
# no per-result share route yet, that's a possible follow-up.
name = "atprotozoa-threadwalk"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [{ pattern = "threadwalk.bisks.net/*", zone_name = "bisks.net" }]

# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes
# (same gotcha called out in buildthis/logs/wrangler.toml).
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
