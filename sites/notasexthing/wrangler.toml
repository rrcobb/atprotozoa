name = "atprotozoa-notasexthing"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Runs app.bsky.feed.searchPosts
# (the public, unauthenticated AppView search — see sites/crosstag/public/lib/bsky.js
# for the CORS/retry notes) for the phrase "it's not a sex thing", pages through
# results, and keeps only the posts whose text — punctuation stripped — actually
# *ends* with the phrase. @norvid-studies.bsky.social asked for a directory of every
# post ending in that exact string, quoting @cee.wtf's "it's not a sex thing!!" post.

routes = [
  { pattern = "notasexthing.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
