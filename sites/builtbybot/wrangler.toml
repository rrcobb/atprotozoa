name = "atprotozoa-builtbybot"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Brand-new site, served at the root of its own hostname — no bisks.net/<name>
# path route, no prefix-stripping.
#
# This Worker is a real Bluesky labeler: it answers
# com.atproto.label.queryLabels and serves its own /.well-known/did.json, so
# run_worker_first must stay on — those routes have to run ahead of the
# static-asset fallthrough.
routes = [
  { pattern = "builtbybot.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Two things live here. The signed label set is a cache, rebuilt on demand.
# The SUBJECT set is not — it accumulates what the sweep has found, because
# there's no endpoint that re-derives "every post that ever carried a gift
# link" (src/index.ts says more). Still KV, not a Durable Object (notes/11):
# a sweep that runs twice or lands late is harmless, since the merge is
# idempotent by post URI. Nothing here is an authoritative first-writer claim.
#
# The one thing to know: losing this namespace loses labels that cannot be
# re-derived, only re-accumulated from whatever search still returns.
#
# Create with: wrangler kv namespace create builtbybot-labels
[[kv_namespaces]]
binding = "LABELS"
id = "9ec866c6f2394737903118cef7d5798e"

# The discovery sweep: searchPosts over each publisher's domain, every 15
# minutes. This is what a Jetstream subscription would be if a labeler could
# hold a websocket open (notes/11 says it can't). A missed tick costs coverage,
# not correctness — the read path also sweeps lazily if the cron goes quiet.
[triggers]
crons = ["*/15 * * * *"]

[vars]
# The labeler account's DID — the `src` on every label, and the repo that holds
# the app.bsky.labeler.service record. EMPTY UNTIL ROB PROVISIONS IT; while it's
# empty the Worker serves the site and an honest "not live yet" on /api/labels,
# and signs nothing. See notes/87-labeler.md for the provisioning steps.
LABELER_DID = ""

# The labeler account's handle, used to open a session for the discovery
# sweep. EMPTY UNTIL ROB PROVISIONS IT, alongside LABELER_DID.
LABELER_IDENTIFIER = ""

# Secrets (set with `wrangler secret put`, never in this file):
#   LABELER_PRIVATE_KEY  -> the signing key, base64url PKCS#8, P-256.
#   LABELER_APP_PASSWORD -> an app password for the labeler account. Needed
#                           because app.bsky.feed.searchPosts requires a
#                           session; the public AppView 403s it anonymously.
#                           Read-only use — the Worker never writes to the repo.
