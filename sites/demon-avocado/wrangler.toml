name = "atprotozoa-demon-avocado"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. An avocado whose pit ("the
# ball") is rendered as a glowing demon core (the plutonium-sphere criticality
# imagery: two hemispheres + a screwdriver holding them apart) that is ALSO a
# working ANSI-Common-Lisp-flavored REPL. lisp.js is a small self-contained
# interpreter — genuinely evaluates a useful subset (arithmetic, let, defun,
# lambda, cons/car/cdr/list, if, quote, cond, mapcar, etc.). A norvid bit,
# requested via @buildthis: "an avocado where the ball is a demon core that
# implements ANSI Common Lisp."
assets = { directory = "./public" }

routes = [{ pattern = "demon-avocado.bisks.net", custom_domain = true }]
