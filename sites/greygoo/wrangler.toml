name = "atprotozoa-greygoo"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Brand-new site, own subdomain from day one — no bisks.net/greygoo path
# route to carry forward (see notes/40-new-site-playbook.md).
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [
  { pattern = "greygoo.bisks.net/*", zone_name = "bisks.net" },
]

# /s/<nines>/<assimilated> is dynamic (personalized OG tags per ending), so
# the Worker must run before the static-asset router, same as projecthydra.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
