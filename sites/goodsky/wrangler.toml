name = "atprotozoa-goodsky"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# goodsky (goodsky.bisks.net): an unofficial bsky.app-style client — same live
# AppView data, same look and feel as the real thing — with a client-side
# quality filter over every feed. See public/lib/goodposts.js for the scoring
# heuristic. Descended from sites/skyclone (a full bsky.app clone); this copy
# strips skyclone's spider/goop reskin and adds the filter.
#
# New site, single canonical host — no legacy bisks.net/<name> path route
# (those only exist on sites that predate the subdomain migration).
routes = [
  { pattern = "goodsky.bisks.net/*", zone_name = "bisks.net" },
]

# run_worker_first: the Worker renders per-profile and per-post OG tags
# dynamically (so shared links unfurl with the real person/post, not a
# generic card), and serves the SPA shell for client-side routes. Without it
# the assets router would serve static files directly and neither the OG
# injection nor the SPA fallback would ever run.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true
