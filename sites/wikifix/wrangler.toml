name = "atprotozoa-wikifix"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Path route on the shared bisks.net zone, not a dedicated custom domain — the
# zone hit its Cloudflare custom-domain cap. See notes/40-new-site-playbook.md.
routes = [
  { pattern = "bisks.net/wikifix", zone_name = "bisks.net" },
  { pattern = "bisks.net/wikifix/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
