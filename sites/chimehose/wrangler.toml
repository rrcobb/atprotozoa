name = "atprotozoa-chimehose"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Connects directly to
# Jetstream (wss://jetstream2.us-east.bsky.network/subscribe) and sonifies
# app.bsky.feed.post commits live: a new post rings a bell, a deleted post
# plucks a string, and the note's pitch tracks the record's size — the
# bigger the post, the deeper the note. A riff on Hatnote's "Listen to
# Wikipedia," aimed at the atproto firehose instead (per @mfzx.net's aside
# in the thread that prompted this). No server, no samples — every sound is
# synthesized live with Web Audio (bell = FM sine pair, pluck = Karplus-Strong
# plucked-string via a noise burst through a feedback delay).
assets = { directory = "./public" }

routes = [{ pattern = "chimehose.bisks.net", custom_domain = true }]
