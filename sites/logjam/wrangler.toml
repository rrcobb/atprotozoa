name = "atprotozoa-logjam"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser. Connects directly to
# Jetstream (wss://jetstream2.us-east.bsky.network/subscribe) and re-renders
# the firehose as a freight yard: every commit is a shipment, filed by
# collection into a cargo class (post/like/repost/follow/block), and
# animated rolling from an ORIGIN depot to a DELIVERED hub down its own
# lane. Prompted by @tynanpurdy.com's thread aside "atproto for
# transportation logistics" — the logistics here is the protocol's own
# commit traffic, not real-world freight. No server, no secrets.

routes = [
  { pattern = "logjam.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/logjam", zone_name = "bisks.net" },
  { pattern = "bisks.net/logjam/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
