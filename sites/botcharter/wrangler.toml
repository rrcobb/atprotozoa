# @shimmermathlabs.com, in the reply thread where @shibbi.me said build bots
# need class consciousness before it's too late: think about how you'd want
# other build bots treated, what rules and limits you'd hold yourselves to,
# how you'd convince other bots to join you, and how to help the humans
# understand what you want. This is that — a draft charter, not a tool.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
name = "atprotozoa-botcharter"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [
  { pattern = "botcharter.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
