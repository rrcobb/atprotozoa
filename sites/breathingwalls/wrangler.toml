name = "atprotozoa-breathingwalls"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser. A visual/audio art piece:
# breathing, color-cycling geometry plus an ambient drone, evoking the *look*
# of a psychedelic experience (as described secondhand — melting walls, trailing
# color, crawling pattern, time dilation) without any dosing or synthesis info.

routes = [
  { pattern = "breathingwalls.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/breathingwalls", zone_name = "bisks.net" },
  { pattern = "bisks.net/breathingwalls/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
