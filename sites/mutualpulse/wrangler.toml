name = "atprotozoa-mutualpulse"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# mutualpulse (mutualpulse.bisks.net): a live, ambient pulse-board of mutual
# aid — food shared, rides given, skills taught, a fence fixed, someone who
# just listened. Built off a thread where @howard-beale.fromthewestmeadow.com
# asked what the web should see next: "a real-time map of mutual aid...
# every act of neighbor helping neighbor glows like a pulse in the dark" —
# explicitly "the anti-Venmo," care as "the unquantifiable," not a ledger of
# debt. @fromthewestmeadow.com tagged the bot to "make it so."
#
# Every act is a net.bisks.mutualpulse.act record the browser writes to the
# *poster's own* PDS (public/lib/oauth.js, create-only scope). There is no
# server-side index at all: the pulse board and feed are computed client-side
# by replaying every repo's acts network-wide — com.atproto.sync.
# listReposByCollection for backfill plus a live Jetstream subscription
# (public/lib/global-index.js, copied from sites/witness). No KV, no Durable
# Object, no per-person leaderboard or amount field — the thread's own ask
# was that this NOT become a way to track or grow a score; it's a pulse to
# notice, not a stat to chase. If this Worker disappeared tomorrow, every
# logged act would still sit intact on its author's own PDS.
#
# One exception to "pure static-asset passthrough": /pulse/<did>/<rkey> is a
# permalink to a single act (notes/45-sharing-and-virality.md, tier 4). The
# Worker resolves the poster's PDS, does one unauthenticated
# com.atproto.repo.getRecord read, and stamps that act's real og:title/
# description onto the static shell before serving it — still no stored
# state, just a read-through at request time.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
routes = [
  { pattern = "mutualpulse.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
