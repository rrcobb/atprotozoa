name = "atprotozoa-polcompass"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [
  { pattern = "polcompass.bisks.net/*", zone_name = "bisks.net" },
]

# run_worker_first: /c/<config> is dynamic (personalized OG tags per chart,
# stamped server-side from the config encoded straight into the URL — no
# lookup, no storage), so the Worker must run before the static-asset router.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
