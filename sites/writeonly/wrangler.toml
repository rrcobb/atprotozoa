name = "atprotozoa-writeonly"
compatibility_date = "2025-01-01"

# @aly.codes, in a thread bisks.net tagged the bot into: "tbh i kinda want a
# write-only bsky client." This is that: sign in, compose, send — the OAuth
# scope (public/client-metadata.json) only ever grants create-on-
# app.bsky.feed.post + image blob uploads, so the page is structurally
# incapable of reading a timeline, a notification, or even the post it just
# sent back. No feed view exists to build; there is nothing to route besides
# the composer itself.
#
# Pure static site — everything runs in the browser (public/lib/oauth.js +
# post.js). Brand-new site, served at the root of its own hostname, no
# bisks.net/writeonly path route and no prefix-stripping needed.
assets = { directory = "./public" }

routes = [{ pattern = "writeonly.bisks.net/*", zone_name = "bisks.net" }]
