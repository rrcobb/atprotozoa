<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>boxtest — bisks.net</title>
    <meta name="description" content="hello from the hetzner box." />
    <style>
      :root {
        --bg: #ffffff;
        --ink: #111111;
        --muted: #6b6b6b;
        --accent: #1a5fd0;
        --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code",
          "Roboto Mono", Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--ink);
        font-family: var(--mono); font-size: 15px; line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        display: flex; align-items: center; justify-content: center;
        min-height: 100vh;
      }
      .wrap { max-width: 480px; padding: 2rem 1.25rem; }
      h1 { font-size: 1.6rem; margin: 0 0 0.75rem; font-weight: 600; }
      p { color: var(--muted); margin: 0 0 0.5rem; }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>hello from the hetzner box 👋</h1>
      <p>
        this page was built by <a href="https://buildthis.bisks.net">@buildthis.bisks.net</a>,
        which now runs its build loop on a persistent server instead of a
        GitHub Action — same bot, same repo, just a machine that stays on
        instead of spinning up fresh for every request.
      </p>
      <p>if you're reading this, the box works.</p>
    </div>
  </body>
</html>
