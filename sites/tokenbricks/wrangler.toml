name = "atprotozoa-tokenbricks"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Everything runs client-side (see public/index.html): type text, pick a
# tokenizer, and it's BPE-encoded entirely in the browser via the gpt-tokenizer
# package (loaded from esm.sh, pure JS, no wasm/model download) — no server
# inference, ever.
routes = [{ pattern = "tokenbricks.bisks.net/*", zone_name = "bisks.net" }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
