name = "atprotozoa-crosstag"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser. Enter two Bluesky
# handles; it searchPosts's for every post by X that mentions Y and every
# post by Y that mentions X (both authored-by + mentions filters, so it's a
# precise crosstag scan, not a text grep), merges the two directions into one
# chronological timeline, and flags which ones are replies. Read straight
# from the public, unauthenticated AppView (api.bsky.app serves searchPosts
# CORS-open with no auth — see notes/70-reply-and-rich.md's "HAMMERED" find).
# @norvid-studies.bsky.social asked for the whole history of two accounts
# tagging each other in replies.

routes = [
  { pattern = "bisks.net/crosstag", zone_name = "bisks.net" },
  { pattern = "bisks.net/crosstag/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
