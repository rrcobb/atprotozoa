name = "atprotozoa-epistemics"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Mounted at bisks.net/epistemics/ (a path route on the shared zone, not a
# dedicated custom domain — the zone hit a Cloudflare custom-domain cap, see
# notes/20-deploy.md). Everything still runs client-side (see public/index.html)
# EXCEPT the OG/share unfurl: /epistemics/s/<handle> is a real per-handle URL
# that the Worker renders server-side (a lightweight re-run of the same
# heuristic the client uses) with personalized og:title/og:description/og:url
# baked in, so link-unfurl caches don't show one generic card for every share
# — same shape as sites/didscope's /s/<handle>.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [
  { pattern = "bisks.net/epistemics", zone_name = "bisks.net" },
  { pattern = "bisks.net/epistemics/*", zone_name = "bisks.net" },
]

# run_worker_first: /epistemics/s/<handle> is dynamic (personalized OG tags
# per share), so the Worker must run BEFORE the static-asset router.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
