name = "atprotozoa-snubbed"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @norvid-studies.bsky.social asked (in a reply thread) for a list of people
# who liked one post but not another — specifically grace's reply vs. their
# own original post. Generalized into a tool: paste two post links, get
# everyone who liked the second but skipped the first.
#
# The read runs client-side (public/lib/bsky.js pages app.bsky.feed.getLikes
# to exhaustion for both posts — no page cap, see the comment there for why
# that's fine here), EXCEPT the personalized share route, same shape as
# sites/favoritism:
#
#   /s/<a>+<b> — a personalized OG share URL per post pair (each side is a
#   base64url-encoded AT-URI, since a post URL itself contains slashes).
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [{ pattern = "snubbed.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /s/<a>+<b> is dynamic, so the Worker must run before the
# static-asset router.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
