name = "atprotozoa-pop-webring"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Static hub plus stateless /next /prev /random redirects.
routes = [
  { pattern = "pop-webring.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
