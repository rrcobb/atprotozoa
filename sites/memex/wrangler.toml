name = "atprotozoa-memex"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# New site — own subdomain from the start, no legacy path route. zone_name,
# not custom_domain = true: the wildcard *.bisks.net DNS record + cert
# already cover this hostname. See notes/40-new-site-playbook.md.
routes = [
  { pattern = "memex.bisks.net/*", zone_name = "bisks.net" },
]

# run_worker_first: /api/* is a live server route (the global "what's atomic"
# leaderboard) and /p/<id> serves per-phrase share pages with stamped OG
# tags, so the Worker must see every request before the static-asset router
# does.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# GlobalTracker backs /api/atomic — a live Jetstream-fed index of every
# net.bisks.memex.phrase record across the network (everyone's personal
# phrasebooks), aggregated into a popularity leaderboard by phrase text.
# Same shape as sites/steamtags' GlobalTracker / sites/quadrants' QuadrantHub,
# plus a resumable backfill via com.atproto.sync.listReposByCollection so the
# board isn't limited to activity since the DO started running.
[[durable_objects.bindings]]
name = "GLOBAL"
class_name = "GlobalTracker"

# new_sqlite_classes, not new_classes — legacy KV-backed DOs need Workers
# Paid; this account is on Free. See notes/20-deploy.md.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GlobalTracker"]
