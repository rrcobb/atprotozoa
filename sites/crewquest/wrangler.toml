name = "atprotozoa-crewquest"
compatibility_date = "2025-01-01"

# Pure static site — the whole game runs in the browser. crewquest is a tiny
# PuzzleScript-style party-Sokoban starring the build crew: thebes, norvid,
# bisks and the @buildthis bot all share the board, but only one moves at a
# time. Swap between them (each has their own colored door only they can pass)
# to shove every idea onto a ship-pad. Real PuzzleScript-style source ships in
# the page; a compact in-page engine parses and plays it, adding the one thing
# stock PuzzleScript can't do on its own — the four-way character swap. Built
# for @vgel.me, who asked for a game about the crew's adventures. No secrets,
# no server, no build step.
assets = { directory = "./public" }

routes = [{ pattern = "crewquest.bisks.net", custom_domain = true }]
