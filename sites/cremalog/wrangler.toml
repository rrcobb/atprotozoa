name = "atprotozoa-cremalog"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# cremalog (cremalog.bisks.net): a latte review diary. Built for
# @kitto.nekoweb.org at shimmermathlabs.com's request. Every review ("I had
# this latte, rated it N/10") is a plain net.bisks.cremalog.review atproto
# record the browser signs and writes to the *writer's own* PDS — no
# backend, no KV, no Durable Object. A person's log and taste-over-time
# chart are just their own review records read straight back
# (public/lib/log.js) and plotted client-side (public/lib/chart.js).
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
#
# No dynamic route (no per-review unfurl page — src/index.ts is a plain
# passthrough), so no run_worker_first is needed.
routes = [
  { pattern = "cremalog.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
