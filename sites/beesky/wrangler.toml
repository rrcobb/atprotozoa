# beesky — bisks.net/beesky
#
# A navigable 3D beehive appview: type a Bluesky handle, resolve its moots
# (mutuals — follows ∩ followers, via the public AppView, same lookup as
# sites/dial-a-mutual/public/lib/moots.js), and lay each one out as a
# hexagonal wax cell in a honeycomb. Fly through the hive with WASD + mouse
# look (free-fly camera, same shape of controls as sites/cowlick) — your own
# cell glows gold at the center, every mutual gets a cell around it with
# their avatar at the back of the tunnel.
#
# Avatars are proxied through /beesky/img (src/index.ts) rather than loaded
# directly from cdn.bsky.app: that CDN sends no Access-Control-Allow-Origin
# header, so a crossOrigin="anonymous" texture load fails outright, and a
# non-CORS load taints the canvas (blocks the share-screenshot's
# canvas.toBlob()). The proxy re-serves the same bytes with an open CORS
# header, allow-listed to cdn.bsky.app/img/avatar* paths only.
#
# Built for @words.bsky.social.
name = "atprotozoa-beesky"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [
  { pattern = "bisks.net/beesky", zone_name = "bisks.net" },
  { pattern = "bisks.net/beesky/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
