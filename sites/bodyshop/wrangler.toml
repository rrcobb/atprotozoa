name = "atprotozoa-bodyshop"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# A static, browser-only toy. Every pull, garage, and share card is computed
# and stored (localStorage) in the browser; the Worker only serves assets.
routes = [
  { pattern = "bodyshop.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
