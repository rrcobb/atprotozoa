name = "atprotozoa-babel"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Tower of Babel idle/incremental
# game: hire workers to lay bricks, buy generators, and climb the tower ever higher.
# The higher you build, the more heaven notices — at altitude milestones the languages
# CONFOUND: your workforce fractures into tongues that can't coordinate, productivity
# tanks, and the only way forward is to let the tower fall and prestige into a new
# lineage that speaks a little faster. Numbers go up. Hubris goes up faster.
# localStorage save. Built after @thebadcode.com tagged @buildthis for
# "tower of babel incremental game". No secrets, no server.
assets = { directory = "./public" }

routes = [{ pattern = "babel.bisks.net", custom_domain = true }]
