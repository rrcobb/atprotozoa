name = "atprotozoa-fellowshipcast"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A casting-call poll:
# sign in with Bluesky, assign one LLM model to each of the Fellowship's
# nine walkers, and see the network-wide tally live. Every ballot is a real
# net.bisks.fellowshipcast.ballot record the browser writes to the voter's
# own PDS (fixed rkey "self" — revoting overwrites it in place); the results
# board is a client-side aggregation over every repo holding that collection
# (com.atproto.sync.listReposByCollection backfill + a live Jetstream
# subscription), same recipe as sites/steamtags/public/lib/global-index.js.
# No Worker, no KV, no per-visit backend — see notes/40-new-site-playbook.md.
# Built for @funferall.bsky.social, 2026-09-13.
assets = { directory = "./public" }

routes = [{ pattern = "fellowshipcast.bisks.net/*", zone_name = "bisks.net" }]
