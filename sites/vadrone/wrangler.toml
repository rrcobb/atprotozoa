name = "atprotozoa-vadrone"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser. Drag a point inside the
# VAD triangle (Valence / Arousal / Dominance) and it continuously reshapes a
# small ensemble of Web Audio drones, in the vein of Brian Eno's Music for
# Airports. No samples, no server, no accounts.

routes = [
  { pattern = "vadrone.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
