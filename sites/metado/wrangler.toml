name = "atprotozoa-metado"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A to-do list where
# every task is a suggestion for improving the thing that generates the
# to-do list. Clear today's tasks and you can "refine" — but refining
# doesn't improve the tasks, it just wraps the target in one more layer of
# "the thing that generates the thing that generates...". The recursion
# depth is the only number that ever goes up. Built for theme-box's
# "recursive self improvement" tick, 2026-08-09.
assets = { directory = "./public" }

routes = [{ pattern = "metado.bisks.net/*", zone_name = "bisks.net" }]
