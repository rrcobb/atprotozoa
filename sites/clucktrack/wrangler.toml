name = "atprotozoa-clucktrack"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser. Type a Bluesky handle:
# reads Bluesky's public AppView anonymously (getAuthorFeed, getProfile,
# CORS *) to pull that account's own posts from the last week, sums likes
# per time window (1h/8h/12h/24h/1w) divided by current follower count, and
# draws a rolling-24h likes-per-follower trend line across the week.
# Forked from sites/moistchicken (copy, don't abstract) — same metric,
# applied to one account's own history instead of scanning a whole network.

routes = [
  { pattern = "clucktrack.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
