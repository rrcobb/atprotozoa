name = "atprotozoa-lasercats"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Path-mounted at bisks.net/lasercats — lasercats.bisks.net never provisioned
# (the zone's custom-domain cap, see notes/20-deploy.md), so this Worker
# claims a path route on the already-live bisks.net zone instead. See
# notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "lasercats.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/lasercats", zone_name = "bisks.net" },
  { pattern = "bisks.net/lasercats/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
