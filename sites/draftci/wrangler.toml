name = "atprotozoa-draftci"
compatibility_date = "2025-01-01"

# Pure static site — the pipeline runs in the browser. The only network calls are
# public AppView reads (app.bsky.actor.getProfile) to check that @mentions in a
# draft resolve. Drafts stay in localStorage. No secrets.
assets = { directory = "./public" }

routes = [{ pattern = "draftci.bisks.net/*", zone_name = "bisks.net" }]
