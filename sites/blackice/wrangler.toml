name = "atprotozoa-blackice"
compatibility_date = "2025-01-01"

# Pure static site — a SkiFree-style endless downhill runner, reskinned
# neon-cyberpunk: you're a deck jockey riding a hoverboard down a data-slope,
# weaving corrupted-block rocks and data-spire trees, grabbing chip pickups,
# until a cyborg crow (a Neuromancer-flavored ICE construct) wakes up behind
# you and starts closing the gap. Crash and it gains ground; let it catch you
# and you're caught. All canvas + vanilla JS, no build step, no server.
# @schwarzgerat.bsky.social asked for a SkiFree clone, "super neuromancer
# themed and cyberpunk", mobile controls, and a monster crow.
main = "src/index.ts"

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# blackice.bisks.net is being retired to free a slot against the zone's
# custom-domain cap (see notes/20-deploy.md). Migrated to bisks.net/games/blackice
# as part of the new games/ cluster. See notes/40-new-site-playbook.md
# ("Why paths, not subdomains").
routes = [
  { pattern = "bisks.net/games/blackice", zone_name = "bisks.net" },
  { pattern = "bisks.net/games/blackice/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
