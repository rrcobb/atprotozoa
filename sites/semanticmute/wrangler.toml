name = "atprotozoa-semanticmute"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Connects directly to
# Jetstream (wss://jetstream2.us-east.bsky.network/subscribe) to watch
# app.bsky.feed.post commits live, and to the keyless Datamuse API
# (api.datamuse.com — CORS-open, no account/secret needed) to expand each
# muted "concept" into a cloud of related words. No server-side state: mute
# lists live in the visitor's own localStorage.

routes = [
  { pattern = "bisks.net/semanticmute", zone_name = "bisks.net" },
  { pattern = "bisks.net/semanticmute/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
