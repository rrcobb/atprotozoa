name = "atprotozoa-sisyphus"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site — the whole game runs in the browser. sisyphus is a
# side-scrolling myth simulator: push the boulder up the mountain, leap
# chasms and scree, duck the crows. Getting hit doesn't cost a life — it
# rolls the boulder back down the slope and undoes your climb, forever
# (that's the myth). Six palettes, all audio live-synthesized with the Web
# Audio API, no build step. @dulanyw.bsky.social asked for this one.
#
# Joins the games/ cluster straight away (bisks.net/games/sisyphus) rather
# than a flat bisks.net/sisyphus stop — see notes/40-new-site-playbook.md
# ("Clusters").
routes = [
  { pattern = "bisks.net/games/sisyphus", zone_name = "bisks.net" },
  { pattern = "bisks.net/games/sisyphus/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
