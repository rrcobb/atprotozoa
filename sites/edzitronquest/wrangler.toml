name = "atprotozoa-edzitronquest"
compatibility_date = "2025-01-01"

# Pure static site — a browser-only, Infocom/zcode-style parser text
# adventure. Built for 7778777.online, who asked for "Ed Z*tron Quest, a
# zcode adventure": you play a cub reporter dispatched by the legendary
# newsletter crank Ed Z*tron to gather receipts and take down the Rot
# Economy. No secrets, no server, no build step.
main = "src/index.ts"

# Path route on the shared bisks.net zone, clustered under games/ alongside
# the other parser/arcade games (see notes/20-deploy.md, "Clustering related
# sites under a shared path segment").
routes = [
  { pattern = "bisks.net/games/edzitronquest", zone_name = "bisks.net" },
  { pattern = "bisks.net/games/edzitronquest/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
