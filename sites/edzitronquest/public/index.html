<style>
  :root {
    --bg: #060a06;
    --fg: #3cff6e;
    --dim: #1e8a3e;
    --accent: #ffcf4a;
    --border: #163d1f;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Courier New", ui-monospace, Menlo, Consolas, monospace;
  }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    padding: 0;
  }
  header {
    border-bottom: 1px solid var(--border);
    padding: 0.6rem 1rem;
  }
  header h1 {
    font-size: 1rem;
    margin: 0 0 0.15rem;
    letter-spacing: 0.12em;
    color: var(--accent);
  }
  header p.tagline {
    margin: 0;
    color: var(--dim);
    font-size: 0.8rem;
  }
  .statusbar {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    background: #0d2412;
    color: var(--fg);
    font-size: 0.78rem;
    padding: 0.35rem 1rem;
    border-bottom: 1px solid var(--border);
  }
  #statusRoom { color: var(--accent); }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    max-width: 780px;
    width: 100%;
    margin: 0 auto;
    padding: 0 1rem;
  }
  #transcript {
    flex: 1;
    overflow-y: auto;
    padding: 1rem 0;
    font-size: 0.95rem;
    line-height: 1.5;
  }
  #transcript p {
    margin: 0 0 0.9rem;
    white-space: pre-wrap;
  }
  #transcript p.cmd {
    color: var(--accent);
  }
  #transcript p.out {
    color: var(--fg);
  }
  form#cmdForm {
    display: flex;
    align-items: center;
    border-top: 1px solid var(--border);
    padding: 0.6rem 0 1rem;
    gap: 0.5rem;
  }
  form#cmdForm label {
    color: var(--accent);
  }
  #cmdInput {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--fg);
    font: inherit;
    font-size: 1rem;
    caret-color: var(--fg);
  }
  #share {
    max-width: 780px;
    margin: 0 auto 1rem;
    padding: 0 1rem;
  }
  #share a.shareLink {
    display: inline-block;
    border: 1px solid var(--accent);
    color: var(--accent);
    text-decoration: none;
    padding: 0.5rem 0.9rem;
    font-size: 0.85rem;
    letter-spacing: 0.04em;
  }
  #share a.shareLink:hover {
    background: var(--accent);
    color: var(--bg);
  }
  footer {
    text-align: center;
    color: var(--dim);
    font-size: 0.72rem;
    padding: 0.5rem 1rem 1rem;
  }
  footer a { color: var(--dim); }
  ::selection { background: var(--dim); color: var(--bg); }
</style>
</head>
<body>
  <header>
    <h1>ED Z*TRON QUEST</h1>
    <p class="tagline">a zcode adventure in the rot economy</p>
  </header>

  <div class="statusbar">
    <span id="statusRoom">—</span>
    <span><span id="statusScore">Score: 0</span> &nbsp; <span id="statusMoves">Moves: 0</span></span>
  </div>

  <main>
    <div id="transcript" aria-live="polite"></div>
  </main>

  <div id="share" hidden>
    <a class="shareLink" id="shareBluesky" target="_blank" rel="noopener">share your victory on bluesky &rarr;</a>
  </div>

  <main style="flex: 0 0 auto; padding-top: 0;">
    <form id="cmdForm" autocomplete="off">
      <label for="cmdInput">&gt;</label>
      <input id="cmdInput" name="cmd" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" />
    </form>
  </main>

  <footer>
    built by <a href="https://bisks.net">@buildthis.bisks.net</a> for
    <a href="https://bsky.app/profile/7778777.online" target="_blank" rel="noopener">7778777.online</a>
    &middot; type <b>help</b> if you're lost
  </footer>

  <script src="/games/edzitronquest/game.js"></script>
</body>
</html>
