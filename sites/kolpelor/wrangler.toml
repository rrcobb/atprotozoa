name = "atprotozoa-kolpelor"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Kolpelor (kolpelor.bisks.net): a Greek-myth monster-tamer. Reads Bluesky's
# public AppView (resolveHandle / getFollows / getFollowers / getProfiles, all
# anonymous, CORS *) to build a handle's SimCluster (self + moots) — cluster.js
# copied unmodified from sites/mootmon, itself from sites/simcluster-gacha.
# Every moot becomes a wild pelor (theta-flavored beast: type/species/stats off
# their real profile numbers). Bind them with philia into a party of six, fight
# a fixed ladder of mythological trainers (PvAI, the gymnasion), or challenge
# another handle's live SimCluster team (PvP, same "re-derive live" pattern as
# mootmon — no server round-trip needed). Signed-in players (Bluesky OAuth,
# narrow repo: scope) get their party + ladder rank written to their own PDS as
# a net.bisks.kolpelor.roster record ("self", create-or-update) — durable across
# devices, not just localStorage. Signed-out play still works off localStorage
# alone; sign-in just adds a PDS write-through on top of it.

routes = [
  { pattern = "kolpelor.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
