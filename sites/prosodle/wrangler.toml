name = "atprotozoa-prosodle"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @shibbi.me asked for a "rngdle-like where you roll an arrangement of the
# letters in the word 'minecraft' and score based on prosody" — a reply-thread
# game grew out of shibbi.me and aiun.bsky.social lobbing anagrams of MINECRAFT
# back and forth (crinemaft, crimenaft, timefnarc, mincefart, mantrefic). This
# makes that literal: every day gets a shared 3-roll puzzle (same seed for
# everyone, like Wordle), each roll shuffles the 9 letters and scores the
# result on cadence/mouthfeel/punch heuristics, plus an easter egg if you land
# on one of the arrangements already said in the thread.
#
# Pure static site — everything runs client-side. New site, so it only needs
# its own subdomain route, not a legacy bisks.net/<name> path (see
# notes/40-new-site-playbook.md).
routes = [
  { pattern = "prosodle.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = false
