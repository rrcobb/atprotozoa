name = "atprotozoa-fitzcarraldo"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A Yahoo!-2001-style web
# portal (table-web chrome, blinking "NEW!", hit counter, webring) built
# around one centerpiece: an 8-bit canvas toy recreating the climactic scene
# of Herzog's Fitzcarraldo — hauling the steamship over the mountain between
# two rivers. Mash SPACE / tap to haul; morale and slippage make it a real
# (tiny) struggle, same as the production it's spoofing. All audio
# synthesized live with the Web Audio API, no files shipped. @ver.ooo asked
# for this one. No secrets, no server, no build step for the page itself —
# og-gen.mjs is a one-time local script that writes public/og.png.
assets = { directory = "./public" }

routes = [{ pattern = "fitzcarraldo.bisks.net", custom_domain = true }]
