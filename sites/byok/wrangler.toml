name = "atprotozoa-byok"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [
  { pattern = "byok.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# No Hydracept secrets: each visitor supplies their own key in the page and
# the Worker proxies only the voice request, without storing the key.
