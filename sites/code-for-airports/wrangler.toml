name = "atprotozoa-code-for-airports"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser. Four generative ambient
# tracks (see public/lib/tracks.js) in the vein of Brian Eno's Music for
# Airports: a seeded ensemble of Web Audio voices per track, each on its own
# loop cycle, drifting in and out of phase forever. No samples, no server,
# no accounts.

routes = [
  { pattern = "bisks.net/code-for-airports", zone_name = "bisks.net" },
  { pattern = "bisks.net/code-for-airports/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
