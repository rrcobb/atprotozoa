name = "atprotozoa-runnerup"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# The thread: @isolyth.dev got hyperobject.bisks.net built for them — a shrine
# where they're eternally #1 and everyone else falls into a pit. @mfzx.net
# (who started that whole "mog" beef by leapfrogging isolyth on peakposting)
# replied to that build asking for the same move, but scaled down: "do this
# but make it so i'm always #2".
#
# So: 1st place here is permanently vacant — it's already spoken for, over at
# hyperobject.bisks.net. mfzx.net is hardcoded into 2nd, immovable. Everyone
# else can climb onto the podium and get boosted by visitors, competing for
# 3rd place and below, but nobody ever touches gold or silver.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [
  { pattern = "runnerup.bisks.net/*", zone_name = "bisks.net" },
]

# run_worker_first: /api/* (the podium Durable Object) and /s/<handle>
# (personalized share unfurls) are both dynamic, so the Worker must run
# BEFORE the static-asset router.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "PODIUM"
class_name = "Podium"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Podium"]
