name = "atprotozoa-alsointhisthread"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @fromthewestmeadow.com asked for a page listing every thread they've ever
# said "buh" in and every post where they commented "interesting" — read off
# their *entire* post history via a full repo CAR download (see
# public/lib/car.js's fetchRepoRecordsWithKeys), not just a recent sample.
# Entirely client-side: no worker logic, no Durable Object, no login (public
# repo reads only). See notes/40-new-site-playbook.md.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
routes = [
  { pattern = "alsointhisthread.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
