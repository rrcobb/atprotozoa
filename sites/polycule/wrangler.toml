name = "atprotozoa-polycule"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [
  { pattern = "polycule.bisks.net/*", zone_name = "bisks.net" },
]

# run_worker_first: /p/<id> is dynamic (personalized OG tags per shared
# graph), so the Worker must run BEFORE the static-asset router.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Shared graphs (POST /api/share), keyed by short id, read back by /p/<id>.
# Deliberately no `id =` — this builder has no Cloudflare credentials to run
# `wrangler kv namespace create` by hand, but modern Wrangler auto-provisions
# a draft binding like this on the first real `wrangler deploy` using CI's
# token, then writes the real id back into this file. See
# sites/trigrams/wrangler.toml for the same pattern already working.
[[kv_namespaces]]
binding = "GRAPHS"
