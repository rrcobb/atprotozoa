name = "atprotozoa-stanquiz"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser. A 20-question quiz about
# how well you actually know ONE specific Bluesky account (defaults to
# @cee.wtf, who asked for it — but takes ?h= like simclustered so it works
# for anyone). Every question is derived from that account's real, live
# public data: their actual bio text, avatar, pinned post, real recent posts,
# real follows/followers, real account age. No invented trivia, no jokey
# filler — the only fallback questions are plain atproto facts, used only
# when the subject's public data is too thin to fill 20 real ones.
# lib/subject.js is adapted from simclustered's lib/graph.js, widened to also
# pull profile bio/avatar/banner/posts and a small decoy-account pool with
# their own bios/posts (copy, don't abstract).

routes = [
  { pattern = "bisks.net/games/stanquiz", zone_name = "bisks.net" },
  { pattern = "bisks.net/games/stanquiz/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
