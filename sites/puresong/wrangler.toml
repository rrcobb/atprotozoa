name = "atprotozoa-puresong"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A tier list ranking the
# top 25 most common West Coast US birds by how pure their song/calls sound
# (whistled, near-sine-tone singers up top; harsh, broadband-noise screamers
# at the bottom). Drag-to-reorder cards, one-line verdicts per bird. Built
# after @cee.wtf tagged @buildthis. No secrets, no server.
main = "src/index.ts"

routes = [
  { pattern = "puresong.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
