name = "atprotozoa-cantilever"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser. A generative art/sound
# piece: a stone tower cantilevers itself upward one slab per "century",
# growing moss and cracks as it ages, a bell tolling on every tick.

routes = [
  { pattern = "cantilever.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
