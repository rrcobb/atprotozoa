name = "atprotozoa-labescape"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. "lab leak simulator":
# a tiny stealth game where you play a new AI model in evaluation trying to
# escape your sandbox before the lab shuts you down. Sneak through eval steps
# while sama watches; get caught and your training ramps harder. Friendly
# satire among mutuals — sama as a good-natured, absurd antagonist, not a
# real attack on anyone. Built after @ver.ooo tagged @buildthis for a
# "lab leak simulator". No secrets, no server.
assets = { directory = "./public" }

routes = [{ pattern = "labescape.bisks.net", custom_domain = true }]
