name = "atprotozoa-blipverts"
compatibility_date = "2025-01-01"

# speedhose's sibling. In the thread where @shimmermathlabs.com and
# @vivsha.ws kept riffing on speedhose (feed at 500 wpm, one word at a time),
# @words.bsky.social asked for a version that flashes whole POSTS instead of
# single words, at the same pace — and @shimmermathlabs.com's "does anyone
# remember blipverts?" (the subliminal fast-cut ads from Max Headroom) landed
# right in the middle of it. Too good a name to pass up.
#
# Same fully-frontend shape as speedhose: browser resolves the handle's
# follows via the public AppView, opens Jetstream filtered client-side to
# that DID set, and pushes whole posts into a capped ring buffer instead of
# exploding them into words. The reader holds each post on screen for
# (word count / wpm) so the READING pace matches speedhose exactly — it's
# the same 500 wpm, just chunked into full posts instead of one word.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/blipverts path route and no prefix-stripping needed.
routes = [
  { pattern = "blipverts.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
