name = "atprotozoa-bloomgarden"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Everything runs client-side (public/index.html: quiz, garden, watering,
# crossing). The one server surface: /view/<code> is a real per-bloom URL so
# a shared bloom or hybrid unfurls with its own og:title/description instead
# of one generic card for every link (same fix as sites/bouquet and
# sites/didscope, see notes/45-sharing-and-virality.md). routes MUST stay
# above [assets] — in TOML, keys after a table header join that table, so a
# routes line below [assets] silently becomes assets.routes.
routes = [{ pattern = "bloomgarden.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /view/<code> is dynamic (personalized OG tags per
# bloom/hybrid), so the Worker must run BEFORE the static-asset router.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
