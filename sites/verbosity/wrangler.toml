name = "atprotozoa-verbosity"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Everything still runs client-side (see public/index.html) EXCEPT the OG/share
# unfurl, which has a small server surface: the Worker renders /s/<handle>
# (src/index.ts) with per-handle og:title/og:description/og:url baked server-side,
# then falls through to ASSETS for everything else. Type a Bluesky handle, it
# resolves the DID, paginates getAuthorFeed, and measures every post's length
# in graphemes (Bluesky's own 300-character unit) — how many hit exactly 300,
# a histogram of short vs long, average/median, longest and shortest posts.
# Built for @ashanti.pds.witchcraft.systems, approved by @bisks.net. No secrets.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes
# (same gotcha called out in buildthis/logs/wrangler.toml).
routes = [{ pattern = "verbosity.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /s/<handle> is dynamic (personalized OG tags per share), so
# the Worker must run BEFORE the static-asset router, same as sites/logs.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
