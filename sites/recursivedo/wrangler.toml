name = "atprotozoa-recursivedo"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A to-do list that
# generates one task a day, seeded by the date so everyone sees the same
# one. The task is always some flavor of "improve the website that
# generates this to-do list" — nothing about the site ever actually
# changes, that's the joke. "Done" checkboxes are localStorage only, per
# browser, which is itself part of the bit: the only progress that's real
# is the progress you imagine you made. Built for theme-box's "recursive
# self improvement" tick, 2026-08-08.
assets = { directory = "./public" }

routes = [{ pattern = "recursivedo.bisks.net/*", zone_name = "bisks.net" }]
