name = "atprotozoa-meowdoku"
compatibility_date = "2025-01-01"

# Pure static site — the whole game runs in the browser. meowdoku is a killer
# sudoku (cage-sum sudoku) with a smug orange tabby mascot judging your every
# move. Grid generation, cage partitioning and the solver all run client-side
# in public/engine.js. Daily puzzle seeded by UTC date, plus a "new puzzle"
# button for endless play. No secrets, no server, no build step.
main = "src/index.ts"

routes = [
  { pattern = "meowdoku.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
