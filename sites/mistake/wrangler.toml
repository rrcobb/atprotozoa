name = "atprotozoa-mistake"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A daily "make a
# mistake" assignment: type what you'd like to mess up (optional), and get
# today's assigned mistake, seeded from today's date + your context, so
# asking twice in one day gives the same answer — it only changes at
# midnight. Same shape as maybetoday, which this was copied from.
# lib/mistakes.js holds the seeded-hash + mistake-bank logic; index.html is
# the ask/reroll/copy/share UI.
assets = { directory = "./public" }

routes = [{ pattern = "mistake.bisks.net/*", zone_name = "bisks.net" }]
