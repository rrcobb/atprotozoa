name = "atprotozoa-skeetin"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Everything runs client-side (see public/index.html) EXCEPT the OG/share
# unfurl for a profile view: the Worker renders /s/<handle> (src/index.ts)
# with per-handle og:title/og:description/og:url baked server-side, then
# falls through to ASSETS for everything else. skeetin is Bluesky reskinned
# as LinkedIn — type a handle, see their posts rendered as a corporate
# professional-network feed, reactions relabeled Like/Comment/Repost/Send.
# No auth, public AppView reads only. Built for @antiali.as.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes
# (same gotcha called out in buildthis/logs/wrangler.toml).
routes = [{ pattern = "skeetin.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /s/<handle> is dynamic (personalized OG tags per share), so
# the Worker must run BEFORE the static-asset router, same as sites/logs.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# CorvidClaims: the atomic rank counter behind SkeetIn Corvid (500 numbered
# accounts, first come first served — @antiali.as's ask). Same DO-as-counter
# pattern as griftmax's AscensionEngine; see src/index.ts for why a plain
# client-side counter can't make "every number is unique" actually true.
[[durable_objects.bindings]]
name = "CORVID"
class_name = "CorvidClaims"

# new_sqlite_classes, not new_classes — legacy KV-backed DOs need Workers
# Paid; this account is on Free. See notes/20-deploy.md.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["CorvidClaims"]
