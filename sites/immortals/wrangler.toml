name = "atprotozoa-immortals"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Enter a Bluesky handle to
# be "immortalized": it resolves the handle, pulls the profile + greatest-hits
# posts from Bluesky's public AppView (resolveHandle / getProfile /
# getAuthorFeed, anonymous, CORS *) and renders a marble-and-gold monument page.
# Per-handle pages live at a real path — immortals.bisks.net/<handle> — which is
# shareable/linkable; single-page-application fallback serves index.html for any
# such path and the client reads the handle off location.pathname.
main = "src/index.ts"

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# immortals.bisks.net is being retired to free a slot against the zone's
# custom-domain cap (see notes/20-deploy.md). Migrated to bisks.net/immortals
# instead. See notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "bisks.net/immortals", zone_name = "bisks.net" },
  { pattern = "bisks.net/immortals/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"
