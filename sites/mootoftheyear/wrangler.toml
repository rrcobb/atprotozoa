name = "atprotozoa-mootoftheyear"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Everything runs client-side (see public/index.html) EXCEPT the OG/share
# unfurl, which has a small server surface: the Worker renders /s/<handle>
# (src/index.ts) with per-handle og:title/og:description/og:url baked
# server-side, then falls through to ASSETS for everything else. Type a
# Bluesky handle, it pulls the profile + recent posts (public.api.bsky.app,
# no auth), picks the highest-engagement post as the headline, and draws a
# TIME-style "PERSON OF THE YEAR" magazine cover on canvas using the
# person's own avatar as the cover photo. Built for @antiali.as (root ask:
# "atproto website of the year") after @fromthewestmeadow.com's reply
# pitched the concrete idea: "generates a time magazine moot of the year
# and uses your posts to generate the headline and uses your profile
# picture." No secrets.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [{ pattern = "mootoftheyear.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /s/<handle> is dynamic (personalized OG tags per share), so
# the Worker must run BEFORE the static-asset router.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
