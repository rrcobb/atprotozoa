name = "atprotozoa-cluckstonks"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A satirical "AI stock
# picker" fintech landing page. The twist: the "proprietary neural flock" is
# literally a coop of chickens, and every "stock" is a chicken breed wearing
# a ticker symbol ($RIR, $ORP, ...). Pick generation, the fake portfolio, and
# the "AI confidence" meter are all client-side Math.random() theater — no
# backend, no real market data, nothing to keep in sync. Requested by
# @isolyth.dev: a stock-picking AI that "just knows" — except it's secretly
# top chickens.
assets = { directory = "./public" }

routes = [{ pattern = "cluckstonks.bisks.net", custom_domain = true }]
