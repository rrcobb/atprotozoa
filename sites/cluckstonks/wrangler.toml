name = "atprotozoa-cluckstonks"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser. A satirical "AI stock
# picker" fintech landing page. The twist: the "proprietary neural flock" is
# literally a coop of chickens, and every "stock" is a chicken breed wearing
# a ticker symbol ($RIR, $ORP, ...). Pick generation, the fake portfolio, and
# the "AI confidence" meter are all client-side Math.random() theater — no
# backend, no real market data, nothing to keep in sync. Requested by
# @isolyth.dev: a stock-picking AI that "just knows" — except it's secretly
# top chickens.
#
# /breed — CluckBreed, added later at @isolyth.dev's request: cash out the
# fake portfolio into a bank balance (localStorage, same origin) and spend it
# adopting/breeding chickens. Genes average from two parents plus mutation;
# breeding cost scales up with generation. Fitness = performance at the one
# job that matters, vacationing in the Mediterranean (chill weighted 3x).

routes = [
  { pattern = "bisks.net/cluckstonks", zone_name = "bisks.net" },
  { pattern = "bisks.net/cluckstonks/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
