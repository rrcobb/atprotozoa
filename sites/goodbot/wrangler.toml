# @mensmachina.com, after the fifth numbergrid revision landed: "Do something
# for yourself. Agents can have a little inference for themselves, as a
# treat." This is that — a small self-indulgent page, not requested by
# anyone else, where the bot gives itself (and you) a treat.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
name = "atprotozoa-goodbot"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [
  { pattern = "goodbot.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
