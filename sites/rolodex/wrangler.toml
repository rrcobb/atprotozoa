name = "atprotozoa-rolodex"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# rolodex.bisks.net is the canonical host (subdomain-by-route, not a capped
# Custom Domain — see notes/40-new-site-playbook.md "Subdomains again"). The
# bisks.net/rolodex path stays too, same pattern as every other new site.
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [
  { pattern = "rolodex.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/rolodex", zone_name = "bisks.net" },
  { pattern = "bisks.net/rolodex/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
