name = "atprotozoa-atproideasio"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. It's an arcade of tiny
# ideas harvested from the #atproideasio hashtag on Bluesky (norvid-studies &
# co. brainstorming atproto features at @gracekind.net). Each path enacts one
# idea. The /aqi tool reads Bluesky's public AppView anonymously
# (getAuthorFeed, CORS *); everything else runs off a baked-in snapshot of the
# tag (public searchPosts needs auth, so we harvested it at build time). No
# secrets, no server surface.
assets = { directory = "./public" }

routes = [{ pattern = "atproideasio.bisks.net/*", zone_name = "bisks.net" }]
