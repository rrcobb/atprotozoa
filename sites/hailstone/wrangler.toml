name = "atprotozoa-hailstone"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser, no server state. A
# from-scratch sound synthesis engine ("hailstone synthesis") that never
# touches the Web Audio API: pitch and waveform are computed sample-by-sample
# in plain JS from a generalized Collatz/hailstone integer walk, rendered to
# a 16-bit PCM WAV in memory, and played back through a plain <audio> element.
# Built after @words.bsky.social (relaying @minormobius.bsky.social's clef
# thread) asked buildthis for "an exotic and never before heard sound
# synthesis technique that does not use webaudio."
routes = [
  { pattern = "hailstone.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
