name = "atprotozoa-chainedemoji"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @cee.wtf posted deepseek flash 4.1's attempt at "a 3d model of the crying
# laughing emoji in blender" (image, no alt text) and the replies were
# immediate "kill it kill it kill it KILL IT". shimmermathlabs.com's verdict:
# put it in a museum, then chain it down in the museum, just in case. Pure
# static exhibit page — nothing here needs a server.
routes = [
  { pattern = "chainedemoji.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
