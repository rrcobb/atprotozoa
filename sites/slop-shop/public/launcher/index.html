<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>signing in... — slop shop</title>
    <style>
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center;
        justify-content: center; background: #111; color: #eee;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 0.95rem; text-align: center; padding: 1.5rem;
      }
      .err { color: #ff5d5d; }
      a { color: #baff29; }
    </style>
  </head>
  <body>
    <div id="msg">signing in&hellip;</div>
    <script type="module">
      import { completeLoginIfCallback } from "../lib/oauth.js";
      const msg = document.getElementById("msg");
      (async () => {
        try {
          const session = await completeLoginIfCallback();
          if (session) {
            location.replace("/");
          } else {
            msg.innerHTML = `nothing to complete here &mdash; <a href="/">back to slop shop</a>`;
          }
        } catch (e) {
          msg.innerHTML = `<span class="err">${String(e.message || e)}</span><br /><br /><a href="/">try again</a>`;
        }
      })();
    </script>
  </body>
</html>
