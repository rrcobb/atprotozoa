<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>STRANDBEEST</title>
<meta name="description" content="A machine designed to walk on a beach keeps walking until the beach becomes a mountain and the mountain becomes the sky." />
<meta property="og:title" content="STRANDBEEST" />
<meta property="og:description" content="A machine designed to walk on a beach keeps walking until the beach becomes a mountain and the mountain becomes the sky." />
<meta property="og:url" content="https://strandbeest.bisks.net/" />
<meta property="og:type" content="website" />
<meta property="og:image" content="https://strandbeest.bisks.net/og.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://strandbeest.bisks.net/og.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<canvas id="scene" aria-label="A Theo Jansen style walking machine crossing endless dunes that rise into mountains"></canvas>
<div id="crt" class="crt" hidden></div>

<button id="open" class="open" type="button" aria-controls="panel" aria-expanded="true" hidden>controls</button>

<section id="panel" class="panel" aria-label="Controls">
  <header class="phead">
    <span class="brand">STRANDBEEST</span>
    <button id="hide" type="button" aria-controls="panel">Hide controls</button>
  </header>

  <label class="row" for="legs"><span>Leg count</span><output id="legs-out" for="legs">16</output></label>
  <input id="legs" type="range" min="2" max="64" step="2" value="16" />

  <label class="row" for="speed"><span>Walking speed</span><output id="speed-out" for="speed">45%</output></label>
  <input id="speed" type="range" min="0" max="100" step="1" value="45" />

  <label class="row" for="rough"><span>Terrain roughness</span><output id="rough-out" for="rough">30%</output></label>
  <input id="rough" type="range" min="0" max="100" step="1" value="30" />

  <label class="row" for="mode"><span>Elevation mode</span></label>
  <select id="mode">
    <option value="dunes">Endless Dunes</option>
    <option value="climb" selected>Climb Into the Sky</option>
    <option value="wild">Wild Mountains</option>
  </select>

  <label class="row" for="suspension"><span>Suspension</span><input id="suspension" type="checkbox" checked /></label>
  <label class="row" for="rigid"><span>Rigid chassis</span><input id="rigid" type="checkbox" /></label>

  <details class="veh" id="veh" open>
    <summary>Vehicle tuning</summary>

    <label class="row" for="travel"><span>Suspension travel</span><output id="travel-out" for="travel">100%</output></label>
    <input id="travel" type="range" min="0" max="100" step="1" value="100" />

    <label class="row" for="gravity"><span>Gravity</span><output id="gravity-out" for="gravity">100%</output></label>
    <input id="gravity" type="range" min="0" max="300" step="5" value="100" />

    <label class="row" for="stiff"><span>Suspension stiffness</span><output id="stiff-out" for="stiff">14</output></label>
    <input id="stiff" type="range" min="1" max="60" step="1" value="14" />

    <label class="row" for="tilt"><span>Max body tilt</span><output id="tilt-out" for="tilt">100%</output></label>
    <input id="tilt" type="range" min="0" max="500" step="1" value="100" />

    <label class="row" for="bodyrate"><span>Body damping</span><output id="bodyrate-out" for="bodyrate">4</output></label>
    <input id="bodyrate" type="range" min="1" max="40" step="1" value="4" />

    <label class="row" for="ride"><span>Ride height</span><output id="ride-out" for="ride">0</output></label>
    <input id="ride" type="range" min="-30" max="80" step="1" value="0" />

    <label class="row" for="spacing"><span>Leg spacing</span><output id="spacing-out" for="spacing">100%</output></label>
    <input id="spacing" type="range" min="40" max="160" step="1" value="100" />

    <label class="row" for="phase"><span>Crank phasing</span></label>
    <select id="phase">
      <option value="jansen" selected>Jansen 120° steps</option>
      <option value="wave">Even travelling wave</option>
      <option value="alt">Alternate pairs 180°</option>
      <option value="sync">All in sync</option>
      <option value="random">Scrambled</option>
    </select>

    <label class="row" for="parallel"><span>Normalize body parallel to ground</span><input id="parallel" type="checkbox" checked /></label>
    <label class="row" for="railshow"><span>Show body rail</span><input id="railshow" type="checkbox" checked /></label>
    <label class="row" for="cranks"><span>Show crank circles</span><input id="cranks" type="checkbox" checked /></label>
    <button id="vdefaults" type="button" class="vreset">Reset vehicle</button>
  </details>

  <label class="row" for="style"><span>Visual style</span></label>
  <select id="style">
    <option value="min">Minimalist Mechanical Drawing</option>
    <option value="atmos" selected>Atmospheric Beach</option>
    <option value="retro">Retro Computer Simulation</option>
  </select>

  <div class="btns">
    <button id="pause" type="button">Pause</button>
    <button id="reset" type="button">Reset journey</button>
    <button id="sound" type="button" aria-pressed="false">Sound: off</button>
  </div>

  <div class="read" aria-live="off">
    <span>distance <b id="dist">0.00 km</b></span>
    <span>altitude <b id="alt">0 m</b></span>
  </div>

  <footer class="foot">
    <span>space pause · h hide</span>
    <a id="share" href="#" target="_blank" rel="noopener">post this</a>
    <a href="https://rateyourbuild.bisks.net/site/strandbeest" target="_blank" rel="noopener">rate this on rateyourbuild →</a>
  </footer>
</section>

<script type="module" src="main.js"></script>
</body>
</html>
