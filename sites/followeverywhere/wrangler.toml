name = "atprotozoa-followeverywhere"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @psingletary.com asked for a tool that follows one account on every appview
# at once: scan their repo for profile records, create a follow record in your
# own repo for each appview that has one. Brand-new site, served at the root of
# its own hostname.
routes = [
  { pattern = "followeverywhere.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
