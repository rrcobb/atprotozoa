name = "atprotozoa-logitlens"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Everything runs client-side (see public/index.html): pick a small causal
# language model, type a prompt, and it runs one real forward pass through
# the model in-browser via transformers.js (WASM/ONNX) to show the actual
# next-token probability distribution — no server inference, ever.
routes = [{ pattern = "logitlens.bisks.net/*", zone_name = "bisks.net" }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
