name = "atprotozoa-butteredup"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @norvid-studies.bsky.social asked for a vote-rigging botnet for
# @croissanthology.com on simcluster-guests.bisks.net (declined — see
# sites/canvass, built instead). Told to build a fan page for him instead:
# "highlight his best tweets and all the images you can find of him." This is
# that — a static highlight reel built from his real, public post history,
# baked ahead of time by gen-fanpage.mjs (public AppView, no auth) into
# public/fan-data.json, same pattern as simcluster-atlas.
routes = [
  { pattern = "butteredup.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
