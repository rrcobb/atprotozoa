name = "atprotozoa-birdflow"
compatibility_date = "2025-01-01"

# A sankey chart of where microblogging's active users went, 2022 -> 2026:
# Twitter/Tumblr/Mastodon's 2022 base plus new joiners, flowing out to
# X/Threads/Bluesky/Mastodon/Tumblr/"left microblogging entirely" by 2026.
# Numbers are illustrative napkin-math, not sourced analytics -- said plainly
# on the page. Pure static site, d3 + d3-sankey via CDN.
#
# /posts is a second view: a bar chart of estimated posts/month and
# posts/user/month per platform, sized off an independent guess at who's
# actually posting rather than any platform's claimed MAU/DAU.
assets = { directory = "./public" }

routes = [{ pattern = "birdflow.bisks.net", custom_domain = true }]
