name = "atprotozoa-borgedin"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Everything runs client-side (see public/index.html) EXCEPT the OG/share
# unfurl, which gets a small server surface: the Worker renders /s/<handle>
# (src/index.ts) with per-handle og:title/og:description/og:url baked
# server-side, then falls through to ASSETS for everything else. Same shape
# as sites/didscope's /s/<handle> route.
routes = [{ pattern = "borgedin.bisks.net/*", zone_name = "bisks.net" }]

# routes MUST stay above [assets] — a routes line below [assets] silently
# becomes assets.routes in TOML (see notes/20-deploy.md).
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
