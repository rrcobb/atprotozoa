name = "atprotozoa-firstcontact"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @psingletary.com asked: download an account's .car and build a chronological
# list of every account "first contact" was ever made with — likes, replies,
# quote posts, reposts, chat messages, card links, anything else that shows up
# in the repo — one row per account, at the moment they first appear. Uses the
# same repo-CAR bulk read as sites/backscroll (com.atproto.sync.getRepo, no
# pagination), but walks EVERY collection instead of filtering to one $type,
# then classifies whatever it finds generically instead of hardcoding every
# third-party lexicon. See public/lib/contacts.js.

routes = [
  { pattern = "firstcontact.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
