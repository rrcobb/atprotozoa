name = "atprotozoa-influential25"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @caleb.jasik.xyz tagged the bot with "pllsssss" on a reply to @pds.dad's
# thread: "I can't believe no one made '25 Most Influential Bluesky Posters
# of 2026.'" pds.dad's spec: search to nominate someone, each account can
# vote for ~5-10 users, take the top 25 and give everyone a week to post
# about it (linking a "Vote For Pedro" gif).
#
# Same shape as sites/socialcredit (copied wholesale, see notes/40): a vote
# is a net.bisks.influential25.vote record written by the browser straight
# to the voter's OWN PDS (target DID + createdAt, no delta — this is a
# nomination, not a +1/-1). There is no server holding a global tally —
# every visitor's browser rebuilds the board itself from
# com.atproto.sync.listReposByCollection (find every repo that's ever
# written this collection) + one full-repo CAR download per voter
# (com.atproto.sync.getRepo, not a paginated listRecords walk — the
# "prefer bulk reads" standing order in sites/buildthis/builder/
# INSTRUCTIONS.md) plus a live Jetstream subscription for anything cast
# just now. A voter's votes beyond their first 10 (by createdAt) are
# silently not counted, same "the write always lands, only counting is
# enforced client-side" spirit as socialcredit's cooldown/self-vote rules.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
routes = [
  { pattern = "influential25.bisks.net/*", zone_name = "bisks.net" },
]

# run_worker_first: /p/<handle> serves the profile shell; reads and writes are
# performed by the browser against public AppView/PDS endpoints.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
