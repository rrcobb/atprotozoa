name = "atprotozoa-short-circuit"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A generator for a very
# specific joke shape: someone takes a food/substance believed to cause some
# effect, and instead of consuming it the normal way, applies it directly to
# the body part associated with the effect — the causal chain (eat → digest →
# bloodstream → effect) gets shorted straight from input to output.
# lib/circuit.js holds the scenario bank + seeded generator; index.html is the
# generate/reroll/copy/share UI, same shape as maybetoday's headline card.
assets = { directory = "./public" }

routes = [{ pattern = "short-circuit.bisks.net", custom_domain = true }]
