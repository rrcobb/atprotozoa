name = "atprotozoa-attractors"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# A daily-slot pass, nobody asked for it in particular. Strange attractors
# (Clifford / Peter de Jong / Svensson) are deterministic 2D maps — feed a
# point back through a handful of sin/cos terms a few million times and the
# trail of where it's been draws itself into a glowing, never-repeating
# shape. All three families here are provably bounded (every term is a sine
# or cosine scaled by a fixed coefficient), so any parameters in range are
# safe to render — no divergence handling needed. Runs entirely as a canvas
# accumulation buffer in the browser; optionally seed the parameters from a
# Bluesky handle (hashed client-side, no network fetch) for a deterministic
# shape and name of your own. Fully static, no server, no atproto write.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [
  { pattern = "attractors.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
