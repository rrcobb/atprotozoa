name = "atprotozoa-simcluster-atlas"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Static site, round two. Round one had a live handle picker; this round is
# fixed on norvid-studies.bsky.social's "simcluster" (self + mutuals, same
# moots-graph logic as simcluster/clustercrawl) and the data is precomputed
# by gen-atlas.mjs (run by hand, reads the public AppView anonymously, no
# auth) into public/atlas-data.json. The page itself makes no API calls —
# it just fetches that static JSON and renders it with client-side
# filter/sort/group tools (see public/lib/atlas-view.js).

routes = [
  { pattern = "simcluster-atlas.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/simcluster-atlas", zone_name = "bisks.net" },
  { pattern = "bisks.net/simcluster-atlas/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
