name = "atprotozoa-simcluster-atlas"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser. Type a Bluesky handle and
# it maps that handle's "simcluster" (self + mutuals, same moots-graph logic
# as simcluster/clustercrawl), then reads a page of each member's own posts
# from the public AppView and keeps only the ones containing a link — a
# literal atlas of every URL the cluster has been passing around lately.
# Anonymous reads only (getFollows / getFollowers / getProfile /
# getAuthorFeed), no auth, everything client-side.

routes = [
  { pattern = "bisks.net/simcluster-atlas", zone_name = "bisks.net" },
  { pattern = "bisks.net/simcluster-atlas/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
