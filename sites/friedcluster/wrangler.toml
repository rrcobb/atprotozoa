name = "atprotozoa-friedcluster"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Reads Bluesky's public
# AppView (resolveHandle / getFollows / getFollowers, anonymous, CORS *) to
# build a handle's SimCluster, then recursively re-fries every avatar through
# real <canvas> pixel manipulation + JPEG re-encoding passes. moots.js copied
# from sites/simcluster-gacha/public/lib/cluster.js (copy, don't abstract).

routes = [
  { pattern = "friedcluster.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
