name = "atprotozoa-listrank"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser. Enter a Bluesky handle:
# reads that account's own blocks + follows in one repo CAR download, then
# for each blocked account asks constellation.microcosm.blue (a firehose-
# backed backlink index, not the Bluesky AppView) which moderation lists it
# turns up on. Ranks those lists by how many of your blocks vs. how many of
# your follows they contain, and estimates what share of each list's
# membership is a default *.bsky.social handle. See public/lib/rank.js for
# the full pipeline and public/lib/constellation.js for the backlink calls.

routes = [
  { pattern = "listrank.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
