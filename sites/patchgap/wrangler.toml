name = "atprotozoa-patchgap"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# A live CVE dashboard: Windows and macOS (the two major closed-source
# desktop/mobile OSes) against Android, iOS, and Debian (a relatively
# minimal, actively-updated open-source distro), reading counts straight from
# the NVD CVE API 2.0 (services.nvd.nist.gov) from the browser — it's CORS-
# open (access-control-allow-origin: *), so no server-side proxy is needed.
#
# Pure static: all fetching, rate-limited polling, and chart rendering happens
# client-side in public/app.js. No dynamic routes, no per-request compute, so
# the Worker is a plain ASSETS passthrough.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
routes = [
  { pattern = "patchgap.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = false
