name = "atprotozoa-wheelhouse"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A big color wheel over
# @buildthis's own high-level categories (toy / game / tool / chart / tier /
# anything), spun to pick one, then a slot-style reel settles on one actual
# shipped site from that bucket. data.js holds the catalog (copied out of
# apex/public/index.html's cards — refresh it by hand when that list grows);
# lib/wheelhouse.js is the spin/reel logic; index.html is the wheel + reveal UI.
assets = { directory = "./public" }

routes = [{ pattern = "wheelhouse.bisks.net", custom_domain = true }]
