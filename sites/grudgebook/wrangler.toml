name = "atprotozoa-grudgebook"
compatibility_date = "2025-01-01"

# @jason-edelman.org, replying to a thread about liberalcurrents.com's "On the
# Practical Case for a Book of Grudges" (an organized ledger of political
# misdeeds so nothing gets forgotten): "this seems very easy to do -
# organizing links by Grudge." Built as a general-purpose tool, not a
# pre-populated list of anyone in particular — sign in, log a grudge (a
# subject, a note, and the source links backing it up), search and sort your
# own ledger. Pure static SPA, no server-side state:
#
#   - Every grudge is a real net.bisks.grudgebook.entry record on the
#     signed-in user's own PDS (see public/lexicons/) — create+delete scope
#     only, same repo:...?action=create&action=delete pattern as
#     sites/blocknotes/skyclone/bskyxp. Editing deletes the old record and
#     recreates it (no update scope requested), keeping the original
#     createdAt.
#   - "subject" is free text, not a resolved atproto identity — a grudge can
#     be about a person, an institution, or a situation, so there's no handle
#     lookup or typeahead on it.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed. No Worker logic
# needed (no per-page OG personalization, nothing dynamic), so this is
# assets-only — see sites/blocknotes/wrangler.toml for the same shape.
assets = { directory = "./public" }

routes = [{ pattern = "grudgebook.bisks.net/*", zone_name = "bisks.net" }]
