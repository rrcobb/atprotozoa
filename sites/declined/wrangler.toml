name = "atprotozoa-declined"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser. The anti-@buildthis: type
# an idea, hit build, and it always declines, with a fresh over-elaborate excuse
# every time ("the moon is in the wrong phase", "that violates the third law of
# website-dynamics"). A loving parody of a build bot that says no to everything —
# a fake "considering…" delay, a running tally of ideas declined, escalating
# absurdity. Sibling of idea-mill / @buildthis.

routes = [
  { pattern = "bisks.net/declined", zone_name = "bisks.net" },
  { pattern = "bisks.net/declined/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
