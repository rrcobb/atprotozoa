# Everything still runs client-side (public/index.html + lib/moots.js): it
# reads Bluesky's public AppView (resolveHandle / getFollows / getFollowers,
# anonymous, CORS *) to find a handle's moots (mutuals), loads them into a
# drum roaster, and tumbles/darkens them over a timed roast until every bean
# pops with a roast level and a tasting note. The only server surface is
# /roast/<selfHandle> (src/index.ts): a shareable URL with personalized OG
# tags built from query-string batch stats, so sharing a result unfurls a
# card about that specific batch instead of one generic card for every share.
name = "atprotozoa-mootroast"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [{ pattern = "mootroast.bisks.net/*", zone_name = "bisks.net" }]

# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes
# (same gotcha called out in buildthis/logs/wrangler.toml).
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
