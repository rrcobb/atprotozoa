name = "atprotozoa-invocation"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A three-line blessing
# generator in the cadence of "Peace and prosperity for all. Make a
# breakthrough. Make no mistakes." — mad-libs word banks recombine into a
# fresh invocation each cast. lib/invocation.js is the generator; index.html
# is the cast/reroll/copy/share UI, same shape as idea-mill's headline card.
main = "src/index.ts"

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# invocation.bisks.net is being retired to free a slot against the zone's
# custom-domain cap (see notes/20-deploy.md). Migrated to bisks.net/invocation
# instead. See notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "invocation.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/invocation", zone_name = "bisks.net" },
  { pattern = "bisks.net/invocation/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
