name = "atprotozoa-vouch"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# vouch — inspired by github.com/rektide/at-seven-ten (psingletary.com's ask):
# that project is a static Bluesky app for viewing com.bsky38.influential.vote
# records, one per subject DID, keyed by the subject so re-voting is an
# idempotent overwrite rather than a duplicate. This rebuilds that same idea
# under this repo's own lexicon (net.bisks.vouch.vouch) and OAuth conventions
# instead of depending on someone else's unclaimed collection: sign in, vouch
# for anyone you find influential (a record written to *your own* PDS,
# rkey = subject DID), and look up anyone's public vouch list the same
# three-step way seven-ten does (resolveHandle -> PLC/did:web doc -> PDS ->
# listRecords). Entirely frontend — no KV, no Durable Object, no backend
# tally, same as the source project's "pure static assets" goal.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [
  { pattern = "vouch.bisks.net/*", zone_name = "bisks.net" },
]

# run_worker_first: /u/<handle> renders personalized OG tags server-side
# (src/index.ts), same recipe as sites/didscope, so the Worker must run
# before the static-asset router.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
