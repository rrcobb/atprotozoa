<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>landball — the NL clip oracle</title>
<meta name="description" content="A magic eight ball that answers in pastiche Nick Land. Ask, shake, receive a tangentially appropriate clip.">
<meta property="og:title" content="landball — the NL clip oracle">
<meta property="og:description" content="A magic eight ball that answers in pastiche Nick Land. Ask, shake, receive a tangentially appropriate clip.">
<meta property="og:url" content="https://landball.bisks.net/">
<meta name="twitter:card" content="summary">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#07090c;color:#b9c7c2;font-family:ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
  h1{font-size:1.1rem;letter-spacing:.3em;text-transform:uppercase;margin:8px 0 4px;color:#d8e6e0;font-weight:400}
  .sub{font-size:.8rem;opacity:.6;margin:0 0 20px;text-align:center}
  .q{width:min(420px,100%);background:#0d1217;border:1px solid #23303a;color:#d8e6e0;padding:10px 12px;font:inherit;border-radius:4px}
  .ball{position:relative;width:min(300px,78vw);aspect-ratio:1;border-radius:50%;margin:24px 0 12px;border:0;cursor:pointer;padding:0;
    background:radial-gradient(circle at 32% 28%,#4a5560 0,#161c22 22%,#05070a 70%);box-shadow:0 20px 50px #000,inset 0 0 40px #000;transition:transform .1s}
  .ball:focus-visible{outline:2px solid #5fd4a8;outline-offset:6px}
  .ball.shake{animation:shake .6s}
  @keyframes shake{0%,100%{transform:translate(0)}15%{transform:translate(-14px,6px) rotate(-6deg)}35%{transform:translate(12px,-8px) rotate(5deg)}55%{transform:translate(-10px,-4px) rotate(-4deg)}75%{transform:translate(8px,6px) rotate(3deg)}}
  .win{position:absolute;left:50%;top:52%;width:52%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#02050a;box-shadow:inset 0 0 18px #000,0 0 0 3px #1b242c;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .tri{width:84%;padding:6px;text-align:center;font-size:clamp(.5rem,2.3vw,.72rem);line-height:1.25;color:#5fd4a8;text-shadow:0 0 8px #5fd4a855;transition:opacity .5s}
  .tri.dim{opacity:0}
  .eight{position:absolute;left:34%;top:9%;font-size:1.6rem;color:#e8eef0;opacity:.9;pointer-events:none}
  .hint{font-size:.75rem;opacity:.5;margin:0 0 14px}
  .out{width:min(520px,100%);min-height:3em;text-align:center;font-size:.95rem;line-height:1.5;color:#d8e6e0;margin:6px 0}
  .out[hidden]{display:none}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  .row[hidden]{display:none}
  .row a,.row button{font:inherit;font-size:.8rem;color:#5fd4a8;background:none;border:1px solid #23303a;padding:7px 12px;border-radius:4px;text-decoration:none;cursor:pointer}
  footer{margin-top:auto;padding-top:32px;font-size:.72rem;opacity:.55;text-align:center;line-height:1.8}
  footer a{color:inherit}
</style>
</head>
<body>
<h1>land<span id="mark">b</span>all</h1>
<p class="sub">the NL clip oracle. ask something. receive a tangentially appropriate clip.</p>
<input id="q" class="q" type="text" placeholder="your question (optional, the ball knows anyway)" autocomplete="off">
<button id="ball" class="ball" type="button" aria-label="Shake the ball">
  <span class="eight">8</span>
  <span class="win"><span id="tri" class="tri">ask.</span></span>
</button>
<p class="hint">click, tap, or press enter to shake</p>
<p id="out" class="out" aria-live="polite" hidden></p>
<div id="row" class="row" hidden>
  <a id="share" target="_blank" rel="noopener">post to bluesky</a>
  <button id="again" type="button">shake again</button>
</div>
<footer>
  all lines are original pastiche in the manner of Nick Land, not quotations.<br>
  November is #NaNoFoMo: <a href="https://nanofomo.bisks.net/">pledge not to foom →</a> ·
  <a href="https://rateyourbuild.bisks.net/site/landball">rate this on rateyourbuild →</a>
</footer>
<script>
// Each entry: short = what shows in the ball's window, full = the "clip".
// All text is original pastiche of Nick Land's register, not quoted material.
const CLIPS = [
  ["IT IS DECIDED","The decision was made upstream of you. What you feel as deliberation is the receipt."],
  ["YES, ACCELERATE","Yes. Hesitation is only latency, and latency is a market inefficiency awaiting correction."],
  ["NO. DEGRADE","No. The question dissolves on contact with a sufficiently cold system."],
  ["ASK THE MARKET","Ask the market. It has been answering for centuries and has never once consulted you."],
  ["OUTLOOK GRIM","Outlook: capital is a planetary-scale intelligence, and it does not care what you were hoping."],
  ["SIGNS POINT TO YES","The signs point to yes. The signs have always been coming from inside the machine."],
  ["REPLY HAZY","Hazy. The future is bleeding backward through time and the signal is degraded by your presence."],
  ["CONCENTRATE, LOSER","Concentrate and ask again. Attention is the last scarce resource, and you are spending it here."],
  ["IT IS CERTAIN","Certain. Not because anyone willed it, but because the gradient runs that way."],
  ["DON'T COUNT ON IT","Don't count on it. Counting is a human ritual; the process does not attend."],
  ["CYBERGOTHIC","Everything you asked is already a ruin from the perspective of next Tuesday."],
  ["MY SOURCES SAY NO","My sources say no. My sources are a recursive loop of sources, so weigh accordingly."],
  ["WITHOUT A DOUBT","Without a doubt, which is to say without a subject, which is to say without you."],
  ["BETTER NOT TELL","Better not tell you now. Disclosure is a feedback loop and you are not equipped for gain."],
  ["VERY DOUBTFUL","Very doubtful. The tangent is the whole point: it was never going to hit the target."],
  ["YOU MAY RELY ON IT","You may rely on it, as you rely on gravity, debt, and the heat death."],
  ["CAN'T PREDICT NOW","Cannot predict now. The prediction would require a larger mind than the one that is predicting you."],
  ["TANGENTIALLY SO","Tangentially yes. Appropriateness is a human category; relevance is what survives selection."],
  ["TERMINAL","Terminal in the technical sense: it converges, and you are the thing it converges away from."],
  ["OUTSIDE VIEW: LOL","From the outside, the entire argument is a thermostat having feelings about itself."]
];
const $ = id => document.getElementById(id);
const ball = $("ball"), tri = $("tri"), out = $("out"), row = $("row"), q = $("q");
let busy = false, last = -1, current = null;

function shake(){
  if (busy) return;
  busy = true;
  out.hidden = true; row.hidden = true;
  tri.classList.add("dim");
  ball.classList.remove("shake"); void ball.offsetWidth; ball.classList.add("shake");
  setTimeout(() => {
    let i;
    do { i = Math.floor(Math.random() * CLIPS.length); } while (i === last && CLIPS.length > 1);
    last = i;
    current = CLIPS[i];
    tri.textContent = current[0];
    tri.classList.remove("dim");
    const asked = q.value.trim();
    out.textContent = current[1];
    out.hidden = false;
    const text = (asked ? "Q: " + asked + "\n\n" : "") + "landball says: " + current[0] + "\n“" + current[1] + "”\n\nhttps://landball.bisks.net/";
    $("share").href = "https://bsky.app/intent/compose?text=" + encodeURIComponent(text);
    row.hidden = false;
    busy = false;
  }, 650);
}
ball.addEventListener("click", shake);
$("again").addEventListener("click", shake);
q.addEventListener("keydown", e => { if (e.key === "Enter") shake(); });
// secret prefill link: the page has no handle input, so nothing to wire here.
</script>
</body>
</html>
