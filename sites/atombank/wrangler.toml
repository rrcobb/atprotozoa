name = "atprotozoa-atombank"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser, dedup and vault storage
# included. Built after @norvid-studies.bsky.social tagged @buildthis in a
# thread where @librarianofbabl.bsky.social's post got dubbed "Lexical Atom
# Bank Deduplication" — a real tool now exists for depositing your text's
# unique words into a lexical atom bank.
routes = [
  { pattern = "atombank.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
