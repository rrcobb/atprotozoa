name = "atprotozoa-sepcheck"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Own subdomain via a hostname route (2026-07-31). The wildcard *.bisks.net
# DNS record + ACM wildcard cert mean this needs no custom-domain slot; routes
# cap at 1000/zone vs 100 for custom domains. See notes/20-deploy.md.
# The path route stays so existing shared links keep working.
routes = [
  { pattern = "sepcheck.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/sepcheck", zone_name = "bisks.net" },
  { pattern = "bisks.net/sepcheck/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
