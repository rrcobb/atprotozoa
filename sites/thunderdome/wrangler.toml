name = "atprotozoa-thunderdome"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Enter a Bluesky handle
# (or pass ?h=): it reads the public AppView anonymously (resolveHandle,
# getProfile, getFollows, getFollowers, getAuthorFeed — all CORS *, no auth)
# to build two rosters of bisks — the handle's own, and a pool pulled from
# its moots — then runs a betting thunderdome: bet wasteland dollars on
# single-draw grudge matches, decided randomly weighted by like count (odds
# and like counts stay hidden), until the bankroll busts at $0 or jackpots at
# $10,000. lib/thunderdome.js is
# copied+trimmed from moot-bingo/lib/moots.js and immortals/lib/immortal.js
# (copy, don't abstract).
main = "src/index.ts"

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# thunderdome.bisks.net is being retired to free a slot against the zone's
# custom-domain cap (see notes/20-deploy.md). Migrated to bisks.net/games/thunderdome
# as part of the new games/ cluster. See notes/40-new-site-playbook.md
# ("Why paths, not subdomains").
routes = [
  { pattern = "thunderdome.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/games/thunderdome", zone_name = "bisks.net" },
  { pattern = "bisks.net/games/thunderdome/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
