name = "atprotozoa-moottld"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Everything runs client-side (see public/index.html + public/lib/census.js)
# EXCEPT the OG/share unfurl, which has a small server surface: the Worker
# renders /s/<handle> (src/index.ts) with per-handle og:title/og:description
# baked server-side, then falls through to ASSETS for everything else. Enter
# a Bluesky handle, it resolves the DID, walks getFollows/getFollowers
# (public.api.bsky.app, CORS *, no auth), intersects them into mutuals, and
# runs the same TLD/segment/length census @mfzx.net did by hand in the
# thread this site automates. No secrets.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes
# (same gotcha called out in buildthis/logs/wrangler.toml).
routes = [{ pattern = "moottld.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /s/<handle> is dynamic (personalized OG tags per share), so
# the Worker must run BEFORE the static-asset router, same as sites/didscope.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
