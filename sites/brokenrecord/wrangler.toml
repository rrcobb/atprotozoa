name = "atprotozoa-brokenrecord"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Enter a Bluesky handle, download their whole repo as one CAR, and cluster
# their own posts against each other — near-duplicates, paraphrases, reused
# jokes/opinions/stories/phrases. Everything runs client-side
# (public/lib/car.js + lib/similarity.js + app.js); the one server job is
# /s/<handle>, a personalized share-preview route (see src/index.ts).
# No OAuth, no login, no secrets — public AT Protocol reads only.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [{ pattern = "brokenrecord.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /s/<handle> is dynamic (personalized OG tags per share),
# so the Worker must run before the static-asset router.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
