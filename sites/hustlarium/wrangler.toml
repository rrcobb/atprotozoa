name = "atprotozoa-hustlarium"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Everything runs client-side (see public/index.html — a pure JS specimen
# generator, no XRPC calls, no per-user data) EXCEPT the OG/share unfurl,
# which has a small server surface: the Worker renders /s/<n> (src/index.ts)
# with that specimen's og:title/og:description/og:url baked server-side, then
# falls through to ASSETS for everything else. Prompted by @dame.is's post
# ("we are basically free of a certain type of AI/vibecode hustle bro that
# saturates X") — this is a satirical wildlife exhibit for that species,
# safely viewed from behind glass, from Bluesky. No secrets, no XRPC.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes
# (same gotcha called out in buildthis/logs/wrangler.toml).
routes = [{ pattern = "hustlarium.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /s/<n> is dynamic (personalized OG tags per specimen), so
# the Worker must run BEFORE the static-asset router, same as sites/didscope.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
