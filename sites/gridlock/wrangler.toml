name = "atprotozoa-gridlock"
compatibility_date = "2025-01-01"

# Static assets only. The browser resolves the public AppView roster and
# keeps notes, honks, checklist progress, and mileage in localStorage.
routes = [
  { pattern = "gridlock.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
not_found_handling = "single-page-application"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Jam"]

[[migrations]]
tag = "v2"
deleted_classes = ["Jam"]
