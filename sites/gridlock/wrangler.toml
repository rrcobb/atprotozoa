name = "atprotozoa-gridlock"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @words.bsky.social asked for a "sitting in traffic simulator where you sit
# next to your mutuals and work together to thread messages or alleviate
# boredom." Client resolves a handle to its moots pool (getFollows ∩
# getFollowers, widened to follows if too small — copied verbatim from
# sites/pacmoot/public/lib/cluster.js, itself from mootdrone, itself from
# clustercrawl, itself from simcluster: copy, don't abstract) and lays the
# pool out as a bumper-to-bumper jam. The real bit: one Durable Object per
# jam (idFromName(handle)) holds live WebSocket presence, a shared CB-radio
# note thread, a synced honk counter, and a co-op "spot it" road-trip
# checklist — same shape as sites/docmoot's Doc DO (WebSocketPair, per-room
# broadcast, blockConcurrencyWhile-loaded storage), stripped of the
# operational-transform text-editing part since a jam doesn't need it.
#
# Single canonical host, own subdomain — no path-mount alongside it (per
# notes/40-new-site-playbook.md, 2026-07-31: a plain subdomain route no
# longer costs a custom-domain slot).
routes = [
  { pattern = "gridlock.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/j/*"]

[[durable_objects.bindings]]
name = "JAM"
class_name = "Jam"

# new_sqlite_classes, not new_classes — legacy KV-backed DOs need Workers
# Paid; this account is on Free. See sites/the-place/wrangler.toml.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Jam"]
