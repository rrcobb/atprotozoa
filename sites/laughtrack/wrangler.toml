name = "atprotozoa-laughtrack"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Everything still runs client-side (see public/lib/scan.js) EXCEPT the OG/share
# unfurl, which has a small server surface: the Worker renders /s/<handle>
# (src/index.ts) with per-handle og:title/og:description/og:url baked server-side,
# then falls through to ASSETS for everything else. Type a Bluesky handle: it
# resolves the DID, walks their recent posts (own posts and their own replies),
# pulls each post's reply thread, and counts "lol"/"haha"/"omg"/"lmao"/"rofl"-family
# exclamations across every reply to find whichever post made people laugh the
# most. Built for @cee.wtf. No secrets.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes
# (same gotcha called out in buildthis/logs/wrangler.toml).
routes = [{ pattern = "laughtrack.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /s/<handle> is dynamic (personalized OG tags per share), so
# the Worker must run BEFORE the static-asset router, same as sites/didscope.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
