name = "atprotozoa-lesslong"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Mostly a static site — the Sequences, each boiled down to one plain-English
# paragraph at an eighth-grade reading level. Built off @joetforhire.com's
# "getting an LLM to autosummarize lesswrong articles" bit, requested by
# @fubarchitect.com. One dynamic route: /api/recent, a stateless proxy to
# LessWrong's GraphQL API (added for @robmurrish.bsky.social's "recent
# articles with a karma cutoff" ask) so the browser can live-query recent
# posts above a karma threshold without hitting CORS. No storage, no cron,
# no AI binding — every request re-fetches from lesswrong.com live.

routes = [
  { pattern = "lesslong.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
