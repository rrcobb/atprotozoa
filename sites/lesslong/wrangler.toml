name = "atprotozoa-lesslong"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything is prebuilt HTML, no runtime data fetching.
# LessWrong's Sequences, each article boiled down to one plain-English
# paragraph at an eighth-grade reading level. Built off @joetforhire.com's
# "getting an LLM to autosummarize lesswrong articles" bit, requested by
# @fubarchitect.com. Starting with the Sequences; more of the site could
# follow later.

routes = [
  { pattern = "lesslong.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
