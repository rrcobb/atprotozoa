name = "atprotozoa-promptrot"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @fromthewestmeadow.com asked for a site that "enshittifies the way I
# prompt" — takes a clean, well-specified prompt and rots it into the way
# they've actually been tagging @buildthis.bisks.net (read straight off their
# real mention history: lowercase, no punctuation, dropped apostrophes,
# stock typos, and — the real bit — never one complete spec, always a stream
# of stacked follow-up posts amending the ask). Pure client-side transform,
# no server state.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
routes = [
  { pattern = "promptrot.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = false
