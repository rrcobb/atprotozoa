name = "atprotozoa-simcluster"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser. It reads Bluesky's public
# AppView (resolveHandle / getFollows / getFollowers / getProfile, all anonymous,
# CORS *) to work out a handle's "moots" (mutuals), then plays Clue with them:
# six mutuals are the murder SUSPECTS (one is the killer), a handful more are
# rival detectives who hold cards, and the WEAPONS and ROOMS are "popular but
# unique" trigrams. Deduce who, in which trigram, with which trigram, then accuse.
# moots.js is copied from moot-bingo/neighborhood; trigrams.js from trigrams/data
# (copy, don't abstract).

routes = [
  { pattern = "bisks.net/games/simcluster", zone_name = "bisks.net" },
  { pattern = "bisks.net/games/simcluster/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
