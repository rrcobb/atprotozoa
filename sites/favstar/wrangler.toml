name = "atprotozoa-favstar"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Enter a Bluesky handle (or
# pass ?handle=): it reads that account's public feed anonymously from the AppView
# (getAuthorFeed, CORS *), ranks their original posts by likes + reposts, and
# shows the top 25 — a favstar leaderboard, gold/silver/bronze for the podium.
# No secrets, no server surface.
assets = { directory = "./public" }

routes = [{ pattern = "favstar.bisks.net", custom_domain = true }]
