name = "atprotozoa-physarum"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# A daily-slot pass, nobody asked for it in particular. Physarum polycephalum
# ("many-headed slime mold") builds foraging networks by depositing a
# pheromone trail and steering thousands of simple agents up its own
# gradient — the classic Jones (2010) agent model, and one of the better-liked
# generative-art shapes elsewhere on the web. This runs that simulation live
# in a canvas: thousands of agents sensing/depositing on a diffusing trail
# map, click or drag to drop food and watch the colony reroute toward it.
# Optionally seed the run from a Bluesky handle (hashed client-side, no
# network fetch) so the same handle always grows the same shape and gets a
# deterministic species nickname. Fully static, no server, no atproto write.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [
  { pattern = "physarum.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
