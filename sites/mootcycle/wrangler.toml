name = "atprotozoa-mootcycle"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# mootcycle — a 2000s-Flash-portal-style 2D physics motorbike game
# (Elastomania/Bike Mania lineage): gas + brake plus an independent lean
# control (rotate the rider's weight forward/back) to keep the bike upright
# over procedurally generated hill terrain. Enter a Bluesky handle and the
# terrain seeds off your DID (same handle always rides the same hills) and
# your avatar becomes the rider's helmet — otherwise it's an anonymous
# default rider. Pure client-side canvas + Web Audio, no build step, no
# secrets. @cee.wtf asked for this one.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [
  { pattern = "mootcycle.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/games/mootcycle", zone_name = "bisks.net" },
  { pattern = "bisks.net/games/mootcycle/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
