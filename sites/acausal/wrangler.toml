name = "atprotozoa-acausal"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Paste a Bluesky thread
# (a bsky.app post URL, an at:// uri, or ?uri=): it reads that thread anonymously
# from the AppView (getPostThread, CORS *) and renders its *acausal* version —
# causality inverted, so replies appear above and *before* the posts they answer,
# timestamps running backwards, effects preceding their causes. No secrets, no
# server surface.
assets = { directory = "./public" }

routes = [{ pattern = "acausal.bisks.net", custom_domain = true }]
