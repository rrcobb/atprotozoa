name = "atprotozoa-acausal"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Paste a Bluesky thread
# (a bsky.app post URL, an at:// uri, or ?uri=): it reads that thread anonymously
# from the AppView (getPostThread, CORS *) and renders its *acausal* version —
# causality inverted, so replies appear above and *before* the posts they answer,
# timestamps running backwards, effects preceding their causes. No secrets, no
# server surface.
main = "src/index.ts"

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# acausal.bisks.net is being retired to free a slot against the zone's
# custom-domain cap (see notes/20-deploy.md). Migrated to bisks.net/acausal
# instead. See notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "bisks.net/acausal", zone_name = "bisks.net" },
  { pattern = "bisks.net/acausal/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
