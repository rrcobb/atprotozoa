name = "atprotozoa-simclustered"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A 20-question quiz that
# quantifies how "SimCluster" a Bluesky handle really is: it reads the public
# AppView (resolveHandle / getFollows / getFollowers, anonymous, CORS *) for a
# handle's actual follows/followers, then asks 20 questions that are ALL
# derived from that real graph — is this real account one of your moots?
# which of these three really is? who posted more recently? how big is your
# real mutual count, really? No made-up trivia, no jokey filler — every
# question has a ground-truth answer sitting in the handle's live data.
# lib/graph.js is adapted from lib/moots.js (simclash/toroidarium/moot-bingo),
# widened to expose raw follows/followers/one-way sets, not just the mutual
# pool (copy, don't abstract).
assets = { directory = "./public" }

routes = [{ pattern = "simclustered.bisks.net", custom_domain = true }]
