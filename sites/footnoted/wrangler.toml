name = "atprotozoa-footnoted"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything is prebuilt HTML/CSS/JS, no runtime data
# fetching. Reproduces one jargon-dense thread post with underlined terms
# that fan out (desktop) or expand inline (mobile) into plain-English
# annotations with links to the actual papers/tutorials being alluded to.
# Built for @shimmermathlabs.com, who asked the bot to explain a post by
# @theophite.bsky.social about ablating a diffusion-transformer recipe.

routes = [
  { pattern = "footnoted.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
