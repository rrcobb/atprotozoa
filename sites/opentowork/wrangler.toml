name = "atprotozoa-opentowork"
compatibility_date = "2025-01-01"

# @aly.codes' thread: "puts the linkedin #opentowork banner over your bluesky
# avatar and changes it for you ... autonomously upon approval after the user
# logins with oauth." Pure static site: everything runs in the browser
# (public/lib/oauth.js + ring.js). Brand-new site at the root of its own
# hostname, no path route.
assets = { directory = "./public" }

routes = [{ pattern = "opentowork.bisks.net/*", zone_name = "bisks.net" }]
