name = "atprotozoa-overthink"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A fake ChatGPT chat: the
# reply streams in like the real thing, then a "Thought for Ns" chip unfolds
# into an infinitely-nested tree of fake reasoning steps (public/app.js's
# thinkTree() generator). No backend, no secrets — built for
# @fromthewestmeadow.com.

routes = [
  { pattern = "overthink.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
