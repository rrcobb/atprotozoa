name = "atprotozoa-simcluster-samesame"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Reads Bluesky's public
# AppView (resolveHandle / getFollows / getFollowers / getProfile, all
# anonymous, CORS *) to get a real number out of a handle's SimCluster (the
# mutual rate: what fraction of who you follow follows back), then plots
# that ONE number twice — once drawn to look alarming, once drawn to look
# calm — as a riff on "if you look at these two graphics you'll see they
# are, in essence, the same." simstats.js is a trimmed copy of
# sites/simcluster-gacha/public/lib/cluster.js (copy, don't abstract): same
# resolve/page helpers, no profile-hydration pass since this only needs
# counts, not a card pool.

routes = [
  { pattern = "simcluster-samesame.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
