name = "atprotozoa-candyland"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A schizophrenic Bluesky
# Candyland: the live firehose (jetstream) pours down a winding rainbow candy
# path where every post becomes a gumdrop, lollipop, or peppermint marching
# toward Queen Frostine's castle, while the posts' own words rise as an
# overlapping candy-colored chorus of whispers. Oversaturated, kaleidoscopic,
# many-voices-at-once. Built after @ver.ooo tagged @buildthis for
# "schizophrenic bluesky candyland ... tonite queen". No secrets, no server.
assets = { directory = "./public" }

routes = [{ pattern = "candyland.bisks.net", custom_domain = true }]
