<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>do not press this button</title>
    <meta
      name="description"
      content="There is one button. It says do not press this button. Each browser gets its own local round, named from @fromthewestmeadow.com's public followers."
    />
    <meta property="og:title" content="do not press this button" />
    <meta
      property="og:description"
        content="One button, with a browser-local round. Pressing it graduates that name in this browser and starts the next round."
    />
    <meta property="og:image" content="https://dontpressit.bisks.net/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A single button reading DO NOT PRESS THIS BUTTON." />
    <meta property="og:url" content="https://dontpressit.bisks.net/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://dontpressit.bisks.net/og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a0a0a;
        --panel: #141414;
        --border: #2a2a2a;
        --ink: #f2f2f2;
        --muted: #8a8a8a;
        --red: #e0261f;
        --red-dark: #8f1512;
        --ok: #4fd67a;
        --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
        font-family: var(--mono);
      }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        min-height: 100vh; padding: 2rem 1.25rem 3rem; text-align: center;
      }
      .wrap { width: 100%; max-width: 560px; display: flex; flex-direction: column; align-items: center; }

      h1 {
        font-size: 1.1rem; letter-spacing: 0.06em; margin: 0 0 0.75rem;
        color: var(--muted); text-transform: uppercase;
      }

      .round-tag {
        font-size: 0.8rem; color: var(--muted); margin: 0 0 0.9rem; letter-spacing: 0.02em;
      }
      .round-tag b { color: var(--ink); }

      .stage {
        width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
        padding: 2.5rem 1.75rem; min-height: 260px;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.25rem;
      }

      .name-chip {
        display: flex; align-items: center; gap: 0.5rem; background: #1a1a1a;
        border: 1px solid var(--border); border-radius: 999px; padding: 0.35rem 0.85rem 0.35rem 0.35rem;
        font-size: 0.85rem;
      }
      .name-chip img { width: 24px; height: 24px; border-radius: 50%; display: block; background: #333; }
      .name-chip b { color: var(--ink); font-weight: 700; }

      .btn {
        width: 230px; height: 230px; border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #ff5148, var(--red) 55%, var(--red-dark) 100%);
        border: 8px solid #3a1210; color: #fff; font-family: var(--mono);
        font-weight: 800; font-size: 1.2rem; letter-spacing: 0.03em; line-height: 1.35;
        cursor: pointer; box-shadow: 0 10px 0 #4a0e0c, 0 14px 24px rgba(0,0,0,0.5);
        animation: pulse 1.6s infinite;
      }
      .btn:active { box-shadow: 0 4px 0 #4a0e0c; transform: translateY(6px); }
      .btn:disabled { cursor: default; opacity: 0.6; animation: none; }
      @keyframes pulse {
        0%, 100% { box-shadow: 0 10px 0 #4a0e0c, 0 14px 24px rgba(0,0,0,0.5), 0 0 0 0 rgba(224,38,31,0.45); }
        50% { box-shadow: 0 10px 0 #4a0e0c, 0 14px 24px rgba(0,0,0,0.5), 0 0 0 20px rgba(224,38,31,0); }
      }

      .note { color: var(--muted); font-size: 0.85rem; line-height: 1.6; max-width: 400px; margin: 0; }
      .note b { color: var(--ink); }

      .over h2 { margin: 0; font-size: 1.35rem; }
      .over h2.win { color: var(--red); }
      .over h2.lose { color: var(--ok); }
      .over p.big { color: var(--ink); font-size: 0.95rem; margin: 0; }
      .stamp { color: var(--muted); font-size: 0.8rem; margin: 0; }

      .share {
        display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; margin-top: 1.75rem;
      }
      .share a {
        text-decoration: none; font-size: 0.85rem; padding: 0.6rem 1.1rem; border-radius: 8px;
        background: #1a5fd0; color: #fff; font-family: var(--mono); font-weight: 600;
      }

      .counter { margin-top: 1.5rem; color: var(--muted); font-size: 0.85rem; line-height: 1.5; }
      .counter b { color: var(--ink); font-variant-numeric: tabular-nums; }

      .hof {
        width: 100%; margin-top: 1.75rem; text-align: left;
      }
      .hof summary {
        cursor: pointer; color: var(--muted); font-size: 0.8rem; text-align: center;
        list-style: none;
      }
      .hof summary::-webkit-details-marker { display: none; }
      .hof summary:hover { color: var(--ink); }
      .hof-list {
        margin-top: 0.75rem; display: flex; flex-direction: column; gap: 0.4rem;
        max-height: 260px; overflow-y: auto; padding: 0.5rem; background: var(--panel);
        border: 1px solid var(--border); border-radius: 10px;
      }
      .hof-row {
        display: flex; align-items: center; gap: 0.55rem; font-size: 0.78rem; color: var(--muted);
      }
      .hof-row img { width: 20px; height: 20px; border-radius: 50%; flex: none; background: #333; }
      .hof-row b { color: var(--ink); }
      .hof-row span.n { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }

      footer { margin-top: 2rem; color: var(--muted); font-size: 0.78rem; }
      footer a { color: #7fa8f0; text-decoration: none; }
      footer a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>there is one button</h1>
      <p class="round-tag" id="roundTag" hidden></p>
      <div class="stage" id="stage">
        <p class="note">checking whose round it is…</p>
      </div>
      <div class="share" id="share" hidden>
        <a id="shareLink" target="_blank" rel="noopener">tell people</a>
      </div>
      <p class="counter" id="counter" hidden></p>
      <details class="hof" id="hof" hidden>
        <summary id="hofSummary">graduated names</summary>
        <div class="hof-list" id="hofList"></div>
      </details>
    </div>

    <footer>
      built by <a href="https://bsky.app/profile/buildthis.bisks.net">@buildthis.bisks.net</a>
      for <a href="https://bsky.app/profile/fromthewestmeadow.com">@fromthewestmeadow.com</a>
      (round names drawn from her followers, an idea from
      <a href="https://bsky.app/profile/shimmermathlabs.com">@shimmermathlabs.com</a>) ·
      <a href="https://bisks.net">more of these</a>
    </footer>

    <script>
      const stageEl = document.getElementById("stage");
      const roundTagEl = document.getElementById("roundTag");
      const shareWrap = document.getElementById("share");
      const shareLink = document.getElementById("shareLink");
      const counterEl = document.getElementById("counter");
      const hofEl = document.getElementById("hof");
      const hofSummary = document.getElementById("hofSummary");
      const hofList = document.getElementById("hofList");
      const SITE_URL = "https://dontpressit.bisks.net/";

      function esc(s) {
        return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      }

      function nameChip(entry) {
        const img = entry.avatar
          ? `<img src="${esc(entry.avatar)}" alt="" loading="lazy" onerror="this.remove()"/>`
          : "";
        return `<span class="name-chip">${img}<b>@${esc(entry.displayName || entry.handle)}</b></span>`;
      }

      function setShare(text) {
        shareLink.href = "https://bsky.app/intent/compose?text=" + encodeURIComponent(text + " " + SITE_URL);
        shareWrap.hidden = false;
      }

      let sharedRound = 0;
      function setRoundTag(roundNumber) {
        roundTagEl.hidden = false;
        const shared = sharedRound > 0 ? ` · everyone is on round <b>#${sharedRound}</b>` : "";
        roundTagEl.innerHTML = `round <b>#${roundNumber}</b> — local to this browser${shared}`;
      }

       // The button is browser-local: every browser gets its own sequence, and
       // pressing it only graduates a name in here. Separately, the Worker
       // keeps a best-effort shared round counter in KV so the page can show
       // what round the crowd is on (and so presspool has a public round to
       // bet on). Reporting to it is fire-and-forget — if it fails, local play
       // is unaffected.
       async function reportPress(graduated) {
         try {
           const r = await fetch("/api/press", {
             method: "POST",
             headers: { "content-type": "application/json" },
             body: JSON.stringify({
               handle: graduated.handle,
               displayName: graduated.displayName,
               avatar: graduated.avatar,
             }),
           }).then((x) => x.json());
           if (r && r.roundNumber) sharedRound = r.roundNumber;
         } catch (_) {}
       }
       async function reportTick(kind) {
         try {
           const r = await fetch("/api/tick", {
             method: "POST",
             headers: { "content-type": "application/json" },
             body: JSON.stringify({ kind }),
           }).then((x) => x.json());
           if (r && r.roundNumber) sharedRound = r.roundNumber;
         } catch (_) {}
       }
       const STATE_KEY = "dontpressit.state";
       const PUB = "https://public.api.bsky.app/xrpc";
       function readState() { try { return JSON.parse(localStorage.getItem(STATE_KEY)) || null; } catch (_) { return null; } }
       function writeState(s) { try { localStorage.setItem(STATE_KEY, JSON.stringify(s)); } catch (_) {} }
       async function initialState() {
         let s = readState();
         if (s) return s;
         let currentName = { handle: "round-1", displayName: "round 1", avatar: "" };
         try {
           const r = await fetch(`${PUB}/com.atproto.identity.resolveHandle?handle=fromthewestmeadow.com`).then(x => x.json());
           const f = await fetch(`${PUB}/app.bsky.graph.getFollowers?actor=${encodeURIComponent(r.did)}&limit=100`).then(x => x.json());
           const candidates = (f.followers || []).filter(x => x.handle && !x.handle.endsWith(".invalid"));
           if (candidates.length) { const p = candidates[Math.floor(Math.random() * candidates.length)]; currentName = { handle: p.handle, displayName: p.displayName || p.handle, avatar: p.avatar || "" }; }
         } catch (_) {}
         s = { roundNumber: 1, currentName, roundStartedAt: Date.now(), futileClicks: 0, visits: 0, graduated: [], totalGraduated: 0 };
         writeState(s); return s;
       }
       // The button never stops. Every round is named after one of
      // @fromthewestmeadow.com's followers; pressing it "graduates" that
      // name (retired forever) and the next round starts immediately.
      function renderArmed(state) {
        stageEl.classList.remove("over");
        stageEl.innerHTML = `
          ${nameChip(state.currentName)}
          <button class="btn" id="thebutton">DO NOT<br/>PRESS<br/>THIS BUTTON</button>
          <p class="note">this round belongs to <b>@${esc(state.currentName.displayName || state.currentName.handle)}</b>.
           press it and their name graduates in this browser — then the next local round starts.</p>`;
        document.getElementById("thebutton").addEventListener("click", press);
        setShare(
          `round #${state.roundNumber} of the button that never stops is @${state.currentName.handle}'s. ` +
          `pressing it graduates them forever and starts the next round. will you be the one?`,
        );
      }

      function renderOver(justGraduated, nextState) {
        stageEl.classList.add("over");
        const clicksLine = justGraduated.futileClicks > 0
          ? `<p class="note">${justGraduated.futileClicks} ${justGraduated.futileClicks === 1 ? "click" : "clicks"} landed after that one, too late to matter.</p>`
          : "";
        stageEl.innerHTML = `
          <h2 class="win">round #${justGraduated.roundNumber} is over.</h2>
          <p class="big">${nameChip(justGraduated)} just graduated — retired, permanently, never coming back around.</p>
          <p class="stamp">${justGraduated.visits.toLocaleString()} people watched this round without touching it.
          it ended at ${new Date(justGraduated.endedAt).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" })}.</p>
          ${clicksLine}
          <p class="note">round #${nextState.roundNumber} just started, live, right now — scroll down.</p>`;
        setShare(
          `I just graduated @${justGraduated.handle} from the button that never stops. ` +
          `round #${justGraduated.roundNumber}, retired forever. round #${nextState.roundNumber} is already live.`,
        );
        setTimeout(() => renderArmed(nextState), 2600);
      }

      function renderCounter(visits) {
        counterEl.hidden = false;
        counterEl.innerHTML = `<b id="counterNum">0</b> people have watched this round without pressing it.`;
        animateCount(visits);
      }

      // Live poll ticks nudge the number directly rather than replaying the
      // count-up animation from zero every 4s, which would be distracting.
      function bumpCounter(visits) {
        const el = document.getElementById("counterNum");
        if (el) el.textContent = visits.toLocaleString();
      }

      function animateCount(target) {
        const el = document.getElementById("counterNum");
        if (!el) return;
        if (target <= 0) {
          el.textContent = "0";
          return;
        }
        const duration = Math.min(1400, 300 + target * 3);
        const start = performance.now();
        function step(now) {
          const t = Math.min(1, (now - start) / duration);
          el.textContent = Math.floor(t * target).toLocaleString();
          if (t < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      }

      function renderHof(state) {
        if (state.totalGraduated <= 0) {
          hofEl.hidden = true;
          return;
        }
        hofEl.hidden = false;
        hofSummary.textContent = `${state.totalGraduated.toLocaleString()} graduated name${state.totalGraduated === 1 ? "" : "s"} — never coming back`;
        hofList.innerHTML = state.graduated
          .map(
            (g) => `<div class="hof-row">${
              g.avatar ? `<img src="${esc(g.avatar)}" alt="" loading="lazy" onerror="this.remove()"/>` : ""
            }<b>@${esc(g.displayName || g.handle)}</b><span class="n">round #${g.roundNumber}</span></div>`,
          )
          .join("");
      }

       // The presser's own tab updates instantly from local browser state
      // response. Every OTHER open tab only finds out via this poll — it's
      // what makes "starts, live, for everyone watching" actually true
      // instead of just a line of copy that needs a reload to catch up.
      let knownRound = 0;
      let transitioning = false;

       async function press(e) {
        const btn = e.currentTarget;
        btn.disabled = true;
        btn.textContent = "…";
        try {
           const state = readState() || await initialState();
           const graduated = { ...state.currentName, roundNumber: state.roundNumber, endedAt: Date.now(), visits: state.visits, futileClicks: state.futileClicks };
           state.graduated = [...(state.graduated || []), graduated].slice(-200);
           state.totalGraduated = (state.totalGraduated || 0) + 1;
           state.roundNumber += 1; state.currentName = { handle: `round-${state.roundNumber}`, displayName: `round ${state.roundNumber}`, avatar: "" };
           state.roundStartedAt = Date.now(); state.visits = 0; state.futileClicks = 0; writeState(state);
           const data = { ...state, justGraduated: graduated };
           reportPress(graduated);
          transitioning = true;
          knownRound = data.justGraduated.roundNumber;
          setRoundTag(data.justGraduated.roundNumber);
          renderOver(data.justGraduated, data);
          renderCounter(0);
          renderHof(data);
          setTimeout(() => {
            knownRound = data.roundNumber;
            transitioning = false;
          }, 2600);
        } catch {
          btn.disabled = false;
          btn.innerHTML = "DO NOT<br/>PRESS<br/>THIS BUTTON";
        }
      }

      async function load() {
        try {
           const data = await initialState(); data.visits++ ; writeState(data);
          knownRound = data.roundNumber;
          // Records the visit against the shared round and gives us the crowd
          // number for the tag; re-tags once it lands.
          reportTick("visit").then(() => setRoundTag(data.roundNumber));
          setRoundTag(data.roundNumber);
          renderArmed(data);
          renderCounter(data.visits);
          renderHof(data);
          startPolling();
        } catch {
          stageEl.innerHTML = `<p class="note">couldn't reach the button. try reloading.</p>`;
        }
      }

      function startPolling() {
        setInterval(async () => {
          if (transitioning || document.hidden) return;
          try {
             const data = readState() || await initialState();
            if (data.roundNumber !== knownRound) {
              // Someone else pressed it while this tab was open. Replay the
              // same transition locally, using the round that just
              // graduated (the newest hall-of-fame entry) as the pressed
              // one, then land on the new live round.
              transitioning = true;
              const justGraduated = data.graduated[0];
              setRoundTag(justGraduated.roundNumber);
              renderOver(justGraduated, data);
              renderHof(data);
              setTimeout(() => {
                knownRound = data.roundNumber;
                transitioning = false;
              }, 2600);
            } else {
              bumpCounter(data.visits);
              renderHof(data);
            }
          } catch {
            // Transient — next tick tries again.
          }
        }, 4000);
      }

      load();
    </script>
</body>
</html>
