name = "atprotozoa-dontpressit"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @fromthewestmeadow.com asked for one button labeled "do not press this
# button" — press it and it's over, globally, for every visitor. v2 (from the
# thread that followed, after someone sniped v1): the button never stops —
# each round is named after one of @fromthewestmeadow.com's followers, and
# pressing it "graduates" that name (retired forever) and starts the next
# round.
#
# The button itself is browser-local — each browser plays its own sequence.
# Alongside it, KV holds a best-effort *shared* round counter so the crowd has
# a common round number, and so sites/presspool has a public /api/state to run
# its market against. Deliberately KV, not a Durable Object: a simultaneous
# double-press collapsing into one advance is an acceptable outcome here.
routes = [
  { pattern = "dontpressit.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[kv_namespaces]]
binding = "ROUND_STATE"

[[migrations]]
tag = "v1"
deleted_classes = ["PressState"]
