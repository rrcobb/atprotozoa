name = "atprotozoa-dontpressit"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @fromthewestmeadow.com asked for one button labeled "do not press this
# button" — press it and it's over. Read literally: there's exactly one
# button for the whole site, so "over" is global, not per-visitor. The one
# bit of real infrastructure is a Durable Object holding that single
# pressed/not-pressed flag for every visitor everywhere. See
# notes/40-new-site-playbook.md.
routes = [
  { pattern = "dontpressit.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "PRESS"
class_name = "PressState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PressState"]
