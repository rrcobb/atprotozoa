name = "atprotozoa-dontpressit"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @fromthewestmeadow.com asked for one button labeled "do not press this
# button" — press it and it's over, globally, for every visitor. v2 (from the
# thread that followed, after someone sniped v1): the button never stops —
# each round is named after one of @fromthewestmeadow.com's followers, and
# pressing it "graduates" that name (retired forever) and starts the next
# round. Still one Durable Object holding the single shared round state. See
# notes/40-new-site-playbook.md.
routes = [
  { pattern = "dontpressit.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "PRESS"
class_name = "PressState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PressState"]
