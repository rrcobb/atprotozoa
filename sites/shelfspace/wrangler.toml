# sites/shelfspace — a browser-owned 3D bookshelf built from your own CSV
# export (Goodreads/StoryGraph-shaped: Title, Authors, ISBN, Last Date Read,
# Stars). No server surface at all: the CSV is parsed and rendered entirely in
# the browser and never uploaded anywhere, so this Worker only serves static
# assets.
name = "atprotozoa-shelfspace"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [
  { pattern = "shelfspace.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
