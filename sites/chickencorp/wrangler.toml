name = "atprotozoa-chickencorp"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site — a 10-slide corporate-deck retrospective on the phrase
# "top chicken": what it did (and mostly didn't) mean before 2026-07-29, and
# what it means now that sites/topchicken exists. No server logic.

routes = [
  { pattern = "chickencorp.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
