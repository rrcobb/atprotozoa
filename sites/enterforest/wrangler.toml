name = "atprotozoa-enterforest"
compatibility_date = "2025-01-01"

# Pure static site — the whole game runs in the browser. enterforest is a
# choose-your-own-adventure branching through a forest full of cryptids and
# fae, riffing on @dame.is's "Enter forest? [Yes] / [No]" post. No secrets,
# no server, no build step.
main = "src/index.ts"

routes = [
  { pattern = "enterforest.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
