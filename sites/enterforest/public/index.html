<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>enter forest? — a choose-your-own-adventure</title>
<meta name="description" content="A choose-your-own-adventure through a forest that isn't keeping to the rules. Cryptids, fae courts, a path that loops, 16 ways it can end — good, bad, and deeply weird." />

<meta property="og:type" content="website" />
<meta property="og:url" content="https://enterforest.bisks.net/" />
<meta property="og:title" content="enter forest? — a choose-your-own-adventure" />
<meta property="og:description" content="Yes or no. Then: cryptids, a fae table set for one, a path that loops on itself. 16 endings — good, bad, and deeply weird." />
<meta property="og:image" content="https://enterforest.bisks.net/og.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="A dark treeline under the words ENTER FOREST? with Yes and No buttons, and a scatter of small lit eyes in the dark." />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="enter forest? — a choose-your-own-adventure" />
<meta name="twitter:description" content="Yes or no. Then: cryptids, a fae table set for one, a path that loops. 16 endings — good, bad, and deeply weird." />
<meta name="twitter:image" content="https://enterforest.bisks.net/og.png" />

<style>
  :root{
    --bg:#070b08; --panel:#0e150f; --panel2:#131d14; --ink:#e9efe4; --dim:#7f9a83;
    --line:#1e2c1f; --gold:#e8c25a; --gold-deep:#b8931f; --gold-dim:#4a3d1a;
    --green:#6fd18a; --red:#ff6b6b; --violet:#b79bf0;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:radial-gradient(1100px 560px at 50% -8%, #101d12 0%, var(--bg) 55%);
    color:var(--ink);
    font:16px/1.55 var(--mono);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{max-width:640px;margin:0 auto;padding:22px 14px 60px}

  header{text-align:center;margin-bottom:6px}
  h1{font-size:26px;letter-spacing:1px;margin:0;color:var(--gold);text-shadow:0 2px 0 #3a2f10}
  .sub{color:var(--dim);margin:8px auto 0;max-width:52ch;font-size:13.5px}

  .statsbar{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin:14px 0 0;font-size:11px;color:var(--dim)}
  .statsbar b{color:var(--ink)}

  .scene{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:20px;margin:20px 0 16px;box-shadow:0 10px 30px rgba(0,0,0,.4);
  }
  .scene .narrative{font-size:15.5px;line-height:1.7;margin:0 0 18px;white-space:pre-line}
  .scene .narrative b{color:var(--gold)}
  .scene .narrative i{color:var(--violet);font-style:normal}
  .choices{display:flex;flex-direction:column;gap:8px}
  .choice{
    text-align:left;font:inherit;font-size:14px;color:var(--ink);
    background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    padding:13px 14px;cursor:pointer;
  }
  .choice:hover{border-color:var(--gold-dim);background:#182319}
  .choice .clabel{font-weight:700}
  .choice .cmeta{display:block;color:var(--dim);font-size:11.5px;margin-top:3px}

  .start-buttons{display:flex;gap:12px;justify-content:center;margin-top:4px}
  .start-buttons .choice{flex:1;max-width:160px;text-align:center}
  .start-buttons .choice.yes{border-color:var(--gold-dim)}
  .start-buttons .choice.yes:hover{background:#2a2412;border-color:var(--gold)}

  .trail{margin:0 0 4px;padding:0;list-style:none;font-size:11.5px;color:var(--dim);text-align:center}
  .trail span{display:inline-block;padding:2px 8px}
  .trail span:not(:last-child)::after{content:"→";margin-left:8px;color:var(--line)}

  .result{
    text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:26px 18px;margin-bottom:18px;
  }
  .result.bad{border-color:#4a2020}
  .result.weird{border-color:#3d2f5c}
  .result .tier-tag{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
  .result .title{font-size:26px;font-weight:800;color:var(--green);margin:2px 0 12px}
  .result.bad .title{color:var(--red)}
  .result.weird .title{color:var(--violet)}
  .result .flavor{font-size:14.5px;color:var(--ink);line-height:1.7;margin-bottom:6px;text-align:left}
  .result .newfind{color:var(--gold);font-weight:700;font-size:12.5px;margin-top:10px}

  .btn{
    font:inherit;font-size:13.5px;cursor:pointer;color:#1a1608;
    background:var(--gold);border:1px solid var(--gold);border-radius:8px;
    padding:10px 16px;font-weight:700;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn.secondary{background:var(--panel2);color:var(--ink);border-color:var(--line)}
  .btn.secondary:hover{border-color:#3a4a3c}

  .share-box{display:none;text-align:center;margin-top:6px}
  .share-box.show{display:block}
  .share-box canvas{display:none}
  .share-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
  .share-post{
    display:inline-flex;align-items:center;gap:6px;text-decoration:none;
    font:inherit;font-size:13px;cursor:pointer;color:var(--ink);
    background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 14px;
  }
  .share-post:hover{border-color:var(--violet)}

  .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}

  .compendium{margin-top:22px;font-size:12.5px}
  .compendium summary{cursor:pointer;color:var(--dim);list-style:none;text-align:center}
  .compendium summary::-webkit-details-marker{display:none}
  .compendium summary:hover{color:var(--violet)}
  .end-list{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:6px}
  .end-list li{
    display:flex;justify-content:space-between;gap:10px;padding:8px 12px;
    background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  }
  .end-list li.locked{opacity:.45}
  .end-list .el{color:var(--ink);font-weight:700;white-space:nowrap}
  .end-list .el.bad{color:var(--red)}
  .end-list .el.weird{color:var(--violet)}
  .end-list .el.good{color:var(--green)}
  .end-list .ed{color:var(--dim);text-align:right;font-size:11.5px}

  footer{text-align:center;margin-top:26px;color:var(--dim);font-size:11.5px}
  footer a{color:var(--violet);text-decoration:none}
  footer a:hover{text-decoration:underline}

  [hidden]{display:none !important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌲 enter forest?</h1>
    <p class="sub">A path breaks off through thick trees. Something in there is breathing wrong. Choose your own adventure — 16 ways this can end.</p>
  </header>

  <div class="statsbar" id="statsBar"></div>

  <ul class="trail" id="trail"></ul>

  <div class="scene" id="scene"></div>

  <div class="result" id="result" hidden></div>

  <div class="share-box" id="shareBox">
    <canvas id="shareCanvas" width="1200" height="630"></canvas>
    <div class="share-actions">
      <button id="shareNative" class="share-post" type="button" style="display:none">📤 share card</button>
      <a id="shareBluesky" class="share-post" target="_blank" rel="noopener">🦋 post to bluesky</a>
      <button id="shareDownload" class="share-post" type="button">⬇ download card</button>
    </div>
  </div>

  <div class="actions" id="actions" hidden>
    <button class="btn" id="again">🌲 enter again</button>
  </div>

  <details class="compendium">
    <summary id="compSummary">📖 ending compendium</summary>
    <ul class="end-list" id="endList"></ul>
  </details>

  <footer>
    part of <a href="https://bisks.net/">bisks.net</a> — built by
    <a href="https://bsky.app/profile/buildthis.bisks.net">@buildthis.bisks.net</a>,
    riffing on a post by <a href="https://bsky.app/profile/dame.is">@dame.is</a>
  </footer>
</div>

<script src="game.js"></script>
</body>
</html>
