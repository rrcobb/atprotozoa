name = "atprotozoa-homemixer"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Brand-new site, served at the root of its own hostname — no bisks.net/<name>
# path route, no prefix-stripping.
#
# This Worker is also a real Bluesky feed generator: it answers
# app.bsky.feed.getFeedSkeleton and serves its own /.well-known/did.json
# (did:web:homemixer.bisks.net), so run_worker_first must stay on — those
# routes have to run ahead of the static-asset fallthrough.
routes = [
  { pattern = "homemixer.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
