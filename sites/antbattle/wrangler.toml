name = "atprotozoa-antbattle"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Reads Bluesky's public
# AppView (resolveHandle / getFollows / getFollowers / getProfiles, all
# anonymous, CORS *) to build a handle's SimCluster (self + moots) via
# lib/cluster.js (copied unchanged from sites/simcluster-gacha), splits it
# into two ant colonies — forest and desert — and runs a deterministic
# seeded autobattle between them (lib/battle.js).

routes = [
  { pattern = "antbattle.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
