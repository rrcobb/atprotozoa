# Pure static site — everything runs in the browser. It reads Bluesky's public
# AppView (resolveHandle / getFollows / getFollowers / getProfile, all
# anonymous, CORS *) to work out a handle's "moots" (mutuals), then turns them
# into a little follow-the-leader duck game: waddle mama duck around the pond
# with your mutuals in tow, and honk to call back any duckling that's peeled
# off toward the treeline before it's lost in the forest for good.
# moots.js is copied from simcluster/moot-bingo (copy, don't abstract).
name = "atprotozoa-duckpond"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [{ pattern = "duckpond.bisks.net/*", zone_name = "bisks.net" }]

# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
