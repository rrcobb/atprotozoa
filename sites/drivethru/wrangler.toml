name = "atprotozoa-drivethru"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Path route on the shared zone, not a dedicated custom domain — the bisks.net
# zone hit a Cloudflare custom-domain cap, so new sites mount as a path
# instead of requesting a new hostname (see notes/20-deploy.md,
# notes/40-new-site-playbook.md).
routes = [
  { pattern = "drivethru.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/drivethru", zone_name = "bisks.net" },
  { pattern = "bisks.net/drivethru/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
