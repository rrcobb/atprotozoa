name = "atprotozoa-erdosproof"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. @dollspace.gay asked
# @buildthis to "solve an open erdos problem, do a breakthrough." An actual
# proof machine isn't on offer, so instead: pick a real, currently-open
# Erdős problem (short list below, sourced from erdosproblems.com) and hit
# "attempt breakthrough" for an absurd mad-libs proof, a rotating peer-review
# reaction, and an occasional retraction. The math is real; the proofs are not.
main = "src/index.ts"

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# erdosproof.bisks.net is being retired to free a slot against the zone's
# custom-domain cap (see notes/20-deploy.md). Migrated to bisks.net/erdosproof
# instead. See notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "erdosproof.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/erdosproof", zone_name = "bisks.net" },
  { pattern = "bisks.net/erdosproof/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
