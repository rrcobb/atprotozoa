# Pure static site — everything runs in the browser. Built from the literal
# first post seen on the open firehose (2026-08-12): a reply, "Who wore
# them?", asked under a photo of 2,000-year-old Roman leather briefs dug out
# of a backfilled well in London — likely worn by a young acrobatic dancer
# whose name nobody will ever know. This site takes that question and makes
# it a generator: describe a found object, get a speculative sketch of
# whoever wore/used/owned it. Requested by cee.wtf, replying into
# @words.bsky.social's antecedent-less "build this" thread with a way to
# find an antecedent: open the firehose, build from whatever's first.
name = "atprotozoa-whoworethem"
compatibility_date = "2025-01-01"

assets = { directory = "./public" }

routes = [{ pattern = "whoworethem.bisks.net/*", zone_name = "bisks.net" }]
