name = "atprotozoa-paintmoot"
compatibility_date = "2025-01-01"

# Pure static + client-side OAuth (public client) — no server surface needed.
# All state lives in custom lexicon records (net.bisks.paintmoot.*) written
# straight to each user's own PDS from the browser.
assets = { directory = "./public" }

routes = [{ pattern = "paintmoot.bisks.net/*", zone_name = "bisks.net" }]
