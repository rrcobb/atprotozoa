<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>armory — 1000 discourse grenades</title>
<meta name="description" content="A stockpile of 1000 discourse grenades. Pull a pin, post one, watch the quote-posts arrive." />
<meta property="og:title" content="armory — 1000 discourse grenades" />
<meta property="og:description" content="One prototype, 999 originals. Each with a yield, a fuse and a blast radius." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://armory.bisks.net/" />
<meta property="og:image" content="https://armory.bisks.net/og.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="armory: 1000 discourse grenades" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://armory.bisks.net/og.png" />
<style>
  :root { --bg:#120d0b; --fg:#f6ece6; --dim:#b89a90; --card:#1c1412; --line:#3a2420; --hot:#ff6a3d; --gold:#ffd166; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 2rem; margin: 0 0 4px; }
  .sub { color: var(--dim); margin: 0 0 20px; }
  .pin { background: var(--card); border: 1px solid var(--hot); border-radius: 12px; padding: 18px; margin-bottom: 20px; }
  .pin .text { font-size: 1.3rem; font-weight: 600; min-height: 3.2em; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  button, .btn { background: var(--hot); color: #1a0a05; border: 0; border-radius: 8px; padding: 8px 14px; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; }
  button.ghost, .btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); font-weight: 500; }
  button.on { background: var(--gold); color: #1a0a05; border-color: var(--gold); }
  input[type=search], select { background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; }
  input[type=search] { flex: 1; min-width: 160px; }
  .meta { color: var(--dim); font-size: .85rem; }
  .meta b { color: var(--gold); font-weight: 600; }
  ol { list-style: none; padding: 0; margin: 16px 0; }
  li { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
  li .n { color: var(--hot); font-weight: 700; font-variant-numeric: tabular-nums; margin-right: 6px; }
  li .actions { margin-top: 6px; display: flex; gap: 6px; }
  li .actions button, li .actions a { padding: 3px 10px; font-size: .85rem; }
  [hidden] { display: none !important; }
  footer { color: var(--dim); font-size: .85rem; margin-top: 28px; }
  footer a { color: var(--dim); }
</style>
</head>
<body>
<main>
  <h1>💣 armory</h1>
  <p class="sub">1000 discourse grenades. #0 is the prototype; #1–#999 are original. Yield, fuse and blast radius are fictional and permanent.</p>

  <section class="pin" aria-live="polite">
    <div class="meta" id="pin-label">pull the pin</div>
    <div class="text" id="pin-text">Press the button. Don't read it twice.</div>
    <div class="meta" id="pin-stats"></div>
    <div class="row">
      <button id="pull">Pull a pin</button>
      <a class="btn ghost" id="pin-post" href="#" target="_blank" rel="noopener" hidden>Post it</a>
      <button class="ghost" id="pin-copy" hidden>Copy</button>
    </div>
  </section>

  <div class="row">
    <input type="search" id="q" placeholder="search the armory…" aria-label="search the armory" />
    <select id="cat" aria-label="category"><option value="">all categories</option></select>
    <select id="sort" aria-label="sort">
      <option value="n">by number</option>
      <option value="yield">biggest yield</option>
      <option value="fuse">shortest fuse</option>
      <option value="radius">widest blast radius</option>
    </select>
  </div>
  <p class="meta" id="count"></p>
  <ol id="list"></ol>
  <button class="ghost" id="more" hidden>Show more</button>

  <footer>
    <a href="https://rateyourbuild.bisks.net/site/armory">rate this on rateyourbuild →</a>
    · <a href="https://bisks.net/">bisks.net</a>
  </footer>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
