name = "atprotozoa-sandpile"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# A daily-slot pass, nobody asked for it in particular. The abelian sandpile
# model: a grid of cells each holding 0-3 chips; drop enough in one place and
# every cell at 4+ chips "topples," giving one chip to each of its four
# neighbors, which can cascade. Repeated from a single big pile this produces
# the same self-similar fractal every time (deterministic, order-independent
# toppling is the "abelian" part) — this runs it as a live animated cascade
# instead of solving straight to the fixed point.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [
  { pattern = "sandpile.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
