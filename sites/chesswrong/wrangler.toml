# ChessWrong: every LessWrong post from the last ten years, with the title
# rewritten to be about chess. The Worker is a stateless GET proxy for
# LessWrong's GraphQL API (which sends no CORS headers); the rewriting runs in
# the browser. No KV, no Durable Objects, no AI.
name = "atprotozoa-chesswrong"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [
  { pattern = "chesswrong.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
