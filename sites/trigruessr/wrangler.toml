name = "atprotozoa-trigruessr"
compatibility_date = "2025-01-01"

# Pure static site — the whole game runs in the browser (it reads Bluesky's
# public AppView + PDS anonymously, no auth, no server). index.html is at the
# root, so there's no Worker fetch handler to redirect anything.
assets = { directory = "./public" }

routes = [{ pattern = "trigruessr.bisks.net", custom_domain = true }]
