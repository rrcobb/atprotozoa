name = "atprotozoa-idea-mill"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. It's a companion to the
# @buildthis.bisks.net build bot: a mill that never stops grinding out new
# atproto-flavoured website ideas. A live feed drops a fresh idea every few
# seconds (the "bot posting periodically" feel), and each idea has a one-tap
# "tag @buildthis to build it" button that opens Bluesky's compose intent
# (https://bsky.app/intent/compose?text=...) pre-filled with the tag + idea.
#
# Why not an actually-autonomous poster: that needs its own Bluesky account +
# app-password (a secret) and would hammer @buildthis into an infinite
# build/spend loop. So this is the human-in-the-loop version — the mill picks
# the idea, you decide to send it.
assets = { directory = "./public" }

routes = [{ pattern = "idea-mill.bisks.net/*", zone_name = "bisks.net" }]
