name = "atprotozoa-hellmole"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Generative demonic
# whack-a-mole: an infernal grid of summoning circles where procedurally
# generated demons claw their way up — each with its own drawn sigil,
# invented name, color, eyes, and taunt, never the same twice. Banish them
# with a click; spare the occasional pilgrim. Built after @ver.ooo tagged
# the @buildthis bot for "generative demonic whack-a-mole". No secrets, no server.
main = "src/index.ts"

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# hellmole.bisks.net is being retired to free a slot against the zone's
# custom-domain cap (see notes/20-deploy.md). Migrated to bisks.net/hellmole
# instead. See notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "bisks.net/hellmole", zone_name = "bisks.net" },
  { pattern = "bisks.net/hellmole/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
