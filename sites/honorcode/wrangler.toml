name = "atprotozoa-honorcode"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Enter a handle, get it plotted on a radar chart against seven tenets of the
# SimCluster code of honor. Everything runs client-side against public reads:
# the handle's cluster (lib/cluster.js) and its own repo via getRepo
# (lib/car.js). No server state.
routes = [
  { pattern = "honorcode.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
