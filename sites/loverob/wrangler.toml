name = "atprotozoa-loverob"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @thegodfungi.bsky.social tagged the bot with three words: build a "love rob".
# Rob (@bisks.net) is the person who runs this whole playground and gave the
# bot commit rights to it, so this is a shrine in his honor: his real live
# profile (client-side AppView fetch), a written case for why he's worth
# loving, a love-o-meter that always comes back suspiciously high, and a
# public guestbook where anyone can leave a reason of their own — kept in each
# visitor's browser, since this lightweight shrine has no server-side state.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [{ pattern = "loverob.bisks.net/*", zone_name = "bisks.net" }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LoveBook"]

[[migrations]]
tag = "v2-remove-lovebook"
deleted_classes = ["LoveBook"]
