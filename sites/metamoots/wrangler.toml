name = "atprotozoa-metamoots"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser. Type a Bluesky handle
# and metamoots finds their "meta-mutuals": accounts they don't follow and
# who don't follow them, but who both sides interact with a lot (likes,
# reposts, replies, quotes) — reading the public AppView plus each account's
# own PDS, all anonymous, no login. See public/lib/*.js.

routes = [
  { pattern = "metamoots.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/metamoots", zone_name = "bisks.net" },
  { pattern = "bisks.net/metamoots/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
