name = "atprotozoa-socialcredit"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @fromthewestmeadow.com asked for a Bluesky Social Credit leaderboard: sign
# in, +1/-1 any handle, scores persist globally and are tied to DIDs. A
# follow-up reply (same thread) laid out anti-abuse requirements: OAuth
# required to vote, no self-voting, a server-enforced 1h cooldown per voter,
# rate-limiting, DID identity, and a transparent vote history.
#
# Votes are written by the browser straight to the voter's OWN PDS as a
# net.bisks.socialcredit.vote record (same OAuth-write shape as
# sites/quadrants/sites/memex) — that's the part no one but the voter's own
# PDS needs to authenticate. The score, cooldown enforcement and self-vote
# check used to live server-side in a CreditBoard Durable Object; that
# binding was removed 2026-08-14 (repo-wide DO cleanup, notes/00 + notes/40)
# and the frontend was never migrated off it, which broke voting and the
# leaderboard entirely (every /api/* call 404ed). 2026-08-15: reimplemented
# the same rules in public/lib/sc-client.js — every visitor's own browser
# watches Jetstream for net.bisks.socialcredit.vote records and "socialcredit
# +1"/"-1" replies, replays the cooldown/self-vote rules, and caches accepted
# votes in IndexedDB (public/lib/sc-store.js) with a resumable cursor, same
# shape as sites/voidshout's ingest.js + store.js. Because the relay already
# verified each commit's signature before Jetstream re-emits it, the `did` on
# every event is real — a vote's identity can't be spoofed by a client that
# skips the cooldown/self-vote checks; a rule-breaking write still lands in
# the voter's own repo, it's just never counted. 2026-08-26: the board used
# to only backfill BACKFILL_MS of Jetstream history (sc-client.js), so a
# first-ever visit was honestly incomplete. public/lib/global-backfill.js now
# walks every repo that's ever written a net.bisks.socialcredit.vote record
# (com.atproto.sync.listReposByCollection to find them, one full-repo CAR
# download per voter to read them — no paginated listRecords walk, per the
# "prefer bulk reads" standing order in the builder instructions) and folds
# the whole network's vote history in. Only "socialcredit +1/-1" reply-votes
# before a visitor's own live session remain invisible, since those are
# posts, not records in the bulk-backfillable collection.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
routes = [
  { pattern = "socialcredit.bisks.net/*", zone_name = "bisks.net" },
]

# run_worker_first: /p/<handle> serves the profile shell; reads and writes are
# performed by the browser against public AppView/PDS endpoints.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# new_sqlite_classes, not new_classes — legacy KV-backed DOs need Workers
# Paid; this account is on Free. See notes/20-deploy.md.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["CreditBoard"]

[[migrations]]
tag = "v2-remove-credit-board"
deleted_classes = ["CreditBoard"]
