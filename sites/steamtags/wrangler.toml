name = "atprotozoa-steamtags"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Moved from a bisks.net/steamtags path route to its own custom domain
# (2026-07-31, requested by @7778777.online: "it's got login + data, go ahead
# and move it to a subdomain"). Only ~35 of ~187 sites are still on
# custom_domain routes — well under the ~100-site mark that caused the zone's
# custom-domain cap trouble (see notes/20-deploy.md), so there's headroom for
# one more. routes MUST stay above [assets] — in TOML, keys after a table
# header join that table, so a routes line below [assets] silently becomes
# assets.routes.
routes = [
  { pattern = "steamtags.bisks.net/*", zone_name = "bisks.net" },
]

# Stopgap fallback (2026-07-31): steamtags.bisks.net has no DNS record at all
# post-deploy (confirmed via dig/curl from a build-agent sandbox with live
# network access) — same failure shape as the custom-domain-cap incidents in
# notes/20-deploy.md. workers_dev=true gives a reachable fallback URL even if
# the custom-domain route never provisions. Note this won't carry OAuth login
# (client-metadata.json/redirect URIs are pinned to steamtags.bisks.net), so
# it only restores read-only access, not login — see notes/20-deploy.md for
# the full writeup and the real fix (needs Cloudflare dashboard access).
workers_dev = true

# run_worker_first: /api/* and /g/* are live server routes (Steam Store API +
# SteamSpy proxy, and per-game share pages with personalized OG tags), so the
# Worker must see every request before the static-asset router does.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# GlobalTracker backs /api/global — a live Jetstream-fed index of every
# net.bisks.steamtags.rating record across the network, aggregated into a
# tag leaderboard (same shape as sites/quadrants' QuadrantHub), plus a
# resumable backfill via com.atproto.sync.listReposByCollection + each
# repo's own com.atproto.repo.listRecords so the board isn't limited to
# activity since the DO started running.
[[durable_objects.bindings]]
name = "GLOBAL"
class_name = "GlobalTracker"

# new_sqlite_classes, not new_classes — legacy KV-backed DOs need Workers
# Paid; this account is on Free. See notes/20-deploy.md.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GlobalTracker"]
