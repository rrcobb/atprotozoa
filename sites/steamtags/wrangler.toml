name = "atprotozoa-steamtags"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Path-mounted at bisks.net/steamtags — the zone's custom-domain cap means new
# sites mount as a path route on the already-provisioned bisks.net zone
# instead of a dedicated custom domain. See notes/40-new-site-playbook.md
# ("Why paths, not subdomains"). routes MUST stay above [assets] — in TOML,
# keys after a table header join that table, so a routes line below [assets]
# silently becomes assets.routes.
routes = [
  { pattern = "bisks.net/steamtags", zone_name = "bisks.net" },
  { pattern = "bisks.net/steamtags/*", zone_name = "bisks.net" },
]

# run_worker_first: every request needs the "/steamtags" mount prefix
# stripped before it reaches ASSETS, and /steamtags/api/* + /steamtags/g/*
# are live server routes (Steam Store API + SteamSpy proxy, and per-game
# share pages with personalized OG tags).
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
