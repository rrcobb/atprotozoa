<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>bleekcube — what's inside the cube of everyone's bleesks?</title>
<meta name="description" content="A cube made of everyone's posts, live from the Bluesky firehose. Tap through the layers. Reach the center." />

<meta property="og:title" content="bleekcube — what's inside the cube?" />
<meta property="og:description" content="a cube composed of everyone's bleesks. every cubelet is a real post, live from the firehose. dig to the center." />

<style>
  :root { --bg:#f4f4f1; --ink:#222; --dim:#888; --line:#d8d8d2; --acc:#1185fe; --gold:#e5a50a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 system-ui, sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; }
  header { text-align:center; padding:18px 12px 4px; }
  h1 { margin:0; font-size:22px; letter-spacing:.02em; }
  .sub { color:var(--dim); font-size:13px; margin-top:2px; }
  .hud { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; font-size:13px; padding:8px; }
  .hud b { font-variant-numeric:tabular-nums; }
  .layername { font-size:13px; color:var(--dim); height:18px; text-align:center; }
  .stage { perspective:900px; padding:18px 0 26px; }
  #cube { display:grid; gap:3px; transform:rotateX(14deg) rotateY(-16deg); transition:transform .4s; transform-style:preserve-3d; }
  #cube:hover { transform:rotateX(6deg) rotateY(-6deg); }
  .cl { width:var(--s); height:var(--s); border:0; padding:0; border-radius:3px; cursor:pointer; background:#fff; box-shadow:0 1px 0 var(--line), inset 0 0 0 1px var(--line); transition:transform .08s, background .15s; }
  .cl:hover { background:#eaf3ff; transform:translateZ(8px); }
  .cl.gone { visibility:hidden; pointer-events:none; }
  .cl.pop { background:var(--acc); }
  #feed { width:min(640px, 94vw); display:flex; flex-direction:column; gap:6px; min-height:150px; }
  .post { background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:14px; overflow-wrap:anywhere; }
  .post a { color:var(--dim); font-size:12px; text-decoration:none; }
  .post.fresh { border-color:var(--acc); }
  .shop { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:6px 0; }
  button.b { font:inherit; border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px 10px; cursor:pointer; }
  button.b:disabled { opacity:.45; cursor:default; }
  button.b.on { border-color:var(--acc); }
  #center { display:none; text-align:center; max-width:560px; padding:16px; }
  #center.show { display:block; }
  #center[hidden] { display:none; }
  .prize { font-size:20px; margin:6px 0; }
  .conn { font-size:12px; color:var(--dim); }
  footer { margin:30px 0 24px; font-size:12px; color:var(--dim); text-align:center; }
  footer a { color:var(--dim); }
</style>
</head>
<body>
<header>
  <h1>bleekcube</h1>
  <div class="sub">a cube composed of everyone's bleesks. every cubelet is a real post. what's inside?</div>
</header>
<div class="hud">
  <span>cubelets <b id="n-dug">0</b>/<b id="n-total">0</b></span>
  <span>coins <b id="n-coins">0</b></span>
  <span>layer <b id="n-layer">1</b></span>
  <span class="conn" id="conn">connecting to the firehose…</span>
</div>
<div class="shop" id="shop"></div>
<div class="layername" id="layername"></div>
<div class="stage"><div id="cube"></div></div>
<section id="center" hidden>
  <div class="prize">🎉 you reached the center</div>
  <p id="center-text"></p>
  <p><a id="share" class="b" style="text-decoration:none;display:inline-block;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:inherit" target="_blank" rel="noopener">post about it</a>
  <button class="b" id="again">rebuild the cube</button></p>
</section>
<div id="feed"></div>
<footer>
  posts stream live from Jetstream · progress saves in this browser ·
  <a href="https://rateyourbuild.bisks.net/site/bleekcube">rate this on rateyourbuild →</a>
</footer>
<script type="module" src="app.js"></script>
</body>
</html>
