name = "atprotozoa-clustercrawl"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Type a Bluesky handle and
# it reads the public AppView (getFollows / getFollowers / getProfile / a
# getAuthorFeed page, all anonymous, CORS *) to build a five-floor ANSI dungeon
# out of that handle's own atproto cluster: mutuals become the monsters guarding
# each room, and the handle's own posts become collectible item-cards (rarity
# scaled off like/repost/reply counts). Bump monsters to fight them in a small
# turn-based card-combat, and a Deck screen lets you combine two collected cards
# into one stronger crafted card — the way through the floor-5 boss. moots-graph
# logic copied from simcluster/lib/moots.js (copy, don't abstract).
assets = { directory = "./public" }

routes = [{ pattern = "clustercrawl.bisks.net", custom_domain = true }]
