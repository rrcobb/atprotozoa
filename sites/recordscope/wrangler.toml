name = "atprotozoa-recordscope"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Everything still runs client-side (see public/index.html) EXCEPT the OG/share
# unfurl, which has a small server surface: the Worker renders
# /at/<did>/<collection>/<rkey> (src/index.ts) with per-record og:title/
# og:description/og:url baked server-side, then falls through to ASSETS for
# everything else. Paste an AT-URI (or a whtwnd.com link, or did/collection/
# rkey), it resolves the repo's PDS off its DID doc and reads the record
# straight from there — public, unauthenticated XRPC, no login. Built for
# @antiali.as, who asked "any way to do this without pasting my document in
# to a huge thread?" after linking a whtwnd blog entry: point people at the
# record's own URL instead of pasting the whole thing.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes
# (same gotcha called out in buildthis/logs/wrangler.toml).
routes = [{ pattern = "recordscope.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /at/<did>/<collection>/<rkey> is dynamic (personalized OG
# tags per record), so the Worker must run BEFORE the static-asset router,
# same as sites/didscope and sites/logs.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
