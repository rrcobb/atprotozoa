name = "atprotozoa-multiclass"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Everything runs client-side (see public/index.html): either scan a handle —
# downloads the account's entire repo as one CAR (com.atproto.sync.getRepo,
# via public/lib/car.js, every app.bsky.feed.post record, no page cap; falls
# back to paginated app.bsky.feed.getAuthorFeed only if that fails) and runs
# every post through a three-way keyword heuristic (public/lib/classify.js) —
# or skip the scan entirely and answer a six-question manual quiz. Either way
# it tallies into a Wizard/Warlock/Cleric multiclass build. No real model in
# the loop — it's a lexicon, not a judge.
#
# The one server job: /s/<handle> is a real per-handle URL so a shared scan
# result gets its own og:title/description instead of one generic card for
# every account — same shape as sites/llmstance's renderShare.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [{ pattern = "multiclass.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /s/<handle> is dynamic (personalized OG tags per share), so
# the Worker must run BEFORE the static-asset router.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
