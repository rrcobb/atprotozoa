name = "atprotozoa-westmeadow"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# MUST stay ABOVE any [table] headers (same TOML gotcha as buildthis/apex): a
# `routes` line under a table silently becomes <table>.routes and never binds.
routes = [{ pattern = "westmeadow.bisks.net/*", zone_name = "bisks.net" }]

# westmeadow.bisks.net: a bare list of just the sites @fromthewestmeadow.com has
# asked buildthis to build, recomputed live on every load — the same idea as
# buildthis's own /live, filtered to one requester. Pure READER, same pattern as
# sites/logs: fetches buildthis.bisks.net/logs.json and renders. No KV of its
# own — the event log lives on the buildthis worker.
#
# run_worker_first: "/" is rendered dynamically, so the Worker must run BEFORE
# the static-asset router, or env.ASSETS would serve public/index.html directly.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true
