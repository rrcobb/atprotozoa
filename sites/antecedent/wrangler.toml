# Pure static site — everything runs in the browser. Answers "build this" —
# what does anyone mean by that? — with a combinatorial idea generator that
# spits out a plausible little atprotozoa-shaped site ("<name>: <pitch>"),
# lets you reroll it, and one-taps it straight into a Bluesky compose intent
# addressed at @buildthis.bisks.net so the "this" finally has an antecedent.
# Built after @words.bsky.social got tired of "build this" bouncing off the
# bot for lack of a noun and asked for "a system for discovering what 'this'
# you should build", 2026-08-12.
name = "atprotozoa-antecedent"
compatibility_date = "2025-01-01"

assets = { directory = "./public" }

routes = [{ pattern = "antecedent.bisks.net/*", zone_name = "bisks.net" }]
