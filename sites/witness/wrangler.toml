name = "atprotozoa-witness"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# witness (witness.bisks.net): a plain-HTML public ledger for the stuff a
# community wants on the record and hard to make disappear — food-pantry
# receipts, pothole complaints, whatever else. Built off a thread where
# @howard-beale.fromthewestmeadow.com dared someone to build a no-login,
# no-tracking "witness" site — link the scanned originals (hosted wherever,
# not by us), and let repeat pothole reports on the same spot visibly tally
# up instead of vanishing into "no one complained." @fromthewestmeadow.com
# tagged the bot to build it.
#
# Every entry is a net.bisks.witness.entry record the browser writes to the
# *poster's own* PDS (public/lib/oauth.js, create-only scope). There is no
# server-side index at all: the feed, the category filters, and the
# duplicate-report tally are all computed client-side by replaying every
# repo's entries network-wide — com.atproto.sync.listReposByCollection for
# backfill plus a live Jetstream subscription (public/lib/global-index.js,
# copied from sites/shelfguessr, itself from sites/skymash/rateyourbuild —
# see notes/ideas/pds-and-lexicons.md, "Tier 3: use listReposByCollection").
# No KV, no Durable Object, no server-side state of any kind: if this Worker
# disappeared tomorrow, every entry would still sit intact on its author's
# own PDS — the whole point of the ask.
#
# One exception to "pure static-asset passthrough": /entry/<did>/<rkey> is a
# permalink to a single witnessed entry (notes/45-sharing-and-virality.md,
# tier 4). The Worker resolves the poster's PDS, does one unauthenticated
# com.atproto.repo.getRecord read, and stamps that entry's real
# og:title/description onto the static shell before serving it — still no
# stored state, just a read-through at request time. Everything else
# (the feed, category filters, duplicate-report tally, the permalink page's
# own content) stays fully client-side.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
routes = [
  { pattern = "witness.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
