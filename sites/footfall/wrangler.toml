name = "atprotozoa-footfall"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @angussoftware.dev: "site which lists sites u have made & ranks them by
# number of visit or timelength of usage. Multiple Leaderboards 4 prompters
# 4 how many hits or time on their prompted site, site hits or time per
# prompt, & other tracked stats". So: a real (not fabricated) visit/dwell-
# time tracker. A tiny beacon script (public/beacon.js) that other sites
# embed reports a "hit" on load and a "dwell" duration on pagehide to the
# FootBoard Durable Object here, which keeps cumulative per-site totals.
# The leaderboard page joins those live totals against
# public/data/manifests.json (a static snapshot of every sites/*/site.json,
# regenerated by sync-manifests.mjs — same pattern as sites/receipts'
# sync-asks.mjs) to roll counts up per-prompter as well as per-site.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [
  { pattern = "footfall.bisks.net/*", zone_name = "bisks.net" },
]

# The Worker only serves static assets.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Historical migration retained for cleanup of the former class.
# v1 is the ledger entry Cloudflare already applied when this site had a DO.
# It must keep saying what it originally said: a tag is applied once, and
# rewriting v1 in place to say deleted_classes silently did nothing (Cloudflare
# skips tags it has already seen) while the deploy failed for dropping a class
# live DOs still depended on. The deletion has to be a NEW tag.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["FootBoard"]

[[migrations]]
tag = "v2"
deleted_classes = ["FootBoard"]

[observability]
enabled = true
