<style>
  :root { --bg:#070b16; --ink:#dfe8ff; --dim:#8390b0; --water:#4fb6ff; --accent:#ffd166; }
  * { box-sizing: border-box; }
  body { margin:0; background:radial-gradient(ellipse at top,#121a33,var(--bg)); color:var(--ink);
    font:16px/1.5 system-ui,sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px 14px 30px; }
  h1 { margin:0; font-size:1.7rem; letter-spacing:.02em; }
  .sub { color:var(--dim); margin:.2rem 0 1rem; text-align:center; max-width:34rem; }
  canvas { width:min(92vw,440px); height:auto; aspect-ratio:1; touch-action:none; }
  .row { display:flex; gap:12px; align-items:center; margin:12px 0 0; flex-wrap:wrap; justify-content:center; }
  label { color:var(--dim); font-size:.9rem; }
  input[type=range] { width:200px; accent-color:var(--water); }
  button, a.btn { background:#1a2444; color:var(--ink); border:1px solid #33427a; border-radius:10px; padding:.7rem 1.2rem;
    font:inherit; cursor:pointer; text-decoration:none; user-select:none; touch-action:none; }
  button#pull { background:#20407a; border-color:var(--water); font-weight:700; min-width:9rem; }
  button#pull.on { background:var(--water); color:#04101f; }
  #status { min-height:3rem; text-align:center; margin-top:10px; max-width:32rem; }
  #status b { color:var(--accent); }
  .msg[hidden] { display:none; }
  footer { margin-top:auto; padding-top:24px; color:var(--dim); font-size:.85rem; text-align:center; }
  footer a { color:var(--dim); }
</style>
</head>
<body>
<h1>zerogbong</h1>
<p class="sub">The water forms a perfect sphere. There is no gravity to hold it down. Spin the chamber, hold the pull, and don't let the sphere reach the stem.</p>
<canvas id="cv" width="880" height="880" aria-label="rotating chamber with a water sphere"></canvas>
<div class="row">
  <label for="spin">spin <span id="spinv">0</span>%</label>
  <input id="spin" type="range" min="0" max="100" value="0" />
</div>
<div class="row">
  <button id="pull" type="button">hold to pull</button>
  <button id="reset" type="button">reset</button>
</div>
<div id="status" aria-live="polite"><span id="statusText">Pull with no spin and watch what happens. (Space also pulls.)</span></div>
<div class="row" id="shareRow" hidden><a class="btn" id="share" target="_blank" rel="noopener">post result to Bluesky</a></div>
<footer>
  <a href="https://rateyourbuild.bisks.net/site/zerogbong">rate this on rateyourbuild →</a>
</footer>
<script src="sim.js"></script>
</body>
