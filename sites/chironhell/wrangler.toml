name = "atprotozoa-chironhell"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# chironhell: the live Bluesky firehose rendered as nothing but text chirons
# (news-ticker crawls) — dozens layered at once, every size, every direction,
# scrolling forever. @words.bsky.social asked for "maximalist poetico-chaotic
# chirons going in every direction" and this is the closest good version.
#
# Path route on the shared zone, not a dedicated custom domain — the zone hit
# a Cloudflare custom-domain cap (see notes/20-deploy.md and
# notes/40-new-site-playbook.md). Two entries: the bare path (no trailing
# slash) and everything under it.
routes = [
  { pattern = "bisks.net/chironhell", zone_name = "bisks.net" },
  { pattern = "bisks.net/chironhell/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
