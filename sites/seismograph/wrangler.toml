name = "atprotozoa-seismograph"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. It reads Bluesky's public
# AppView (resolveHandle / getFollows / getFollowers / getProfile, all anonymous,
# CORS *) to work out who a handle FOLLOWS but who does NOT follow back — the
# one-way follows — then draws a seismograph: paper drum, ink needle, one twitch
# per unrequited follow (bigger account = bigger spike). graph.js is copied and
# re-diffed from simcluster/neighborhood (copy, don't abstract).
assets = { directory = "./public" }

routes = [{ pattern = "seismograph.bisks.net", custom_domain = true }]
