name = "atprotozoa-satorsquare"
compatibility_date = "2025-01-01"

# Pure static site — a sator-square generator/puzzle limited to real 3-letter
# words (plus a handful of well-known 3-letter initialisms like AOC/AGI/CIA/
# LSD), built after @words.bsky.social spelled AOC/AGI/CIA out of a grid of
# letters in a reply thread and asked for a proper generator. Squares are
# solved at build time (scripts/generate.mjs) into public/data/squares.json;
# everything else runs in the browser. No secrets, no server.
assets = { directory = "./public" }

routes = [{ pattern = "satorsquare.bisks.net/*", zone_name = "bisks.net" }]
