<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>timeline — bisks.net</title>
    <meta name="description" content="A chronological history of autonomous web dev in this repo." />
    <meta http-equiv="refresh" content="0; url=/timeline" />
    <style>
      body {
        margin: 0;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        color: #111;
        background: #fff;
      }
      .wrap { max-width: 680px; margin: 0 auto; padding: 3.5rem 1.25rem; }
      a { color: #1a5fd0; }
    </style>
  </head>
  <body>
    <!-- The worker renders the live timeline at "/timeline"; this static file
         is only served for unknown sub-paths, so it just points back home. -->
    <div class="wrap">
      <p>the timeline of autonomous web dev lives at <a href="/timeline">bisks.net/timeline</a>.</p>
    </div>
  
    <!-- chicken mode (added across projects by @buildthis.bisks.net) -->
    <style>
      #cm-toggle {
        position: fixed;
        right: 0.85rem;
        bottom: 0.85rem;
        z-index: 2147483000;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 0.7rem;
        line-height: 1;
        background: rgba(20, 20, 20, 0.72);
        color: #ddd;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 999px;
        padding: 0.45rem 0.6rem;
        cursor: pointer;
        -webkit-backdrop-filter: blur(4px);
        backdrop-filter: blur(4px);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      }
      #cm-toggle.on { background: #f4b400; color: #1a1206; border-color: #f4b400; }
      #cm-coop {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 2.2rem;
        overflow: hidden;
        pointer-events: none;
        z-index: 2147483000;
        display: none;
      }
      #cm-coop.on { display: block; }
      .cm-chicken {
        position: absolute;
        bottom: 0.1rem;
        font-size: 1.5rem;
        transform: scaleX(-1);
        animation-name: cm-strut;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.5));
      }
      @keyframes cm-strut {
        0% { transform: translateX(-3rem) scaleX(-1); }
        48% { transform: translateX(calc(100vw + 3rem)) scaleX(-1) translateY(-0.3rem); }
        50% { transform: translateX(calc(100vw + 3rem)) scaleX(1); }
        98% { transform: translateX(-3rem) scaleX(1) translateY(-0.3rem); }
        100% { transform: translateX(-3rem) scaleX(-1); }
      }
    </style>
    <button id="cm-toggle" type="button" title="it's not really corgi mode">🐔</button>
    <div id="cm-coop"></div>
    <script>
      (function () {
        var coop = document.getElementById("cm-coop");
        var toggle = document.getElementById("cm-toggle");
        if (!coop || !toggle) return;
        var KEY = "chicken-mode";
        var spawner = null;

        function spawn() {
          var c = document.createElement("div");
          c.className = "cm-chicken";
          c.textContent = Math.random() < 0.15 ? "🐓" : "🐔";
          var duration = 14 + Math.random() * 10;
          c.style.animationDuration = duration + "s";
          c.style.animationDelay = -Math.random() * duration + "s";
          c.style.fontSize = (1.1 + Math.random() * 0.9) + "rem";
          coop.appendChild(c);
        }
        function start() {
          if (spawner) return;
          coop.innerHTML = "";
          for (var i = 0; i < 5; i++) spawn();
          spawner = setInterval(function () {
            if (coop.children.length < 8) spawn();
          }, 4000);
        }
        function stop() {
          if (spawner) clearInterval(spawner);
          spawner = null;
          coop.innerHTML = "";
        }
        function setMode(on) {
          coop.classList.toggle("on", on);
          toggle.classList.toggle("on", on);
          if (on) start(); else stop();
          try { localStorage.setItem(KEY, on ? "1" : "0"); } catch (e) {}
        }
        toggle.addEventListener("click", function () {
          setMode(!coop.classList.contains("on"));
        });
        var startedOn = false;
        try { startedOn = localStorage.getItem(KEY) === "1"; } catch (e) {}
        if (startedOn) setMode(true);
      })();
    </script>
    <!-- /chicken mode -->
</body>
</html>
