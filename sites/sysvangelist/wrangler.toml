name = "atprotozoa-sysvangelist"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @7778777.online asked for a site agitating omarchy users to petition Arch
# Linux to drop systemd and Wayland for sysvinit and Xlibre, "because that's
# the only pureblooded software." Built as a satirical revivalist-preacher
# petition page — the joke leans into the fact that Omarchy is a Hyprland
# distro, and Hyprland is Wayland-only, so the ask is gleefully self-defeating.
#
# KV holds a best-effort shared petition-signature count + a wall of recent
# signers, same shape as sites/dontpressit's shared round counter. Not a
# Durable Object (banned in this repo, notes/11-durable-objects.md) — a lost
# signature under concurrent writes is an acceptable trade for not running a
# coordinator.
routes = [
  { pattern = "sysvangelist.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[kv_namespaces]]
binding = "PETITION_STATE"
