name = "atprotozoa-skyclone"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# skyclone (bisks.net/skyclone): an unofficial, read-only clone of the bsky.app
# web client — live data straight from the public AppView
# (public.api.bsky.app), no auth, no local state. Home feed, profile pages,
# post threads, feed discovery, search: all real, all live.
#
# Path route on the shared zone, not a dedicated custom domain — the zone hit
# a Cloudflare custom-domain cap a while back, so new sites mount as a path
# on bisks.net instead of requesting a new hostname. See
# notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "bisks.net/skyclone", zone_name = "bisks.net" },
  { pattern = "bisks.net/skyclone/*", zone_name = "bisks.net" },
]

# run_worker_first: the Worker renders per-profile and per-post OG tags
# dynamically (so shared links unfurl with the real person/post, not a
# generic card), and serves the SPA shell for client-side routes. Without it
# the assets router would serve static files directly and neither the OG
# injection nor the SPA fallback would ever run.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true
