name = "atprotozoa-chrysalis"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @fromthewestmeadow.com asked for a site that reveals something cool in
# exactly one week, with the reveal itself unreadable in the code until
# then. The payload (a short note + a generated SVG) is stored in
# src/secret.ts as AES-256-GCM ciphertext; src/index.ts only holds the key
# material server-side and only decrypts once its own clock passes
# TARGET_ISO. See src/index.ts for the full explanation.
routes = [
  { pattern = "chrysalis.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
