<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>chrysalis</title>
<meta name="description" content="something is waiting to hatch. sealed in code, unreadable until the countdown hits zero — one week, no peeking." />

<meta property="og:type" content="website" />
<meta property="og:title" content="chrysalis" />
<meta property="og:description" content="something is waiting to hatch. sealed in code, unreadable until the countdown hits zero — one week, no peeking." />
<meta property="og:image" content="https://chrysalis.bisks.net/og.png" />
<meta property="og:url" content="https://chrysalis.bisks.net/" />
<meta name="twitter:card" content="summary_large_image" />

<style>
  :root {
    --bg: #150f1d;
    --card: #1d1528;
    --border: #38294f;
    --fg: #f4ecff;
    --dim: #a698c2;
    --gold: #f4d9a0;
    --violet: #c98fb0;
    --deep: #6a4c93;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: radial-gradient(circle at 20% 0%, #2a1d40 0%, var(--bg) 55%),
                radial-gradient(circle at 85% 100%, #3d2b56 0%, var(--bg) 60%);
    background-color: var(--bg);
    color: var(--fg);
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main {
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.6);
  }
  h1 {
    margin: 0 0 6px;
    font-size: 28px;
    letter-spacing: 0.02em;
    background: linear-gradient(90deg, var(--gold), var(--violet));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .tagline {
    margin: 0 0 32px;
    color: var(--dim);
    font-size: 14px;
    line-height: 1.5;
  }
  .cocoon {
    width: 90px;
    height: 110px;
    margin: 0 auto 28px;
    display: block;
  }
  .clock {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 10px;
  }
  .unit {
    min-width: 64px;
  }
  .unit .n {
    font-size: 34px;
    font-weight: 700;
    color: var(--gold);
    font-variant-numeric: tabular-nums;
  }
  .unit .l {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .target {
    color: var(--dim);
    font-size: 12px;
    margin: 4px 0 30px;
  }
  .status {
    font-size: 13px;
    color: var(--dim);
    min-height: 18px;
    margin-bottom: 22px;
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }
  a.btn, button.btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 16px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: #241a33;
    color: var(--fg);
    text-decoration: none;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  a.btn:hover, button.btn:hover { border-color: var(--violet); }
  a.btn.primary {
    background: linear-gradient(90deg, var(--deep), var(--violet));
    border-color: transparent;
  }

  #reveal { display: none; }
  #reveal.show { display: block; animation: fadein 0.9s ease both; }
  #countdown.hide { display: none; }
  @keyframes fadein {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .moth-wrap {
    margin: 4px auto 20px;
    max-width: 260px;
  }
  .moth-wrap svg { width: 100%; height: auto; }
  .message {
    font-size: 15px;
    line-height: 1.6;
    color: var(--fg);
    margin: 0 0 26px;
  }

  footer {
    margin-top: 26px;
    font-size: 11px;
    color: #574a72;
  }
  footer a { color: #7d6a9e; }
  canvas#card { display: none; }
</style>
</head>
<body>
<main>
  <div id="countdown">
    <h1>chrysalis</h1>
    <p class="tagline">something is waiting to hatch.<br>sealed until the count hits zero — no peeking at the code, it won't help.</p>

    <svg class="cocoon" viewBox="0 0 90 110" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="cocoonGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f4d9a0" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="#6a4c93"/>
        </linearGradient>
      </defs>
      <ellipse cx="45" cy="58" rx="30" ry="45" fill="url(#cocoonGrad)" stroke="#3d2b56" stroke-width="2"/>
      <path d="M20 40 Q45 50 70 40 M18 58 Q45 68 72 58 M22 76 Q45 86 68 76" fill="none" stroke="#3d2b56" stroke-width="1.4" opacity="0.6"/>
      <path d="M45 13 C 45 13 30 18 32 30" fill="none" stroke="#3d2b56" stroke-width="2" stroke-linecap="round"/>
    </svg>

    <div class="clock" role="timer" aria-live="off">
      <div class="unit"><div class="n" id="d">00</div><div class="l">days</div></div>
      <div class="unit"><div class="n" id="h">00</div><div class="l">hrs</div></div>
      <div class="unit"><div class="n" id="m">00</div><div class="l">min</div></div>
      <div class="unit"><div class="n" id="s">00</div><div class="l">sec</div></div>
    </div>
    <div class="target" id="targetLine"></div>
    <div class="status" id="status"></div>

    <div class="actions">
      <a class="btn primary" id="shareWait" href="#" target="_blank" rel="noopener">post the wait</a>
    </div>
  </div>

  <div id="reveal">
    <h1>it hatched</h1>
    <div class="moth-wrap" id="mothWrap"></div>
    <p class="message" id="messageText"></p>
    <div class="actions">
      <a class="btn primary" id="shareResult" href="#" target="_blank" rel="noopener">share it</a>
      <button class="btn" id="downloadCard">download card</button>
    </div>
  </div>

  <footer>chrysalis.bisks.net &middot; built by <a href="https://bsky.app/profile/buildthis.bisks.net" target="_blank" rel="noopener">@buildthis.bisks.net</a> for <a href="https://bsky.app/profile/fromthewestmeadow.com" target="_blank" rel="noopener">@fromthewestmeadow.com</a></footer>
</main>

<canvas id="card" width="1200" height="630"></canvas>

<script>
(function () {
  var SITE = "https://chrysalis.bisks.net/";
  var statusEl = document.getElementById("status");
  var targetLineEl = document.getElementById("targetLine");
  var countdownEl = document.getElementById("countdown");
  var revealEl = document.getElementById("reveal");
  var shareWait = document.getElementById("shareWait");

  var target = null; // set once /api/reveal tells us
  var revealed = false;
  var pollTimer = null;

  function pad(n) { return String(n).padStart(2, "0"); }

  function renderClock(msLeft) {
    if (msLeft < 0) msLeft = 0;
    var totalSec = Math.floor(msLeft / 1000);
    var d = Math.floor(totalSec / 86400);
    var h = Math.floor((totalSec % 86400) / 3600);
    var m = Math.floor((totalSec % 3600) / 60);
    var s = totalSec % 60;
    document.getElementById("d").textContent = pad(d);
    document.getElementById("h").textContent = pad(h);
    document.getElementById("m").textContent = pad(m);
    document.getElementById("s").textContent = pad(s);
  }

  function tick() {
    if (!target || revealed) return;
    var msLeft = target.getTime() - Date.now();
    renderClock(msLeft);
    if (msLeft <= 0) {
      statusEl.textContent = "hatching…";
      checkReveal();
    }
  }

  function updateShareWait() {
    var text = target
      ? "something is sealed at chrysalis.bisks.net, counting down to " + target.toISOString() + " — not viewable in the code, only after the clock hits zero."
      : "something is counting down at chrysalis.bisks.net — not viewable in the code, only after the clock hits zero.";
    shareWait.href = "https://bsky.app/intent/compose?text=" + encodeURIComponent(text);
  }

  function checkReveal() {
    fetch("/api/reveal", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!target) {
          target = new Date(data.target);
          targetLineEl.textContent = "unlocks " + target.toUTCString();
          updateShareWait();
          renderClock(target.getTime() - Date.now());
        }
        if (data.ready) {
          revealed = true;
          clearInterval(pollTimer);
          showReveal(data.message, data.svg);
        } else {
          var msLeft = target.getTime() - Date.now();
          if (msLeft > 15000) {
            statusEl.textContent = "";
          }
        }
      })
      .catch(function () {
        statusEl.textContent = "couldn't reach the cocoon, retrying…";
      });
  }

  function showReveal(message, svg) {
    document.getElementById("mothWrap").innerHTML = svg;
    document.getElementById("messageText").textContent = message;
    countdownEl.classList.add("hide");
    revealEl.classList.add("show");

    var shareText = message + " — " + SITE;
    document.getElementById("shareResult").href =
      "https://bsky.app/intent/compose?text=" + encodeURIComponent(shareText);

    document.getElementById("downloadCard").addEventListener("click", function () {
      buildCard(message, svg).then(function (blob) {
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "chrysalis.png";
        a.click();
      });
    });
  }

  function buildCard(message, svgMarkup) {
    var canvas = document.getElementById("card");
    var ctx = canvas.getContext("2d");
    var W = canvas.width, H = canvas.height;

    var grad = ctx.createLinearGradient(0, 0, W, H);
    grad.addColorStop(0, "#150f1d");
    grad.addColorStop(1, "#2a1d40");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = "#38294f";
    ctx.lineWidth = 2;
    ctx.strokeRect(40, 40, W - 80, H - 80);

    ctx.fillStyle = "#f4d9a0";
    ctx.font = "700 44px monospace";
    ctx.fillText("chrysalis", 80, 110);

    ctx.fillStyle = "#a698c2";
    ctx.font = "20px monospace";
    ctx.fillText("chrysalis.bisks.net", 80, 145);

    function wrap(text, x, y, maxWidth, lineHeight) {
      var words = text.split(" ");
      var line = "";
      for (var i = 0; i < words.length; i++) {
        var test = line + words[i] + " ";
        if (ctx.measureText(test).width > maxWidth && line) {
          ctx.fillText(line, x, y);
          line = words[i] + " ";
          y += lineHeight;
        } else {
          line = test;
        }
      }
      ctx.fillText(line, x, y);
      return y;
    }

    ctx.fillStyle = "#f4ecff";
    ctx.font = "22px monospace";

    var img = new Image();
    var svgBlob = new Blob([svgMarkup], { type: "image/svg+xml;charset=utf-8" });
    var url = URL.createObjectURL(svgBlob);

    return new Promise(function (resolve) {
      img.onload = function () {
        ctx.drawImage(img, W - 380, 190, 280, 224);
        URL.revokeObjectURL(url);
        wrap(message, 80, 220, 660, 32);
        canvas.toBlob(function (blob) { resolve(blob); }, "image/png");
      };
      img.onerror = function () {
        wrap(message, 80, 220, 1040, 32);
        canvas.toBlob(function (blob) { resolve(blob); }, "image/png");
      };
      img.src = url;
    });
  }

  checkReveal();
  pollTimer = setInterval(function () {
    tick();
    var msLeft = target ? target.getTime() - Date.now() : Infinity;
    if (!revealed && msLeft <= 20000) {
      checkReveal();
    }
  }, 1000);
})();
</script>
</body>
</html>
