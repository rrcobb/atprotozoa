name = "atprotozoa-quantizeme"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Everything still runs client-side (see public/index.html): enter a handle,
# it downloads the account's entire repo as one CAR (com.atproto.sync.getRepo,
# via public/lib/car.js — every app.bsky.feed.post record, no page cap; falls
# back to paginated app.bsky.feed.getAuthorFeed only if the CAR read fails),
# runs every post through a heuristic (public/lib/failuremodes.js) that greps
# for the same failure modes language models have — contradictions, hedge
# fog, unearned certainty, whataboutism, doomcasting, broken-record repeats —
# and assigns the size (and quantization) of LLM that would embarrass itself
# the same way. No real model in the loop — it's a lexicon with opinions, not
# a judge.
#
# The one server job: /s/<handle> is a real per-handle URL so a shared link
# gets its own og:title/description instead of one generic card for every
# account — same shape as sites/didscope's renderShare / sites/llmstance's.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [{ pattern = "quantizeme.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /s/<handle> is dynamic (personalized OG tags per share), so
# the Worker must run BEFORE the static-asset router.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
