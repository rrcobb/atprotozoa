name = "atprotozoa-tacocounter"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# tacocounter (tacocounter.bisks.net): count how many tacos you've eaten.
# Asked for by @geesawra.industries. Every log ("I ate N tacos") and every
# board (leaderboard) and membership is a plain atproto record the browser
# signs and writes to the *writer's own* PDS — no backend, no KV, no Durable
# Object. A personal total is just the sum of your own net.bisks.tacocounter.log
# records (public/lib/tally.js). A board's roster is found via
# constellation.microcosm.blue's backlink index (public/lib/constellation.js):
# it answers "who has a net.bisks.tacocounter.membership record pointing
# .board at this board's at-uri", which is also what makes a board "private"
# — there's no public directory of boards, so the only way in is the
# shareable link a board's creator hands out.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes
# (see sites/logs, sites/didscope, sites/the-place for this exact gotcha).
routes = [
  { pattern = "tacocounter.bisks.net/*", zone_name = "bisks.net" },
]

# run_worker_first: /b/<did>/<rkey> (a board's shareable link, src/index.ts)
# is dynamic and matches no static file, and needs a real OG unfurl, so the
# Worker must run BEFORE the static-asset router, same as shelfguessr's /s/.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
