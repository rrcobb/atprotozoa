name = "atprotozoa-grand-moot-auto"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Type a Bluesky handle and
# it reads the public AppView (getFollows / getFollowers / a getProfiles
# batch, all anonymous, CORS *) to pull that handle's moots (mutuals, widened
# to follows if too small — moots-graph logic copied from
# pacmoot/lib/cluster.js, itself from mootdrone, itself from clustercrawl,
# itself from simcluster: copy, don't abstract). Then it's a tiny open-world
# driving toy: real WebGL 3D (three.js via CDN import map, same pattern as
# cowlick) around a nine-block city, chase cam, real-time shadow mapping,
# moots wander the streets as billboard-sprite pedestrians, honking near one
# "recruits" them before the clock runs out. RTX toggles the real shadow
# pass, DLSS toggles the real render resolution, FSR is still just a
# canvas-filter joke. No server, no build step, still not GTA 6.
assets = { directory = "./public" }

routes = [{ pattern = "grand-moot-auto.bisks.net", custom_domain = true }]
