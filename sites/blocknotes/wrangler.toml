name = "atprotozoa-blocknotes"
compatibility_date = "2025-01-01"

# @bisks.net asked, off @keytryer.net's line in the same thread ("blocks need
# to have a date and a note reminding you why you blocked") for a site to
# sign in via atproto, block someone, leave a note, and search your blocks —
# plus the same for mutes. Pure static SPA — no server-side state at all:
#
#   - Blocking writes a real app.bsky.graph.block record to the signed-in
#     user's own PDS (unblocking deletes it) — same repo:...?action=create
#     &action=delete pattern as sites/mutualsky/skyclone/bskyxp.
#   - Muting isn't a repo record — it's account-side AppView state — so it
#     goes through app.bsky.graph.muteActor/unmuteActor/getMutes, proxied
#     through the user's own PDS with the atproto-proxy header, same recipe
#     as skyclone's getTimeline/listNotifications rpc calls.
#   - The date+reason note is this site's own net.bisks.blocknotes.entry
#     record (see public/lexicons/), one per (subject, kind) pair, searched
#     client-side against whatever's cached in the browser after sign-in.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed. No Worker
# logic needed (no per-page OG personalization, nothing dynamic), so this
# is assets-only — see sites/abstractodo/wrangler.toml for the same shape.
assets = { directory = "./public" }

routes = [{ pattern = "blocknotes.bisks.net/*", zone_name = "bisks.net" }]
