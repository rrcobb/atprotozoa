name = "atprotozoa-cityhall"
compatibility_date = "2025-01-01"

# Static assets only — the whole game (state, factions, vote math, share card)
# runs in the browser. Nothing to persist server-side; each session is its own
# fresh council term.
routes = [
  { pattern = "cityhall.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
