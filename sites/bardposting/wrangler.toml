name = "atprotozoa-bardposting"
compatibility_date = "2025-01-01"

# Pure static site — the whole thing runs in the browser. It reads Bluesky's
# public AppView + PDS anonymously (no auth, no server, no secrets): it resolves
# a handle, pulls that person's own posts, and weaves them into a Shakespearean
# sonnet client-side. index.html is at the root, so there's no Worker fetch
# handler.
assets = { directory = "./public" }

routes = [{ pattern = "bardposting.bisks.net", custom_domain = true }]
