name = "atprotozoa-meadowbrand"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @fromthewestmeadow.com asked buildthis to "make me a website that describes
# my brand after you analyze my CAR file." Pure static site, single subject:
# build-brand.js downloads their whole repo as one com.atproto.sync.getRepo
# CAR (same CAR/DAG-CBOR parser as sites/ceemilarity's build-profile.js,
# copied in as CommonJS), counts every record collection, reads every post
# for vocabulary/tone/rhythm, and bakes the result into
# public/data/brand.json at build time — no live per-visitor analysis, no
# handle input, this is a portrait of one account. Re-run
# `node build-brand.js` to refresh it as they keep posting. No dynamic
# routes, so the Worker is a straight passthrough to ASSETS.
routes = [
  { pattern = "meadowbrand.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = false
