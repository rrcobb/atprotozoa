name = "atprotozoa-yetihunt"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site — a classic SkiFree-style endless downhill run (white
# slope, trees, rocks, moguls) with one addition: mouse-aim shooting. A
# crosshair tracks the pointer independent of steering; click/tap throws a
# snowball at it. Land enough hits on the yeti once it wakes up and starts
# chasing, and it gets knocked back instead of just closing the gap. All
# canvas + vanilla JS, no build step, no server.
# @brennan.computer's reply-thread post: "make skifree but also you can
# shoot at the yeti (mouse aim) while skiing", off a SkiFree-yeti gif
# @cee.wtf posted and @oksettledown.bsky.social's "let the player shoot the
# yeti with a gun" ask in the same thread.
routes = [{ pattern = "yetihunt.bisks.net/*", zone_name = "bisks.net" }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
