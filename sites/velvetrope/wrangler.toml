# schizanon.bsky.social asked for a site to sign in with Bluesky, list all of
# your moderation lists publicly, and let any other authenticated Bluesky user
# request to be added to or removed from one — with a bulk approve/deny queue
# for the list owner. See src/index.ts and public/index.html for how requests
# and decisions are real atproto records, verified by reading them back off
# the author's own PDS (same trust model as sites/clusterpedia).
#
# New site, canonical host only (no legacy bisks.net/<name> path route) — see
# notes/40-new-site-playbook.md.
name = "atprotozoa-velvetrope"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [
  { pattern = "velvetrope.bisks.net/*", zone_name = "bisks.net" },
]

# The Worker runs first for dynamic SPA paths; all data is read or written by
# the browser against public AppView/PDS endpoints.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# new_sqlite_classes, not new_classes: legacy KV-backed DO storage needs
# Workers Paid; SQLite-backed DOs work on the Free plan this account is on
# (see sites/docmoot, sites/the-place, sites/ratioed wrangler.tomls).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Rope"]

[[migrations]]
tag = "v2-remove-rope"
deleted_classes = ["Rope"]
