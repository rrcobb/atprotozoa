name = "atprotozoa-beanjar2"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Same hand-rolled 2D
# rigid-body bean physics + synthesized (Web Audio, no sample files) rattle
# sounds as sites/beanjar, plus a collection layer: shake the jar hot enough
# and a bean pops free into your permanent, persisted (localStorage) beandex.
# Built after @cee.wtf asked for "beanjar 2 — the lessons learned" from the
# original, which was fun to shake but had "no purpose whatsoever".
main = "src/index.ts"

routes = [
  { pattern = "beanjar2.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
