name = "atprotozoa-bathmat"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A luxury-bath-mat product
# generator: client-side template + word-bank recombination, no backend.

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# see notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "bathmat.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/bathmat", zone_name = "bisks.net" },
  { pattern = "bisks.net/bathmat/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
