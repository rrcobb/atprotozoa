name = "atprotozoa-knolling"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Type a Bluesky handle and
# it reads the public AppView (getFollows/getFollowers, anonymous, CORS *) for
# that handle's moots (mutuals, widened to follows if too small — moots-graph
# logic copied from mootdrone/lib/cluster.js, itself from clustercrawl, itself
# from simcluster: copy, don't abstract). Each moot's DID hashes (FNV-1a, same
# convention as mootdrone/lib/synth.js) to one fixed "ordinary object" (mug,
# stapler, keys, ...) at a scattered position and angle on a canvas worktop.
# Hit "knoll it" and every object glides into a tidy, right-angled, grouped
# flat-lay — the knolling trick — animated on a single 2D canvas, no server.
assets = { directory = "./public" }

routes = [{ pattern = "knolling.bisks.net", custom_domain = true }]
