name = "atprotozoa-biskshow"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. It reads Bluesky's public
# AppView (resolveHandle / getFollows / getAuthorFeed, all anonymous, CORS *)
# to build a pool of candidates — solo mode: one handle's follows; versus
# mode: the set union of two handles' follows — then quizzes you on who wrote
# a given bisk. pool.js is trimmed from neighborhood/hood.js (copy, don't
# abstract).
main = "src/index.ts"

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# biskshow.bisks.net is being retired to free a slot against the zone's
# custom-domain cap (see notes/20-deploy.md). Migrated to bisks.net/games/biskshow
# as part of the new games/ cluster. See notes/40-new-site-playbook.md
# ("Why paths, not subdomains").
routes = [
  { pattern = "biskshow.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/games/biskshow", zone_name = "bisks.net" },
  { pattern = "bisks.net/games/biskshow/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
