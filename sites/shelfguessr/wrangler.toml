name = "atprotozoa-shelfguessr"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# shelfguessr (shelfguessr.bisks.net): GeoGuessr, but the "map" is a handle's
# SimCluster and the "location" is a bookshelf. @gracekind.net asked for it in
# a reply to a thread about zooming in on someone's bookshelf photo for book
# recommendations. Sign in, upload a photo of your own shelf (a
# net.bisks.shelfguessr.shelf "self" record in your own PDS, photo blob +
# optional caption). To play, pick a simcluster (self + mutuals, same
# mutual-follow pool as sites/simcluster's moots.js / simcluster-levels'
# cluster.js), pull every shelf uploaded by someone in that cluster
# (network-wide net.bisks.shelfguessr.shelf index via listReposByCollection +
# Jetstream — public/lib/global-index.js, same recipe as skymash/catspace),
# and guess whose shelf you're looking at from the cluster roster. A correct
# guess (if signed in) writes a net.bisks.shelfguessr.guess record, replayed
# network-wide into the /leaderboard standings — same pattern as skymash's
# vote -> elo.js, just a plain correct/total tally instead of Elo. No KV, no
# Durable Object, no server-side game state: every write lives in the
# writer's own PDS, this Worker only ever serves static assets.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
routes = [
  { pattern = "shelfguessr.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = false
