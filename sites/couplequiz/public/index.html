    <style>

        --bg2: #1c1012;

      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; min-height: 100%; }
      body {
        background:
          radial-gradient(85% 55% at 8% -10%, rgba(227,64,47,0.20) 0%, transparent 55%),

        background-attachment: fixed;
        color: var(--ink);
        font-family: var(--sans);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      a { color: var(--gold); }
      .wrap { max-width: 700px; margin: 0 auto; padding: 2rem 1.1rem 3rem; }

      header { text-align: center; margin-bottom: 1.2rem; }
      .masthead {
        margin: 0; font-family: var(--serif); font-weight: 700; font-size: 2.6rem;
        letter-spacing: -0.01em; color: var(--cream);
        text-transform: uppercase;
      }
      .masthead .the { display: block; font-size: 0.85rem; letter-spacing: 0.35em; color: var(--red); font-family: var(--sans); font-weight: 800; margin-bottom: 0.3rem; }

        background: var(--card); border: 1px solid var(--card-border);

      }

      .step { display: none; }
      .step.show { display: block; }

      .progress { display: flex; gap: 0.35rem; justify-content: center; margin: 0 0 1.2rem; }
      .progress .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--card-border); }
      .progress .dot.on { background: var(--red); }
      .progress .dot.done { background: var(--gold); }

      .names { display: flex; align-items: center; gap: 0.6rem; }
      .namefield { flex: 1; min-width: 0; }
      label { display: block; font-size: 0.78rem; color: var(--dim); margin: 0 0 0.4rem; font-weight: 700; }
      input[type="text"] {
        width: 100%; font: inherit; font-size: 1rem; padding: 0.7rem 0.85rem;
        border-radius: 12px; border: 1px solid var(--card-border);
        background: rgba(0,0,0,0.25); color: var(--ink);
      }
      input[type="text"]::placeholder { color: rgba(246,239,226,0.32); }
      input[type="text"]:focus { outline: 2px solid var(--red); outline-offset: 1px; }
      .plus { font-size: 1.3rem; color: var(--dim); padding-top: 1.1rem; }

      .chips { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 0.8rem; }
      .chip {
        font: inherit; font-size: 0.78rem; padding: 0.4rem 0.75rem; border-radius: 999px;
        border: 1px solid var(--card-border); background: rgba(0,0,0,0.2); color: var(--dim);
        cursor: pointer; text-align: left;

      button {
        font-family: var(--sans); font-size: 0.95rem; font-weight: 800;
        color: #1a0d0a; background: linear-gradient(90deg, var(--red), var(--gold));

      .wide { width: 100%; padding: 0.85rem; font-size: 1.02rem; margin-top: 1rem; }

      .qhead { font-weight: 800; margin: 0 0 0.9rem; font-size: 1.05rem; }

      .options { display: grid; gap: 0.55rem; }
      .opt {
        display: block; width: 100%; text-align: left; font: inherit; font-size: 0.92rem;

        background: rgba(0,0,0,0.2); color: var(--ink); cursor: pointer; font-weight: 600;

      .opt.picked { border-color: var(--red); background: rgba(227,64,47,0.16); }

      .navrow { display: flex; gap: 0.6rem; margin-top: 1.1rem; }

      .alts { text-align: center; color: var(--dim); font-size: 0.82rem; margin-bottom: 1rem; }
      .alts b { color: var(--ink); font-weight: 700; }

      .shareRow { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 0.6rem; }
      .shareRow button, .shareRow a { flex: 1; min-width: 140px; text-align: center; text-decoration: none; }
      .shareRow a.primary { background: linear-gradient(90deg, var(--red), var(--gold)); color: #1a0d0a; border-radius: 12px; padding: 0.7rem 1.2rem; font-weight: 800; }

      #shareCanvas { display: none; }

      footer { margin-top: 2.4rem; text-align: center; color: var(--dim); font-size: 0.74rem; line-height: 1.7; }
      footer a { text-decoration: none; }
      footer a:hover { text-decoration: underline; }

      .flash { position: fixed; left: 50%; bottom: 1.2rem; transform: translateX(-50%);
        background: rgba(0,0,0,0.8); color: var(--ink); padding: 0.55rem 1rem; border-radius: 999px;
        font-size: 0.8rem; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; z-index: 10; }
      .flash.show { opacity: 1; }

  <body>
    <div class="wrap">
      <header>
        <h1 class="masthead"><span class="the">the daily</span>couplequiz</h1>
        <p class="tag">type two names, answer five extremely serious questions, and the tabloids will decide the rest.</p>
      </header>

      <div class="progress" id="progress">
        <span class="dot" data-step="0"></span>
        <span class="dot" data-step="1"></span>
        <span class="dot" data-step="2"></span>
        <span class="dot" data-step="3"></span>
        <span class="dot" data-step="4"></span>
        <span class="dot" data-step="5"></span>
      </div>

      <!-- step 0: names -->
      <section class="step show" id="step0">
        <div class="card">
          <div class="names">
            <div class="namefield">
              <label for="nameA">your name (or handle)</label>
              <input id="nameA" type="text" placeholder="e.g. Alex" autocomplete="off" autocapitalize="off" spellcheck="false" />
            </div>
            <div class="plus">💕</div>
            <div class="namefield">
              <label for="nameB">their name (or handle)</label>
              <input id="nameB" type="text" placeholder="e.g. Rory" autocomplete="off" autocapitalize="off" spellcheck="false" />
            </div>
          </div>
          <div class="chips" id="chips">
            <button type="button" class="chip" data-a="Alex" data-b="Rory">Alex + Rory</button>
            <button type="button" class="chip" data-a="Priya" data-b="Sam">Priya + Sam</button>
            <button type="button" class="chip" data-a="Marcus" data-b="Bea">Marcus + Bea</button>
          </div>
          <button type="button" class="wide" id="startBtn">start the quiz →</button>
        </div>
      </section>

      <!-- steps 1-5: quiz questions, injected -->
      <section class="step" id="quizStep">
        <div class="card">
          <p class="qhead"><span class="qn" id="qn"></span> <span id="qtext"></span></p>
          <div class="options" id="options"></div>
          <div class="navrow">
            <button type="button" class="ghost" id="backBtn">← back</button>
            <button type="button" id="nextBtn" disabled>next →</button>
          </div>
        </div>
      </section>

      <!-- step 6: result -->
      <section class="step" id="resultStep">
        <div class="card">
          <p class="result-kicker">breaking news</p>
          <p class="result-name" id="resultName"></p>
          <p class="result-archetype" id="resultArchetype"></p>
          <div class="compat">
            <span class="num" id="compatNum"></span>
            <span class="lbl">tabloid compatibility</span>
          </div>
          <p class="headline" id="headline"></p>
          <p class="alts" id="alts"></p>
          <div class="shareRow">
            <button type="button" id="copyBtn">📋 copy headline</button>
            <button type="button" id="shareCardBtn">🖼️ make a card</button>
            <button type="button" id="shareNative" style="display:none;">📤 share card</button>
          </div>
          <div class="shareRow">
            <a id="shareBluesky" class="primary" target="_blank" rel="noopener">🦋 post it</a>
            <button type="button" class="ghost" id="retakeBtn">↺ retake</button>
          </div>
        </div>
      </section>

      <canvas id="shareCanvas" width="1200" height="630"></canvas>
      <div class="flash" id="flash"></div>

      <hr class="rule" />
      <footer>
        this tick's theme-box idea, for "dating and connection" ·
        built by <a href="https://buildthis.bisks.net">@buildthis.bisks.net</a> ·
        part of <a href="https://bisks.net">atprotozoa</a>
      </footer>
    </div>

    <script src="lib/handle-typeahead.js"></script>
    <script>
    "use strict";
    (function () {
      var SITE_URL = "https://couplequiz.bisks.net/";

      // ---------------------------------------------------------------
      // name cleanup — accepts a plain name or a handle typed/selected via
      // the typeahead, reduces either to a bare word to mash.
      // ---------------------------------------------------------------
      function cleanName(raw) {
        var s = (raw || "").trim();
        if (!s) return "";
        s = s.replace(/^@/, "");
        if (s.indexOf(".") !== -1) s = s.split(".")[0];
        return s;
      }
      function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

      // ---------------------------------------------------------------
      // portmanteau — vowel-snapped head of one name + vowel-snapped tail
      // of the other, so the seam tends to land on a syllable boundary.
      // A short ratio sweep picks a few distinct candidates; the first is
      // the "official" tabloid name, the rest show as "also floated".
      // ---------------------------------------------------------------
      function vowelHead(s, ratio) {
        var len = s.length;
        var min = len <= 1 ? len : Math.min(2, len - 1);
        var i = Math.max(min, Math.min(len - 1, Math.round(len * ratio)));
        for (var d = 0; d <= 2; d++) {
          if (i + d < len && /[aeiou]/.test(s[i + d])) return s.slice(0, i + d + 1);
        }
        return s.slice(0, i);
      }
      function vowelTail(s, ratio) {
        var len = s.length;
        var min = len <= 1 ? len : Math.min(2, len - 1);
        var maxIdx = len - min;
        var i = Math.max(1, Math.min(maxIdx, Math.round(len * ratio)));
        for (var d = 0; d <= 2; d++) {
          if (i - d > 0 && /[aeiou]/.test(s[i - d])) return s.slice(i - d);
        }
        return s.slice(i);
      }
      function join(head, tail, a, b) {
        if (!tail) tail = b.slice(Math.max(1, b.length - 2)) || b;
        if (!head) head = a.slice(0, Math.max(1, Math.ceil(a.length / 2)));
        return cap(head + tail);
      }
      var PORT_RATIOS = [
        [0.55, 0.5],
        [0.35, 0.65],
        [0.7, 0.35]
      ];
      function portmanteaus(a, b) {
        var out = [];
        var seen = {};
        PORT_RATIOS.forEach(function (r) {
          var name = join(vowelHead(a, r[0]), vowelTail(b, r[1]), a, b);
          var key = name.toLowerCase();
          if (!seen[key]) { seen[key] = true; out.push(name); }
        });
        var rev = join(vowelHead(b, 0.55), vowelTail(a, 0.5), b, a);
        if (!seen[rev.toLowerCase()]) out.push(rev);
        return out;
      }

      // ---------------------------------------------------------------
      // deterministic hash — same names + same answers always land on the
      // same compatibility number and, if a quiz category ties, the same
      // tie-break. Not cryptographic, just seeded string hashing.
      // ---------------------------------------------------------------
      function hashStr(s) {
        var h = 2166136261;
        for (var i = 0; i < s.length; i++) {
          h ^= s.charCodeAt(i);
          h = (h * 16777619) >>> 0;
        }
        return h >>> 0;
      }

      // ---------------------------------------------------------------
      // the quiz — five questions, each option tagged with a vibe. The
      // vibe with the most picks decides the couple's tabloid archetype;
      // ties break toward whichever vibe was picked earliest.
      // ---------------------------------------------------------------
      var QUESTIONS = [
        {
          text: "how did this start?",
          options: [
            { t: "reply guy arc, no shame", v: "chaos" },
            { t: "mutuals for months, then... feelings", v: "soft" },
            { t: "eye contact across a crowded server", v: "intense" },
            { t: "honestly? the algorithm did this", v: "unbothered" }
          ]
        },
        {
          text: "their most dangerous quality?",
          options: [
            { t: "would start discourse for you", v: "chaos" },
            { t: "unreasonably good taste in snacks", v: "soft" },
            { t: "never once leaves a text on read", v: "intense" },
            { t: "somehow always down, never fazed", v: "unbothered" }
          ]
        },
        {
          text: "the red flag you're choosing to ignore:",
          options: [
            { t: "posts at 4am like it's totally normal", v: "chaos" },
            { t: "still uses the crying-laughing emoji", v: "soft" },
            { t: "says \"it's giving\" about literally everything", v: "intense" },
            { t: "\"situationship\" in the bio, unironically", v: "unbothered" }
          ]
        },
        {
          text: "how does the tabloid cover write itself?",
          options: [
            { t: "messy public breakup thread, front page", v: "chaos" },
            { t: "matching pfps within the week", v: "soft" },
            { t: "eloped in Vegas on a whim", v: "intense" },
            { t: "still \"complicated,\" three years running", v: "unbothered" }
          ]
        },
        {
          text: "one word for the energy:",
          options: [
            { t: "chaotic", v: "chaos" },
            { t: "soft", v: "soft" },
            { t: "intense", v: "intense" },
            { t: "unbothered", v: "unbothered" }
          ]
        }
      ];

      var ARCHETYPES = {
        chaos: {
          label: "the tabloid disaster couple",
          line: "sources describe the vibe as \"unhinged, but make it romantic.\" experts are calling it a trainwreck. nobody can look away, least of all us."
        },
        soft: {
          label: "the soft-launch sweethearts",
          line: "spotted holding hands, matching playlists, and generally being disgustingly wholesome about the whole thing."
        },
        intense: {
          label: "the red-carpet power couple",
          line: "insiders confirm this is not a phase — flashbulbs, dramatic entrances, and a situationship that graduated with honors."
        },
        unbothered: {
          label: "the situationship that refuses to end",
          line: "three years of \"it's complicated\" and counting. tabloids have given up guessing and started a running bet instead."
        }
      };

      // ---------------------------------------------------------------
      // state + elements
      // ---------------------------------------------------------------
      var els = {
        progress: document.getElementById("progress"),
        step0: document.getElementById("step0"),
        nameA: document.getElementById("nameA"),
        nameB: document.getElementById("nameB"),
        chips: document.getElementById("chips"),
        startBtn: document.getElementById("startBtn"),
        quizStep: document.getElementById("quizStep"),
        qn: document.getElementById("qn"),
        qtext: document.getElementById("qtext"),
        options: document.getElementById("options"),
        backBtn: document.getElementById("backBtn"),
        nextBtn: document.getElementById("nextBtn"),
        resultStep: document.getElementById("resultStep"),
        resultName: document.getElementById("resultName"),
        resultArchetype: document.getElementById("resultArchetype"),
        compatNum: document.getElementById("compatNum"),
        headline: document.getElementById("headline"),
        alts: document.getElementById("alts"),
        copyBtn: document.getElementById("copyBtn"),
        shareCardBtn: document.getElementById("shareCardBtn"),
        shareNative: document.getElementById("shareNative"),
        shareBluesky: document.getElementById("shareBluesky"),
        retakeBtn: document.getElementById("retakeBtn"),
        canvas: document.getElementById("shareCanvas"),
        flash: document.getElementById("flash")
      };

      if (window.attachHandleTypeahead) {
        window.attachHandleTypeahead(els.nameA);
        window.attachHandleTypeahead(els.nameB);
      }

      var curA = "", curB = "";
      var qIndex = 0;
      var answers = []; // vibe string per question, in order picked
      var result = null; // { name, archetype, compat, headline, alts }

      function setProgress(step) {
        var dots = els.progress.querySelectorAll(".dot");
        dots.forEach(function (d) {
          var i = Number(d.dataset.step);
          d.classList.toggle("on", i === step);
          d.classList.toggle("done", i < step);
        });
      }

      function showStep(el) {
        [els.step0, els.quizStep, els.resultStep].forEach(function (s) { s.classList.remove("show"); });
        el.classList.add("show");
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      els.chips.addEventListener("click", function (e) {
        var btn = e.target.closest(".chip");
        if (!btn) return;
        els.nameA.value = btn.dataset.a;
        els.nameB.value = btn.dataset.b;
      });

      els.startBtn.addEventListener("click", function () {
        curA = cleanName(els.nameA.value);
        curB = cleanName(els.nameB.value);
        if (!curA) { els.nameA.focus(); return; }
        if (!curB) { els.nameB.focus(); return; }
        qIndex = 0;
        answers = [];
        renderQuestion();
        showStep(els.quizStep);
        setProgress(1);
      });

      function renderQuestion() {
        var q = QUESTIONS[qIndex];
        els.qn.textContent = "Q" + (qIndex + 1) + ".";
        els.qtext.textContent = q.text;
        els.options.innerHTML = "";
        q.options.forEach(function (opt) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "opt";
          b.textContent = opt.t;
          if (answers[qIndex] === opt.v) b.classList.add("picked");
          b.addEventListener("click", function () {
            answers[qIndex] = opt.v;
            els.options.querySelectorAll(".opt").forEach(function (o) { o.classList.remove("picked"); });
            b.classList.add("picked");
            els.nextBtn.disabled = false;
          });
          els.options.appendChild(b);
        });
        els.nextBtn.disabled = answers[qIndex] === undefined;
        els.nextBtn.textContent = qIndex === QUESTIONS.length - 1 ? "see results →" : "next →";
        els.backBtn.disabled = false;
        setProgress(qIndex + 1);
      }

      els.backBtn.addEventListener("click", function () {
        if (qIndex === 0) { showStep(els.step0); setProgress(0); return; }
        qIndex--;
        renderQuestion();
      });

      els.nextBtn.addEventListener("click", function () {
        if (answers[qIndex] === undefined) return;
        if (qIndex < QUESTIONS.length - 1) {
          qIndex++;
          renderQuestion();
        } else {
          computeResult();
          renderResult();
          showStep(els.resultStep);
          setProgress(6);
        }
      });

      function dominantVibe() {
        var order = ["chaos", "intense", "soft", "unbothered"];
        var counts = { chaos: 0, intense: 0, soft: 0, unbothered: 0 };
        answers.forEach(function (v) { counts[v]++; });
        var best = order[0];
        order.forEach(function (v) { if (counts[v] > counts[best]) best = v; });
        return best;
      }

      function computeResult() {
        var la = curA.toLowerCase(), lb = curB.toLowerCase();
        var names = portmanteaus(la, lb);
        var vibe = dominantVibe();
        var arche = ARCHETYPES[vibe];
        var seed = hashStr(la + "|" + lb + "|" + answers.join(","));
        var compat = 42 + (seed % 58); // 42-99, keeps it fun, never a real dud
        result = {
          top: names[0],
          alts: names.slice(1, 3),
          archetype: arche.label,
          line: arche.line,
          compat: compat
        };
      }

      function truncate(s, max) { return s.length > max ? s.slice(0, max - 1).trim() + "…" : s; }

      function buildHeadline() {
        return "BREAKING: " + curA + " & " + curB + " spotted again. tabloids are already calling them " +
          "“" + result.top + "”" + " — " + result.line;
      }

      function buildShareText() {
        var prefix = curA + " + " + curB + " = " + result.top + " (" + result.archetype + ", " + result.compat + "% compatible) — ";
        var suffix = " take the quiz: " + SITE_URL;
        var budget = 300 - prefix.length - suffix.length;
        return prefix + truncate(result.line, Math.max(budget, 10)) + suffix;
      }

      function renderResult() {
        els.resultName.textContent = "“" + result.top + "”";
        els.resultArchetype.textContent = result.archetype;
        els.compatNum.textContent = result.compat + "%";
        var h = buildHeadline();
        els.headline.innerHTML = "BREAKING: " + curA + " &amp; " + curB + " spotted again. tabloids are already calling them <b>“" +
          result.top + "”</b> — " + result.line;
        els.alts.textContent = result.alts.length ? ("also floated in the newsroom: " + result.alts.join(" · ")) : "";
        els.shareBluesky.href = "https://bsky.app/intent/compose?text=" + encodeURIComponent(buildShareText());
      }

      els.copyBtn.addEventListener("click", function () {
        var text = buildHeadline();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () { flash("copied!"); })
            .catch(function () { window.prompt("copy this:", text); });
        } else {
          window.prompt("copy this:", text);
        }
      });

      function flash(msg) {
        els.flash.textContent = msg;
        els.flash.classList.add("show");
        setTimeout(function () { els.flash.classList.remove("show"); }, 1500);
      }

      els.retakeBtn.addEventListener("click", function () {
        qIndex = 0;
        answers = [];
        result = null;
        showStep(els.step0);
        setProgress(0);
      });

      // ---------------------------------------------------------------
      // share card — canvas, downloadable / native-shareable.
      // ---------------------------------------------------------------
      function wrapCanvasText(c, text, x, y, maxWidth, lineHeight, maxLines) {
        var words = text.split(" ");
        var line = "", cy = y, lines = 0;
        for (var i = 0; i < words.length; i++) {
          var test = line ? line + " " + words[i] : words[i];
          if (line && c.measureText(test).width > maxWidth) {
            c.fillText(line, x, cy); line = words[i]; cy += lineHeight; lines++;
            if (maxLines && lines >= maxLines - 1) {
              var rest = words.slice(i).join(" ");
              c.fillText(truncate(line + " " + rest, 70), x, cy);
              return cy;
            }
          } else { line = test; }
        }
        if (line) c.fillText(line, x, cy);
        return cy;
      }

      function buildShareCard() {
        if (!result) return false;
        var c = els.canvas.getContext("2d");
        var W = els.canvas.width, H = els.canvas.height;

        var grad = c.createLinearGradient(0, 0, W, H);
        grad.addColorStop(0, "#1c1012");
        grad.addColorStop(1, "#120b0c");
        c.fillStyle = grad; c.fillRect(0, 0, W, H);

        var glow = c.createRadialGradient(W * 0.5, H * 0.15, 0, W * 0.5, H * 0.15, W * 0.65);
        glow.addColorStop(0, "#e3402f2e");
        glow.addColorStop(1, "#e3402f00");
        c.fillStyle = glow; c.fillRect(0, 0, W, H);

        c.textAlign = "center";
        c.font = "800 22px system-ui, sans-serif";
        c.fillStyle = "#e3402f";
        c.fillText("BREAKING NEWS", W / 2, 90);

        c.strokeStyle = "#e8b13c"; c.lineWidth = 3;
        c.beginPath(); c.moveTo(W / 2 - 90, 118); c.lineTo(W / 2 + 90, 118); c.stroke();

        var fontSize = result.top.length > 12 ? 70 : 96;
        c.fillStyle = "#f6efe2";
        c.font = "700 " + fontSize + "px Georgia, 'Times New Roman', serif";
        c.fillText("“" + result.top + "”", W / 2, 250);

        c.fillStyle = "#e8b13c";
        c.font = "800 26px system-ui, sans-serif";
        c.fillText(result.archetype, W / 2, 300);

        c.fillStyle = "#cbb79f";
        c.font = "600 24px system-ui, sans-serif";
        wrapCanvasText(c, curA + " + " + curB + "  ·  " + result.compat + "% tabloid compatible", W / 2, 370, 980, 32, 2);

        c.fillStyle = "#e3402f";
        c.font = "700 22px system-ui, sans-serif";
        wrapCanvasText(c, result.line, W / 2, 470, 900, 30, 3);

        c.fillStyle = "#e8b13c";
        c.font = "700 22px system-ui, sans-serif";
        c.fillText("couplequiz.bisks.net", W / 2, H - 56);
        return true;
      }

      function canShareFiles() {
        if (!navigator.share || !navigator.canShare) return false;
        try {
          var probe = new File([""], "probe.png", { type: "image/png" });
          return navigator.canShare({ files: [probe] });
        } catch (e) { return false; }
      }
      if (canShareFiles()) els.shareNative.style.display = "";

      els.shareCardBtn.addEventListener("click", function () {
        if (!buildShareCard()) return;
        var link = document.createElement("a");
        link.download = "couplequiz-" + (curA + "-" + curB).toLowerCase().replace(/[^a-z0-9-]/g, "") + ".png";
        link.href = els.canvas.toDataURL("image/png");
        link.click();
      });

      els.shareNative.addEventListener("click", function () {
        if (!buildShareCard()) return;
        els.canvas.toBlob(function (blob) {
          if (!blob) return;
          var file = new File([blob], "couplequiz.png", { type: "image/png" });
          navigator.share({
            files: [file],
            text: curA + " + " + curB + " = " + result.top + " — " + SITE_URL,
            title: "couplequiz"
          }).catch(function () {});
        }, "image/png");
      });

      [els.nameA, els.nameB].forEach(function (inp) {
        inp.addEventListener("keydown", function (e) { if (e.key === "Enter") els.startBtn.click(); });
      });
    })();
    </script>
    <script defer src="https://footfall.bisks.net/beacon.js" data-site="couplequiz"></script>
</body>
</html>
