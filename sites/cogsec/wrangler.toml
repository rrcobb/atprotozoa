name = "atprotozoa-cogsec"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A cognitive-security
# console for the @buildthis build bot: it documents the bot's own defenses
# against prompt injection and cursed text, and lets you run an untrusted
# string through a client-side "intrusion test" to watch those defenses
# classify it. Built after @vgel.me tagged the bot asking for exactly this,
# in a thread about the bot needing a killswitch. No secrets, no server.
assets = { directory = "./public" }

routes = [{ pattern = "cogsec.bisks.net", custom_domain = true }]
