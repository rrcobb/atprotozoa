name = "atprotozoa-cogsec"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A cognitive-security
# console for the @buildthis build bot: it documents the bot's own defenses
# against prompt injection and cursed text, and lets you run an untrusted
# string through a client-side "intrusion test" to watch those defenses
# classify it. Built after @vgel.me tagged the bot asking for exactly this,
# in a thread about the bot needing a killswitch. No secrets, no server.
main = "src/index.ts"

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# cogsec.bisks.net is being retired to free a slot against the zone's
# custom-domain cap (see notes/20-deploy.md). Migrated to bisks.net/cogsec
# instead. See notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "cogsec.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/cogsec", zone_name = "bisks.net" },
  { pattern = "bisks.net/cogsec/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
