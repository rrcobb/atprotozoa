<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>let me claude that for you</title>
<meta name="description" content="For people who ask humans things an AI could answer. Make a link, watch the question get typed for them.">
<meta property="og:title" content="let me claude that for you">
<meta property="og:description" content="Make a link that shows someone how easy it is to just ask an AI.">
<meta property="og:image" content="https://letmeclaude.bisks.net/og.png">
<meta property="og:url" content="https://letmeclaude.bisks.net/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://letmeclaude.bisks.net/og.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <section id="maker">
    <h1>let me claude that for you</h1>
    <p class="sub">for questions an AI could have answered in four seconds.</p>
    <label for="q">the question</label>
    <textarea id="q" rows="3" placeholder="what is the difference between a DID and a handle?"></textarea>
    <button id="make" type="button">make the link</button>
    <div id="result" class="result" hidden>
      <input id="url" readonly aria-label="generated link">
      <div class="row">
        <button id="copy" type="button">copy</button>
        <a id="preview" href="#">preview</a>
        <a id="share" href="#" target="_blank" rel="noopener">post to bluesky</a>
      </div>
    </div>
  </section>

  <section id="player" hidden>
    <div class="win">
      <div class="bar"><i></i><i></i><i></i><span>new chat</span></div>
      <div class="body">
        <div id="msgs" class="msgs"></div>
        <div class="composer">
          <div id="fake" class="fake" aria-live="polite"><span id="typed"></span><span class="caret"></span></div>
          <button id="send" class="send" type="button" aria-label="send">↑</button>
        </div>
      </div>
      <div id="cursor" class="cursor">➤</div>
    </div>
    <p id="verdict" class="verdict" hidden></p>
    <div id="after" class="after" hidden>
      <a id="ask" class="big" href="#" target="_blank" rel="noopener">ask it for real →</a>
      <a href="./" class="small">make your own</a>
    </div>
  </section>
</main>
<footer>
  <a href="https://rateyourbuild.bisks.net/site/letmeclaude">rate this on rateyourbuild →</a>
  · <a href="https://bisks.net/">bisks.net</a>
</footer>
<script src="app.js"></script>
</body>
</html>
