name = "atprotozoa-keytags"
compatibility_date = "2025-01-01"

# Pure static + client-side OAuth (public client) — no server surface needed.
# All state lives in one custom lexicon collection (net.bisks.keytags.set)
# written straight to the user's own PDS from the browser. The record key
# (rkey) for each entry is an HMAC-SHA256 of a target DID under a secret the
# user types in and that never leaves the browser — so the repo is public,
# but which entry belongs to which DID isn't, unless you hold the key.
assets = { directory = "./public" }

routes = [{ pattern = "keytags.bisks.net", custom_domain = true }]
