name = "atprotozoa-keytags"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# The tag box itself is still client-side OAuth against the user's own PDS —
# see src's own comment. All tag state lives in one custom lexicon collection
# (net.bisks.keytags.set) written straight from the browser. The record key
# (rkey) for each entry is an HMAC-SHA256 of a target DID under a secret the
# user types in and that never leaves the browser — so the repo is public,
# but which entry belongs to which DID isn't, unless you hold the key.
#
# The only server surface is a tiny Durable Object behind /api/net — a single
# global "first come, first served" claim, unrelated to the tag box.
routes = [{ pattern = "keytags.bisks.net/*", zone_name = "bisks.net" }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "NET"
class_name = "NetWinner"

# new_sqlite_classes, not new_classes — legacy KV-backed DOs need Workers
# Paid; this account is on Free. See sites/the-place/wrangler.toml.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["NetWinner"]
