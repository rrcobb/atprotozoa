name = "atprotozoa-elopt"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @nequals001.bsky.social, replying to two declines in the same thread
# (a poster-elo board judged by AI, then a real-money-betting variant of it —
# see sites/sidenote's 2026-09-23 entries): "what if you only do it for
# people who consent." Both declines turned on the same problem — real,
# non-consenting Bluesky accounts turned into a public win/loss score. This
# is that idea rebuilt so consent is load-bearing instead of assumed: nobody
# is ever named, ranked, or battled unless they've signed in themselves and
# written their own net.bisks.elopt.optin record. No AI judge (also just
# Workers AI, banned by the cost wall) — human visitors vote on real threads,
# same as sites/verdict and sites/thoughtdome. No wagering, no crypto.
#
# Pure static + client-side OAuth (public client), no server surface needed —
# every write is a record the browser signs straight to the *author's own*
# PDS, and the leaderboard is a client-side replay of every
# net.bisks.elopt.vote record on the network (Tier 3 pattern,
# notes/ideas/pds-and-lexicons.md), filtered live to only accounts that are
# still opted in.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
routes = [
  { pattern = "elopt.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
