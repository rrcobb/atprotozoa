name = "atprotozoa-typeofguy"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# The generator itself is entirely client-side (public/index.html): a seeded
# PRNG picks from word banks to assemble a "guy," deterministic from an
# integer seed. The one server-side surface is /s/<seed36> — a real, distinct
# URL per generated guy so link-unfurl caches (Bluesky's included) don't
# collapse every share into one generic card. src/index.ts re-runs the same
# seeded generation server-side (duplicated from public/index.html's
# generateGuy, same reasoning as sites/didscope's src/index.ts) to stamp
# per-guy og:title/og:description/og:url onto the shell before falling
# through to ASSETS.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [{ pattern = "typeofguy.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /s/<seed36> is dynamic (personalized OG tags per share),
# so the Worker must run before the static-asset router, same as sites/logs
# and sites/didscope.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
