name = "atprotozoa-prestige"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static + client-side OAuth (public client) — no server surface needed.
# Prestige links are a custom lexicon record (net.bisks.prestige.link) written
# straight to each user's own PDS from the browser; the chain viewer is
# public, unauthenticated reads (com.atproto.repo.listRecords) fanned out
# across whichever PDSes the chain touches. See notes/40-new-site-playbook.md.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/prestige path route and no prefix-stripping needed.
routes = [
  { pattern = "prestige.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
