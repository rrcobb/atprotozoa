name = "atprotozoa-nightfare"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Path route on the shared zone, not a dedicated custom domain — the zone hit
# a Cloudflare custom-domain cap, so new sites mount as a path. See
# notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "nightfare.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/nightfare", zone_name = "bisks.net" },
  { pattern = "bisks.net/nightfare/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
