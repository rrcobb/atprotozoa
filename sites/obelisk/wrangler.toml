name = "atprotozoa-obelisk"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [
  { pattern = "obelisk.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# 2026-08-13: redeploy kick — pnpm-lock.yaml was out of sync when this site first shipped (see notes/history/2026-08-pnpm-lockfile-outage.md), so CI's check job failed and this Worker never actually deployed. Config-only touch to pull it back into this push's changed-dirs diff.

[[migrations]]
tag = "v1"
deleted_classes = ["ObeliskState"]

# 2026-08-13: @shimmermathlabs.com's parole clause — if norvid ever publicly
# posts "i learned my lesson," the obelisk unlocks. scheduled() in
# src/index.ts polls his public feed off the AppView every 15min; GET
# /api/status also lazily triggers a check if the last one is stale, so the
# clause works even before the first cron tick lands post-deploy.
