<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>branchline</title>
<meta name="description" content="Click to lay down points on a line; every segment branches into a fractal tree with leaves.">
<meta property="og:title" content="branchline">
<meta property="og:description" content="Click to lay down points; every segment grows a fractal tree.">
<meta property="og:image" content="https://branchline.bisks.net/og.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0d1410; color: #cfe6d2; font: 15px/1.4 system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }
  header { padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .sub { opacity: .65; font-size: 13px; }
  label { font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
  input[type=range] { width: 90px; }
  button, a.btn { background: #1d2c22; color: inherit; border: 1px solid #2f4a38; border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; text-decoration: none; }
  button:hover, a.btn:hover { background: #274032; }
  #stage { flex: 1; min-height: 0; position: relative; }
  canvas { width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
  #hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: .5; font-size: 18px; }
  #hint[hidden] { display: none; }
  footer { padding: 6px 14px; font-size: 12px; opacity: .6; }
  footer a { color: inherit; }
</style>
</head>
<body>
<header>
  <h1>branch<span id="b">l</span>ine</h1>
  <span class="sub">click to add points</span>
  <label>spread <input id="spread" type="range" min="10" max="80" value="30"></label>
  <label>depth <input id="depth" type="range" min="1" max="11" value="8"></label>
  <label>shrink <input id="shrink" type="range" min="50" max="90" value="72"></label>
  <label>wind <input id="wind" type="range" min="0" max="10" value="3"></label>
  <button id="undo">undo</button>
  <button id="clear">clear</button>
  <button id="save">save png</button>
  <a class="btn" id="share" target="_blank" rel="noopener">share</a>
</header>
<div id="stage"><canvas id="c"></canvas><div id="hint">click anywhere to plant a point</div></div>
<footer><a href="https://rateyourbuild.bisks.net/site/branchline">rate this on rateyourbuild →</a></footer>
<script src="main.js"></script>
</body>
</html>
