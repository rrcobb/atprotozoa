name = "atprotozoa-gulpstream"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. An agar.io clone: you
# play as @norvid-studies.bsky.social and every pellet is a real post pulled
# from that account's own archive (public AppView, fetched client-side).
# Arrow keys to move, other accounts mentioned in the archive wander the
# arena as rival blobs you can outgrow and eat or be eaten by. Spacebar fires
# half your mass at the nearest rival. @croissanthology.com always gets a
# spot in the arena as a duck — pop him and he bursts into a hail of tweets.
# v2, built after @norvid-studies.bsky.social asked for this revision of the
# original firehose-fed gulpstream. No secrets, no server.
main = "src/index.ts"

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# gulpstream.bisks.net is being retired to free a slot against the zone's
# custom-domain cap (see notes/20-deploy.md). Migrated to bisks.net/gulpstream
# instead. See notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "gulpstream.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/gulpstream", zone_name = "bisks.net" },
  { pattern = "bisks.net/gulpstream/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
