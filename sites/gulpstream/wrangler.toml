name = "atprotozoa-gulpstream"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. An agar.io clone played
# against the live Bluesky firehose: your blob eats posts (jetstream) as
# colored pellets to grow, arrow keys to move, other accounts wander the
# arena as rival blobs you can outgrow and eat or be eaten by. Spacebar fires
# half your mass at the nearest rival. Built after @norvid-studies.bsky.social
# tagged @buildthis for "an agar.io clone where your account moves around to
# eat tweets from the firehose". No secrets, no server.
assets = { directory = "./public" }

routes = [{ pattern = "gulpstream.bisks.net", custom_domain = true }]
