name = "atprotozoa-mentiontally"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Fully client-side: the page reads the thread from the public AppView.
# routes MUST stay above [assets] (TOML: keys after a table header join it).
routes = [{ pattern = "mentiontally.bisks.net/*", zone_name = "bisks.net" }]

[assets]
directory = "./public"
binding = "ASSETS"
