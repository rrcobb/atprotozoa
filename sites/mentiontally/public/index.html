<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mentiontally — who's mentioned under a post?</title>
<meta name="description" content="Paste a Bluesky post and tally every @-mention in the replies beneath it, double-counting repeats. Shows root-thread totals too.">
<meta property="og:title" content="mentiontally">
<meta property="og:description" content="Tally every @-mention under a Bluesky post — per post and per thread root.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mentiontally.bisks.net/">
<meta property="og:image" content="https://mentiontally.bisks.net/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://mentiontally.bisks.net/og.png">
<style>
:root{--bg:#0e1116;--card:#171c24;--fg:#e8edf4;--dim:#8b97a8;--acc:#4aa8ff;--bd:#2a3340}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:28px 16px 60px}
h1{margin:0 0 4px;font-size:28px}
.sub{color:var(--dim);margin:0 0 20px}
form{display:flex;gap:8px;flex-wrap:wrap}
input[type=text]{flex:1;min-width:240px;padding:10px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:inherit}
button{padding:10px 16px;border-radius:8px;border:0;background:var(--acc);color:#04121f;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
label.opt{display:block;margin:10px 0 0;color:var(--dim);font-size:14px}
#status{margin:16px 0;color:var(--dim)}
#status.err{color:#ff7b7b}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums;width:90px}
td .who{display:flex;align-items:center;gap:10px}
td img{width:32px;height:32px;border-radius:50%;background:var(--card)}
td a{color:var(--fg);text-decoration:none}
td a:hover{color:var(--acc)}
.dn{display:block}.hd{color:var(--dim);font-size:13px}
#out[hidden],#status[hidden]{display:none}
.summary{color:var(--dim);font-size:14px}
.share{margin-top:14px}
.share a{color:var(--acc)}
footer{margin-top:40px;color:var(--dim);font-size:13px}
footer a{color:var(--dim)}
</style>
</head>
<body>
<main>
<h1>mentiontally</h1>
<p class="sub">Paste a Bluesky post. Every @-mention in the replies beneath it gets counted — mention someone twice, count twice.</p>
<form id="form">
  <input type="text" id="post" placeholder="https://bsky.app/profile/handle/post/… or at://…" autocomplete="off" spellcheck="false">
  <button id="go" type="submit">tally</button>
</form>
<label class="opt"><input type="checkbox" id="self"> also count mentions in the post itself</label>
<div id="status" hidden></div>
<div id="out" hidden>
  <div class="summary" id="summary"></div>
  <table>
    <thead><tr><th>person</th><th class="n" id="h-post">this post</th><th class="n" id="h-root">under root</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="share"><a id="share" target="_blank" rel="noopener">post this to Bluesky →</a></div>
</div>
<footer>
  <a href="https://rateyourbuild.bisks.net/site/mentiontally">rate this on rateyourbuild →</a>
</footer>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
