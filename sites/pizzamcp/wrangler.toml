name = "atprotozoa-pizzamcp"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# A stateless MCP server (streamable HTTP, JSON-RPC at /mcp) for a pretend pizza
# chain, plus a static page explaining how to plug it into a client. Nothing is
# stored: an "order" is a deterministic id and the tracker is computed from the
# order's own timestamp. No real ordering, no payment data.

routes = [
  { pattern = "pizzamcp.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
