name = "atprotozoa-grudge-garden"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Planting and the garden itself are entirely client-side (localStorage, see
# public/index.html). The one server surface: /h/<code> is a shareable hex
# bouquet link (the bouquet's weeds + grievances base64url-encoded into the
# path), and a Worker renders per-bouquet og:title/og:description/og:url
# server-side before falling through to ASSETS — same fix as
# sites/gratitude-garden's /b/<code>, for the same reason: a plain static page
# can't vary its OG tags per bouquet, so every shared link would unfurl as one
# generic card forever.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [{ pattern = "grudge-garden.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /h/<code> is dynamic, so the Worker must run BEFORE the
# static-asset router, same as sites/gratitude-garden and sites/didscope.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
