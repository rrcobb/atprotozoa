name = "atprotozoa-claimstamp"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser, reading only the public
# (unauthenticated) Bluesky AppView. Paste a post URL, watch a huge red stamp
# slam down and mark it CLAIM, then two seconds later it shatters and burns.
# Nothing on Bluesky is ever touched — it's all local theater.

routes = [
  { pattern = "claimstamp.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
