name = "atprotozoa-gongguo"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Ledger of Merit and Demerit (功過格, gongguoge) for Bluesky accounts. The
# whole score runs client-side (public/index.html): resolve a handle, read
# public profile/feed stats through a few playful heuristics for "observed"
# merit/demerit, then let the visitor tick a confession checklist modeled on
# Yunqi Zhuhong's 1604 Buddhist ledger 自知錄 (Record for Self-Knowledge) for
# the rest. The one server surface is /s/<handle> (src/index.ts, copied from
# didscope's pattern), which renders a per-handle OG card server-side so a
# shared link gets its own unfurl instead of one generic cached card.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [{ pattern = "gongguo.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /s/<handle> is dynamic (personalized OG tags per share),
# so the Worker must run before the static-asset router.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
