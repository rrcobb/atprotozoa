name = "atprotozoa-claimsky"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Everything runs client-side (see public/index.html): a handle string gets
# hashed into a seed, the seed picks an escalating sequence of "induction"
# lines from fixed pools, and the reveal ends in a fake claim certificate.
# No AppView calls at all — unlike sites/posterspsychosis, this one doesn't
# care whether the handle is real or what its owner actually posts; that's
# the joke. The one server surface is /s/<handle> (src/index.ts), a real
# per-person URL with personalized og:title/description baked in server-side
# so a shared claim unfurls as that person's card instead of one generic
# cached embed for everyone. No secrets, no auth, no network fetch server-side
# either — the Worker runs the exact same deterministic hash as the client.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes
# (same gotcha called out in buildthis/logs/wrangler.toml).
routes = [{ pattern = "claimsky.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /s/<handle> is dynamic (personalized OG tags per share), so
# the Worker must run BEFORE the static-asset router, same as sites/logs.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
