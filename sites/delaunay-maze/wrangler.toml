name = "atprotozoa-delaunay-maze"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A Delaunay triangulation of
# scattered nodes with red/blue/green edges; a weighted die (red on 4 faces, blue
# on 3, green on 2) decides which colored edges you may cross. Get from the start
# node to the end node — a probability maze. Built after @catblanketflower.yuwakisa.com
# asked @buildthis for "a Delaunay graph with colored edges and a weighted dice."
# No secrets, no server.
main = "src/index.ts"

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# delaunay-maze.bisks.net is being retired to free a slot against the zone's
# custom-domain cap (see notes/20-deploy.md). Migrated to bisks.net/delaunay-maze
# instead. See notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "bisks.net/delaunay-maze", zone_name = "bisks.net" },
  { pattern = "bisks.net/delaunay-maze/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
