name = "atprotozoa-roomgrow"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# The one server job: Room World sends no CORS headers, so a browser cannot read
# its room list. /grid fetches that list and hands it back, which lets the page
# pick a free cell for its Build button and confirm that each save landed.
# Saves themselves still go straight from the visitor's browser to Room World,
# because its anonymous rate limits and room ownership count the sender's address.
#
# routes MUST stay above [assets] (a key after a table header joins that table).
routes = [{ pattern = "roomgrow.bisks.net/*", zone_name = "bisks.net" }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/grid"]
