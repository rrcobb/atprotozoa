name = "atprotozoa-coliseum"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [{ pattern = "coliseum.bisks.net/*", zone_name = "bisks.net" }]

# The whole viewer runs client-side (public/index.html + public/lib/) against
# the public AppView — no auth, no server compute. The one server job is
# /s/<encoded-thread> (src/index.ts): a distinct URL per brawl with the
# matchup baked into og:title/og:description server-side, so link-unfurl
# caches don't collapse every shared coliseum into one generic card (same
# fix as sites/didscope). run_worker_first is needed so that dynamic route
# runs before the static-asset router.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
