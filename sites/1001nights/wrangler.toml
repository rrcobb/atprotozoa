# @antiali.as asked the bot to "celebrate being @'d 1001 times" — this is
# that celebration: a Scheherazade riff where every ask the bot has ever
# gotten is one of the 1,001 nights. 417 of them have real tales (pulled
# from receipts' own archive, sites/receipts/public/data/asks.json, snapshot
# copied in at build time); the rest are framed as unwritten, waiting on
# whoever @'s the bot next.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
# 2026-08-15: redeploy trigger, never actually shipped — caught in the
# 1001nights pnpm-lockfile CI outage, see notes/history/2026-08-pnpm-lockfile-outage.md.
name = "atprotozoa-1001nights"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [
  { pattern = "1001nights.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
