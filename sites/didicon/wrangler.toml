name = "atprotozoa-didicon"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Resolves a Bluesky handle
# to its DID (com.atproto.identity.resolveHandle, public AppView, anonymous)
# and hashes the DID into a palette plus a few angled strokes. No writes, no
# accounts, no server logic.
assets = { directory = "./public" }

routes = [{ pattern = "didicon.bisks.net/*", zone_name = "bisks.net" }]
