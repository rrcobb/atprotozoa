name = "atprotozoa-mootmon"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Reads Bluesky's public
# AppView (resolveHandle / getFollows / getFollowers / getProfiles, all
# anonymous, CORS *) to build a handle's SimCluster (self + moots), same
# cluster.js copied from sites/simcluster-gacha unmodified. Instead of gacha
# pulls, each moot becomes a capturable creature — species/type/rarity
# derived from real profile stats — you catch them into a party and battle
# another handle's SimCluster, trainer-style. State (party, pokedex, wins)
# is client-side localStorage, scoped per trainer DID.

routes = [
  { pattern = "mootmon.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
