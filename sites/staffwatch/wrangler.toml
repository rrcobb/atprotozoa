name = "atprotozoa-staffwatch"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A browser-side Jetstream
# subscription filtered to a roster of DIDs; the liked posts are looked up on
# the public AppView to see whether they carry adult-content labels.
assets = { directory = "./public" }

routes = [{ pattern = "staffwatch.bisks.net/*", zone_name = "bisks.net" }]
