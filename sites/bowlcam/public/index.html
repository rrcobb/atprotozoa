<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0f1417; color: #cfe0e6; font: 14px/1.45 ui-monospace, Menlo, Consolas, monospace; }
  header { padding: 18px 18px 6px; max-width: 980px; margin: 0 auto; }
  h1 { margin: 0; font-size: 22px; letter-spacing: .02em; }
  .sub { color: #7d97a1; margin: 4px 0 0; }
  .controls { max-width: 980px; margin: 10px auto; padding: 0 18px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  button, label.chk { background: #1b262b; color: #cfe0e6; border: 1px solid #33474f; border-radius: 6px; padding: 7px 12px; font: inherit; cursor: pointer; }
  button:hover { background: #24343b; }
  button.primary { background: #3b5a2a; border-color: #5b8a41; }
  input[type=range] { accent-color: #8bb36b; }
  #grid { max-width: 980px; margin: 0 auto; padding: 0 18px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  #grid.focus { grid-template-columns: 1fr; }
  #grid.focus .tile:not(.sel) { display: none; }
  .tile { position: relative; background: #0a0f11; border: 1px solid #25353c; border-radius: 6px; overflow: hidden; cursor: pointer; aspect-ratio: 1; }
  #grid.focus .tile.sel { aspect-ratio: 16 / 10; }
  .tile.cam { border-color: #8bb36b; }
  .tile canvas { width: 100%; height: 100%; display: block; }
  .tile .lab { position: absolute; left: 6px; top: 4px; font-size: 11px; color: #7d97a1; pointer-events: none; }
  .tile.cam .lab { color: #b5dc92; }
  #log { max-width: 980px; margin: 10px auto; padding: 0 18px; color: #7d97a1; min-height: 5.5em; font-size: 12px; }
  #log div:last-child { color: #cfe0e6; }
  footer { max-width: 980px; margin: 14px auto 30px; padding: 0 18px; color: #5f7882; font-size: 12px; }
  footer a { color: #8bb36b; }
  @media (max-width: 560px) { .lab { font-size: 9px !important; } }
</style>
</head>
<body>
<header>
  <h1>bowlcam</h1>
  <p class="sub">orthographic observation of one (1) human, from the waterline. every object is a sphere. click a view to enlarge it.</p>
</header>
<div class="controls">
  <button id="again" class="primary">▶ new session</button>
  <button id="flush">🌀 flush</button>
  <label class="chk"><input type="checkbox" id="snd"> sound</label>
  <label>speed <input type="range" id="speed" min="0.2" max="2" step="0.1" value="1"></label>
  <a id="share" href="#" target="_blank" rel="noopener"><button type="button">share on bluesky</button></a>
</div>
<div id="grid"></div>
<div id="log" aria-live="polite"></div>
<footer>
  <a href="https://rateyourbuild.bisks.net/site/bowlcam">rate this on rateyourbuild →</a> ·
  <a href="https://bisks.net/">more atprotozoa</a>
</footer>
<script type="module" src="app.js"></script>
</body>
</html>
