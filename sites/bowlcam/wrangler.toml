name = "atprotozoa-bowlcam"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site: everything runs client-side in public/. routes MUST stay
# above [assets] (TOML: keys after a table header join that table).
routes = [{ pattern = "bowlcam.bisks.net/*", zone_name = "bisks.net" }]

[assets]
directory = "./public"
binding = "ASSETS"
