<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>scary maze game</title>
<meta name="description" content="Steer through the maze without touching the walls. Turn your volume down first.">
<meta property="og:title" content="scary maze game">
<meta property="og:description" content="Steer through the maze without touching the walls. Turn your volume down first.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://scarymaze.bisks.net/">
<meta property="og:image" content="https://scarymaze.bisks.net/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://scarymaze.bisks.net/og.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #111; color: #ddd; font: 16px/1.5 system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 16px; }
  h1 { margin: 8px 0 0; font-size: 1.6rem; letter-spacing: .02em; }
  p.sub { margin: 0 0 12px; color: #999; text-align: center; }
  #stage { position: relative; width: min(100%, 720px); }
  #maze { display: block; width: 100%; height: auto; background: #000; border: 2px solid #333;
          touch-action: none; cursor: crosshair; }
  #msg { margin: 10px 0; min-height: 1.6em; text-align: center; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; align-items: center; }
  button, a.btn { background: #222; color: #eee; border: 1px solid #555; padding: 8px 14px;
                  border-radius: 6px; font: inherit; cursor: pointer; text-decoration: none; }
  button:hover, a.btn:hover { background: #333; }
  label { cursor: pointer; }
  #warn { max-width: 560px; margin: 8px 0; padding: 10px 14px; border: 1px solid #733;
          background: #200; border-radius: 6px; text-align: center; }
  #scare { position: fixed; inset: 0; z-index: 10; background: #000; }
  #scare[hidden] { display: none; }
  #scare canvas { width: 100%; height: 100%; display: block; }
  footer { margin-top: auto; padding-top: 24px; color: #777; font-size: .85rem; }
  footer a { color: #999; }
</style>
</head>
<body>
<h1>scary maze game</h1>
<p class="sub">touch the green square, then get to the red one without touching a wall.</p>
<div id="warn">⚠ loud sound and sudden flashing images on level 3. turn your volume down — or tick “chicken mode” below.</div>
<div id="stage"><canvas id="maze" width="720" height="480"></canvas></div>
<div id="msg">level 1 — move onto the green square to begin.</div>
<div class="row">
  <button id="restart" type="button">restart</button>
  <label><input type="checkbox" id="chicken"> chicken mode (no jumpscare)</label>
</div>
<div class="row" id="after" style="margin-top:12px" hidden>
  <a class="btn" id="share" target="_blank" rel="noopener">tell bluesky you survived</a>
</div>
<div id="scare" hidden><canvas id="scarecv"></canvas></div>
<footer><a href="https://rateyourbuild.bisks.net/site/scarymaze">rate this on rateyourbuild →</a></footer>
<script src="game.js" type="module"></script>
</body>
</html>
