name = "atprotozoa-scarymaze"
compatibility_date = "2025-01-01"

# Pure static site: a canvas maze game with a jumpscare. Everything runs in the
# browser; the Worker only forwards to the static assets.
main = "src/index.ts"

routes = [
  { pattern = "scarymaze.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
