name = "atprotozoa-norvidpot"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# norvidpot (bisks.net/norvidpot): @norvid-studies.bsky.social's 100
# most-liked posts (reposts and quotes excluded), rewritten as somber
# Steinbeck-and-Dostoevsky pastiche prose — the "serious account" mirror
# of sites/impostorbel, which norvid commissioned to make abel's jokes
# "tractable". abel asked in return: what would norvid look like played
# completely straight? Every sixth entry breaks tone to plug a fictional
# $BRKTHRU token drop, per the request. The 100 posts and their rewrites
# are baked into public/data.json at build time (fetched once from the
# public AppView, rewritten by the build agent) — there's no live AI call
# at request time, so the Worker's only job is the usual path-mount prefix
# strip plus per-entry OG tags for sharing.
#
# Path route on the shared zone, not a dedicated custom domain — see
# notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "norvidpot.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/norvidpot", zone_name = "bisks.net" },
  { pattern = "bisks.net/norvidpot/*", zone_name = "bisks.net" },
]

# run_worker_first: /norvidpot/entry/<rank> gets personalized OG tags (that
# one entry's somber rewrite) stamped onto the shell before it's served, so
# a shared link unfurls with the actual bit, not a generic card.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true
