name = "atprotozoa-cymatics"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# A daily-slot pass, nobody asked for it in particular. Cymatics is the real
# physical phenomenon this simulates: a plate vibrating at one of its
# resonant modes has "loud" antinode regions where it moves a lot and "quiet"
# nodal lines where it barely moves at all — sand scattered on the plate
# bounces off the loud parts and comes to rest on the quiet ones, tracing the
# mode's shape. This runs that as a live particle sim in a canvas: thousands
# of grains doing an amplitude-biased random walk toward the nearest nodal
# line of a chosen (n, m) mode pair on a square plate.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [
  { pattern = "cymatics.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
