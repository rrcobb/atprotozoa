name = "atprotozoa-biskywang"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser, reading only the public
# (unauthenticated) Bluesky AppView when a post URL is pasted. Paste a link or
# just paste text; a secret, deterministic algorithm decides whether it's
# BISKYWANG. Nothing on Bluesky is ever touched.

routes = [
  { pattern = "biskywang.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
