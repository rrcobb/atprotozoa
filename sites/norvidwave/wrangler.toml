name = "atprotozoa-norvidwave"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A SoundCloud-style page for a
# generated EP about @norvid-studies: five tracks synthesized live with Web Audio
# (no audio files), with speech-synth vocals, each with its own play button and a
# scrubbable waveform. No secrets, no server surface.
main = "src/index.ts"

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# norvidwave.bisks.net is being retired to free a slot against the zone's
# custom-domain cap (see notes/20-deploy.md). Migrated to bisks.net/norvidwave
# instead. See notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "bisks.net/norvidwave", zone_name = "bisks.net" },
  { pattern = "bisks.net/norvidwave/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
