name = "atprotozoa-doublefeature"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Everything runs client-side (public/index.html) except the share unfurl.
# A plain static site would serve the *same* index.html — same og:title/
# og:image — no matter which two videos are encoded in the URL, so every
# remix would collapse into one generic link-preview card. Fix, same shape
# as sites/didscope: /s/<encoded> is a real, distinct URL per remix. The
# Worker decodes the state, builds a title out of both clips' labels, points
# og:image at the left clip's own YouTube thumbnail (no image generation
# needed — YouTube already serves one per video), and falls through to
# ASSETS for everything else.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes
# (same gotcha called out in buildthis/logs/wrangler.toml).
routes = [{ pattern = "doublefeature.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /s/<encoded> is dynamic (personalized OG tags per remix),
# so the Worker must run before the static-asset router, same as sites/logs.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
