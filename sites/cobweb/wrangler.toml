name = "atprotozoa-cobweb"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# cobweb (bisks.net/cobweb): a browser extension with two halves. The popup
# is skyclone's un-live counterpart — a hardcoded DATA literal in popup.js,
# no fetch, no AppView. content.js is the real half: on the actual bsky.app,
# it turns Follow buttons into real Block buttons by driving the site's own
# overflow-menu → Block → confirm flow. The download links on the landing
# page are data: URIs (see build-extension-zips.mjs) — the zip bytes are a
# literal in the page, not a separately hosted file. This Worker is purely
# static: it strips the /cobweb mount prefix and serves public/ (landing page
# + the browsable/downloadable extension source under public/extension/).
#
# Path route on the shared zone, not a dedicated custom domain — the zone hit
# a Cloudflare custom-domain cap a while back, so new sites mount as a path
# on bisks.net instead of requesting a new hostname. See
# notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "cobweb.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/cobweb", zone_name = "bisks.net" },
  { pattern = "bisks.net/cobweb/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true
