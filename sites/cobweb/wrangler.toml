name = "atprotozoa-cobweb"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# cobweb (bisks.net/cobweb): skyclone's un-live counterpart — a downloadable
# browser-extension popup whose whole timeline is a hardcoded DATA literal in
# popup.js. No fetch, no host_permissions, no AppView. This Worker is purely
# static: it strips the /cobweb mount prefix and serves public/ (landing page
# + the browsable/downloadable extension source under public/extension/).
#
# Path route on the shared zone, not a dedicated custom domain — the zone hit
# a Cloudflare custom-domain cap a while back, so new sites mount as a path
# on bisks.net instead of requesting a new hostname. See
# notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "bisks.net/cobweb", zone_name = "bisks.net" },
  { pattern = "bisks.net/cobweb/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true
