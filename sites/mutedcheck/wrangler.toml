name = "atprotozoa-mutedcheck"
compatibility_date = "2025-01-01"

# @jessehattabaugh.com asked: sign in with Bluesky, load your muted words,
# then give it a post URL and it tells you which of your muted words show up
# in that post.
#
# Pure static SPA, no server-side state:
#   - Sign-in reads app.bsky.actor.getPreferences for the signed-in account —
#     muted words live in a private #mutedWordsPref record that only the PDS
#     holds (explicitly not synced to the AppView, per the lexicon docs), so
#     this is a direct call to the user's own PDS, not an AppView-proxied
#     `rpc:...?aud=...` grant like sibling sites use for getMutes/getTimeline.
#     Read-only — see client-metadata.json's single rpc: grant, no repo:/blob:
#     writes at all.
#   - The post itself is fetched unauthenticated from the public AppView
#     (app.bsky.feed.getPostThread, depth=0) — post text is public data, no
#     session needed to read it.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
assets = { directory = "./public" }

routes = [{ pattern = "mutedcheck.bisks.net/*", zone_name = "bisks.net" }]
