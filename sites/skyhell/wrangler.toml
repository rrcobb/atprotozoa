name = "atprotozoa-skyhell"
compatibility_date = "2025-01-01"

# Pure static site — a nostalgia toy that replicates the *experience* of a
# late-90s AOL warez/toolkit app (AOHell and its ilk), reskinned for Bluesky.
# Windows-95 chrome, a dial-up boot sequence, and a sidebar of "tools" —
# Skeet Punter, Skeet Bomber, Chat Roomz, Serial Keygen — that are all
# harmless cosmetic satire (no real target, no real send, no real crack).
# The one live feature is Profile Snoop, a read-only public getProfile
# lookup styled like an old AIM info window. @ver.ooo asked for the AOHell
# vibe "but for bluesky."
assets = { directory = "./public" }

routes = [{ pattern = "skyhell.bisks.net", custom_domain = true }]
