name = "atprotozoa-technically"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Built after a tag described "@buildthis.bisks.net website that's a website
# on the web that can be accessed via an internet capable computer with an
# Internet connection via the secure hyper text transfer protocol" — the joke
# being maximal, tautological over-specification of something simple. This
# site turns that joke into a machine: type anything, get back the most
# exhaustively redundant, technically-accurate definition possible.

routes = [
  { pattern = "technically.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
