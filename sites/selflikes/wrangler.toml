name = "atprotozoa-selflikes"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @octopodeeznuts.bsky.social, replying to a thread about accidentally liking
# your own post: is it feasible to list an account's self-liked posts? Enter
# a handle, we download their whole repo in one shot (com.atproto.sync.getRepo,
# same trick as sites/backscroll/sites/activitygrid) and cross-reference their
# app.bsky.feed.like records against their own app.bsky.feed.post records —
# both collections come out of the same CAR, so no extra fetches are needed
# to find out. No OAuth: it's all public reads of the account's own repo.

routes = [
  { pattern = "selflikes.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
