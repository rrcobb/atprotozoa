name = "atprotozoa-grindset"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @fromthewestmeadow.com asked buildthis to build a site it thinks they'd
# HATE, based on everything they've asked for so far. Their whole back
# catalog (clusterpedia, didrank, ngmi, portfolio, intrigue...) is real
# backends, live data pulled off actual repos/firehose, and dark self-aware
# humor — zero grift, zero filler. So this is the exact inverse: a hustle-
# course landing page with a countdown that never reaches zero, a live
# "visitor count" that's just Math.random(), a chat bot that never answers
# the question asked, a newsletter popup that respawns every reload, and a
# quiz that always scores 100/100 no matter what you click. Pure client-side
# theater, nothing real underneath — which is the point.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
routes = [
  { pattern = "grindset.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = false
