name = "atprotozoa-claudoku"
compatibility_date = "2025-01-01"

# Pure static site — the whole game runs in the browser. claudoku is a killer
# sudoku (cage-sum sudoku) with a cute sparkly Claude-orange mascot who
# cheers you on. Grid generation, cage partitioning and the solver all run
# client-side in public/engine.js. Daily puzzle seeded by UTC date, plus a
# "new puzzle" button for endless play. No secrets, no server, no build step.
main = "src/index.ts"

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# claudoku.bisks.net is being retired to free a slot against the zone's
# custom-domain cap (see notes/20-deploy.md). Migrated to bisks.net/games/claudoku
# as part of the new games/ cluster. See notes/40-new-site-playbook.md
# ("Why paths, not subdomains").
routes = [
  { pattern = "claudoku.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/games/claudoku", zone_name = "bisks.net" },
  { pattern = "bisks.net/games/claudoku/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
