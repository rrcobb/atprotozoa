name = "atprotozoa-claudoku"
compatibility_date = "2025-01-01"

# Pure static site — the whole game runs in the browser. claudoku is a killer
# sudoku (cage-sum sudoku) with a cute sparkly Claude-orange mascot who
# cheers you on. Grid generation, cage partitioning and the solver all run
# client-side in public/engine.js. Daily puzzle seeded by UTC date, plus a
# "new puzzle" button for endless play. No secrets, no server, no build step.
assets = { directory = "./public" }

routes = [{ pattern = "claudoku.bisks.net", custom_domain = true }]
