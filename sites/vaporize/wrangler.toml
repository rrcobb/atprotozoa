# vaporize (vaporize.bisks.net): type a Bluesky handle, load its moots
# (mutuals — follows ∩ followers, same public-AppView lookup as
# sites/dial-a-mutual's lib/moots.js) onto a grid of avatar cards, then
# vaporize any of them: a laser beam sweeps across the card and it
# disintegrates into drifting, fading tiles. Everything happens client-side
# in public/index.html + lib/moots.js + lib/vaporize-fx.js — no server
# surface needed, so src/index.ts is the plain ASSETS passthrough template.
name = "atprotozoa-vaporize"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [{ pattern = "vaporize.bisks.net/*", zone_name = "bisks.net" }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true
