name = "atprotozoa-howitstarted"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Enter a Bluesky handle
# (or pass ?handle=): it reads that account's public feed anonymously from the
# AppView (getAuthorFeed, CORS *), finds their most-liked post ("how it
# started"), and on click that card visibly cracks and shatters away to reveal
# their most recent post ("how it's going"). No secrets, no server surface.
assets = { directory = "./public" }

routes = [{ pattern = "howitstarted.bisks.net/*", zone_name = "bisks.net" }]
