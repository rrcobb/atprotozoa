name = "atprotozoa-ngmi"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @fromthewestmeadow.com asked for a site that takes a Bluesky handle,
# downloads their whole repo CAR, and reads through their posts to call
# whether they're NGMI ("never gonna make it") — with details and posts
# cited. The read itself runs client-side (public/lib/car.js downloads and
# MST-walks the repo, public/lib/ngmi-analysis.js scores it); the only thing
# that needs a server is /s/<handle>, a personalized OG share URL. See
# src/index.ts.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [{ pattern = "ngmi.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /s/<handle> is dynamic, so the Worker must run before the
# static-asset router.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
