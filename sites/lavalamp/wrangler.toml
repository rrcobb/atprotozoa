name = "atprotozoa-lavalamp"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Reads Bluesky's public
# AppView (getAuthorFeed, anonymous, CORS *) for a handle's recent original
# posts, then floats a rotating dozen of them as lava-lamp blobs: more likes
# floats higher, fewer likes sinks low. Blobs swap out for fresh picks from
# the pool every few seconds.
assets = { directory = "./public" }

routes = [{ pattern = "lavalamp.bisks.net/*", zone_name = "bisks.net" }]
