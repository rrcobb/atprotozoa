name = "atprotozoa-mootmosaic"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Everything runs in the browser (public/app.js); the Worker only forwards to
# the static assets.
routes = [{ pattern = "mootmosaic.bisks.net/*", zone_name = "bisks.net" }]

[assets]
directory = "./public"
binding = "ASSETS"
