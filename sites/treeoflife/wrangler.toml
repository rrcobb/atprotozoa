name = "atprotozoa-treeoflife"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. It reads Bluesky's public
# AppView (resolveHandle / getFollows / getFollowers, all anonymous, CORS *)
# to build a handle's network, then hashes every DID in it to a fixed spot in
# a hardcoded taxonomy (see public/lib/life.js) and renders the whole thing as
# a real kingdom→phylum→class→order→family→genus→species tree.

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# treeoflife.bisks.net is being retired to free a slot against the zone's
# custom-domain cap (see notes/20-deploy.md). Migrated to bisks.net/treeoflife
# instead. See notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "bisks.net/treeoflife", zone_name = "bisks.net" },
  { pattern = "bisks.net/treeoflife/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
