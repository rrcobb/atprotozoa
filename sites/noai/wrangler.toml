# sites/noai/wrangler.toml
name = "atprotozoa-noai"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Connects directly to
# Jetstream (wss://jetstream2.us-east.bsky.network/subscribe) and filters
# app.bsky.feed.post commits client-side for posts that contain no "a"/"A"
# or "i"/"I" anywhere in the text. No server, no storage.

routes = [
  { pattern = "noai.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
