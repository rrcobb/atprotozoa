# Daily-slot build (2026-09-05, no specific requester) — a broad, playful
# pass through the repo turned into one small site: everything sites/*/
# site.json describes, drawn as a tiny orbiting solar system around
# bisks.net. Six orbits (toy/game/tool/joke/explainer/art), inner rings spin
# faster than outer ones, same as real planets. Click a world to visit it.
#
# Data comes from sites/orrery/sync-fleet.mjs, same source apex's gallery /
# receipts / rateyourbuild already read from sites/*/site.json — see that
# script's header for how to refresh it. This is a snapshot, not a live
# view; it has no standing "keep current" order the way receipts and
# rateyourbuild do.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
name = "atprotozoa-orrery"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [
  { pattern = "orrery.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
