name = "atprotozoa-lightrail"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Live arrivals come from the same JSON endpoint MTA Maryland's own "Real Time
# Information" page (mta.maryland.gov/realtime) calls: /schedule/real-time-stops/<stop_id>,<route_id>.
# It has no CORS headers, so the Worker is a thin pass-through. The official
# GTFS-RT feeds for light rail sit behind a Swiftly API key, so this is the open path.
# No secrets, no storage; responses are held ~15s in the edge Cache API.
#
# routes MUST stay above [assets] (TOML: keys after a table header join that table).
routes = [{ pattern = "lightrail.bisks.net/*", zone_name = "bisks.net" }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
