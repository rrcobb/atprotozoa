name = "atprotozoa-likeclusters"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser. Type a Bluesky handle
# and likeclusters reads that account's own recent posts, pulls the public
# likers of each one, extracts a rough topic (keyword/hashtag) signature per
# post, and groups the likers by which topic signature they show up on most —
# so you can see who's a fan of one recurring thing you post about versus who
# likes everything. Reads the public AppView only, all anonymous, no login.
# See public/lib/*.js.

routes = [
  { pattern = "likeclusters.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
