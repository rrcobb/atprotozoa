name = "atprotozoa-knowyourmuseum"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Brand-new site, own subdomain from day one — no bisks.net/knowyourmuseum
# path route to carry forward (see notes/40-new-site-playbook.md).
routes = [
  { pattern = "knowyourmuseum.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# 2026-09-08: the "deploy (chunk 0)" job for this site's original push
# (b7af1ea4) failed while sibling dirs in the same push deployed fine — the
# route/Worker never got its first deploy, so the hostname 404s like it was
# never claimed at all. Bundling and check pass locally; this touch forces
# the site back into the next push's diff for a fresh deploy attempt. No
# functional change. See notes/20-deploy.md.
