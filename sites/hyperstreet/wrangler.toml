name = "atprotozoa-hyperstreet"
compatibility_date = "2025-01-01"

# Pure static site. The world is a pure function of the atproto Jetstream
# firehose, computed in the visitor's browser (or in `node cli.mjs`); there is
# no server state.
assets = { directory = "./public" }

routes = [{ pattern = "hyperstreet.bisks.net/*", zone_name = "bisks.net" }]
