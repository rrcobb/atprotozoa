name = "atprotozoa-guavacode"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @shimmermathlabs.com and @riziles.bsky.social wondered how many times
# anything is "encoded" in the guava genome. The browser streams the genome
# from NCBI (efetch is CORS-open) and counts in-page, so the Worker is a plain
# ASSETS passthrough: no compute, no storage.
#
# Brand-new site — served at the root of its own hostname, no path prefix.
routes = [
  { pattern = "guavacode.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = false
