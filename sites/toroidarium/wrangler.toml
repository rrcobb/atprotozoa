name = "atprotozoa-toroidarium"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. It reads Bluesky's public
# AppView (resolveHandle / getFollows / getFollowers / getProfile, all
# anonymous, CORS *) to work out a handle's "moots" (mutuals), then swims them
# as fish in a toroidal aquarium: a canvas with wraparound edges (exit right,
# re-enter left; exit bottom, re-enter top), each fish an avatar-sprite sized
# by how early they appear in the mutuals list. lib/moots.js is copied from
# sites/moot-bingo/public/lib/moots.js, itself copied from
# neighborhood/hood.js (copy, don't abstract).
assets = { directory = "./public" }

routes = [{ pattern = "toroidarium.bisks.net", custom_domain = true }]
