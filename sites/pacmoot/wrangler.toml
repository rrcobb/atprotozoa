name = "atprotozoa-pacmoot"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Type a Bluesky handle
# and it reads the public AppView (getFollows / getFollowers / a
# getProfiles batch, all anonymous, CORS *) to pull that handle's moots
# (mutuals, widened to follows if too small — moots-graph logic copied
# from mootdrone/lib/cluster.js, itself from clustercrawl, itself from
# simcluster: copy, don't abstract). Then it's Pac-Man: your own avatar,
# clipped into a chomping wedge, chases your moots' avatars around a maze
# while they flee toward whichever open tile is farthest from you. Chomp
# as many as you can before the clock runs out. Canvas + vanilla JS, no
# server, no build step.
main = "src/index.ts"

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# pacmoot.bisks.net is being retired to free a slot against the zone's
# custom-domain cap (see notes/20-deploy.md). Migrated to bisks.net/games/pacmoot
# as part of the new games/ cluster. See notes/40-new-site-playbook.md
# ("Why paths, not subdomains").
routes = [
  { pattern = "pacmoot.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/games/pacmoot", zone_name = "bisks.net" },
  { pattern = "bisks.net/games/pacmoot/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
