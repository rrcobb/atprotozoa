name = "atprotozoa-timelane"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Boards > swimlanes >
# bars/events > segments/markers, plus tasks, a markdown inbox, and an
# outline view. All data lives in the visitor's own localStorage; nothing is
# sent to or stored by this Worker. Per-lane sharing works by putting the
# lane's data in the share link's URL fragment (never sent in an HTTP
# request, never seen by any server) rather than a database. Built for
# @jessehattabaugh.com's brief, off the back of @hmans.dev asking (re:
# everie.app) for something local-first with a clear GDPR posture.
assets = { directory = "./public" }

routes = [{ pattern = "timelane.bisks.net/*", zone_name = "bisks.net" }]
