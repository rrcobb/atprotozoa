name = "atprotozoa-chartjunk"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [
  { pattern = "chartjunk.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

