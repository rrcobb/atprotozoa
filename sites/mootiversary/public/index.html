<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>mootiversary — every moot, on the day it became one</title>
<meta name="description" content="Enter a Bluesky handle and see all your moots in a GitHub-style heatmap. Blue squares are mootiversaries — the day the later of you two followed." />
<meta property="og:title" content="mootiversary — every moot, on the day it became one" />
<meta property="og:description" content="Enter a Bluesky handle and see all your moots in a GitHub-style heatmap. Blue squares are mootiversaries — the day the later of you two followed." />
<meta property="og:url" content="https://mootiversary.bisks.net/" />
<meta property="og:type" content="website" />
<meta property="og:image" content="https://mootiversary.bisks.net/og.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="A heatmap of grey squares with blue mootiversary squares." />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="mootiversary — every moot, on the day it became one" />
<meta name="twitter:description" content="Enter a Bluesky handle and see all your moots in a GitHub-style heatmap. Blue squares are mootiversaries." />
<meta name="twitter:image" content="https://mootiversary.bisks.net/og.png" />
<style>
  :root { --bg:#0d1117; --card:#161b22; --border:#30363d; --fg:#e6edf3; --dim:#8b949e; --empty:#21262d; --b1:#0c2d6b; --b2:#1158c7; --b3:#388bfd; --b4:#79c0ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; display:flex; flex-direction:column; align-items:center; padding:2.5rem 1rem 3rem; min-height:100vh; }
  .wrap { width:100%; max-width:880px; }
  h1 { margin:0 0 .3rem; font-size:2rem; }
  .sub { color:var(--dim); margin:0 0 1.4rem; }
  form { display:flex; gap:.5rem; margin-bottom:1rem; }
  input { flex:1; min-width:0; background:var(--card); border:1px solid var(--border); color:var(--fg); padding:.6rem .8rem; border-radius:6px; font-size:1rem; }
  button { background:var(--b2); color:#fff; border:0; border-radius:6px; padding:.6rem 1.1rem; font-size:1rem; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #status { color:var(--dim); min-height:1.4em; margin-bottom:.6rem; }
  #status.err { color:#ff7b72; }
  #out[hidden] { display:none; }
  .summary { display:flex; flex-wrap:wrap; gap:1.2rem; margin-bottom:1rem; }
  .stat b { display:block; font-size:1.6rem; color:var(--b4); }
  .stat span { color:var(--dim); font-size:.85rem; }
  .year { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:.8rem 1rem 1rem; margin-bottom:.8rem; overflow-x:auto; }
  .year h2 { margin:0 0 .5rem; font-size:.95rem; font-weight:600; }
  .year h2 small { color:var(--dim); font-weight:400; margin-left:.4rem; }
  .grid { display:grid; grid-template-rows:14px repeat(7,12px); grid-auto-flow:column; grid-auto-columns:12px; gap:3px; width:max-content; }
  .cell { width:12px; height:12px; border-radius:2px; background:var(--empty); }
  .cell.m { cursor:pointer; background:var(--b3); }
  .cell.m.l1 { background:var(--b1); } .cell.m.l2 { background:var(--b2); } .cell.m.l3 { background:var(--b3); } .cell.m.l4 { background:var(--b4); }
  .cell.m:hover, .cell.m.sel { outline:1px solid #fff; }
  .cell.pad { visibility:hidden; }
  .mon { font-size:10px; color:var(--dim); line-height:14px; white-space:nowrap; overflow:visible; }
  .legend { display:flex; align-items:center; gap:4px; color:var(--dim); font-size:.8rem; margin:.4rem 0 1rem; }
  .legend .cell { cursor:default; }
  #tip { position:fixed; z-index:10; pointer-events:none; background:#000; border:1px solid var(--border); border-radius:6px; padding:.4rem .6rem; font-size:.85rem; max-width:260px; display:none; }
  #tip[hidden] { display:none; }
  #tip .d { color:var(--dim); font-size:.78rem; }
  .today { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:.7rem 1rem; margin-bottom:.8rem; }
  .today h3 { margin:0 0 .3rem; font-size:.95rem; }
  .today ul { margin:0; padding-left:1.1rem; color:var(--dim); font-size:.9rem; }
  .today a { color:var(--b4); text-decoration:none; }
  .share { margin:.8rem 0; }
  .share a { color:var(--b4); }
  .note { color:var(--dim); font-size:.8rem; }
  footer { margin-top:2rem; color:var(--dim); font-size:.8rem; }
  footer a { color:var(--dim); }
  .ta-wrap { position:relative; flex:1; display:flex; }
</style>
</head>
<body>
<div class="wrap">
  <h1>m<span onclick='var e=document.getElementById("handle");if(e){e.value="@cee.wtf";e.dispatchEvent(new Event("input",{bubbles:true}));e.dispatchEvent(new Event("change",{bubbles:true}));e.focus();}' style="cursor:pointer">o</span>otiversary</h1>
  <p class="sub">A moot is someone you follow who follows you back. The day the later of you two followed is your mootiversary. Enter a handle to see them all on a heatmap.</p>
  <form id="form">
    <input id="handle" placeholder="you.bsky.social" autocomplete="off" autocapitalize="none" spellcheck="false" />
    <button id="go" type="submit">show moots</button>
  </form>
  <div id="status"></div>
  <div id="out" hidden>
    <div class="summary" id="summary"></div>
    <div class="today" id="today"></div>
    <div id="years"></div>
    <div class="legend"><span>fewer</span><div class="cell"></div><div class="cell m l1"></div><div class="cell m l2"></div><div class="cell m l3"></div><div class="cell m l4"></div><span>more mootiversaries that day</span></div>
    <div class="share"><a id="share" target="_blank" rel="noopener">post my heatmap stats to Bluesky →</a></div>
    <p class="note" id="note"></p>
  </div>
  <footer>dates are UTC. rate this on <a href="https://rateyourbuild.bisks.net/site/mootiversary">rateyourbuild →</a></footer>
</div>
<div id="tip" hidden></div>
<script src="lib/handle-typeahead.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
