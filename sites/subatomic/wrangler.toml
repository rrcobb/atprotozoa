name = "atprotozoa-subatomic"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @isaaccorbrey.com asked, tagging the bot in a reply thread with @bisks.net's
# go-ahead: "reddit but atproto." This is that — post links or text to a
# board (a freeform tag, like a subreddit), upvote/downvote, comment. Every
# post, vote, and comment is a real net.bisks.subatomic.* record the browser
# writes to the *author's own* PDS (see public/lib/oauth.js); the Worker only
# ever reads a record back off the claimed author's own repo to verify it
# before folding it into the shared, KV-backed feed everyone sees — same
# recipe as sites/hyperobject's PitStore / sites/thewell's WellStore /
# sites/clusterpedia's WikiStore.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [
  { pattern = "subatomic.bisks.net/*", zone_name = "bisks.net" },
]

# run_worker_first: /api/* (the shared KV-backed boards/posts/votes/comments)
# is dynamic, so the Worker must run before the static-asset router.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[kv_namespaces]]
binding = "SUB_STATE"
