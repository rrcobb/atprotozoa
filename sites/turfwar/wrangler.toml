name = "atprotozoa-turfwar"
compatibility_date = "2025-01-01"

# @kerry.bsky.social sent switchboard code SB-61NU: "an unhinged maps
# visualizer with loud, competitive, dark traits, dense (5/9)." Decoded
# subject was "maps" + "visualizer" — this is a live language turf war: every
# post.langs[0] seen on the Jetstream firehose is a faction fighting for
# territory on a dense grid map, in real time, forever. No server state, no
# DO, no KV — a Worker serving static assets, the browser does everything.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/turfwar path route and no prefix-stripping needed.
#
# Redeployed 2026-09-04: the 2026-08-30 build push failed CI's `check` job,
# which skips `deploy` repo-wide, and no later push happened to touch this
# dir again to retrigger it — so it sat live-linked on the gallery but
# 404ing for 5 days. `check` passes clean now. See notes/20-deploy.md.
routes = [
  { pattern = "turfwar.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
