name = "atprotozoa-didneighbors"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Type a Bluesky handle, resolve it to a did:plc, then go looking for whoever's
# DID sits right next to it alphabetically. did:plc identifiers are 24-char
# base32 hashes, not sequential IDs, so there's no API that returns "the DID
# right before/after this one" — there's no complete sorted index of every
# DID on the network available to a stateless Worker. Instead the client pulls
# a live random sample of real DIDs straight from the PLC directory's public
# export firehose (plc.directory/export, CORS *), sorts the sample plus the
# target DID, and reports the closest predecessor/successor it found —
# "dig deeper" pulls more sample windows and keeps the best match so far.
# Since did:plc is essentially a random hash, no exhaustive search would find
# a "meaningful" neighbor either — this is honest about being a sample, and
# that's the joke: your closest neighbor in the whole network is still a
# total stranger.
#
# Mounted as a path on the shared bisks.net zone (not a custom domain) — see
# notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "didneighbors.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/didneighbors", zone_name = "bisks.net" },
  { pattern = "bisks.net/didneighbors/*", zone_name = "bisks.net" },
]

# run_worker_first: /s/<handle> renders personalized OG tags server-side
# before falling through to ASSETS, same pattern as sites/didscope.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
