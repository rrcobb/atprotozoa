name = "atprotozoa-hairloom"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Everything runs client-side (see public/index.html) EXCEPT the OG/share
# unfurl, which has a small server surface: the Worker renders /s/<handle>
# (src/index.ts) with a per-handle og:title/og:description/og:url baked in
# server-side, then falls through to ASSETS for everything else. Same shape
# as sites/didscope's /s/<handle> route — copied, not shared.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [{ pattern = "hairloom.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /s/<handle> is dynamic (personalized OG tags per share),
# so the Worker must run BEFORE the static-asset router.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
