name = "atprotozoa-seinfeldify"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [{ pattern = "seinfeldify.bisks.net/*", zone_name = "bisks.net" }]

# Workers AI reads a sample of the account's posts and picks a Seinfeld
# character — no API key needed, it's a native binding billed to the
# account, same pattern as sites/thread-heirloom. The verdict itself is
# never stored server-side: /c/<code> decodes the whole card out of the
# URL, so a share link keeps rendering exactly as generated even if the
# account later deletes posts or goes private.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
