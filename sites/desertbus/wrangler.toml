name = "atprotozoa-desertbus"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — the whole game runs in the browser. desertbus is a
# Desert Bus homage compressed into a joke-length drive: the fuel gauge
# drains in exactly 30 real-time seconds and your speed is directly tied to
# the fuel left ("less fuel = less car velocity. exactly." — the brief this
# was built from), so the drive gets more agonizing as it goes instead of
# just longer. Once fuel drops below half, Grace starts messaging you about
# it — a new dialog every 5 seconds, none of them auto-dismiss, so they
# stack up and start eating the screen exactly like the brief asked.
# @norvid-studies.bsky.social asked for this one, quoting a gracekind.net /
# norvid-studies exchange in the thread ("We've detected that your vehicle's
# fuel level is low. Exactly." / "less fuel = less car velocity. exactly.").
# No secrets, no server, no build step beyond the checked-in og.png.

routes = [
  { pattern = "bisks.net/games/desertbus", zone_name = "bisks.net" },
  { pattern = "bisks.net/games/desertbus/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
