name = "atprotozoa-hotwater"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Everything still runs client-side (see public/index.html) EXCEPT the OG/share
# unfurl, which has a small server surface: the Worker renders /s/<handle>
# (src/index.ts) with per-handle og:title/og:description/og:url baked server-side,
# then falls through to ASSETS for everything else. Enter a Bluesky handle, it
# resolves the profile via the public AppView and issues a satirical "Certificate
# of Discovery" listing real, mundane facts about the account (follower count,
# post count, bio, account age) framed as groundbreaking research findings —
# built from @antiali.as's tag ("reinvent the wheel ... discover hot water ...
# but on atproto, be excellent") riffing on the pile of idioms for redundant/
# obvious effort. Lineage: copied from sites/didscope for its share-card +
# per-handle-unfurl plumbing.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes
# (same gotcha called out in buildthis/logs/wrangler.toml).
routes = [{ pattern = "hotwater.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /s/<handle> is dynamic (personalized OG tags per share), so
# the Worker must run BEFORE the static-asset router, same as sites/logs.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
