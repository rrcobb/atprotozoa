# Everything runs client-side (public/index.html + lib/*.js): resolve a
# handle's mutuals off the public AppView (lib/mutuals.js, copied and trimmed
# from clustercrawl's cluster.js), then for every mutual download their whole
# repo as one CAR (lib/car.js + lib/identity.js, copied from backscroll — see
# notes/40-new-site-playbook.md's cee.wtf bulk-read order) and scan it for
# their earliest reply to any other mutual. lib/race.js turns that into a
# did->did "who broke the ice first" map, which public/index.html renders as
# a grid. The only server surface is /summary/<handle>/<first>/<total>
# (src/index.ts): a distinct, shareable URL per result with personalized OG
# tags built straight from the path segments — no server-side recompute of
# the (expensive) repo scan, same trick dial-a-mutual uses for /call/.
name = "atprotozoa-mootrace"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [{ pattern = "mootrace.bisks.net/*", zone_name = "bisks.net" }]

# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes
# (same gotcha called out in buildthis/logs/wrangler.toml).
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
