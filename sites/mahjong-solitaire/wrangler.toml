name = "atprotozoa-mahjong-solitaire"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# mahjong-solitaire.bisks.net is being retired to free a slot against the zone's
# custom-domain cap (see notes/20-deploy.md). Migrated to bisks.net/mahjong-solitaire
# instead. See notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "bisks.net/mahjong-solitaire", zone_name = "bisks.net" },
  { pattern = "bisks.net/mahjong-solitaire/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
