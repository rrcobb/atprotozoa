name = "atprotozoa-revolver"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# A static, same-browser two-player toy. Round state is local to each browser;
# there is no room server, leaderboard, polling, WebSocket, or Durable Object.
routes = [
  { pattern = "revolver.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Round"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Leaderboard"]

[[migrations]]
tag = "v3"
deleted_classes = ["Round", "Leaderboard"]
