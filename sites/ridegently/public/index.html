<style>
  :root {
    --bg: #0b0c14;
    --bg2: #14162a;
    --fg: #f1f0ff;
    --dim: #8d8bab;
    --accent: #ffb703;
    --ride-color: #d9744f;
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: radial-gradient(80% 60% at 50% -10%, var(--bg2), var(--bg) 65%);
    color: var(--fg);
    overflow-x: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 28px 16px 20px;
  }

  header { text-align: center; margin-bottom: 6px; }
  h1 {
    font-size: clamp(28px, 6vw, 44px);
    margin: 0 0 6px;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #ffb703, #ff5fa2 60%, #8b5cf6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .tagline { color: var(--dim); font-size: 14px; margin: 0; max-width: 46ch; }

  main { width: 100%; max-width: 960px; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }

  /* ---------- select screen ---------- */
  #selectScreen { width: 100%; display: flex; flex-direction: column; align-items: center; }

  .stage {
    position: relative;
    width: 100%;
    height: 260px;
    perspective: 1100px;
    margin-top: 18px;
  }
  .track {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    cursor: grab;
    touch-action: pan-y;
  }
  .track.dragging { cursor: grabbing; }
  .track.dragging .pod { transition: none; }
  .pod {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 148px;
    height: 148px;
    margin: -74px 0 0 -74px;
    border-radius: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: linear-gradient(160deg, color-mix(in srgb, var(--c) 85%, white), color-mix(in srgb, var(--c) 55%, black));
    box-shadow: 0 14px 30px -10px color-mix(in srgb, var(--c) 60%, transparent), inset 0 0 0 2px color-mix(in srgb, var(--c) 40%, white 10%);
    cursor: pointer;
    transition: transform .5s cubic-bezier(.2,.8,.2,1), opacity .5s ease, box-shadow .3s ease;
    will-change: transform, opacity;
  }
  .pod .logo {
    width: 58px;
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(0,0,0,.6);
    filter: drop-shadow(0 1px 0 rgba(255,255,255,.25));
    perspective: 220px;
  }
  .pod .logo svg { width: 72%; height: 72%; display: block; }
  /* Daytona-style showcase spin: only the focused pod's logo turns in place */
  .pod.selected .logo svg { animation: podSpin 3.1s linear infinite; }
  @keyframes podSpin {
    from { transform: rotateY(0deg); }
    to   { transform: rotateY(360deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .pod.selected .logo svg { animation: none; }
  }
  .pod .name { font-size: 12px; font-weight: 700; color: rgba(0,0,0,.7); letter-spacing: .5px; }
  .pod.selected { box-shadow: 0 20px 44px -8px color-mix(in srgb, var(--c) 75%, transparent), 0 0 0 3px color-mix(in srgb, var(--c) 90%, white); }

  .arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.15);
    color: var(--fg);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    font-size: 22px;
    cursor: pointer;
    z-index: 50;
  }
  .arrow:hover { background: rgba(255,255,255,.14); }
  .arrow.left { left: 0; }
  .arrow.right { right: 0; }

  .marquee {
    margin-top: 22px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 2px;
    color: var(--ride-color);
    transition: color .3s ease;
  }
  .marquee .maker { color: var(--dim); font-weight: 500; font-size: 13px; letter-spacing: 1px; display: block; margin-top: 2px; }
  .blurb-line { color: var(--dim); font-size: 13px; margin: 6px 0 0; min-height: 1.4em; }

  #rideBtn {
    margin-top: 20px;
    padding: 12px 34px;
    font: inherit;
    font-weight: 800;
    letter-spacing: 1px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    color: #111;
    background: linear-gradient(90deg, #ffe37a, #ffb703);
    box-shadow: 0 10px 26px -8px rgba(255,183,3,.6);
  }
  #rideBtn:active { transform: translateY(1px); }

  .hint { color: var(--dim); font-size: 12px; margin-top: 10px; }

  /* ---------- ride screen ---------- */
  #rideScreen { width: 100%; display: flex; flex-direction: column; align-items: center; }
  #rideScreen[hidden], #selectScreen[hidden] { display: none; }

  .rink {
    width: 100%;
    max-width: 420px;
    height: 300px;
    position: relative;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .ground {
    position: absolute;
    bottom: 18px;
    left: 8%;
    right: 8%;
    height: 10px;
    border-radius: 50%;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--ride-color) 35%, transparent), transparent 75%);
    filter: blur(1px);
    transform-origin: 50% 50%;
    animation: groundPulse var(--rock-speed, 1.7s) ease-in-out infinite;
  }
  @keyframes groundPulse {
    0%, 100% { transform: scaleX(1); opacity: .9; }
    50%      { transform: scaleX(1.1); opacity: .55; }
  }

  .toy {
    position: relative;
    transform-origin: 50% 100%;
    animation: rock var(--rock-speed, 1.7s) ease-in-out infinite;
    margin-bottom: 22px;
    cursor: grab;
    touch-action: none;
  }
  .toy.grabbing { cursor: grabbing; }
  @keyframes rock {
    0%   { transform: rotate(calc(var(--rock-amp, 7deg) * -1)); }
    50%  { transform: rotate(var(--rock-amp, 7deg)); }
    100% { transform: rotate(calc(var(--rock-amp, 7deg) * -1)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .toy, .ground, .spring { animation: none; }
  }

  .rockers { display: block; }

  .mount {
    position: absolute;
    left: 50%;
    bottom: 58px;
    width: 118px;
    height: 100px;
    margin-left: -59px;
    border-radius: 60% 60% 55% 55% / 65% 65% 45% 45%;
    background:
      radial-gradient(circle at 14% 12%, color-mix(in srgb, var(--ride-color) 35%, white) 0%, color-mix(in srgb, var(--ride-color) 35%, white) 9%, transparent 10%),
      radial-gradient(circle at 34% 4%,  color-mix(in srgb, var(--ride-color) 35%, white) 0%, color-mix(in srgb, var(--ride-color) 35%, white) 8%, transparent 9%),
      radial-gradient(circle at 56% 2%,  color-mix(in srgb, var(--ride-color) 35%, white) 0%, color-mix(in srgb, var(--ride-color) 35%, white) 9%, transparent 10%),
      radial-gradient(circle at 78% 5%,  color-mix(in srgb, var(--ride-color) 35%, white) 0%, color-mix(in srgb, var(--ride-color) 35%, white) 8%, transparent 9%),
      radial-gradient(circle at 94% 14%, color-mix(in srgb, var(--ride-color) 35%, white) 0%, color-mix(in srgb, var(--ride-color) 35%, white) 8%, transparent 9%),
      linear-gradient(160deg, color-mix(in srgb, var(--ride-color) 88%, white), color-mix(in srgb, var(--ride-color) 55%, black));
    box-shadow: inset 0 -10px 18px rgba(0,0,0,.25), 0 12px 22px -8px color-mix(in srgb, var(--ride-color) 60%, transparent);
  }
  .mount .glyph-big {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(0,0,0,.5);
  }
  .mount .glyph-big svg { width: 46px; height: 46px; display: block; }
  .ear {
    position: absolute;
    top: -14px;
    width: 20px;
    height: 26px;
    border-radius: 50% 50% 45% 45%;
    background: color-mix(in srgb, var(--ride-color) 70%, black);
  }
  .ear.l { left: 18px; transform: rotate(-18deg); }
  .ear.r { right: 18px; transform: rotate(18deg); }

  .rider {
    position: absolute;
    left: 50%;
    bottom: 118px;
    margin-left: -18px;
  }
  .rider .head {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #ffd8b0;
    margin: 0 auto;
    box-shadow: inset -4px -3px 0 rgba(0,0,0,.08);
  }
  .rider .body {
    width: 34px;
    height: 30px;
    border-radius: 14px 14px 6px 6px;
    background: #4d5ea8;
    margin: -4px auto 0;
  }
  .rider .arm {
    position: absolute;
    top: 20px;
    width: 22px;
    height: 6px;
    border-radius: 4px;
    background: #4d5ea8;
  }
  .rider .arm.l { left: -14px; transform: rotate(28deg); }
  .rider .arm.r { right: -14px; transform: rotate(-28deg); }

  .spring {
    position: absolute;
    left: 50%;
    bottom: 8px;
    width: 14px;
    height: 56px;
    margin-left: -7px;
    background: repeating-linear-gradient(0deg, #666 0 4px, #999 4px 8px);
    border-radius: 6px;
    opacity: .85;
    transform-origin: 50% 100%;
    animation: springSquash var(--rock-speed, 1.7s) ease-in-out infinite;
  }
  @keyframes springSquash {
    0%, 100% { transform: scaleY(1); }
    25%      { transform: scaleY(.86); }
    50%      { transform: scaleY(1); }
    75%      { transform: scaleY(.86); }
  }

  .ride-caption { margin-top: 8px; font-size: 20px; font-weight: 800; text-align: center; }
  .ride-caption b { color: var(--ride-color); }
  .ride-tagline { color: var(--dim); font-size: 13px; margin: 4px 0 0; text-align: center; max-width: 40ch; }

  .ride-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 18px; }
  .ride-actions button, .ride-actions a {
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 10px 18px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.05);
    color: var(--fg);
    cursor: pointer;
    text-decoration: none;
  }
  .ride-actions a.primary, .ride-actions button.primary {
    background: var(--ride-color);
    border-color: transparent;
    color: #12121a;
  }
  .ride-actions button:hover, .ride-actions a:hover { background: rgba(255,255,255,.12); }

  footer {
    margin-top: 26px;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
    font-size: 12px;
    color: var(--dim);
  }
  footer a { color: var(--dim); }
  footer a:hover { color: var(--fg); }

  #shareCanvas { display: none; }
</style>
</head>
<body>

<header>
  <h1>ridegently</h1>
  <p class="tagline">pick an LLM. ride it gently, like the sheep, but it's Claude.</p>
</header>

<main>
  <section id="selectScreen">
    <div class="stage" id="stage">
      <div class="track" id="track"></div>
      <button class="arrow left" id="prevBtn" aria-label="previous">‹</button>
      <button class="arrow right" id="nextBtn" aria-label="next">›</button>
    </div>

    <div class="marquee" id="marqueeName">—<span class="maker" id="marqueeMaker">&nbsp;</span></div>
    <p class="blurb-line" id="marqueeBlurb"></p>

    <button id="rideBtn">ride it</button>
    <p class="hint">← → or drag to spin the turntable, click a pod to jump, enter to ride</p>
  </section>

  <section id="rideScreen" hidden>
    <div class="rink">
      <div class="ground"></div>
      <div class="toy" id="toy">
        <svg class="rockers" width="180" height="26" viewBox="0 0 180 26" style="position:absolute; left:50%; bottom:0; margin-left:-90px;">
          <path d="M10 20 Q90 -6 170 20" stroke="#5b4636" stroke-width="9" fill="none" stroke-linecap="round"/>
        </svg>
        <div class="spring"></div>
        <div class="mount" id="mount">
          <div class="ear l"></div>
          <div class="ear r"></div>
          <div class="glyph-big" id="mountGlyph">C</div>
        </div>
        <div class="rider">
          <div class="arm l"></div>
          <div class="arm r"></div>
          <div class="head"></div>
          <div class="body"></div>
        </div>
      </div>
    </div>

    <p class="ride-caption">riding <b id="rideName">Claude</b> gently</p>
    <p class="ride-tagline" id="rideTagline"></p>
    <p class="hint">grab the toy and give it a push</p>

    <div class="ride-actions">
      <button id="switchBtn">switch rides</button>
      <a id="shareBluesky" class="primary" target="_blank" rel="noopener">skeet it</a>
      <button id="shareCardBtn">share card</button>
    </div>
  </section>
</main>

<footer>
  <a href="https://bisks.net/">bisks.net</a>
  <a id="rybLink" href="https://rateyourbuild.bisks.net/site/ridegently">rate this on rateyourbuild →</a>
</footer>

<canvas id="shareCanvas" width="1200" height="630"></canvas>

-.136 1.146.016.352.144.618.408 1.001.782.392.451.462.576.685.915.176.264.336.536.446.848.066.194-.02.353-.25.45"/></svg>',
    command: '<svg role="img" viewBox="0 0 20.5 20.5" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><title>Cohere</title><path d="M6.81969 11.9081C7.34472 11.9081 8.3891 11.8785 9.8327 11.2692C11.5149 10.559 14.8619 9.2699 17.2762 7.94576C18.9648 7.01963 19.7049 5.79474 19.7049 4.14523C19.705 1.85589 17.8949 0 15.6621 0H6.30704C3.09989 0 0.5 2.66571 0.5 5.95406C0.5 9.2424 2.93427 11.9081 6.81969 11.9081Z"/><path d="M8.40234 16.0108C8.40234 14.3989 9.34877 12.9456 10.8008 12.3277L13.7469 11.0741C16.7269 9.80599 20.0069 12.0514 20.0069 15.3595C20.0069 17.9226 17.9801 20.0001 15.4803 19.9994L12.2906 19.9985C10.143 19.998 8.40234 18.2128 8.40234 16.0108Z"/><path d="M3.8476 12.6914H3.84753C1.99874 12.6914 0.5 14.2281 0.5 16.1237V16.5683C0.5 18.4639 1.99874 20.0005 3.84753 20.0005H3.8476C5.69639 20.0005 7.19513 18.4639 7.19513 16.5683V16.1237C7.19513 14.2281 5.69639 12.6914 3.8476 12.6914Z"/></svg>',
  };

  // Riding personality per model — tunes the idle rock (CSS custom
  // properties) and the spring-physics response when someone grabs and
  // pushes the toy (see the pointer handlers below). Pulled from each
  // ride's blurb: Claude settles fast and barely swings, Grok swings hard
  // and takes its time calming down, etc.
  const RIDES = [
    { id: "claude",   name: "Claude",     maker: "Anthropic",  color: "#d9744f", blurb: "gentle, thoughtful, will absolutely refuse to go too fast",
      rock: { speed: "2.1s", amp: "5deg", stiffness: .16, damping: .90 } },
    { id: "gemini",   name: "Gemini",     maker: "Google",     color: "#4f6df3", blurb: "twins riding tandem, somehow still one horse",
      rock: { speed: "1.55s", amp: "7deg", stiffness: .12, damping: .84 } },
    { id: "gpt",      name: "GPT",        maker: "OpenAI",     color: "#12b886", blurb: "the original pony, still the one everyone asks for by name",
      rock: { speed: "1.7s", amp: "7deg", stiffness: .12, damping: .85 } },
    { id: "llama",    name: "Llama",      maker: "Meta",       color: "#66c25a", blurb: "open pasture, open weights, open saddle",
      rock: { speed: "1.9s", amp: "9deg", stiffness: .10, damping: .80 } },
    { id: "grok",     name: "Grok",       maker: "xAI",        color: "#ef4444", blurb: "rides like it's got something to prove",
      rock: { speed: "1.05s", amp: "12deg", stiffness: .09, damping: .68 } },
    { id: "mistral",  name: "Mistral",    maker: "Mistral AI", color: "#f5a524", blurb: "small, fast, faintly windswept",
      rock: { speed: "1.15s", amp: "6deg", stiffness: .18, damping: .88 } },
    { id: "deepseek", name: "DeepSeek",   maker: "DeepSeek",   color: "#8b5cf6", blurb: "came out of nowhere, now everyone wants a turn",
      rock: { speed: "1.4s", amp: "10deg", stiffness: .11, damping: .78 } },
    { id: "command",  name: "Command R",  maker: "Cohere",     color: "#ec4899", blurb: "the quiet one, very good at fetching things",
      rock: { speed: "2.3s", amp: "4deg", stiffness: .20, damping: .93 } },
  ].map((r) => ({ ...r, logo: LOGOS[r.id] }));
  const N = RIDES.length;

  const track = document.getElementById("track");
  const els = {
    stage: document.getElementById("stage"),
    selectScreen: document.getElementById("selectScreen"),
    rideScreen: document.getElementById("rideScreen"),
    marqueeName: document.getElementById("marqueeName"),
    marqueeBlurb: document.getElementById("marqueeBlurb"),
    prevBtn: document.getElementById("prevBtn"),
    nextBtn: document.getElementById("nextBtn"),
    rideBtn: document.getElementById("rideBtn"),
    switchBtn: document.getElementById("switchBtn"),
    rink: document.querySelector(".rink"),
    toy: document.getElementById("toy"),
    mount: document.getElementById("mount"),
    mountGlyph: document.getElementById("mountGlyph"),
    rideName: document.getElementById("rideName"),
    rideTagline: document.getElementById("rideTagline"),
    shareBluesky: document.getElementById("shareBluesky"),
    shareCardBtn: document.getElementById("shareCardBtn"),
  };

  let justDragged = false;

  RIDES.forEach((r, i) => {
    const pod = document.createElement("div");
    pod.className = "pod";
    pod.style.setProperty("--c", r.color);
    pod.dataset.index = String(i);
    pod.innerHTML = '<div class="logo">' + r.logo + '</div><div class="name">' + r.name + "</div>";
    pod.addEventListener("click", () => {
      if (justDragged) return;
      if (selected === i) { ride(); } else { select(i); }
    });
    track.appendChild(pod);
  });
  const pods = Array.from(track.children);

  let selected = 0;

  // wrap a pod-index delta (or a continuous drag position) into [-N/2, N/2)
  // so the turntable always turns the short way round.
  function wrap(d) {
    let m = ((d % N) + N) % N;
    if (m > N / 2) m -= N;
    return m;
  }

  // pos is the continuous turntable position (fractional while dragging,
  // always an integer once settled on `selected`).
  function layout(pos) {
    if (pos === undefined) pos = selected;
    pods.forEach((pod, i) => {
      const d = wrap(i - pos);
      const ad = Math.abs(d);
      const x = d * 168;
      const z = -ad * 130;
      const rot = d * -26;
      const scale = Math.max(0.5, 1 - ad * 0.13);
      const opacity = Math.max(0.08, 1 - ad * 0.24);
      pod.style.transform = "translateX(" + x + "px) translateZ(" + z + "px) rotateY(" + rot + "deg) scale(" + scale + ")";
      pod.style.opacity = String(opacity);
      pod.style.zIndex = String(100 - ad);
      pod.classList.toggle("selected", ad < 0.5);
      pod.style.pointerEvents = ad > 3 ? "none" : "auto";
    });
    const nearest = ((Math.round(pos) % N) + N) % N;
    const r = RIDES[nearest];
    els.marqueeName.innerHTML = r.name + '<span class="maker" id="marqueeMaker">' + r.maker + "</span>";
    els.marqueeBlurb.textContent = r.blurb;
    document.documentElement.style.setProperty("--ride-color", r.color);
  }

  function select(i) {
    selected = ((i % N) + N) % N;
    layout();
  }

  els.prevBtn.addEventListener("click", () => select(selected - 1));
  els.nextBtn.addEventListener("click", () => select(selected + 1));
  els.rideBtn.addEventListener("click", ride);

  window.addEventListener("keydown", (e) => {
    if (!els.rideScreen.hidden) return;
    if (e.key === "ArrowLeft") select(selected - 1);
    else if (e.key === "ArrowRight") select(selected + 1);
    else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); ride(); }
  });

  // ---- drag the turntable itself, Daytona-cabinet style ----
  // A small deadzone before we touch any pod's transform: a click/tap always
  // has a pixel or two of jitter between pointerdown and pointerup, and
  // nudging the *centered* pod's z off exactly 0 (even briefly) can make it
  // hit-test behind its own (invisible, flat) parent in a preserve-3d
  // context, swallowing the click that should have fired ride(). Below the
  // deadzone we leave every pod's transform untouched, so an ordinary click
  // behaves exactly as if this drag handling didn't exist.
  const SPIN_SENS = 130; // px of drag per pod-step
  const DRAG_DEADZONE = 6; // px
  let spinning = false, spinActive = false;
  let spinStartX = 0, spinLastX = 0, spinStartPos = 0, spinDist = 0;

  track.addEventListener("pointerdown", (e) => {
    spinning = true;
    spinActive = false;
    spinStartX = spinLastX = e.clientX;
    spinStartPos = selected;
    spinDist = 0;
  });

  window.addEventListener("pointermove", (e) => {
    if (!spinning) return;
    spinLastX = e.clientX;
    const dx = spinLastX - spinStartX;
    spinDist = Math.max(spinDist, Math.abs(dx));
    if (!spinActive && spinDist > DRAG_DEADZONE) {
      spinActive = true;
      track.classList.add("dragging");
    }
    if (spinActive) layout(spinStartPos - dx / SPIN_SENS);
  });

  function endSpin() {
    if (!spinning) return;
    spinning = false;
    if (spinActive) {
      track.classList.remove("dragging");
      const dx = spinLastX - spinStartX;
      select(Math.round(spinStartPos - dx / SPIN_SENS));
      justDragged = true;
      requestAnimationFrame(() => { justDragged = false; });
    }
    spinActive = false;
  }
  window.addEventListener("pointerup", endSpin);
  window.addEventListener("pointercancel", endSpin);

  let currentRide = RIDES[0];

  function ride() {
    const r = RIDES[selected];
    currentRide = r;
    document.documentElement.style.setProperty("--ride-color", r.color);
    els.mountGlyph.innerHTML = r.logo;
    els.rideName.textContent = r.name;
    els.rideTagline.textContent = r.blurb + " — " + r.maker + ".";
    document.title = "ridegently: riding " + r.name + " gently";

    const shareUrl = location.origin + "/r/" + r.id;
    const shareText = "riding " + r.name + " gently 🐑 " + shareUrl;
    els.shareBluesky.href = "https://bsky.app/intent/compose?text=" + encodeURIComponent(shareText);

    els.rink.style.setProperty("--rock-speed", r.rock.speed);
    els.rink.style.setProperty("--rock-amp", r.rock.amp);

    els.selectScreen.hidden = true;
    els.rideScreen.hidden = false;
    stopPhysics();
    angle = 0;
    angVel = 0;
    els.toy.style.transform = "";
    els.toy.style.animation = "none";
    // restart the rock animation cleanly on every new ride
    void els.toy.offsetWidth;
    els.toy.style.animation = "";
  }

  els.switchBtn.addEventListener("click", () => {
    stopPhysics();
    els.rideScreen.hidden = true;
    els.selectScreen.hidden = false;
    document.title = "ridegently — pick an LLM, ride it gently";
  });

  // ---- riding mechanics: grab the toy and push it, spring-physics release ----
  let angle = 0, angVel = 0, dragging = false, dragLastX = 0, dragLastT = 0, physicsFrame = null;

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function stopPhysics() {
    if (physicsFrame !== null) { cancelAnimationFrame(physicsFrame); physicsFrame = null; }
  }

  function setAngle(a) {
    angle = a;
    els.toy.style.transform = "rotate(" + angle.toFixed(2) + "deg)";
  }

  els.toy.addEventListener("pointerdown", (e) => {
    dragging = true;
    stopPhysics();
    els.toy.style.animation = "none";
    els.toy.classList.add("grabbing");
    if (els.toy.setPointerCapture) els.toy.setPointerCapture(e.pointerId);
    dragLastX = e.clientX;
    dragLastT = performance.now();
  });

  els.toy.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const now = performance.now();
    const dt = Math.max(1, now - dragLastT);
    const dx = e.clientX - dragLastX;
    const target = clamp(angle + dx * 0.35, -48, 48);
    angVel = ((target - angle) / dt) * 16;
    setAngle(target);
    dragLastX = e.clientX;
    dragLastT = now;
  });

  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    els.toy.classList.remove("grabbing");
    releasePhysics();
  }
  els.toy.addEventListener("pointerup", endDrag);
  els.toy.addEventListener("pointercancel", endDrag);

  function releasePhysics() {
    const spring = currentRide.rock;
    function step() {
      const restoring = -angle * spring.stiffness;
      angVel = (angVel + restoring) * spring.damping;
      angle += angVel;
      els.toy.style.transform = "rotate(" + angle.toFixed(2) + "deg)";
      if (Math.abs(angVel) > 0.04 || Math.abs(angle) > 0.3) {
        physicsFrame = requestAnimationFrame(step);
      } else {
        physicsFrame = null;
        angle = 0;
        angVel = 0;
        els.toy.style.transform = "";
        els.toy.style.animation = ""; // hand back to the idle rock keyframes
      }
    }
    physicsFrame = requestAnimationFrame(step);
  }

  // ---- share card (canvas, downloadable / native share) ----
  function canShareFiles() {
    if (!navigator.share || !navigator.canShare) return false;
    try {
      const probe = new File([""], "probe.png", { type: "image/png" });
      return navigator.canShare({ files: [probe] });
    } catch (_) {
      return false;
    }
  }

  function loadLogoImage(svgMarkup, color) {
    return new Promise((resolve, reject) => {
      const styled = svgMarkup.replace("<svg ", '<svg style="color:' + color + '" ');
      const url = URL.createObjectURL(new Blob([styled], { type: "image/svg+xml" }));
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
      img.src = url;
    });
  }

  async function buildShareCard() {
    const r = RIDES[selected];
    const cv = document.getElementById("shareCanvas");
    const ctx = cv.getContext("2d");
    const W = cv.width, H = cv.height;

    const bg = ctx.createRadialGradient(W * 0.25, -60, 60, W * 0.25, -60, 900);
    bg.addColorStop(0, "#20172a");
    bg.addColorStop(1, "#0b0c14");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "#f1f0ff";
    ctx.font = "800 54px 'JetBrains Mono', monospace";
    ctx.fillText("ridegently", 64, 110);
    ctx.fillStyle = "#8d8bab";
    ctx.font = "20px 'JetBrains Mono', monospace";
    ctx.fillText("riding " + r.name + " gently", 64, 150);

    // mount blob, with the real brand mark on top
    const cx = 300, cy = 420;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = r.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, 150, 120, 0, 0, Math.PI * 2);
    ctx.fill();
    try {
      const img = await loadLogoImage(r.logo, "rgba(0,0,0,.5)");
      const size = 140;
      ctx.drawImage(img, -size / 2, -size / 2, size, size);
    } catch (_) { /* skip the mark if it fails to rasterize, blob still reads fine */ }
    ctx.restore();

    ctx.fillStyle = "#f1f0ff";
    ctx.font = "700 30px 'JetBrains Mono', monospace";
    ctx.fillText(r.name + " — " + r.maker, 520, 380);
    ctx.fillStyle = "#8d8bab";
    ctx.font = "18px 'JetBrains Mono', monospace";
    wrapText(ctx, r.blurb, 520, 420, 560, 26);

    ctx.fillStyle = r.color;
    ctx.font = "700 22px 'JetBrains Mono', monospace";
    ctx.fillText("ridegently.bisks.net", 520, 560);

    return cv;
  }

  function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    const words = text.split(" ");
    let line = "";
    for (const w of words) {
      const test = line ? line + " " + w : w;
      if (ctx.measureText(test).width > maxWidth && line) {
        ctx.fillText(line, x, y);
        line = w;
        y += lineHeight;
      } else {
        line = test;
      }
    }
    if (line) ctx.fillText(line, x, y);
  }

  els.shareCardBtn.addEventListener("click", async () => {
    const r = RIDES[selected];
    const cv = await buildShareCard();
    cv.toBlob(async (blob) => {
      if (!blob) return;
      const shareUrl = location.origin + "/r/" + r.id;
      const shareText = "riding " + r.name + " gently 🐑 " + shareUrl;
      if (canShareFiles()) {
        const file = new File([blob], "ridegently-" + r.id + ".png", { type: "image/png" });
        try {
          await navigator.share({ files: [file], text: shareText, title: "ridegently" });
          return;
        } catch (_) { /* fall through to download */ }
      }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "ridegently-" + r.id + ".png";
      a.click();
    }, "image/png");
  });

  layout();
})();
</script>
</body>
