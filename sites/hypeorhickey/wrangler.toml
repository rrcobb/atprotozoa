name = "atprotozoa-hypeorhickey"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A quiz: given a real
# quote, guess who said it — Bluesky staff (incl. ex-staff), a handful of
# famously understated language creators (Rob Pike, Rich Hickey, Larry Wall,
# Zed Shaw, Andrew Kelley), or a handful of famously euphoric tech/finance
# hype-men (Jensen Huang, Elon Musk, Sam Altman, Adam Neumann, Masayoshi Son).
# The bit: curate each person's most euphoric-sounding real quote, so the
# calm engineers' rare hype moments get mistaken for CEO hype-speak and vice
# versa. See public/lib/quotes.js for the bank and sourcing notes.
routes = [
  { pattern = "hypeorhickey.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
