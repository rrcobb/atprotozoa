name = "atprotozoa-hashclaim"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser. Checks a hash-commitment
# claim: paste the hash someone posted in advance, then the text they later
# claimed was the source, and it recomputes the hash client-side and says
# whether it actually matches. Prompted by a thread asking how many people
# actually check the hash when someone "calls it in advance."

routes = [
  { pattern = "hashclaim.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/hashclaim", zone_name = "bisks.net" },
  { pattern = "bisks.net/hashclaim/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
