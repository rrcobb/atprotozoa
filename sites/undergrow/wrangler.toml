name = "atprotozoa-undergrow"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Entirely client-side: the save lives in localStorage (public/game.js).
# routes MUST stay above [assets] — keys after a table header join that table.
routes = [{ pattern = "undergrow.bisks.net/*", zone_name = "bisks.net" }]

[assets]
directory = "./public"
binding = "ASSETS"
