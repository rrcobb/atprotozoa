<meta name="description" content="A semi-cozy cyberpunk farming sim. You're a rat. Grow glowcaps, befriend a pigeon, a raccoon, a crow and a cat. Something hums in the drain." />
<meta property="og:title" content="undergrow — a rat, a rooftop, a neon farm" />

<body>
<div class="wrap">
  <header>
    <h1>🐀 UNDERGROW</h1>
    <p>a semi-cozy rat farm at the bottom of a very tall city.</p>
  </header>
  <div class="skyline"></div>
  <div class="hud">
    <span class="chip">day <b id="day">1</b></span>
    <span class="chip">⚡ <b id="energy">10</b>/<span id="maxE">10</span></span>
    <span class="chip">¢ <b id="coins">0</b></span>
    <span class="chip" id="title" hidden></span>
  </div>
  <nav id="nav"></nav>
  <main id="view"></main>
  <div class="panel"><div id="log" aria-live="polite"></div></div>
  <div class="row">
    <button id="sleep" class="go">💤 sleep (end the day)</button>
    <a id="share" target="_blank" rel="noopener"><button type="button">share on bluesky</button></a>
    <button id="reset">new game</button>
  </div>
  <footer>
    <span>saves in your browser.</span>
    <a href="https://rateyourbuild.bisks.net/site/undergrow">rate this on rateyourbuild →</a>
    <a href="https://bisks.net/">bisks.net</a>
  </footer>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
