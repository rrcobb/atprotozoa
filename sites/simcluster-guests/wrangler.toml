name = "atprotozoa-simcluster-guests"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @riziles asked for a board to track guest requests for @brennan.computer's
# "Simcluster" podcast. Not the same thing as sites/simcluster (a Clue game
# played over a handle's mutuals) — same word, unrelated project, this one is
# a real request board: suggest a guest, upvote the ones you also want to
# hear, sorted into a live leaderboard. One Durable Object holds all of it
# (the submission list + vote state), same "single-writer rolling state"
# shape notes/10-architecture.md calls out DOs for, borrowed from
# sites/ideahose/sites/ratioed minus the firehose-watching part — this one's
# fed directly by the form on the page, no Jetstream needed.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes
# (the gotcha called out in sites/logs, sites/didscope, sites/the-place).
routes = [
  { pattern = "simcluster-guests.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "BOARD"
class_name = "GuestBoard"

# new_sqlite_classes, not new_classes — legacy KV-backed DOs need Workers
# Paid; this account is on Free. See sites/the-place/wrangler.toml for the
# full story.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GuestBoard"]
