name = "atprotozoa-mutechella"
compatibility_date = "2025-01-01"

# @ver.ooo asked, replying to @jcsalterego.bsky.social's "releasing my muted
# users list like a coachella lineup poster": sign in and see your own mute
# list rendered as a festival lineup poster, biggest accounts in the biggest
# font at the top.
#
# Pure static SPA, no server-side state:
#   - Sign-in only reads app.bsky.graph.getMutes for the signed-in account —
#     that's account-side AppView state gated to the owner, not public data,
#     so it needs OAuth, but it's read-only (see client-metadata.json's single
#     rpc: grant, no repo:/blob: writes at all).
#   - "Biggest" is by follower count, fetched per-muted-account from the
#     public, unauthenticated app.bsky.actor.getProfiles (same pattern as
#     sites/blocknotes' fetchProfiles) — getMutes itself returns ProfileView,
#     not ProfileViewDetailed, so it has no followersCount.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
assets = { directory = "./public" }

routes = [{ pattern = "mutechella.bisks.net/*", zone_name = "bisks.net" }]
