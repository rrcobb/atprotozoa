name = "atprotozoa-hyperobject"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @isolyth.dev got mogged down to 4th place on peakposting's leaderboard by
# @mfzx.net and asked for compensation: a site where they're on top and
# everyone else is on the bottom. isolyth.dev is hardcoded as the one and only
# hyperobject, rendered enthroned at the zenith; anyone else can be "cast into
# the pit" beneath them. The pit is real shared state (a Durable Object) —
# everyone who visits sees the same growing pit, not a private fiction — and
# casts are re-verified server-side against the AppView (src/index.ts resolves
# the submitted DID's real profile itself; a client can't lie about who it's
# casting in, only who it targets).
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [
  { pattern = "hyperobject.bisks.net/*", zone_name = "bisks.net" },
]

# run_worker_first: /api/* (the pit Durable Object) and /s/<handle> (personalized
# share unfurls) are both dynamic, so the Worker must run BEFORE the
# static-asset router.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[migrations]]
tag = "v1"
deleted_classes = ["Pit"]
