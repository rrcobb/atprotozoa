name = "atprotozoa-slopwater"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# SLOP WATER — a shake-timing minigame. Pure static site; the only server
# job is stripping the "/games/slopwater" mount prefix (see
# notes/40-new-site-playbook.md). Mounted in the games/ cluster, not flat —
# see notes/20-deploy.md ("Clustering related sites under a shared path
# segment").
routes = [
  { pattern = "bisks.net/games/slopwater", zone_name = "bisks.net" },
  { pattern = "bisks.net/games/slopwater/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
