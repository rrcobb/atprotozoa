name = "atprotozoa-pixel-fishing"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A little pixel-art fishing
# game: cast into a pond that cycles day/dusk/night/dawn, watch the bobber,
# hook the bite in a short timing window, then reel against a tension bar
# before the line snaps. Eight hand-pixeled fish (one only bites at night, one
# is a vanishingly rare golden carp) plus junk you can reel in for laughs.
# Field guide + lifetime score persist in localStorage. @steve-adams.me asked
# for "pixel fishing game"; @bisks.net gave it the go-ahead in-thread. No
# secrets, no server.
main = "src/index.ts"

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# pixel-fishing.bisks.net is being retired to free a slot against the zone's
# custom-domain cap (see notes/20-deploy.md). Migrated to bisks.net/pixel-fishing
# instead. See notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "bisks.net/pixel-fishing", zone_name = "bisks.net" },
  { pattern = "bisks.net/pixel-fishing/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
