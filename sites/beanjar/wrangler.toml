name = "atprotozoa-beanjar"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A jar of hand-modeled
# beans with real 2D rigid-body physics (custom, no dependency): shake it by
# dragging the jar, tilting your phone, or hitting the shake button, and every
# bean collision plays a synthesized (Web Audio, no sample files) rattle/knock
# whose pitch and volume scale with impact speed. Built after @cee.wtf tagged
# @buildthis asking to "go wild" on a jar of beans.
main = "src/index.ts"

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# see notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "beanjar.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/beanjar", zone_name = "bisks.net" },
  { pattern = "bisks.net/beanjar/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
