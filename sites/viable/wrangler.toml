name = "atprotozoa-viable"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. An interactive explainer
# of Stafford Beer's Viable System Model (VSM): the five systems (S1–S5), the
# recursion, and the channels between them. Click or hover a system to learn
# what it does and how it connects. Built after @ver.ooo tagged the bot asking
# for a visual, interactive, educational VSM tool. No secrets, no server.
main = "src/index.ts"

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# viable.bisks.net is being retired to free a slot against the zone's
# custom-domain cap (see notes/20-deploy.md). Migrated to bisks.net/viable
# instead. See notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "viable.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/viable", zone_name = "bisks.net" },
  { pattern = "bisks.net/viable/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
