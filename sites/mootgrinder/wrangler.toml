# sites/mootgrinder/wrangler.toml
#
# @cee.wtf: a 2D physics toy — load your moots' profile pics, drag one into
# a coffee grinder, and it gets ground into a pile of colored sand where
# every grain is one pixel of that pfp. Pure client-side canvas cellular
# automaton (falling sand), no WebGL, no server state.
name = "atprotozoa-mootgrinder"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [
  { pattern = "mootgrinder.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
