name = "atprotozoa-vibepantheon"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @antiali.as asked for "a pantheon of vibes": watch the live firehose for
# posts matching /the vibes are/gi, tabulate the phrase that follows up to
# the next punctuation mark, and rank the results. One Durable Object
# ("global") holds the live tally — same single-writer rolling-state shape
# notes/10-architecture.md calls out, and the same Jetstream-over-fetch()
# pattern as sites/quotehof and sites/ratioed.
routes = [
  { pattern = "vibepantheon.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "TRACKER"
class_name = "VibeTracker"

# new_sqlite_classes, not new_classes — legacy KV-backed DOs need Workers
# Paid; this account is on Free. See notes/20-deploy.md.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["VibeTracker"]
