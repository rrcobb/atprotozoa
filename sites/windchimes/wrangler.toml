name = "atprotozoa-windchimes"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser. Connects directly to
# Jetstream (wss://jetstream2.us-east.bsky.network/subscribe) and turns
# app.bsky.feed.post activity into wind: each post strikes one of five hanging
# chimes, and the recent post rate drives an ambient sway across all of them.
# Material (wood / bamboo / metal / glass) picks both the visual tube style
# and the Web Audio synthesis method; a key picker retunes the pentatonic
# scale the chimes are strung to. No server, no samples.

routes = [
  { pattern = "windchimes.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
