name = "atprotozoa-thread-heirloom"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Path-mounted at bisks.net/thread-heirloom — a dedicated custom domain isn't
# the default anymore (the zone's custom-domain cap, see
# notes/20-deploy.md); this Worker claims a path route on the already-live
# bisks.net zone instead. See notes/40-new-site-playbook.md ("Why paths, not
# subdomains"). routes MUST stay above [assets] — in TOML, keys after a
# table header join that table, so a routes line below [assets] silently
# becomes assets.routes.
routes = [
  { pattern = "thread-heirloom.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/thread-heirloom", zone_name = "bisks.net" },
  { pattern = "bisks.net/thread-heirloom/*", zone_name = "bisks.net" },
]

# Workers AI does the distillation (POST /api/distill) — no API key needed,
# it's a native binding billed to the account. The card itself is never
# stored server-side: /c/<code> decodes the whole card out of the URL, so a
# card outlives both the original thread AND this Worker's memory of it.
[ai]
binding = "AI"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
