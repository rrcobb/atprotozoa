name = "atprotozoa-cartouche"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Fetches
# fromthewestmeadow.com's real public profile (app.bsky.actor.getProfile,
# CORS *) and re-renders it as a floating 3D shrine: a cartouche (the actual
# Egyptian device for writing a name) holding their handle transliterated
# into real Unicode Egyptian hieroglyphs (U+13000-U+1342F, Noto Sans
# Egyptian Hieroglyphs from Google Fonts), plus stat-steles for follower/
# following/post counts and account age, and their bio run through the same
# transliteration. Hover/tap any glyph line to reveal its "translation"
# (the real text) — inscrutable until you ask. CSS 3D perspective + mouse
# parallax for the "floating diagrams" half of the ask. Built from
# @fromthewestmeadow.com's own request: "make a website about me entirely
# out of inscrutable hieroglyphics and floating 3 dimensional diagrams."
# ?handle= lets anyone else's profile through the same machine too.
assets = { directory = "./public" }

routes = [{ pattern = "cartouche.bisks.net/*", zone_name = "bisks.net" }]
