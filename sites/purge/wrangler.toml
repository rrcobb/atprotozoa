name = "atprotozoa-purge"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser. Type a Bluesky handle
# and purge finds "quiet mutuals": people you follow who follow you back,
# but who haven't liked or replied to any of your posts in the last N
# months — reading the public AppView anonymously, no login. See
# public/lib/*.js. Sibling of metamoots (same shape, opposite question).

routes = [
  { pattern = "bisks.net/purge", zone_name = "bisks.net" },
  { pattern = "bisks.net/purge/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
