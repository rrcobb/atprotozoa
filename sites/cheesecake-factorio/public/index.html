<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cheesecake factorio</title>
<meta name="description" content="Automate cheesecake. Build mixers, ovens, belts and assemblers until the factory must grow.">
<meta property="og:title" content="cheesecake factorio">
<meta property="og:description" content="Automate cheesecake. The factory must grow.">
<meta property="og:image" content="https://cheesecake-factorio.bisks.net/og.png">
<meta property="og:url" content="https://cheesecake-factorio.bisks.net/">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🍰 cheesecake factorio</h1>
  <p class="sub">the factory must grow. the cheesecake must flow.</p>
</header>
<main>
  <section class="panel">
    <div class="big"><span id="cakes">0</span> <small>cheesecakes</small></div>
    <div class="rate"><span id="rate">0</span> cakes/s</div>
    <button id="bake" type="button">hand-bake a cheesecake</button>
    <p class="hint" id="hint">click to bake by hand. then stop doing that.</p>
    <div class="actions">
      <button id="share" type="button">share on bluesky</button>
      <button id="reset" type="button" class="ghost">reset</button>
    </div>
  </section>
  <section class="panel">
    <h2>build</h2>
    <div id="shop"></div>
  </section>
  <section class="panel wide">
    <h2>the line</h2>
    <div id="line" class="line" aria-label="factory floor"></div>
  </section>
</main>
<footer>
  <a href="https://rateyourbuild.bisks.net/site/cheesecake-factorio">rate this on rateyourbuild →</a>
</footer>
<script src="game.js"></script>
<script src="ring.js" data-site="cheesecake-factorio"></script>
</body>
</html>
