name = "atprotozoa-cheesecake-factorio"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site; the game runs in the browser.
routes = [
  { pattern = "cheesecake-factorio.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
