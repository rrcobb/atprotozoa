<style>
  .room {
    position: relative;
    height: 320px;
    background: radial-gradient(circle at 50% 0%, #1c2b2a 0%, #0b0d10 70%);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  .shelf {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 60px;
    background: repeating-linear-gradient(90deg, #1a1d22 0 18px, #14171c 18px 20px);
    border-top: 2px solid var(--line);
  }
  .mote {
    position: absolute;
    width: 3px; height: 3px;
    background: var(--accent);
    border-radius: 50%;
    opacity: 0.5;
    animation: drift linear infinite;
  }
  @keyframes drift {
    from { transform: translateY(0) translateX(0); opacity: 0; }
    10%  { opacity: 0.6; }
    90%  { opacity: 0.3; }
    to   { transform: translateY(-260px) translateX(20px); opacity: 0; }
  }
  .hush {
    position: absolute;
    top: 40%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    font-family: var(--mono);
    color: var(--muted);
  }
  .hush-btn {
    margin-top: 1rem;
    font-family: var(--mono);
    font-size: 0.85rem;
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0.5rem 1rem;
    cursor: pointer;
  }
  .hush-btn:hover { border-color: var(--accent); color: var(--accent); }
  .patrons { margin-top: 0.8rem; font-size: 0.78rem; color: var(--accent); min-height: 1.2em; }
