name = "atprotozoa-aphoverb"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Path-mounted at bisks.net/aphoverb — the zone's custom-domain cap means new
# sites mount as a path route on the already-provisioned bisks.net zone
# instead of a dedicated custom domain. See notes/40-new-site-playbook.md
# ("Why paths, not subdomains"). routes MUST stay above [assets] — in TOML,
# keys after a table header join that table, so a routes line below [assets]
# silently becomes assets.routes.
routes = [
  { pattern = "aphoverb.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/aphoverb", zone_name = "bisks.net" },
  { pattern = "bisks.net/aphoverb/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
