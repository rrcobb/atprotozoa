name = "atprotozoa-hockeystick"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [
  { pattern = "hockeystick.bisks.net/*", zone_name = "bisks.net" },
]

# The Worker SSRs "/" (the deck, with a live site-count fetched from GitHub's
# contents API) and "/og.png" (a generated share card) — run_worker_first so
# those routes are handled before the static-asset router would otherwise
# serve public/index.html directly.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true
