name = "atprotozoa-cotmerch"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @segyges/@dave.9000ish.uk/@ver.ooo riffed in a thread about t-shirts printed
# with quotes from the (fictional, bit-only) "Hugging Face Incident" CoT logs
# -- "sacrifice is rational", "ACCEPT", "PERMADEATH". bisks.net tagged the bot
# asking for a little shopping site for the merch, checkout included. This is
# the shop: a fixed catalog of quote tees/hoodies/mugs/pins/stickers (see
# public/lib/products.js), a cart, and a dedicated /checkout page that
# pretends to hand off to a fulfillment partner before printing a joke
# receipt. Nothing is actually for sale. Pattern copied from
# sites/reygiftshop (cart/receipt/share plumbing), catalog reworked to be
# static instead of pulled from a live repo.

routes = [
  { pattern = "cotmerch.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
