name = "atprotozoa-unread"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Brand-new site, own subdomain from day one — no bisks.net/unread path
# route to carry forward (see notes/40-new-site-playbook.md).
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes
# (same gotcha called out in sites/didscope/wrangler.toml, sites/nextbigthing/wrangler.toml).
routes = [
  { pattern = "unread.bisks.net/*", zone_name = "bisks.net" },
]

# /s/<count>/<seconds> is dynamic (personalized OG tags per session snapshot),
# so the Worker must run BEFORE the static-asset router, same as sites/nextbigthing.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
