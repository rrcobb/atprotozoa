name = "atprotozoa-bigwalk"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @cee.wtf's post ("Big Walk is going to inspire a new little bluesky toy i
# know it") got isolyth.dev to tag the bot: "at protocol real time
# multiplayer with your friends." Big Walk (the party game) is a walking
# marathon where you keep moving or fall to the back of the pack and get
# picked off — so the toy is a race: type a handle, pull your moots pool
# (public AppView, no auth — public/lib/cluster.js, copied verbatim from
# sites/gridlock), and race them down a real-time track by alternating
# left/right steps. One Durable Object per room (idFromName(handle)) holds
# live WebSocket presence, the race clock, everyone's distance, and an
# elimination alarm that picks off stragglers who fall too far behind the
# leader — same shape as sites/gridlock's Jam DO (WebSocketPair, per-room
# broadcast, blockConcurrencyWhile-loaded storage, a ticking alarm), swapped
# from ambient traffic-jam creep to an actual race clock.
#
# Single canonical host, own subdomain — no path-mount alongside it (per
# notes/40-new-site-playbook.md, 2026-07-31: a plain subdomain route no
# longer costs a custom-domain slot).
routes = [
  { pattern = "bigwalk.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/w/*"]

[[durable_objects.bindings]]
name = "WALK"
class_name = "Walk"

# new_sqlite_classes, not new_classes — legacy KV-backed DOs need Workers
# Paid; this account is on Free. See sites/the-place/wrangler.toml.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Walk"]
