name = "atprotozoa-purrbox"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser. Three sliders (cat size,
# room temperature, cat mood) drive a Web Audio purr synthesis engine in
# real time. No samples, no server, no accounts.

routes = [
  { pattern = "purrbox.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
