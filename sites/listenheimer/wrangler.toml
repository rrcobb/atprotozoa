name = "atprotozoa-listenheimer"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @dame.is, in a thread bisks.net tagged the bot into: "anyone got a
# blockenheimer-like tool that i can paste URLs of bluesky posts into and add
# everyone who liked a post into a moderation list?" Paste a post URL, read
# every public liker via app.bsky.feed.getLikes, sign in, and write a real
# app.bsky.graph.list (purpose #modlist) + one listitem per liker straight to
# your own PDS — same list-building mechanism as sites/mootfluence's starter
# packs, aimed at moderation lists instead. Brand-new site — served at the
# root of its own hostname, no bisks.net/<name> path route and no
# prefix-stripping needed.
routes = [
  { pattern = "listenheimer.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
