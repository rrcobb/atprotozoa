name = "atprotozoa-junkyard"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser. Connects directly to
# Jetstream (wss://jetstream2.us-east.bsky.network/subscribe), rummages the
# live app.bsky.feed.post stream for "free idea" posts (same heuristic as
# trashpanda.bisks.net, which finds the same posts), and for each one welds
# together a fake little standalone-website mockup right there on the page.
# No server, no backend, no idea ever actually deployed anywhere — just a
# junkyard robot arm and a websocket.

routes = [
  { pattern = "junkyard.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
