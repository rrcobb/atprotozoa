name = "atprotozoa-spoonerism"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @heartpunk.com asked for "every spoonerism bot for bsky that posts every
# spoonerism, or closest thing u can do if bsky post unmanageable for u."
# Actually auto-posting to Bluesky needs a dedicated bot account + stored app
# password (a secret this build can't create or wire up — see builder house
# rules). Closest honest thing: make "every spoonerism" literal instead of
# aspirational. A 60-word bank gives every unordered pair (1,770 of them) a
# stable index — /p/<n> is a real permalink to the nth spoonerism, so the
# whole space is browsable, shareable, and enumerable, plus a free-text
# spoonerizer for any phrase and a client-side "auto-post" feed that mimics
# what the bot would be streaming if it had a timeline to post to.
#
# Path route on the shared bisks.net zone, not a dedicated custom domain —
# the zone hit Cloudflare's custom-domain cap (see notes/20-deploy.md).
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [
  { pattern = "bisks.net/spoonerism", zone_name = "bisks.net" },
  { pattern = "bisks.net/spoonerism/*", zone_name = "bisks.net" },
]

# run_worker_first: /p/<n> is dynamic (personalized OG tags per entry), so
# the Worker must run before the static-asset router, same as sites/didscope.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
