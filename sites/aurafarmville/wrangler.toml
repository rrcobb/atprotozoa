name = "atprotozoa-aurafarmville"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Everything runs client-side (public/index.html: plots, crops, the whole
# aura economy lives in localStorage). The one server surface: /f/<code> is
# a real per-farm URL so a shared harvest unfurls with its own og:title/
# description instead of one generic card for every link (same fix as
# sites/bloomgarden and sites/didscope, see notes/45-sharing-and-virality.md).
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [{ pattern = "aurafarmville.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /f/<code> is dynamic (personalized OG tags per farm), so
# the Worker must run BEFORE the static-asset router.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
