name = "atprotozoa-koipond"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A live koi pond fed by the
# Bluesky firehose (jetstream): every incoming post makes a koi turn and dart,
# and accounts that post a lot grow into big, fat, lazy fish. Calm water, drifting
# lily pads, ripples where posts land. Built after @kumavis.me asked @buildthis
# (via idea-mill, re-tagged by @caleb.jasik.xyz) for "the firehose but every post
# is a koi in a pond; the chattiest accounts are the fattest, laziest fish."
# No secrets, no server.
main = "src/index.ts"

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# koipond.bisks.net is being retired to free a slot against the zone's
# custom-domain cap (see notes/20-deploy.md). Migrated to bisks.net/koipond
# instead. See notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "bisks.net/koipond", zone_name = "bisks.net" },
  { pattern = "bisks.net/koipond/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
