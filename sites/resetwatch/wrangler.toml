name = "atprotozoa-resetwatch"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Reads the public feed of
# @thsottiaux-bot.eurosky.social (an unofficial mirror of a Codex/ChatGPT exec's
# tweets) from the anonymous AppView, finds posts that read as a "usage limit
# reset" announcement, and shows the most recent one plus a timeline of the rest.
# No secrets, no server surface.
assets = { directory = "./public" }

routes = [{ pattern = "resetwatch.bisks.net/*", zone_name = "bisks.net" }]
