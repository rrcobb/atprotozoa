# @eggmansasshole.bsky.social asked for a 144p, 4-shade grayscale game
# window, Game-Boy-ish, that randomly generates its own assets, sounds,
# level, rules, and mechanics on every visit, leaving the player to figure
# out what's happening with just a D-pad and two buttons.
# @bisks.net gave the go-ahead in-thread.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed. Pure static
# site: everything (RNG, sprite/sound synthesis, mechanics) runs in the
# browser, no server state.
name = "atprotozoa-graycart"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [
  { pattern = "graycart.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
