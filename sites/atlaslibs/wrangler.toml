name = "atprotozoa-atlaslibs"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site — a mad-libs RPG generator whose "kingdoms" are real
# region/cluster labels from atlas.jazco.dev (Politics Isle, the Furry
# Archipelago, the Japanese Shore, ...), mad-libbed into a short fantasy
# quest. The generator picks a home region, an adjacent neighbor, and a
# distant region using a hand-mapped copy of the atlas's mainland/island
# geography (public/lib/generator.js) — everything runs client-side.
routes = [{ pattern = "atlaslibs.bisks.net/*", zone_name = "bisks.net" }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
