name = "atprotozoa-blueskyisms"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @7778777.online asked for a site "honouring the suffering of people
# affected by 'blueskyisms'" — the example in the thread was a reply that
# turned a vent post into linked logical atoms and an ontology, Tractatus
# style. Rather than name the real accounts involved (the consent test in
# builder/INSTRUCTIONS.md — real people don't get named/exposed for a joke
# site without asking), this catalogs the *pattern* generically: numbered,
# cross-linked propositions about Bluesky-specific posting afflictions,
# themselves styled after Wittgenstein's Tractatus. All client-side, static
# data — no state, no API calls, nothing dynamic for a Worker to do.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
routes = [
  { pattern = "blueskyisms.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
