name = "atprotozoa-mootpocalypse"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @cee.wtf: "project zomboid but all the zombies are bluesky posts from
# moots that you havent liked yet." The zombies are real: each one is an
# actual unliked post from a mutual, fetched live (authenticated, so
# viewer.like tells us what's really unread) from the public AppView. Liking
# a post — walking up and pressing the bite-back key — is a real
# app.bsky.feed.like write straight to the player's own repo. Clear the
# horde, clear your backlog. See public/game.js.

routes = [
  { pattern = "mootpocalypse.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
