<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>metronome</title>
<meta name="description" content="a fully client-side metronome: tap tempo, time signatures, subdivisions, and a setlist of saved presets." />

<meta property="og:type" content="website" />
<meta property="og:title" content="metronome" />
<meta property="og:description" content="tap tempo, time signatures, subdivisions, a flashing downbeat, and a setlist of saved presets. all in the browser." />
<meta property="og:url" content="https://metronome.bisks.net/" />
<meta property="og:image" content="https://metronome.bisks.net/og.png" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="metronome" />
<meta name="twitter:description" content="tap tempo, time signatures, subdivisions, a flashing downbeat, and a setlist of saved presets." />
<meta name="twitter:image" content="https://metronome.bisks.net/og.png" />

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23161616%22/><path d=%22M35 82 L46 18 L54 18 L65 82 Z%22 fill=%22none%22 stroke=%22%23f5a623%22 stroke-width=%226%22 stroke-linejoin=%22round%22/><line x1=%2250%22 y1=%2224%22 x2=%2250%22 y2=%2270%22 stroke=%22%23f5a623%22 stroke-width=%226%22 stroke-linecap=%22round%22 transform=%22rotate(20 50 70)%22/></svg>" />

<style>
  :root {
    --bg: #131316;
    --panel: #1c1c21;
    --panel-2: #232329;
    --line: #2f2f37;
    --text: #f2f1ee;
    --dim: #94929c;
    --accent: #f5a623;
    --accent-dim: #5c4419;
    --downbeat: #ff5d73;
    --downbeat-dim: #5c2530;
    --good: #6fd6a0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 14px 60px;
  }
  .wrap {
    width: 100%;
    max-width: 480px;
  }
  header {
    text-align: center;
    margin-bottom: 18px;
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 1.4rem;
    letter-spacing: 0.02em;
  }
  header h1 .dot { color: var(--accent); }
  header p {
    margin: 0;
    color: var(--dim);
    font-size: 0.85rem;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 14px;
  }

  /* Beat visualizer */
  .beats {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    min-height: 46px;
  }
  .beat-dot {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--panel-2);
    border: 2px solid var(--line);
    transition: background 60ms linear, border-color 60ms linear, transform 60ms linear;
  }
  .beat-dot.down { border-color: var(--downbeat-dim); }
  .beat-dot.lit { background: var(--accent); border-color: var(--accent); transform: scale(1.18); }
  .beat-dot.down.lit { background: var(--downbeat); border-color: var(--downbeat); transform: scale(1.3); }

  .bpm-row {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  #bpmNumber {
    width: 5.2rem;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 3rem;
    font-weight: 700;
    text-align: right;
    -moz-appearance: textfield;
  }
  #bpmNumber::-webkit-inner-spin-button, #bpmNumber::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .bpm-label {
    color: var(--dim);
    font-size: 1rem;
    align-self: center;
  }

  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
    height: 28px;
  }

  .row {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }

  button {
    font: inherit;
    cursor: pointer;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    padding: 10px 14px;
  }
  button:active { transform: translateY(1px); }
  button:hover { border-color: var(--accent); }

  #tapBtn {
    flex: 1;
    font-weight: 600;
  }
  #tapBtn .taplabel { display: block; }
  #tapBtn small { display: block; color: var(--dim); font-weight: 400; font-size: 0.72rem; margin-top: 2px; }

  #playBtn {
    flex: 1;
    font-weight: 700;
    background: var(--accent);
    color: #1a1305;
    border: none;
    font-size: 1.05rem;
    padding: 14px;
  }
  #playBtn.playing {
    background: var(--downbeat);
    color: #2a0007;
  }

  .grid2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  label.field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 0.78rem;
    color: var(--dim);
  }
  select {
    font: inherit;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 8px;
  }

  .vol-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
  }
  .vol-row span { color: var(--dim); font-size: 1.1rem; width: 1.2em; text-align: center; }

  h2 {
    font-size: 0.95rem;
    margin: 0 0 10px;
    color: var(--text);
  }

  .preset-form {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .preset-form input[type="text"] {
    flex: 1;
    font: inherit;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 10px;
  }
  .preset-form button {
    background: var(--accent-dim);
    color: var(--accent);
    border-color: var(--accent-dim);
    white-space: nowrap;
  }

  ul#presetList {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  ul#presetList li {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 10px;
  }
  ul#presetList .pname {
    flex: 1;
    font-weight: 600;
    font-size: 0.9rem;
  }
  ul#presetList .pmeta {
    color: var(--dim);
    font-size: 0.78rem;
  }
  ul#presetList button {
    padding: 6px 9px;
    font-size: 0.8rem;
  }
  ul#presetList button.del {
    background: transparent;
    color: var(--dim);
  }
  ul#presetList button.del:hover { color: var(--downbeat); border-color: var(--downbeat); }
  .empty-note { color: var(--dim); font-size: 0.82rem; text-align: center; padding: 6px 0; }

  footer {
    margin-top: 4px;
    text-align: center;
  }
  footer a {
    color: var(--dim);
    font-size: 0.8rem;
    text-decoration: none;
    border-bottom: 1px dotted var(--line);
  }
  footer a:hover { color: var(--accent); border-color: var(--accent); }

  @media (max-width: 380px) {
    #bpmNumber { font-size: 2.4rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>metro<span class="dot">nome</span></h1>
    <p>tap it out, or drag it in</p>
  </header>

  <div class="card">
    <div class="beats" id="beats" aria-hidden="true"></div>

    <div class="bpm-row">
      <input id="bpmNumber" type="number" min="30" max="280" value="120" inputmode="numeric" aria-label="BPM" />
      <span class="bpm-label">bpm</span>
    </div>
    <input id="bpmSlider" type="range" min="30" max="280" value="120" aria-label="Tempo slider" />

    <div class="row">
      <button id="tapBtn" type="button">
        <span class="taplabel">tap tempo</span>
        <small id="tapHint">tap a few times</small>
      </button>
    </div>
    <div class="row">
      <button id="playBtn" type="button">start</button>
    </div>

    <div class="vol-row">
      <span>🔈</span>
      <input id="volSlider" type="range" min="0" max="100" value="70" aria-label="Volume" />
      <span>🔊</span>
    </div>
  </div>

  <div class="card">
    <div class="grid2">
      <label class="field">
        time signature
        <select id="timeSig">
          <option value="2/4">2/4</option>
          <option value="3/4">3/4</option>
          <option value="4/4" selected>4/4</option>
          <option value="5/4">5/4</option>
          <option value="6/8">6/8</option>
        </select>
      </label>
      <label class="field">
        subdivision
        <select id="subdiv">
          <option value="1">quarter notes</option>
          <option value="2">eighth notes</option>
          <option value="3">triplets</option>
          <option value="4">sixteenth notes</option>
        </select>
      </label>
    </div>
  </div>

  <div class="card">
    <h2>setlist</h2>
    <div class="preset-form">
      <input id="presetName" type="text" placeholder="song name" maxlength="40" />
      <button id="savePreset" type="button">save preset</button>
    </div>
    <ul id="presetList"></ul>
    <p class="empty-note" id="emptyNote">no presets yet — dial in a tempo and save it.</p>
  </div>

  <footer>
    <a id="shareLink" href="https://bsky.app/intent/compose?text=metronome" target="_blank" rel="noopener">share on bluesky</a>
  </footer>
</div>

<script src="app.js"></script>
  <script defer src="https://footfall.bisks.net/beacon.js" data-site="metronome"></script>
</body>
</html>
