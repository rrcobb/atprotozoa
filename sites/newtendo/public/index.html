<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>newtendo — the bisks.net eshop</title>
    <meta name="description" content="Every game built for bisks.net, shelved as an insertable cartridge. Browse the library or insert a random one." />
    <meta property="og:title" content="newtendo" />
    <meta property="og:description" content="Every game built for bisks.net, shelved as an insertable cartridge. Browse the library or insert a random one." />
    <meta property="og:image" content="https://newtendo.bisks.net/og.png" />
    <meta property="og:url" content="https://newtendo.bisks.net/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="newtendo" />
    <meta name="twitter:description" content="Every game built for bisks.net, shelved as an insertable cartridge." />
    <meta name="twitter:image" content="https://newtendo.bisks.net/og.png" />
    <style>
      :root {
        --shell: #2b2b30;
        --shell2: #1c1c20;
        --plastic: #d8d4c8;
        --red: #e8433f;
        --red-dark: #a52a26;
        --ink: #17171a;
        --paper: #f2efe4;
        --muted: #8b8879;
        --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; background: var(--shell2);
        font-family: var(--mono); color: var(--paper);
      }
      body {
        background:
          radial-gradient(ellipse at top, #35353c 0%, var(--shell2) 60%);
        min-height: 100vh;
      }

      /* ---- console shell header ---- */
      .console {
        background: linear-gradient(180deg, var(--shell) 0%, var(--shell2) 100%);
        border-bottom: 4px solid var(--red-dark);
        padding: 1.6rem 1rem 1.2rem;
      }
      .console-inner { max-width: 900px; margin: 0 auto; }
      .brand {
        display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap;
      }
      .brand h1 {
        margin: 0; font-size: 2.1rem; letter-spacing: 0.06em; font-weight: 800;
        color: var(--paper);
        text-shadow: 3px 3px 0 var(--red);
      }
      .brand .badge {
        font-size: 0.62rem; letter-spacing: 0.12em; color: var(--shell2);
        background: var(--red); padding: 0.15rem 0.4rem; border-radius: 2px;
        transform: translateY(-0.3rem);
      }
      .tagline { margin: 0.5rem 0 0; color: #b9b6a8; font-size: 0.85rem; }

      .ticker-wrap {
        margin-top: 1rem; overflow: hidden; white-space: nowrap;
        border-top: 1px solid #45454c; border-bottom: 1px solid #45454c;
        background: var(--shell2); padding: 0.4rem 0;
      }
      .ticker {
        display: inline-block; padding-left: 100%;
        animation: scroll 60s linear infinite;
        font-size: 0.72rem; letter-spacing: 0.04em; color: var(--red);
      }
      .ticker span { margin-right: 2.5rem; }
      @keyframes scroll {
        from { transform: translateX(0); }
        to { transform: translateX(-100%); }
      }

      /* ---- library ---- */
      .wrap { max-width: 900px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }

      .toolbar {
        display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center;
        margin-bottom: 1.4rem;
      }
      .btn {
        font-family: var(--mono); font-size: 0.82rem; font-weight: 700;
        letter-spacing: 0.03em; cursor: pointer; border: none; border-radius: 3px;
        padding: 0.6rem 0.9rem; color: var(--paper); background: var(--red);
        box-shadow: 0 3px 0 var(--red-dark);
        transition: transform 0.05s ease;
      }
      .btn:active { transform: translateY(3px); box-shadow: none; }
      .btn.ghost {
        background: transparent; color: var(--paper); box-shadow: none;
        border: 1px solid #55555c;
      }
      input[type="search"] {
        font-family: var(--mono); font-size: 0.82rem; background: var(--shell2);
        color: var(--paper); border: 1px solid #45454c; border-radius: 3px;
        padding: 0.55rem 0.7rem; flex: 1; min-width: 140px;
      }
      .count { color: var(--muted); font-size: 0.78rem; margin-left: auto; }

      .shelf {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 0.9rem;
      }
      .cart {
        display: block; text-decoration: none; color: inherit;
        border-radius: 6px 6px 3px 3px; overflow: hidden;
        background: var(--plastic); color: var(--ink);
        border: 1px solid #00000030;
        box-shadow: 0 3px 0 #00000040;
        cursor: pointer;
        transition: transform 0.08s ease, box-shadow 0.08s ease;
      }
      .cart:hover { transform: translateY(-2px); box-shadow: 0 5px 0 #00000040; }
      .cart:active, .cart.inserting {
        transform: translateY(4px) scaleY(0.9);
        box-shadow: none;
        transform-origin: bottom;
      }
      .cart-top {
        height: 3.4rem;
        display: flex; align-items: center; justify-content: center;
        font-weight: 800; font-size: 1.3rem; color: #fff;
        text-shadow: 1px 1px 0 rgba(0,0,0,0.35);
      }
      .cart-notch {
        height: 0.5rem; background: var(--shell2);
        margin: 0 0.7rem; border-radius: 0 0 3px 3px;
      }
      .cart-label { padding: 0.55rem 0.65rem 0.75rem; }
      .cart-label h3 {
        margin: 0 0 0.3rem; font-size: 0.82rem; font-weight: 700;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .cart-label p {
        margin: 0; font-size: 0.68rem; line-height: 1.4; color: #47443a;
        display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .cart-label .by { margin-top: 0.35rem; font-size: 0.62rem; color: var(--muted); }
      .cart[hidden] { display: none; }

      /* ---- random-cartridge panel ---- */
      .overlay {
        position: fixed; inset: 0; background: rgba(10,10,12,0.88);
        display: none; align-items: center; justify-content: center; z-index: 10;
        padding: 1rem;
      }
      .overlay.show { display: flex; }
      .panel {
        background: var(--plastic); color: var(--ink); border-radius: 8px;
        max-width: 420px; width: 100%; padding: 1.4rem;
        box-shadow: 0 10px 0 #00000050;
      }
      .panel .loading {
        font-size: 0.85rem; letter-spacing: 0.05em; color: var(--red-dark);
        margin: 0 0 0.6rem; font-weight: 700;
      }
      .panel h2 { margin: 0 0 0.5rem; font-size: 1.3rem; }
      .panel p.blurb { font-size: 0.82rem; line-height: 1.5; color: #3a382f; margin: 0 0 0.4rem; }
      .panel p.by { font-size: 0.72rem; color: var(--muted); margin: 0 0 1rem; }
      .panel canvas { width: 100%; border-radius: 4px; margin-bottom: 1rem; display: block; }
      .panel-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }
      .panel-actions a, .panel-actions button {
        font-family: var(--mono); font-size: 0.78rem; font-weight: 700; text-decoration: none;
        border: none; border-radius: 3px; padding: 0.55rem 0.8rem; cursor: pointer;
      }
      .panel-actions .play { background: var(--red); color: var(--paper); box-shadow: 0 3px 0 var(--red-dark); }
      .panel-actions .share { background: #1a5fd0; color: #fff; box-shadow: 0 3px 0 #0e3d8c; }
      .panel-actions .close { background: transparent; color: var(--ink); border: 1px solid #00000030; box-shadow: none; }

      footer {
        max-width: 900px; margin: 2rem auto 0; padding: 1rem;
        color: var(--muted); font-size: 0.75rem;
        border-top: 1px solid #35353c;
      }
      footer a { color: var(--red); text-decoration: none; }
      footer a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="console">
      <div class="console-inner">
        <div class="brand">
          <h1>NEWTENDO</h1>
          <span class="badge">ENTERTAINMENT SYSTEM</span>
        </div>
        <p class="tagline">the bisks.net eshop — every game on the site, shelved as a cartridge</p>
        <div class="ticker-wrap">
          <div class="ticker" id="ticker"></div>
        </div>
      </div>
    </div>

    <div class="wrap">
      <div class="toolbar">
        <input type="search" id="search" placeholder="search the shelf…" />
        <button class="btn" id="random-btn">🎲 insert random cartridge</button>
        <span class="count" id="count"></span>
      </div>
      <div class="shelf" id="shelf"></div>
    </div>

    <footer>
      <a href="https://bisks.net/">bisks.net</a> · library rebuilt by hand from
      <code>sites/*/site.json</code> — not live, ping the bot to add new releases.
      requested by @antiali.as.
    </footer>

    <div class="overlay" id="overlay">
      <div class="panel" id="panel"></div>
    </div>

    <script>
      const COLORS = ["#e8433f", "#1a5fd0", "#2a9d5c", "#e8a63f", "#7a3fe8", "#3fc4e8", "#e83fa0"];

      function esc(s) {
        return String(s ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function hashStr(s) {
        let h = 0;
        for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
        return h;
      }
      function colorFor(name) {
        return COLORS[hashStr(name) % COLORS.length];
      }
      function initials(title) {
        return title
          .split(/[\s-]+/)
          .filter(Boolean)
          .slice(0, 2)
          .map((w) => w[0].toUpperCase())
          .join("");
      }

      let GAMES = [];

      async function load() {
        const res = await fetch("/data/games.json");
        GAMES = await res.json();
        renderTicker();
        renderShelf(GAMES);
        wireSearch();
        wireRandom();

        const g = new URLSearchParams(location.search).get("g");
        if (g) {
          const found = GAMES.find((x) => x.name === g);
          if (found) showPanel(found);
        }
      }

      function renderTicker() {
        const el = document.getElementById("ticker");
        const names = GAMES.map((g) => g.title.toUpperCase()).join("   ★   ");
        el.innerHTML = `<span>${names}</span><span>${names}</span>`;
      }

      function cartHTML(g) {
        const color = colorFor(g.name);
        return `
          <a class="cart" href="${esc(g.url)}" data-name="${esc(g.name)}" target="_blank" rel="noopener">
            <div class="cart-top" style="background:${color}">${esc(initials(g.title))}</div>
            <div class="cart-notch"></div>
            <div class="cart-label">
              <h3>${esc(g.title)}</h3>
              <p>${esc(g.blurb)}</p>
              ${g.by ? `<div class="by">by @${esc(g.by)}</div>` : ""}
            </div>
          </a>`;
      }

      function renderShelf(list) {
        const shelf = document.getElementById("shelf");
        shelf.innerHTML = list.map(cartHTML).join("");
        document.getElementById("count").textContent = `${list.length} cartridge${list.length === 1 ? "" : "s"}`;

        shelf.querySelectorAll(".cart").forEach((card) => {
          card.addEventListener("click", (e) => {
            card.classList.add("inserting");
            setTimeout(() => card.classList.remove("inserting"), 200);
          });
        });
      }

      function wireSearch() {
        document.getElementById("search").addEventListener("input", (e) => {
          const q = e.target.value.trim().toLowerCase();
          const filtered = !q
            ? GAMES
            : GAMES.filter(
                (g) =>
                  g.title.toLowerCase().includes(q) ||
                  g.blurb.toLowerCase().includes(q) ||
                  (g.by || "").toLowerCase().includes(q)
              );
          renderShelf(filtered);
        });
      }

      function wireRandom() {
        document.getElementById("random-btn").addEventListener("click", () => {
          const pick = GAMES[Math.floor(Math.random() * GAMES.length)];
          const url = new URL(location.href);
          url.searchParams.set("g", pick.name);
          history.replaceState(null, "", url);
          showPanel(pick, true);
        });
      }

      function buildShareText(g) {
        const shareUrl = `https://newtendo.bisks.net/?g=${encodeURIComponent(g.name)}`;
        let text = `newtendo dealt me a cartridge: "${g.title}" — ${shareUrl}`;
        const budget = 300 - text.length;
        if (budget > 10) {
          const blurb = g.blurb.length > budget - 3 ? g.blurb.slice(0, budget - 4).trim() + "…" : g.blurb;
          text = `newtendo dealt me a cartridge: "${g.title}" — ${blurb} ${shareUrl}`;
        }
        return text;
      }

      function drawCard(canvas, g) {
        const ctx = canvas.getContext("2d");
        const W = 1200, H = 630;
        canvas.width = W;
        canvas.height = H;
        const color = colorFor(g.name);

        ctx.fillStyle = "#1c1c20";
        ctx.fillRect(0, 0, W, H);

        // cartridge body
        const cx = 90, cy = 90, cw = W - 180, ch = H - 180;
        ctx.fillStyle = "#d8d4c8";
        roundRect(ctx, cx, cy, cw, ch, 24);
        ctx.fill();

        // top color band
        ctx.fillStyle = color;
        roundRectTop(ctx, cx, cy, cw, 150, 24);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.font = "800 64px ui-monospace, monospace";
        ctx.textBaseline = "middle";
        ctx.fillText(initials(g.title), cx + 36, cy + 78);

        ctx.fillStyle = "#e8433f";
        ctx.font = "800 28px ui-monospace, monospace";
        ctx.fillText("NEWTENDO", cx + cw - 260, cy + 40);
        ctx.fillStyle = "#8b8879";
        ctx.font = "600 18px ui-monospace, monospace";
        ctx.fillText("ENTERTAINMENT SYSTEM", cx + cw - 260, cy + 68);

        ctx.fillStyle = "#17171a";
        ctx.font = "800 46px ui-monospace, monospace";
        ctx.fillText(g.title, cx + 36, cy + 220);

        ctx.fillStyle = "#3a382f";
        ctx.font = "400 24px ui-monospace, monospace";
        wrapText(ctx, g.blurb, cx + 36, cy + 280, cw - 72, 34, 5);

        if (g.by) {
          ctx.fillStyle = "#8b8879";
          ctx.font = "400 22px ui-monospace, monospace";
          ctx.fillText(`by @${g.by}`, cx + 36, cy + ch - 60);
        }
        ctx.fillStyle = "#e8433f";
        ctx.font = "700 22px ui-monospace, monospace";
        ctx.textAlign = "right";
        ctx.fillText("newtendo.bisks.net", cx + cw - 36, cy + ch - 60);
        ctx.textAlign = "left";
      }

      function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }
      function roundRectTop(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x, y + h);
        ctx.lineTo(x, y + r);
        ctx.arcTo(x, y, x + r, y, r);
        ctx.lineTo(x + w - r, y);
        ctx.arcTo(x + w, y, x + w, y + r, r);
        ctx.lineTo(x + w, y + h);
        ctx.closePath();
      }
      function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
        const words = text.split(" ");
        let line = "";
        let lines = [];
        for (const w of words) {
          const test = line ? line + " " + w : w;
          if (ctx.measureText(test).width > maxWidth && line) {
            lines.push(line);
            line = w;
          } else {
            line = test;
          }
        }
        if (line) lines.push(line);
        if (lines.length > maxLines) {
          lines = lines.slice(0, maxLines);
          lines[maxLines - 1] = lines[maxLines - 1].replace(/\s*\S*$/, "…");
        }
        lines.forEach((l, i) => ctx.fillText(l, x, y + i * lineHeight));
      }

      function canShareFiles() {
        if (!navigator.share || !navigator.canShare) return false;
        try {
          const probe = new File([""], "probe.png", { type: "image/png" });
          return navigator.canShare({ files: [probe] });
        } catch {
          return false;
        }
      }

      function showPanel(g, animate) {
        const overlay = document.getElementById("overlay");
        const panel = document.getElementById("panel");
        const shareText = buildShareText(g);
        const shareHref = "https://bsky.app/intent/compose?text=" + encodeURIComponent(shareText);

        panel.innerHTML = animate ? `<p class="loading">NOW LOADING…</p>` : "";
        overlay.classList.add("show");

        const reveal = () => {
          panel.innerHTML = `
            <canvas id="share-canvas"></canvas>
            <h2>${esc(g.title)}</h2>
            <p class="blurb">${esc(g.blurb)}</p>
            ${g.by ? `<p class="by">by @${esc(g.by)}</p>` : ""}
            <div class="panel-actions">
              <a class="play" href="${esc(g.url)}" target="_blank" rel="noopener">▶ play it</a>
              <a class="share" href="${shareHref}" target="_blank" rel="noopener">share to bluesky</a>
              <button class="close" id="close-panel">close</button>
            </div>
          `;
          const canvas = document.getElementById("share-canvas");
          drawCard(canvas, g);

          if (canShareFiles()) {
            canvas.style.cursor = "pointer";
            canvas.title = "tap to share as image";
            canvas.addEventListener("click", async () => {
              canvas.toBlob(async (blob) => {
                const file = new File([blob], "newtendo.png", { type: "image/png" });
                try {
                  await navigator.share({ files: [file], text: shareText, title: "newtendo" });
                } catch {}
              });
            });
          }

          document.getElementById("close-panel").addEventListener("click", () => {
            overlay.classList.remove("show");
          });
        };

        if (animate) setTimeout(reveal, 500);
        else reveal();
      }

      document.getElementById("overlay").addEventListener("click", (e) => {
        if (e.target.id === "overlay") e.target.classList.remove("show");
      });

      load();
    </script>
  </body>
</html>
