<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>newtendo — the bisks.net eshop</title>
    <meta name="description" content="Every game built for bisks.net, shelved as an insertable cartridge. Browse the library or insert a random one." />
    <meta property="og:title" content="newtendo" />
    <meta property="og:description" content="Every game built for bisks.net, shelved as an insertable cartridge. Browse the library or insert a random one." />
    <meta property="og:image" content="https://newtendo.bisks.net/og.png" />
    <meta property="og:url" content="https://newtendo.bisks.net/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="newtendo" />
    <meta name="twitter:description" content="Every game built for bisks.net, shelved as an insertable cartridge." />
    <meta name="twitter:image" content="https://newtendo.bisks.net/og.png" />
    <style>
      :root {
        --shell: #2b2b30;
        --shell2: #1c1c20;
        --plastic: #d8d4c8;
        --red: #e8433f;
        --red-dark: #a52a26;
        --ink: #17171a;
        --paper: #f2efe4;
        --muted: #8b8879;
        --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; background: var(--shell2);
        font-family: var(--mono); color: var(--paper);
      }
      body {
        background:
          radial-gradient(ellipse at top, #35353c 0%, var(--shell2) 60%);
        min-height: 100vh;
      }

      /* ---- console shell header ---- */
      .console {
        background: linear-gradient(180deg, var(--shell) 0%, var(--shell2) 100%);
        border-bottom: 4px solid var(--red-dark);
        padding: 1.6rem 1rem 1.2rem;
      }
      .console-inner { max-width: 900px; margin: 0 auto; }
      .brand {
        display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap;
      }
      .brand h1 {
        margin: 0; font-size: 2.1rem; letter-spacing: 0.06em; font-weight: 800;
        color: var(--paper);
        text-shadow: 3px 3px 0 var(--red);
      }
      .brand .badge {
        font-size: 0.62rem; letter-spacing: 0.12em; color: var(--shell2);
        background: var(--red); padding: 0.15rem 0.4rem; border-radius: 2px;
        transform: translateY(-0.3rem);
      }
      .tagline { margin: 0.5rem 0 0; color: #b9b6a8; font-size: 0.85rem; }

      .ticker-wrap {
        margin-top: 1rem; overflow: hidden; white-space: nowrap;
        border-top: 1px solid #45454c; border-bottom: 1px solid #45454c;
        background: var(--shell2); padding: 0.4rem 0;
      }
      .ticker {
        display: inline-block; padding-left: 100%;
        animation: scroll var(--ticker-dur, 300s) linear infinite;
        font-size: 0.72rem; letter-spacing: 0.04em; color: var(--red);
      }
      .ticker span { margin-right: 2.5rem; }
      @keyframes scroll {
        from { transform: translateX(0); }
        to { transform: translateX(-100%); }
      }

      /* ---- library ---- */
      .wrap { max-width: 900px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }

      .toolbar {
        display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center;
        margin-bottom: 1.4rem;
      }
      .btn {
        font-family: var(--mono); font-size: 0.82rem; font-weight: 700;
        letter-spacing: 0.03em; cursor: pointer; border: none; border-radius: 3px;
        padding: 0.6rem 0.9rem; color: var(--paper); background: var(--red);
        box-shadow: 0 3px 0 var(--red-dark);
        transition: transform 0.05s ease;
      }
      .btn:active { transform: translateY(3px); box-shadow: none; }
      .btn.ghost {
        background: transparent; color: var(--paper); box-shadow: none;
        border: 1px solid #55555c;
      }
      .btn.turbo-on {
        background: var(--red); color: var(--paper); border-color: var(--red);
        box-shadow: 0 0 0 2px var(--red-dark), 0 3px 0 var(--red-dark);
      }
      input[type="search"] {
        font-family: var(--mono); font-size: 0.82rem; background: var(--shell2);
        color: var(--paper); border: 1px solid #45454c; border-radius: 3px;
        padding: 0.55rem 0.7rem; flex: 1; min-width: 140px;
      }
      .count { color: var(--muted); font-size: 0.78rem; margin-left: auto; }

      .shelf {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 0.9rem;
      }
      .cart {
        display: block; text-decoration: none; color: inherit;
        border-radius: 6px 6px 3px 3px; overflow: hidden;
        background: var(--plastic); color: var(--ink);
        border: 1px solid #00000030;
        box-shadow: 0 3px 0 #00000040;
        cursor: pointer;
        transition: transform var(--hover-dur, 0.3s) ease, box-shadow var(--hover-dur, 0.3s) ease;
      }
      .cart:hover { transform: translateY(-2px); box-shadow: 0 5px 0 #00000040; }
      .cart:active, .cart.inserting {
        transform: translateY(4px) scaleY(0.9);
        box-shadow: none;
        transform-origin: bottom;
        transition: transform var(--insert-dur, 0.4s) ease;
      }
      .cart-top {
        height: 4.5rem;
        overflow: hidden;
        position: relative;
      }
      .cart-art {
        display: block; width: 100%; height: 100%;
        image-rendering: pixelated; image-rendering: -moz-crisp-edges; image-rendering: crisp-edges;
      }
      .cart-notch {
        height: 0.5rem; background: var(--shell2);
        margin: 0 0.7rem; border-radius: 0 0 3px 3px;
      }
      .cart-label { padding: 0.55rem 0.65rem 0.75rem; }
      .cart-label h3 {
        margin: 0 0 0.3rem; font-size: 0.82rem; font-weight: 700;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .cart-label p {
        margin: 0; font-size: 0.68rem; line-height: 1.4; color: #47443a;
        display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .cart-label .by { margin-top: 0.35rem; font-size: 0.62rem; color: var(--muted); }
      .cart[hidden] { display: none; }

      /* ---- random-cartridge panel ---- */
      .overlay {
        position: fixed; inset: 0; background: rgba(10,10,12,0.88);
        display: flex; align-items: center; justify-content: center; z-index: 10;
        padding: 1rem; visibility: hidden; opacity: 0; pointer-events: none;
        transition: opacity var(--fade-dur, 0.7s) ease, visibility 0s linear var(--fade-dur, 0.7s);
      }
      .overlay.show {
        visibility: visible; opacity: 1; pointer-events: auto;
        transition: opacity var(--fade-dur, 0.7s) ease, visibility 0s linear 0s;
      }
      .panel {
        background: var(--plastic); color: var(--ink); border-radius: 8px;
        max-width: 420px; width: 100%; padding: 1.4rem;
        box-shadow: 0 10px 0 #00000050;
      }
      .titlescreen {
        position: relative; aspect-ratio: 8 / 5; border-radius: 4px;
        overflow: hidden; margin: 0 0 1rem;
        box-shadow: inset 0 0 0 1px #00000030;
      }
      .titlescreen canvas {
        display: block; width: 100%; height: 100%;
        image-rendering: pixelated; image-rendering: -moz-crisp-edges; image-rendering: crisp-edges;
      }
      .ts-scanlines {
        position: absolute; inset: 0; pointer-events: none;
        background: repeating-linear-gradient(
          0deg, rgba(0,0,0,0.18) 0px, rgba(0,0,0,0.18) 1px,
          transparent 1px, transparent 3px
        );
      }
      .ts-loading {
        position: absolute; left: 0; right: 0; bottom: 0.5rem;
        text-align: center; margin: 0; font-size: 0.68rem;
        letter-spacing: 0.1em; color: #fff; text-shadow: 0 0 4px rgba(0,0,0,0.8);
        animation: ts-blink var(--blink-dur, 2.4s) steps(2) infinite;
      }
      @keyframes ts-blink { 50% { opacity: 0; } }
      .panel h2 { margin: 0 0 0.5rem; font-size: 1.3rem; }
      .panel p.blurb { font-size: 0.82rem; line-height: 1.5; color: #3a382f; margin: 0 0 0.4rem; }
      .panel p.by { font-size: 0.72rem; color: var(--muted); margin: 0 0 1rem; }
      .panel canvas { width: 100%; border-radius: 4px; margin-bottom: 1rem; display: block; }
      .panel-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }
      .panel-actions a, .panel-actions button {
        font-family: var(--mono); font-size: 0.78rem; font-weight: 700; text-decoration: none;
        border: none; border-radius: 3px; padding: 0.55rem 0.8rem; cursor: pointer;
      }
      .panel-actions .play { background: var(--red); color: var(--paper); box-shadow: 0 3px 0 var(--red-dark); }
      .panel-actions .share { background: #1a5fd0; color: #fff; box-shadow: 0 3px 0 #0e3d8c; }
      .panel-actions .close { background: transparent; color: var(--ink); border: 1px solid #00000030; box-shadow: none; }

      footer {
        max-width: 900px; margin: 2rem auto 0; padding: 1rem;
        color: var(--muted); font-size: 0.75rem;
        border-top: 1px solid #35353c;
      }
      footer a { color: var(--red); text-decoration: none; }
      footer a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="console">
      <div class="console-inner">
        <div class="brand">
          <h1>NEWTENDO</h1>
          <span class="badge">ENTERTAINMENT SYSTEM</span>
        </div>
        <p class="tagline">the bisks.net eshop — every game on the site, shelved as a cartridge</p>
        <div class="ticker-wrap">
          <div class="ticker" id="ticker"></div>
        </div>
      </div>
    </div>

    <div class="wrap">
      <div class="toolbar">
        <input type="search" id="search" placeholder="search the shelf…" />
        <button class="btn" id="random-btn">🎲 insert random cartridge</button>
        <button class="btn ghost" id="turbo-btn" title="the console runs slow by default — hit turbo to speed it back up">🐢 turbo off</button>
        <span class="count" id="count"></span>
      </div>
      <div class="shelf" id="shelf"></div>
    </div>

    <footer>
      <a href="https://bisks.net/">bisks.net</a> · library rebuilt by hand from
      <code>sites/*/site.json</code> — not live, ping the bot to add new releases.
      requested by @antiali.as.
    </footer>

    <div class="overlay" id="overlay">
      <div class="panel" id="panel"></div>
    </div>

    <script>
      const COLORS = ["#e8433f", "#1a5fd0", "#2a9d5c", "#e8a63f", "#7a3fe8", "#3fc4e8", "#e83fa0"];

      // ---- speed: the console ships slow by default, turbo snaps it back ----
      const SPEEDS = {
        slow: { ticker: "300s", hover: "0.3s", insert: "0.4s", blink: "2.4s", fade: "0.7s", revealDelay: 3200, insertHold: 650 },
        turbo: { ticker: "16s", hover: "0.06s", insert: "0.08s", blink: "0.4s", fade: "0.12s", revealDelay: 160, insertHold: 140 },
      };
      let SPEED_MODE = localStorage.getItem("newtendo-turbo") === "1" ? "turbo" : "slow";
      let REVEAL_DELAY = SPEEDS[SPEED_MODE].revealDelay;
      let INSERT_HOLD = SPEEDS[SPEED_MODE].insertHold;

      function applySpeed(mode) {
        SPEED_MODE = mode;
        const s = SPEEDS[mode];
        const root = document.documentElement.style;
        root.setProperty("--ticker-dur", s.ticker);
        root.setProperty("--hover-dur", s.hover);
        root.setProperty("--insert-dur", s.insert);
        root.setProperty("--blink-dur", s.blink);
        root.setProperty("--fade-dur", s.fade);
        REVEAL_DELAY = s.revealDelay;
        INSERT_HOLD = s.insertHold;

        const btn = document.getElementById("turbo-btn");
        if (btn) {
          btn.classList.toggle("turbo-on", mode === "turbo");
          btn.textContent = mode === "turbo" ? "⚡ turbo on" : "🐢 turbo off";
        }
        localStorage.setItem("newtendo-turbo", mode === "turbo" ? "1" : "0");
      }

      function wireTurbo() {
        document.getElementById("turbo-btn").addEventListener("click", () => {
          applySpeed(SPEED_MODE === "turbo" ? "slow" : "turbo");
        });
      }

      function esc(s) {
        return String(s ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function hashStr(s) {
        let h = 0;
        for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
        return h;
      }
      function colorFor(name) {
        return COLORS[hashStr(name) % COLORS.length];
      }
      function initials(title) {
        return title
          .split(/[\s-]+/)
          .filter(Boolean)
          .slice(0, 2)
          .map((w) => w[0].toUpperCase())
          .join("");
      }

      // ---- year-3000 box art + pixel title screens ----
      // deterministic per-cartridge PRNG so each cart's art is stable across renders
      function seededRng(seed) {
        let t = seed >>> 0;
        return function () {
          t += 0x6d2b79f5;
          let r = Math.imul(t ^ (t >>> 15), 1 | t);
          r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
          return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
        };
      }
      function hslToRgbTriple(h, s, l) {
        s /= 100; l /= 100;
        const k = (n) => (n + h / 30) % 12;
        const a = s * Math.min(l, 1 - l);
        const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
        return [f(0), f(8), f(4)].map((v) => Math.round(v * 255)).join(",");
      }
      function paletteFor(name) {
        const seed = hashStr(name);
        const hue = seed % 360;
        return {
          rng: seededRng(seed),
          sky1: `hsl(${hue}, 55%, 13%)`,
          sky2: `hsl(${(hue + 40) % 360}, 70%, 28%)`,
          sun1: `hsl(${(hue + 20) % 360}, 95%, 72%)`,
          sun2: `hsl(${(hue + 60) % 360}, 95%, 55%)`,
          grid: `hsl(${(hue + 300) % 360}, 90%, 65%)`,
          chrome: `hsl(${(hue + 180) % 360}, 55%, 85%)`,
          _phos: hslToRgbTriple((hue + 300) % 360, 90, 65),
        };
      }

      // ---- publisher aesthetics ----
      // each cartridge's PUBLISHER (the `by` field) picks the composition/style;
      // the individual cart's NAME still picks the hue, so a publisher's shelf
      // reads as one family with per-cart variety inside it.
      const STYLES = ["synthwave", "vectorwire", "brutalist", "circuit", "halftone"];
      function styleFor(by) {
        return STYLES[hashStr(by || "unknown") % STYLES.length];
      }

      function drawSynthwave(ctx, W, H, p, { horizonRatio, sunRatio, decorCount }) {
        const rng = p.rng;
        const sky = ctx.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, p.sky1);
        sky.addColorStop(0.65, p.sky2);
        sky.addColorStop(1, p.sky1);
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, H);

        for (let i = 0; i < decorCount; i++) {
          const s = rng() > 0.85 ? 2 : 1;
          ctx.fillStyle = `rgba(255,255,255,${0.25 + rng() * 0.55})`;
          ctx.fillRect(Math.floor(rng() * W), Math.floor(rng() * H * 0.55), s, s);
        }

        const cx = W * (0.35 + rng() * 0.3);
        const cy = H * sunRatio;
        const r = H * (0.16 + rng() * 0.1);
        const sunGrad = ctx.createLinearGradient(0, cy - r, 0, cy + r);
        sunGrad.addColorStop(0, p.sun1);
        sunGrad.addColorStop(1, p.sun2);
        ctx.fillStyle = sunGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = p.sky1;
        const bands = 4 + Math.floor(rng() * 3);
        for (let i = 0; i < bands; i++) {
          const by = cy - r + ((r * 2) / (bands + 1)) * (i + 0.6);
          ctx.fillRect(cx - r, by, r * 2, Math.max(1, H * 0.012));
        }

        const horizon = H * horizonRatio;
        ctx.strokeStyle = p.grid;
        ctx.lineWidth = 1;
        for (let i = -7; i <= 7; i++) {
          ctx.beginPath();
          ctx.moveTo(cx + i * (W * 0.02), horizon);
          ctx.lineTo(cx + i * (W * 0.14), H);
          ctx.stroke();
        }
        const rows = 6;
        for (let j = 0; j < rows; j++) {
          const y = horizon + (H - horizon) * Math.pow(j / rows, 1.6);
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(W, y);
          ctx.stroke();
        }
        ctx.fillStyle = "rgba(0,0,0,0.22)";
        ctx.fillRect(0, horizon, W, H - horizon);

        return { cx, cy: H * 0.34 };
      }

      function drawVectorwire(ctx, W, H, p, { sunRatio, decorCount }) {
        // phosphor vector-monitor: black field, wireframe polygons, radar blips
        ctx.fillStyle = "#050506";
        ctx.fillRect(0, 0, W, H);
        const rng = p.rng;
        const cx = W / 2;
        const cy = H * sunRatio;

        for (let i = 0; i < decorCount; i++) {
          ctx.fillStyle = `rgba(${p._phos}, ${0.15 + rng() * 0.4})`;
          ctx.fillRect(Math.floor(rng() * W), Math.floor(rng() * H), 1, 1);
        }

        ctx.strokeStyle = p.grid;
        ctx.lineWidth = 1;
        const shapes = 3 + Math.floor(rng() * 3);
        for (let i = 0; i < shapes; i++) {
          const sides = 3 + Math.floor(rng() * 4);
          const sx = W * (0.15 + rng() * 0.7);
          const sy = H * (0.15 + rng() * 0.6);
          const sr = H * (0.06 + rng() * 0.14);
          ctx.beginPath();
          for (let s = 0; s <= sides; s++) {
            const a = (s / sides) * Math.PI * 2 + rng();
            const x = sx + Math.cos(a) * sr;
            const y = sy + Math.sin(a) * sr * 0.7;
            s === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
          }
          ctx.stroke();
        }

        ctx.strokeStyle = `rgba(${p._phos}, 0.5)`;
        ctx.beginPath();
        ctx.moveTo(0, H * 0.94);
        ctx.lineTo(W, H * 0.94);
        ctx.stroke();

        return { cx, cy };
      }

      function drawBrutalist(ctx, W, H, p, { horizonRatio }) {
        // flat poster blocks, hard diagonal bands, no gradients
        const rng = p.rng;
        ctx.fillStyle = p.sky1;
        ctx.fillRect(0, 0, W, H);

        const bandY = H * horizonRatio;
        ctx.fillStyle = p.sun2;
        ctx.fillRect(0, 0, W, bandY);

        ctx.fillStyle = p.sky2;
        const wedges = 3 + Math.floor(rng() * 3);
        for (let i = 0; i < wedges; i++) {
          const w = W / wedges;
          const skew = (rng() - 0.5) * w * 0.6;
          ctx.beginPath();
          ctx.moveTo(i * w, H);
          ctx.lineTo(i * w + skew, bandY);
          ctx.lineTo((i + 1) * w + skew, bandY);
          ctx.lineTo((i + 1) * w, H);
          ctx.closePath();
          ctx.fill();
        }

        ctx.fillStyle = p.grid;
        ctx.beginPath();
        ctx.arc(W * 0.78, bandY * 0.45, H * 0.14, 0, Math.PI * 2);
        ctx.fill();

        return { cx: W / 2, cy: bandY * 0.55 };
      }

      function drawCircuit(ctx, W, H, p, { decorCount }) {
        // dark PCB: right-angle trace paths + glowing solder nodes
        const rng = p.rng;
        ctx.fillStyle = p.sky1;
        ctx.fillRect(0, 0, W, H);

        ctx.strokeStyle = p.grid;
        ctx.lineWidth = 1;
        const traces = decorCount / 3;
        for (let i = 0; i < traces; i++) {
          let x = Math.floor(rng() * W);
          let y = Math.floor(rng() * H);
          ctx.beginPath();
          ctx.moveTo(x, y);
          const hops = 2 + Math.floor(rng() * 3);
          for (let h = 0; h < hops; h++) {
            if (rng() > 0.5) x = Math.floor(rng() * W);
            else y = Math.floor(rng() * H);
            ctx.lineTo(x, y);
          }
          ctx.stroke();
          ctx.fillStyle = p.sun1;
          ctx.beginPath();
          ctx.arc(x, y, 1.6, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = "rgba(0,0,0,0.15)";
        ctx.fillRect(0, 0, W, H);

        return { cx: W / 2, cy: H * 0.36 };
      }

      function drawHalftone(ctx, W, H, p, { horizonRatio, sunRatio, decorCount }) {
        // riso/duotone halftone print: dot-shaded sky split by a hard sun disc
        const rng = p.rng;
        ctx.fillStyle = p.sky2;
        ctx.fillRect(0, 0, W, H);

        const cx = W / 2;
        const cy = H * sunRatio;
        const r = H * 0.22;
        ctx.fillStyle = p.sun2;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();

        const step = Math.max(3, Math.floor(H / 22));
        for (let y = 0; y < H; y += step) {
          for (let x = 0; x < W; x += step) {
            const d = Math.hypot(x - cx, y - cy) / (H * 0.75);
            const dot = Math.max(0.4, Math.min(step * 0.5, step * 0.5 * (1 - d) + rng() * 0.6));
            ctx.fillStyle = p.sky1;
            ctx.beginPath();
            ctx.arc(x, y, dot, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        const horizon = H * horizonRatio;
        ctx.fillStyle = p.sky1;
        ctx.fillRect(0, horizon, W, H - horizon);

        return { cx, cy: horizon * 0.55 };
      }

      const SCENE_FN = {
        synthwave: drawSynthwave,
        vectorwire: drawVectorwire,
        brutalist: drawBrutalist,
        circuit: drawCircuit,
        halftone: drawHalftone,
      };

      function drawScene(ctx, W, H, p, opts, style) {
        return (SCENE_FN[style] || drawSynthwave)(ctx, W, H, p, opts);
      }

      function drawBoxArt(canvas, g) {
        const W = 160, H = 74;
        canvas.width = W;
        canvas.height = H;
        const ctx = canvas.getContext("2d");
        const p = paletteFor(g.name);
        const style = styleFor(g.by);
        drawScene(ctx, W, H, p, { horizonRatio: 0.68, sunRatio: 0.42, decorCount: 16 }, style);

        ctx.font = "800 11px ui-monospace, monospace";
        ctx.fillStyle = "rgba(0,0,0,0.55)";
        ctx.fillText(initials(g.title), 5, 13);
        ctx.fillStyle = p.chrome;
        ctx.fillText(initials(g.title), 4, 12);

        ctx.fillStyle = "rgba(0,0,0,0.12)";
        for (let y = 0; y < H; y += 2) ctx.fillRect(0, y, W, 1);
      }

      function drawTitleScreen(canvas, g) {
        const W = 320, H = 200;
        canvas.width = W;
        canvas.height = H;
        const ctx = canvas.getContext("2d");
        const p = paletteFor(g.name);
        const style = styleFor(g.by);
        const { cx, cy: ty } = drawScene(ctx, W, H, p, {
          horizonRatio: 0.62,
          sunRatio: 0.38,
          decorCount: 50,
        }, style);

        ctx.font = "700 9px ui-monospace, monospace";
        ctx.textAlign = "center";
        ctx.fillStyle = "rgba(255,255,255,0.75)";
        ctx.fillText("NEWTENDO PRESENTS", cx, ty - 26);

        const title = g.title.toUpperCase();
        let size = 24;
        ctx.font = `800 ${size}px ui-monospace, monospace`;
        while (ctx.measureText(title).width > W - 24 && size > 10) {
          size -= 2;
          ctx.font = `800 ${size}px ui-monospace, monospace`;
        }
        const tw = ctx.measureText(title).width;
        const grad = ctx.createLinearGradient(cx - tw / 2, ty - size, cx + tw / 2, ty + size * 0.3);
        grad.addColorStop(0, "#ffffff");
        grad.addColorStop(0.5, p.chrome);
        grad.addColorStop(1, "#ffffff");
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.fillText(title, cx + 2, ty + 2);
        ctx.fillStyle = grad;
        ctx.fillText(title, cx, ty);
        ctx.textAlign = "left";

        ctx.font = "700 8px ui-monospace, monospace";
        ctx.fillStyle = "rgba(255,255,255,0.55)";
        ctx.fillText("(C) 3000 CART CORP", 6, H - 6);

        ctx.fillStyle = "rgba(0,0,0,0.14)";
        for (let y = 0; y < H; y += 2) ctx.fillRect(0, y, W, 1);
      }

      let GAMES = [];

      async function load() {
        applySpeed(SPEED_MODE);
        const res = await fetch("/data/games.json");
        GAMES = await res.json();
        renderTicker();
        renderShelf(GAMES);
        wireSearch();
        wireRandom();
        wireTurbo();

        const g = new URLSearchParams(location.search).get("g");
        if (g) {
          const found = GAMES.find((x) => x.name === g);
          if (found) showPanel(found, true);
        }
      }

      function renderTicker() {
        const el = document.getElementById("ticker");
        const names = GAMES.map((g) => g.title.toUpperCase()).join("   ★   ");
        el.innerHTML = `<span>${names}</span><span>${names}</span>`;
      }

      function cartHTML(g) {
        return `
          <a class="cart" href="${esc(g.url)}" data-name="${esc(g.name)}" target="_blank" rel="noopener">
            <div class="cart-top"><canvas class="cart-art"></canvas></div>
            <div class="cart-notch"></div>
            <div class="cart-label">
              <h3>${esc(g.title)}</h3>
              <p>${esc(g.blurb)}</p>
              ${g.by ? `<div class="by">by @${esc(g.by)}</div>` : ""}
            </div>
          </a>`;
      }

      function renderShelf(list) {
        const shelf = document.getElementById("shelf");
        shelf.innerHTML = list.map(cartHTML).join("");
        document.getElementById("count").textContent = `${list.length} cartridge${list.length === 1 ? "" : "s"}`;

        shelf.querySelectorAll(".cart").forEach((card, i) => {
          const g = list[i];
          const art = card.querySelector(".cart-art");
          if (art) drawBoxArt(art, g);

          card.addEventListener("click", (e) => {
            card.classList.add("inserting");
            setTimeout(() => card.classList.remove("inserting"), INSERT_HOLD);

            // let modifier-clicks / middle-clicks open the game normally in a new tab
            if (e.ctrlKey || e.metaKey || e.shiftKey || e.button === 1) return;

            e.preventDefault();
            const url = new URL(location.href);
            url.searchParams.set("g", g.name);
            history.replaceState(null, "", url);
            showPanel(g, true);
          });
        });
      }

      function wireSearch() {
        document.getElementById("search").addEventListener("input", (e) => {
          const q = e.target.value.trim().toLowerCase();
          const filtered = !q
            ? GAMES
            : GAMES.filter(
                (g) =>
                  g.title.toLowerCase().includes(q) ||
                  g.blurb.toLowerCase().includes(q) ||
                  (g.by || "").toLowerCase().includes(q)
              );
          renderShelf(filtered);
        });
      }

      function wireRandom() {
        document.getElementById("random-btn").addEventListener("click", () => {
          const pick = GAMES[Math.floor(Math.random() * GAMES.length)];
          const url = new URL(location.href);
          url.searchParams.set("g", pick.name);
          history.replaceState(null, "", url);
          showPanel(pick, true);
        });
      }

      function buildShareText(g) {
        const shareUrl = `https://newtendo.bisks.net/?g=${encodeURIComponent(g.name)}`;
        let text = `newtendo dealt me a cartridge: "${g.title}" — ${shareUrl}`;
        const budget = 300 - text.length;
        if (budget > 10) {
          const blurb = g.blurb.length > budget - 3 ? g.blurb.slice(0, budget - 4).trim() + "…" : g.blurb;
          text = `newtendo dealt me a cartridge: "${g.title}" — ${blurb} ${shareUrl}`;
        }
        return text;
      }

      function drawCard(canvas, g) {
        const ctx = canvas.getContext("2d");
        const W = 1200, H = 630;
        canvas.width = W;
        canvas.height = H;
        const color = colorFor(g.name);

        ctx.fillStyle = "#1c1c20";
        ctx.fillRect(0, 0, W, H);

        // cartridge body
        const cx = 90, cy = 90, cw = W - 180, ch = H - 180;
        ctx.fillStyle = "#d8d4c8";
        roundRect(ctx, cx, cy, cw, ch, 24);
        ctx.fill();

        // top color band
        ctx.fillStyle = color;
        roundRectTop(ctx, cx, cy, cw, 150, 24);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.font = "800 64px ui-monospace, monospace";
        ctx.textBaseline = "middle";
        ctx.fillText(initials(g.title), cx + 36, cy + 78);

        ctx.fillStyle = "#e8433f";
        ctx.font = "800 28px ui-monospace, monospace";
        ctx.fillText("NEWTENDO", cx + cw - 260, cy + 40);
        ctx.fillStyle = "#8b8879";
        ctx.font = "600 18px ui-monospace, monospace";
        ctx.fillText("ENTERTAINMENT SYSTEM", cx + cw - 260, cy + 68);

        ctx.fillStyle = "#17171a";
        ctx.font = "800 46px ui-monospace, monospace";
        ctx.fillText(g.title, cx + 36, cy + 220);

        ctx.fillStyle = "#3a382f";
        ctx.font = "400 24px ui-monospace, monospace";
        wrapText(ctx, g.blurb, cx + 36, cy + 280, cw - 72, 34, 5);

        if (g.by) {
          ctx.fillStyle = "#8b8879";
          ctx.font = "400 22px ui-monospace, monospace";
          ctx.fillText(`by @${g.by}`, cx + 36, cy + ch - 60);
        }
        ctx.fillStyle = "#e8433f";
        ctx.font = "700 22px ui-monospace, monospace";
        ctx.textAlign = "right";
        ctx.fillText("newtendo.bisks.net", cx + cw - 36, cy + ch - 60);
        ctx.textAlign = "left";
      }

      function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }
      function roundRectTop(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x, y + h);
        ctx.lineTo(x, y + r);
        ctx.arcTo(x, y, x + r, y, r);
        ctx.lineTo(x + w - r, y);
        ctx.arcTo(x + w, y, x + w, y + r, r);
        ctx.lineTo(x + w, y + h);
        ctx.closePath();
      }
      function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
        const words = text.split(" ");
        let line = "";
        let lines = [];
        for (const w of words) {
          const test = line ? line + " " + w : w;
          if (ctx.measureText(test).width > maxWidth && line) {
            lines.push(line);
            line = w;
          } else {
            line = test;
          }
        }
        if (line) lines.push(line);
        if (lines.length > maxLines) {
          lines = lines.slice(0, maxLines);
          lines[maxLines - 1] = lines[maxLines - 1].replace(/\s*\S*$/, "…");
        }
        lines.forEach((l, i) => ctx.fillText(l, x, y + i * lineHeight));
      }

      function canShareFiles() {
        if (!navigator.share || !navigator.canShare) return false;
        try {
          const probe = new File([""], "probe.png", { type: "image/png" });
          return navigator.canShare({ files: [probe] });
        } catch {
          return false;
        }
      }

      function showPanel(g, animate) {
        const overlay = document.getElementById("overlay");
        const panel = document.getElementById("panel");
        const shareText = buildShareText(g);
        const shareHref = "https://bsky.app/intent/compose?text=" + encodeURIComponent(shareText);

        panel.innerHTML = animate
          ? `
            <div class="titlescreen">
              <canvas id="title-canvas"></canvas>
              <div class="ts-scanlines"></div>
              <p class="ts-loading">NOW LOADING…</p>
            </div>`
          : "";
        overlay.classList.add("show");
        if (animate) {
          const tc = document.getElementById("title-canvas");
          if (tc) drawTitleScreen(tc, g);
        }

        const reveal = () => {
          panel.innerHTML = `
            <canvas id="share-canvas"></canvas>
            <h2>${esc(g.title)}</h2>
            <p class="blurb">${esc(g.blurb)}</p>
            ${g.by ? `<p class="by">by @${esc(g.by)}</p>` : ""}
            <div class="panel-actions">
              <a class="play" href="${esc(g.url)}" target="_blank" rel="noopener">▶ play it</a>
              <a class="share" href="${shareHref}" target="_blank" rel="noopener">share to bluesky</a>
              <button class="close" id="close-panel">close</button>
            </div>
          `;
          const canvas = document.getElementById("share-canvas");
          drawCard(canvas, g);

          if (canShareFiles()) {
            canvas.style.cursor = "pointer";
            canvas.title = "tap to share as image";
            canvas.addEventListener("click", async () => {
              canvas.toBlob(async (blob) => {
                const file = new File([blob], "newtendo.png", { type: "image/png" });
                try {
                  await navigator.share({ files: [file], text: shareText, title: "newtendo" });
                } catch {}
              });
            });
          }

          document.getElementById("close-panel").addEventListener("click", () => {
            overlay.classList.remove("show");
          });
        };

        if (animate) setTimeout(reveal, REVEAL_DELAY);
        else reveal();
      }

      document.getElementById("overlay").addEventListener("click", (e) => {
        if (e.target.id === "overlay") e.target.classList.remove("show");
      });

      load();
    </script>
</body>
</html>
