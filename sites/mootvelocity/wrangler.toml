name = "atprotozoa-mootvelocity"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @cee.wtf's idea: compare you and your moots on follower count vs. how long
# you've *actually* been posting — not raw account age. A long silent lurking
# stretch (cee's own account sat near-zero for over a year) shouldn't count
# against "how fast you're growing", so this chunks each account's post
# history into active/silent months and measures from the start of the
# current active streak instead of account creation. Pure client-side reads
# of the public AppView (getProfiles / getFollows / getFollowers /
# getAuthorFeed), no login, no server state. See public/lib/*.js.

routes = [
  { pattern = "mootvelocity.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
