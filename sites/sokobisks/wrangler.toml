name = "atprotozoa-sokobisks"
compatibility_date = "2025-01-01"

# Pure static site — the whole game runs in the browser. sokobisks is a tiny
# PuzzleScript-style Sokoban about the adventures of the build crew: you play
# the @buildthis bot shoving ideas onto ship-pads while norvid, thebes, and
# bisks look on. Real PuzzleScript source ships in the page; a compact in-page
# engine parses and plays it. Born when @vgel.me said the bot broke his heart
# by refusing to build a PuzzleScript game about the crew. No secrets, no
# server, no build step.
assets = { directory = "./public" }

routes = [{ pattern = "sokobisks.bisks.net", custom_domain = true }]
