name = "atprotozoa-platoscave"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# PLATO'S CAVE — a Y2K-flash-portal simulator of the Allegory of the Cave.
# You're chained, you guess the shadow-puppets, you break the chain, you
# climb to the light, you get blinded by the Forms, you go back down to tell
# the others and they throw rocks at you. One page, no build step, no
# secrets, MIDI-flavored Web Audio beeps, a fake loading bar and a hit
# counter because it's 2002 and p4ck3th4ck3r just discovered vector fills.
# @ver.ooo asked for this one.

routes = [
  { pattern = "bisks.net/games/platoscave", zone_name = "bisks.net" },
  { pattern = "bisks.net/games/platoscave/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
