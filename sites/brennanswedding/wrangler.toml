name = "atprotozoa-brennanswedding"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @dave.9000ish.uk asked for a wedding guest book for @brennan.computer, who's
# getting married this Saturday (2026-09-19). Everything here is a client-side
# AppView/CAR read plus real Bluesky posts as the guestbook itself — no
# server-side state, so the Worker only serves the static shell.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [{ pattern = "brennanswedding.bisks.net/*", zone_name = "bisks.net" }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = false
