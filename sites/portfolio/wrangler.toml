name = "atprotozoa-portfolio"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Enter a Bluesky handle
# and get a "portfolio" of that account's posts: searchable (client-side text
# search) and grouped by topic, chronological within each topic. Reads
# Bluesky's public AppView anonymously (resolveHandle + getAuthorFeed,
# CORS *). No secrets, no server surface.
assets = { directory = "./public" }

routes = [{ pattern = "portfolio.bisks.net/*", zone_name = "bisks.net" }]
