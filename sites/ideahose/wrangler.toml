name = "atprotozoa-ideahose"
compatibility_date = "2025-01-01"

# @words.bsky.social asked for a site that watches the ENTIRE Bluesky firehose
# for website/app ideas, aggregates the ones people keep separately re-having,
# and ranks them — a crowdsourced backlog for @buildthis, not just the ideas
# that happen to get a tag.
#
# The page is static. Each visitor opens a direct Jetstream connection and does
# bounded detection, grouping, and AppView checks in that browser tab.
#
# Static assets are served from the dedicated hostname. Keeping this route
# hostname-only avoids requiring a Worker just to strip a path prefix.
routes = [
  { pattern = "ideahose.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
run_worker_first = false

# new_sqlite_classes, not new_classes — legacy KV-backed DOs need Workers Paid;
# this account is on Free. See sites/the-place/wrangler.toml for the full story.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["IdeaTracker"]

[[migrations]]
tag = "v2"
deleted_classes = ["IdeaTracker"]
