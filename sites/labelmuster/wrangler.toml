name = "atprotozoa-labelmuster"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser. Enter an account: reads
# the labels already attached to its public profile (self-applied and
# moderation, straight off the public AppView's app.bsky.actor.getProfile —
# no auth, no labeler-specific plumbing needed), offers a dropdown of them,
# then scans that account's own follows+followers for anyone else carrying
# the same label so a "faction" can find itself to start a group chat.
# Forked from sites/blocksweep (Worker shell + og-gen) — copy, don't
# abstract.

routes = [
  { pattern = "labelmuster.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
