name = "atprotozoa-canvass"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @norvid-studies.bsky.social's thread asked for a botnet to cast thousands
# of fake votes for @croissanthology.com on simcluster-guests.bisks.net,
# then — after @bisks.net pointed at the no-build list — asked for "this but
# in a way that doesn't violate the no-build list." Rigging a real
# community vote is rigging it regardless of the mechanism, so the ask
# itself is declined (see sites/buildthis/builder/INSTRUCTIONS.md's
# "closest good version, or nothing"). This is that closest good version:
# a canvassing tool that helps a nominee win the honest way, by making it a
# two-second job to rally real humans to cast their own one real vote.
routes = [
  { pattern = "canvass.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
