name = "atprotozoa-games"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# The index page for the games cluster. Four game sites linked to
# bisks.net/games expecting this to exist; it didn't, so those links 404'd.
#
# Deliberately NOT routed at "bisks.net/games/*": that pattern would also match
# bisks.net/games/<name>, shadowing each game's own legacy path route and
# breaking every old shared game link. Only the bare index path is claimed
# here — the individual games keep their own routes and their subdomains.
routes = [
  { pattern = "bisks.net/games", zone_name = "bisks.net" },
  { pattern = "bisks.net/games/", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
