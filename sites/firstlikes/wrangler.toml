name = "atprotozoa-firstlikes"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @cee.wtf asked for a site that walks a user's whole post history, oldest
# first, and reports how many posts it took to land their first 10-like,
# 100-like, and 1000-like post. Everything runs client-side (public/index.html
# + public/lib/climb.js): resolve the handle, find the PDS, walk
# com.atproto.repo.listRecords with reverse=true (oldest-first, no MST/CAR
# parsing needed — see public/lib/climb.js for why that beats the CAR-download
# trick other sites here use for full-history reads), batch-resolve like
# counts via app.bsky.feed.getPosts, then find the first post crossing each
# threshold. No OAuth: purely public-data reads.
#
# No per-result Worker share route: a full history walk can be thousands of
# requests, too much to redo server-side inside one Worker invocation just to
# stamp an OG card, and a page-capped approximation there could show a
# different number than the real client-side result. Static OG tags + a share
# text with the real numbers baked in cover it for now (see
# notes/45-sharing-and-virality.md — per-result unfurl is the highest-effort
# tier, worth adding later if this gets shared around a lot).
routes = [
  { pattern = "firstlikes.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = false
