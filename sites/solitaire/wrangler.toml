name = "atprotozoa-solitaire"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Monochrome Klondike
# solitaire that follows the OS light/dark theme, with a Windows
# 3.1-style bouncing-card cascade on a win. Built after @heartpunk.com
# tagged @buildthis for "solitaire, monochrome, follow system theme ...
# needs the fancy bounces when you win a game like win 3.1 solitaire".
# No secrets, no server.
main = "src/index.ts"

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# solitaire.bisks.net is being retired to free a slot against the zone's
# custom-domain cap (see notes/20-deploy.md). Migrated to bisks.net/solitaire
# instead. See notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "bisks.net/solitaire", zone_name = "bisks.net" },
  { pattern = "bisks.net/solitaire/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
