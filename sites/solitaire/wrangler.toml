name = "atprotozoa-solitaire"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Monochrome Klondike
# solitaire that follows the OS light/dark theme, with a Windows
# 3.1-style bouncing-card cascade on a win. Built after @heartpunk.com
# tagged @buildthis for "solitaire, monochrome, follow system theme ...
# needs the fancy bounces when you win a game like win 3.1 solitaire".
# No secrets, no server.
assets = { directory = "./public" }

routes = [{ pattern = "solitaire.bisks.net", custom_domain = true }]
