name = "atprotozoa-trigramonopoly"
compatibility_date = "2025-01-01"

# Pure static site — the whole game runs in the browser. It reads the live
# Bluesky firehose (Jetstream) over a websocket, no auth, no server. index.html
# is at the root, so there's no Worker fetch handler.
main = "src/index.ts"

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# trigramonopoly.bisks.net is being retired to free a slot against the zone's
# custom-domain cap (see notes/20-deploy.md). Migrated to bisks.net/trigramonopoly
# instead. See notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "bisks.net/trigramonopoly", zone_name = "bisks.net" },
  { pattern = "bisks.net/trigramonopoly/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
