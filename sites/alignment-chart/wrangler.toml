name = "atprotozoa-alignment-chart"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. It reads Bluesky's public
# AppView (resolveHandle / getFollows / getFollowers / getProfile / getAuthorFeed,
# all anonymous, CORS *) to pull a handle's network (mutuals, widened to follows),
# grab a few recent posts each, and plot every account onto a 3×3 D&D-style
# alignment grid: CHILL↔HARSH on x, GOONING↔MOGGING on y. The classifier is a
# deliberately silly browser-side keyword/vibe heuristic — it's a bit, not science.
# network.js is copied from moot-bingo/lib/moots.js (copy, don't abstract).
assets = { directory = "./public" }

routes = [{ pattern = "alignment-chart.bisks.net", custom_domain = true }]
