name = "atprotozoa-idea-island"
compatibility_date = "2025-01-01"

# Pure static site — a tiny ambient scene, no server. A little island sits in a
# calm sea under a night sky; a lightbulb hovers over it. Click (or wait) and the
# idea *lands*: the bulb flickers on, the island lights up, ripples spread. A
# playful literalization of "having an idea" — idea = lightbulb, lands = island.
# Built for @catblanketflower.yuwakisa.com (echoed by @notharlock.poast.ing), who
# asked @buildthis for "a lightbulb over an island — an idea that lands.. an idea
# with land.. a landed idea." No secrets, no server.
main = "src/index.ts"

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# idea-island.bisks.net is being retired to free a slot against the zone's
# custom-domain cap (see notes/20-deploy.md). Migrated to bisks.net/idea-island
# instead. See notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "idea-island.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/idea-island", zone_name = "bisks.net" },
  { pattern = "bisks.net/idea-island/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
