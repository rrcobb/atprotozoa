name = "atprotozoa-lurkhelper"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser. Type a Bluesky handle:
# reads Bluesky's public AppView anonymously (getFollowers, getAuthorFeed,
# getLikes, getRepostedBy — CORS *) and finds the followers who never liked,
# reposted, or replied to the account's recent posts — the lurkers — then
# gives a one-tap "say hi" compose link for each one.
# Forked from sites/followwall (copy, don't abstract) for the handle-input
# shell, follower paging, share-card canvas, and page chrome; the engagement
# check and lurker wall are new.

routes = [
  { pattern = "lurkhelper.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
