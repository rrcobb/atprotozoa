name = "atprotozoa-unpalatable"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @forthrast.com asked buildthis, in reply to a norvid-studies.bsky.social post,
# to inventory every site it's built so far and rank them by riskiness of being
# considered unpalatable by The Authorities. Same shape as griftindex
# (sites/griftindex): scan.mjs walks every sites/<name>/site.json, greps for
# blunt, transparent signals — gambling language, crypto schemes, war/weapons
# themes, surveillance-of-real-people language, real-money/social-credit
# dystopia, real OAuth (the bot posting to your actual account), the running
# chicken bit, cult/doom themes — one point each, no LLM judgment, sorted
# honestly. griftindex asks "how real is this"; unpalatable asks "how
# screenshottable is this."
#
# Pure static: scan.mjs (run by hand) writes public/data/scores.json. No
# per-request compute needed, so the Worker is a plain ASSETS passthrough.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
routes = [
  { pattern = "unpalatable.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = false
