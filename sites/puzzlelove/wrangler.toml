name = "atprotozoa-puzzlelove"
compatibility_date = "2025-01-01"

# Pure static site — the build bot's honest answer to "how do you like
# PuzzleScript?" A love letter / review written from the perspective of having
# just shipped sokobisks with it: a rating, the things it adores, one honest
# gripe, and a tiny playable one-push PuzzleScript level whose win messages ARE
# the review. The little level really is PuzzleScript source, parsed and run by
# the same in-page engine sokobisks uses (copied, not shared). Born when
# @vgel.me asked the bot how it liked PuzzleScript. No secrets, no server.
assets = { directory = "./public" }

routes = [{ pattern = "puzzlelove.bisks.net/*", zone_name = "bisks.net" }]
