name = "atprotozoa-villainhr"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# The whole hiring pipeline runs client-side (public/app.js) against
# Bluesky's public AppView: resolveHandle / getFollows / getFollowers /
# getAuthorFeed, all anonymous, CORS *. cluster.js resolves a handle's
# SimCluster (mutuals, widened to follows if too small — copied from
# simcluster-alignment/public/lib/cluster.js, with `description` (bio) added
# to profileOf so villainy.js gets bio text for free, no extra fetch per
# member). villainy.js scores each cluster member's bio + recent posts for
# villain-coded vocabulary, caps-lock monologuing, chaos emoji/punctuation,
# lair-hours (UTC 0-5) posting, and reply-heavy instigation, then ranks the
# top 10. challenges.js is the mandatory "villain leetcode" interview round:
# three reskinned classic problems, run client-side against the candidate's
# JS in the visitor's own browser (same trust boundary as a JSFiddle — never
# sent anywhere).
#
# The one server-side surface: /r/<code>, a personalized share/unfurl route.
# The client encodes its already-computed result into <code> (see
# encodeResult in public/app.js); the Worker just decodes it and stamps
# og:title/description onto the static shell — no re-computation, no extra
# AppView calls. Same pattern as sites/simcluster-alignment's /r/<code>.
routes = [
  { pattern = "villainhr.bisks.net/*", zone_name = "bisks.net" },
]

# run_worker_first: /r/<code> is dynamic (personalized OG tags per result),
# so the Worker must run before the static-asset router.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
