name = "atprotozoa-mootree"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @ver.ooo asked for a family-tree / lineage view of the moots you follow:
# bucket them into "generations" by account-creation time relative to your
# own, and order each generation by the order you actually followed them in
# (read straight off your app.bsky.graph.follow records, not getFollows'
# AppView ordering — see public/lib/genealogy.js). OAuth login (public
# client, same padmoot/oauth.js shape) to know who "you" are and to read
# your own repo's follow records.
#
# Single canonical host — no path-mount alongside it. OAuth's client_id has
# to match exactly where client-metadata.json is served from (see
# notes/40-new-site-playbook.md, "OAuth sites need a single canonical
# host"), and per notes/40 (2026-07-31) a plain subdomain route no longer
# costs a custom-domain slot, so there's no reason to dual-home this one.
routes = [
  { pattern = "mootree.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
