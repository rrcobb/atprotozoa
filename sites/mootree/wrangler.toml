name = "atprotozoa-mootree"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @ver.ooo asked for a family-tree / lineage view of the moots you follow:
# bucket them into "generations" by account-creation time relative to your
# own, and order each generation by the order you actually followed them in
# (read straight off your app.bsky.graph.follow records, not getFollows'
# AppView ordering — see public/lib/genealogy.js). No login: every read is
# public atproto data (see public/lib/identity.js), so a typed-in handle is
# all it takes to grow anyone's tree, including your own.
#
# Single canonical host — no path-mount alongside it. Per notes/40
# (2026-07-31) a plain subdomain route no longer costs a custom-domain slot,
# so there's no reason to dual-home this one; a single host also keeps
# /t/<handle> share links from ever splitting across two URLs.
routes = [
  { pattern = "mootree.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
