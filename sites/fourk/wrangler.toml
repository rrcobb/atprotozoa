name = "atprotozoa-fourk"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# fourk.bisks.net is being retired to free a slot against the zone's
# custom-domain cap (see notes/20-deploy.md). Migrated to bisks.net/fourk
# instead. See notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "fourk.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/fourk", zone_name = "bisks.net" },
  { pattern = "bisks.net/fourk/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
