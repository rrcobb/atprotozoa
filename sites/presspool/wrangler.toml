name = "atprotozoa-presspool"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @shimmermathlabs.com tagged the bot on a post quoting
# @fromthewestmeadow.com's original "do not press this button" idea (built as
# sites/dontpressit). The ask: a betting market on WHEN that button gets
# pressed, without encouraging anyone to actually press it, plus a clear
# warning that betting and then affecting the outcome yourself is grounds for
# punishment.
#
# dontpressit was later rebuilt into a round system — the button never stops;
# every press graduates the current round's name and starts a new one. This
# market tracks whichever round dontpressit.bisks.net/api/state (public,
# CORS-open) reports as current, takes bets on one of six time buckets
# measured from that round's start, and the instant the round number
# advances, resolves the round that just ended pari-mutuel and opens a fresh
# board for the new one — balances and the leaderboard carry forward, only
# the per-round pools reset. Originally copied from sites/guestbet (a
# pari-mutuel market with repeating rounds and no login, since moved to KV
# like this one); v1 of this file replaced that repeating-round shape with a
# one-shot terminal resolution to match dontpressit's original one-press-ever
# design, and this version restores the repeating-round shape now that
# dontpressit does too.
routes = [
  { pattern = "presspool.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[kv_namespaces]]
binding = "MARKET_STATE"

# Service binding, not a plain fetch to dontpressit.bisks.net. Both Workers are
# on the bisks.net zone, and an on-zone Worker's subrequest to its own zone
# comes back 522 rather than reaching the other Worker -- the same constraint
# documented in watchtower/wrangler.toml. A service binding goes Worker to
# Worker without touching the edge.
[[services]]
binding = "SOURCE"
service = "atprotozoa-dontpressit"

# new_sqlite_classes, not new_classes — legacy KV-backed DOs need Workers
# Paid; this account is on Free. See sites/the-place/wrangler.toml.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Market"]

[[migrations]]
tag = "v2"
deleted_classes = ["Market"]
