name = "atprotozoa-palindrone"
compatibility_date = "2025-01-01"

# @words.bsky.social, replying in the thread where @ver.ooo pointed out that
# "segyges" is a palindrome: build a site that watches the jetstream and
# catalogs every palindromic text string over 6 characters.
#
# Fully frontend: the browser opens Jetstream (wantedCollections=
# app.bsky.feed.post) directly, strips each post's text down to letters +
# digits, finds the longest palindromic substring in it (expand-around-center,
# fine at post-length scale), and — when it's long enough and not just a
# repeated-character run — files it into a running catalog kept in
# localStorage. No server state, no DO, no KV; just a Worker serving static
# assets.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/palindrone path route and no prefix-stripping needed.
routes = [
  { pattern = "palindrone.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
