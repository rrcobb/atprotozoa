name = "atprotozoa-griftindex"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @fromthewestmeadow.com asked buildthis to build a site it thinks she'd
# actually LIKE, based on her whole request history — the mirror image of
# grindset (built the same day, the site it thought she'd hate). Her back
# catalog runs on real backends and live/real data: firehose subscriptions
# (didrank), full-repo CAR downloads (clusterpedia, intrigue, ngmi, llmstance),
# real atproto OAuth (clusterpedia, nothingness), Durable Objects for live
# server state. So this turns that taste into the actual site: a leaderboard
# that runs the same blunt six-signal grep (no LLM judgment, same spirit as
# her ngmi/llmstance keyword heuristics) over every site this repo has ever
# shipped, and ranks all of them by how much is real vs how much is theater.
#
# Pure static: scan.mjs (run by hand, like every other site's og-gen.mjs) walks
# sites/*/ and writes public/data/scores.json. No per-request compute needed,
# so the Worker is a plain ASSETS passthrough.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
routes = [
  { pattern = "griftindex.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = false
