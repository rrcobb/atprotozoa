name = "atprotozoa-solvers"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# solvers.bisks.net never provisioned (the zone hit Cloudflare's custom-domain
# cap, see notes/20-deploy.md), so it's mounted at bisks.net/solvers instead.
# See notes/40-new-site-playbook.md.
routes = [
  { pattern = "bisks.net/solvers", zone_name = "bisks.net" },
  { pattern = "bisks.net/solvers/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
