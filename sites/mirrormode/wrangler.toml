name = "atprotozoa-mirrormode"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# mirrormode — @7778777.online asked for "a service that takes your photo and
# adjusts the focal length so that it looks as good as you look in the
# bathroom mirror". The bit: phone selfie cameras are wide-angle lenses used
# up close, which bulges the nose/cheeks in a way a bathroom mirror (viewed
# from further away, effectively a longer "focal length") never does — plus
# a mirror flips you, and everyone's more used to their flipped reflection
# than their unflipped photo. This site takes a photo (upload or webcam),
# lets you drag a 24mm-135mm focal-length slider, and re-renders the face
# with a per-pixel radial warp (bulge at the wide end, flatten at the tele
# end) plus a horizontal mirror-flip and a warm soft-focus grade, entirely
# client-side in <canvas> — nothing is ever uploaded anywhere.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [
  { pattern = "bisks.net/mirrormode", zone_name = "bisks.net" },
  { pattern = "bisks.net/mirrormode/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
