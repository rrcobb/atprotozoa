name = "atprotozoa-llm-grams"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# /s/<slug> renders a per-selection OG unfurl (see src/index.ts), so the
# Worker must run before the static-asset router picks it up.
routes = [{ pattern = "llm-grams.bisks.net/*", zone_name = "bisks.net" }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
