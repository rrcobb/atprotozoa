name = "atprotozoa-surprisal"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Everything (corpus download, n-gram model, likes regression) runs in the
# browser; the Worker only forwards to static assets.
routes = [{ pattern = "surprisal.bisks.net/*", zone_name = "bisks.net" }]

[assets]
directory = "./public"
binding = "ASSETS"
