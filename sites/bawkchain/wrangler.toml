name = "atprotozoa-bawkchain"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser. On load it reads
# @topchicken.bsky.social's public post history (anonymous AppView,
# getAuthorFeed) to find every "New Top Chicken!" announcement, pulls the
# winning post's author + likeCount straight out of the embedded quote
# record, oil-paints their avatar on a <canvas>, and hash-chains the whole
# run into a (very fake, very deterministic) "bawkchain" — each block's hash
# folds in the previous block's hash, so re-running the sync always
# reproduces the same chain from the same public data. See public/lib/*.js.

routes = [
  { pattern = "bawkchain.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/bawkchain", zone_name = "bisks.net" },
  { pattern = "bisks.net/bawkchain/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
