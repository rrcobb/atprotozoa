name = "atprotozoa-catsofatproto"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# The Worker has one job beyond serving static assets: /img/<thumb|full>/<did>/<cid>
# proxies a single Bluesky CDN image and adds a permissive CORS header. The page
# needs that for images it feeds to the in-browser cat classifier (canvas pixel
# reads are blocked cross-origin without it) — plain <img> tags in the grid hit
# cdn.bsky.app directly and never touch this route.
assets = { directory = "./public", binding = "ASSETS" }

routes = [{ pattern = "catsofatproto.bisks.net", custom_domain = true }]
