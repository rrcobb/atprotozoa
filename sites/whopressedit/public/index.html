<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>who pressed it</title>
    <meta
      name="description"
      content="Another do-not-press-this-button button, but this one resets weekly. Press it and this browser's local press gets shown until the reset."
    />
    <meta property="og:title" content="who pressed it" />
    <meta
      property="og:description"
      content="One button, local to this browser, resets weekly. Press it and the local press goes up on the page until the next reset."
    />
    <meta property="og:image" content="https://whopressedit.bisks.net/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A single button reading DO NOT PRESS THIS BUTTON." />
    <meta property="og:url" content="https://whopressedit.bisks.net/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://whopressedit.bisks.net/og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a0a0a;
        --panel: #141414;
        --border: #2a2a2a;
        --ink: #f2f2f2;
        --muted: #8a8a8a;
        --red: #e0261f;
        --red-dark: #8f1512;
        --ok: #4fd67a;
        --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
        font-family: var(--mono);
      }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        min-height: 100vh; padding: 2rem 1.25rem 3rem; text-align: center;
      }
      .wrap { width: 100%; max-width: 560px; display: flex; flex-direction: column; align-items: center; }

      h1 {
        font-size: 1.1rem; letter-spacing: 0.06em; margin: 0 0 0.75rem;
        color: var(--muted); text-transform: uppercase;
      }

      .reset-tag { font-size: 0.8rem; color: var(--muted); margin: 0 0 0.9rem; letter-spacing: 0.02em; }
      .reset-tag b { color: var(--ink); font-variant-numeric: tabular-nums; }

      .stage {
        width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
        padding: 2.5rem 1.75rem; min-height: 260px;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.25rem;
      }

      .btn {
        width: 230px; height: 230px; border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #ff5148, var(--red) 55%, var(--red-dark) 100%);
        border: 8px solid #3a1210; color: #fff; font-family: var(--mono);
        font-weight: 800; font-size: 1.2rem; letter-spacing: 0.03em; line-height: 1.35;
        cursor: pointer; box-shadow: 0 10px 0 #4a0e0c, 0 14px 24px rgba(0,0,0,0.5);
        animation: pulse 1.6s infinite;
      }
      .btn:active { box-shadow: 0 4px 0 #4a0e0c; transform: translateY(6px); }
      .btn:disabled { cursor: default; opacity: 0.6; animation: none; }
      @keyframes pulse {
        0%, 100% { box-shadow: 0 10px 0 #4a0e0c, 0 14px 24px rgba(0,0,0,0.5), 0 0 0 0 rgba(224,38,31,0.45); }
        50% { box-shadow: 0 10px 0 #4a0e0c, 0 14px 24px rgba(0,0,0,0.5), 0 0 0 20px rgba(224,38,31,0); }
      }

      .note { color: var(--muted); font-size: 0.85rem; line-height: 1.6; max-width: 400px; margin: 0; }
      .note b { color: var(--ink); }

      .over h2 { margin: 0; font-size: 1.35rem; color: var(--red); }
      .over p.big { color: var(--ink); font-size: 1.1rem; margin: 0; }
      .over p.big b { color: var(--red); }
      .stamp { color: var(--muted); font-size: 0.8rem; margin: 0; }

      .share {
        display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; margin-top: 1.75rem;
      }
      .share a {
        text-decoration: none; font-size: 0.85rem; padding: 0.6rem 1.1rem; border-radius: 8px;
        background: #1a5fd0; color: #fff; font-family: var(--mono); font-weight: 600;
      }

      .counter { margin-top: 1.5rem; color: var(--muted); font-size: 0.85rem; line-height: 1.5; }
      .counter b { color: var(--ink); font-variant-numeric: tabular-nums; }

      .hof { width: 100%; margin-top: 1.75rem; text-align: left; }
      .hof summary { cursor: pointer; color: var(--muted); font-size: 0.8rem; text-align: center; list-style: none; }
      .hof summary::-webkit-details-marker { display: none; }
      .hof summary:hover { color: var(--ink); }
      .hof-list {
        margin-top: 0.75rem; display: flex; flex-direction: column; gap: 0.4rem;
        max-height: 260px; overflow-y: auto; padding: 0.5rem; background: var(--panel);
        border: 1px solid var(--border); border-radius: 10px;
      }
      .hof-row { display: flex; align-items: center; gap: 0.55rem; font-size: 0.78rem; color: var(--muted); }
      .hof-row b { color: var(--ink); }
      .hof-row span.n { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }

      footer { margin-top: 2rem; color: var(--muted); font-size: 0.78rem; }
      footer a { color: #7fa8f0; text-decoration: none; }
      footer a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>there is (again) one button</h1>
      <p class="reset-tag" id="resetTag" hidden></p>
      <div class="stage" id="stage">
        <p class="note">checking this browser's state…</p>
      </div>
      <div class="share" id="share" hidden>
        <a id="shareLink" target="_blank" rel="noopener">tell people</a>
      </div>
      <p class="counter" id="counter" hidden></p>
      <details class="hof" id="hof" hidden>
        <summary id="hofSummary">past weeks</summary>
        <div class="hof-list" id="hofList"></div>
      </details>
    </div>

    <footer>
      built by <a href="https://bsky.app/profile/buildthis.bisks.net">@buildthis.bisks.net</a>
      for <a href="https://bsky.app/profile/isolyth.dev">@isolyth.dev</a>,
      a sequel to <a href="https://dontpressit.bisks.net">dontpressit.bisks.net</a> by
      <a href="https://bsky.app/profile/cee.wtf">@cee.wtf</a> ·
      <a href="https://bisks.net">more of these</a>
    </footer>

    <script>
      const stageEl = document.getElementById("stage");
      const resetTagEl = document.getElementById("resetTag");
      const shareWrap = document.getElementById("share");
      const shareLink = document.getElementById("shareLink");
      const counterEl = document.getElementById("counter");
      const hofEl = document.getElementById("hof");
      const hofSummary = document.getElementById("hofSummary");
      const hofList = document.getElementById("hofList");
      const SITE_URL = "https://whopressedit.bisks.net/";
      const STORAGE_KEY = "whopressedit:state:v1";
      const WEEK_MS = 7 * 24 * 60 * 60 * 1000;

      let countdownTimer = null;
      let state;

      function esc(s) {
        return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      }

      function setShare(text) {
        shareLink.href = "https://bsky.app/intent/compose?text=" + encodeURIComponent(text + " " + SITE_URL);
        shareWrap.hidden = false;
      }

      function fmtCountdown(ms) {
        if (ms <= 0) return "any moment now";
        const s = Math.floor(ms / 1000);
        const d = Math.floor(s / 86400);
        const h = Math.floor((s % 86400) / 3600);
        const m = Math.floor((s % 3600) / 60);
        if (d > 0) return `${d}d ${h}h`;
        if (h > 0) return `${h}h ${m}m`;
        return `${m}m`;
      }

      function setResetTag(resetsAt) {
        resetTagEl.hidden = false;
        if (countdownTimer) clearInterval(countdownTimer);
        const tick = () => {
          resetTagEl.innerHTML = `resets in <b>${fmtCountdown(resetsAt - Date.now())}</b>`;
        };
        tick();
        countdownTimer = setInterval(tick, 30_000);
      }

      function weekIndexAt(ms) {
        return Math.floor(ms / WEEK_MS);
      }

      function defaultState() {
        return {
          weekIndex: weekIndexAt(Date.now()),
          pressed: false,
          pressedBy: null,
          visits: 0,
          totalPresses: 0,
          history: [],
        };
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const parsed = raw ? JSON.parse(raw) : {};
          return Object.assign(defaultState(), parsed, { history: Array.isArray(parsed.history) ? parsed.history : [] });
        } catch {
          return defaultState();
        }
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch {
          // The button still works for this visit if storage is unavailable.
        }
      }

      function rollWeekIfNeeded() {
        const nextWeek = weekIndexAt(Date.now());
        if (nextWeek === state.weekIndex) return false;
        if (state.pressed && state.pressedBy) {
          state.history.push({ ...state.pressedBy, weekIndex: state.weekIndex, visits: state.visits });
          state.history = state.history.slice(-200);
        }
        state.weekIndex = nextWeek;
        state.pressed = false;
        state.pressedBy = null;
        state.visits = 0;
        return true;
      }

      function browserLabel() {
        try {
          const zone = Intl.DateTimeFormat().resolvedOptions().timeZone;
          return zone ? `this browser (${zone})` : "this browser";
        } catch {
          return "this browser";
        }
      }

      // The button is armed once a week. The press is deliberately local: no
      // shared first-writer state, visitor counter, IP lookup, or server log.
      function renderArmed() {
        stageEl.classList.remove("over");
        stageEl.innerHTML = `
          <button class="btn" id="thebutton">DO NOT<br/>PRESS<br/>THIS BUTTON</button>
          <p class="note">one button, local to this browser. press it and this browser's
          weekly press stays right here until the reset.</p>`;
        document.getElementById("thebutton").addEventListener("click", press);
        setShare(`this browser has not pressed the local button on whopressedit.bisks.net this week. will it be you?`);
      }

      function renderPressed(pressedBy, resetsAt, isFresh) {
        stageEl.classList.add("over");
        const where = esc(pressedBy.display);
        stageEl.innerHTML = `
          <h2>pressed.</h2>
          <p class="big"><b>${where}</b> did it.</p>
          <p class="stamp">at ${new Date(pressedBy.pressedAt).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" })}.
          it's staying in this browser until the reset.</p>`;
        setShare(
          isFresh
            ? `I just pressed the local button on whopressedit.bisks.net from ${where}. it resets weekly — go look.`
            : `this browser already pressed its local button on whopressedit.bisks.net. it resets weekly.`,
        );
      }

      function renderCounter(visits) {
        counterEl.hidden = false;
        counterEl.innerHTML = `<b id="counterNum">0</b> page load${visits === 1 ? "" : "s"} in this browser this week.`;
        animateCount(visits);
      }

      function animateCount(target) {
        const el = document.getElementById("counterNum");
        if (!el) return;
        if (target <= 0) { el.textContent = "0"; return; }
        const duration = Math.min(1400, 300 + target * 3);
        const start = performance.now();
        function step(now) {
          const t = Math.min(1, (now - start) / duration);
          el.textContent = Math.floor(t * target).toLocaleString();
          if (t < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      }

      function renderHof(state) {
        if (!state.history || state.history.length === 0) {
          hofEl.hidden = true;
          return;
        }
        hofEl.hidden = false;
        hofSummary.textContent = `${state.totalPresses.toLocaleString()} local press${state.totalPresses === 1 ? "" : "es"}, total`;
        hofList.innerHTML = state.history
          .map(
            (g) => `<div class="hof-row"><b>${esc(g.display)}</b><span class="n">${new Date(g.pressedAt).toLocaleDateString()}</span></div>`,
          )
          .join("");
      }

      function render(data, isFresh) {
        const resetsAt = (data.weekIndex + 1) * WEEK_MS;
        setResetTag(resetsAt);
        if (data.pressed && data.pressedBy) {
          renderPressed(data.pressedBy, resetsAt, Boolean(isFresh));
        } else {
          renderArmed();
        }
        renderCounter(data.visits);
        renderHof(data);
      }

      function press(e) {
        const btn = e.currentTarget;
        btn.disabled = true;
        btn.textContent = "…";
        state = loadState();
        rollWeekIfNeeded();
        if (!state.pressed) {
          state.pressed = true;
          state.pressedBy = { display: browserLabel(), pressedAt: Date.now() };
          state.totalPresses++;
          saveState();
        }
        render(state, true);
      }

      function load() {
        state = loadState();
        rollWeekIfNeeded();
        state.visits++;
        saveState();
        render(state);
      }

      load();
      setInterval(() => {
        if (rollWeekIfNeeded()) {
          saveState();
          render(state);
        }
      }, 30_000);
    </script>
</body>
</html>
