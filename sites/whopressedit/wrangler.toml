name = "atprotozoa-whopressedit"
compatibility_date = "2025-01-01"

# @cee.wtf's dontpressit.bisks.net ended forever, no reset, the first time
# anyone pressed it. @isolyth.dev replied asking for it "again" — a new
# button, but this time it resets weekly and keeps a private browser-local
# press history. See notes/40-new-site-playbook.md.
routes = [
  { pattern = "whopressedit.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PressState"]

[[migrations]]
tag = "v2"
deleted_classes = ["PressState"]
