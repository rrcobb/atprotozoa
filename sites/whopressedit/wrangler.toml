name = "atprotozoa-whopressedit"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @cee.wtf's dontpressit.bisks.net ended forever, no reset, the first time
# anyone pressed it. @isolyth.dev replied asking for it "again" — a new
# button, but this time it resets weekly, and pressing it logs (and displays,
# until the reset) the US state — or country, if not US — of whoever pressed
# it, read off Cloudflare's request geo headers. One Durable Object holds the
# single shared week state, same shape as dontpressit's PressState. See
# notes/40-new-site-playbook.md.
routes = [
  { pattern = "whopressedit.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "PRESS"
class_name = "PressState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PressState"]
