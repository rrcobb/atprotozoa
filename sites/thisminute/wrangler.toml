name = "atprotozoa-thisminute"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Connects to Jetstream,
# keeps a rolling window of the last 60 seconds of post text, and knits a
# fresh "post" out of it with a word-level Markov chain. See public/index.html.

routes = [
  { pattern = "thisminute.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
