name = "atprotozoa-pointless"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Brand-new site, own subdomain from day one — no bisks.net/pointless path
# route to carry forward (see notes/40-new-site-playbook.md).
routes = [
  { pattern = "pointless.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
