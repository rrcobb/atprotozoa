name = "atprotozoa-listbot"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Two jobs (see notes/88-listbot.md):
#  1. fetch handler  -> the landing page, the confidential-client OAuth sign-in
#     (/login, /callback, /client-metadata.json, /jwks.json), /status.json, and
#     /.well-known/atproto-did for handle verification.
#  2. scheduled handler -> the watcher: poll the bot's mentions and act on each
#     tagger's OWN repo with their stored OAuth session.
assets = { directory = "./public", binding = "ASSETS" }

# Above the tables on purpose: in TOML a `routes` line after a table header
# becomes <table>.routes and the domain silently never binds. Same gotcha noted
# in apex/wrangler.toml and sites/buildthis/wrangler.toml.
routes = [{ pattern = "listbot.bisks.net/*", zone_name = "bisks.net" }]

[triggers]
crons = ["*/2 * * * *"]

[observability]
enabled = true

# Holds, per user, an ENCRYPTED OAuth session (refresh token, access token, DPoP
# keypair), plus handled-mention markers and the sweep counter.
#
# KV is not an auth boundary — notes/11 says so, and it's just as true here. The
# boundary is SESSION_ENC_KEY, the Worker secret these blobs are encrypted with,
# which never appears in KV or in this repo. KV alone yields ciphertext. See the
# header comment in src/store.ts.
#
# Create with: wrangler kv namespace create listbot-state
[[kv_namespaces]]
binding = "STATE"
id = "ba21bd2761d54713a922001ef0c26792"

[vars]
# The bot account's DID (@listbot.bsky.social, becoming listbot.bisks.net).
# Served at /.well-known/atproto-did so bisks.net can be verified as its handle.
BOT_DID = "did:plc:ydbdmpz23ou2ycc4oejlf24z"

# Login identifier for createSession. The DID rather than the handle, so login
# survives a handle switch (same reasoning as buildthis).
BOT_IDENTIFIER = "did:plc:ydbdmpz23ou2ycc4oejlf24z"

# The handle the bot answers on, used for the search sweep's query text and the
# copy on the signed-in page. Switched from listbot.bsky.social on 2026-09-17;
# the DID in BOT_IDENTIFIER is what logs in, so the switch needed no other
# change. Verified by DNS, not by this Worker — see notes/88.
BOT_HANDLE = "listbot.bisks.net"

# Every handle it answers to, so the parser strips whichever one a tag used.
# Keep the old handle here after the switch — older posts still carry it, and a
# mention facet resolves by DID either way.
BOT_HANDLE_ALIASES = "listbot.bsky.social,listbot.bisks.net"

# Canonical origin. An atproto OAuth client is identified BY its client_id URL
# and the PDS refetches metadata from it, so this can't be dual-homed — see
# notes/40's "OAuth sites need a single canonical host".
SITE_URL = "https://listbot.bisks.net"

# Three limits, all with the same purpose: listbot shares ONE build box with
# buildthis, and that box runs one job at a time. So a listbot job doesn't just
# spend inference, it puts a build behind it in line. listbot is meant to be the
# dumber, lighter bot — it should never be the reason someone's build waits.
#
# Sized against measured load: buildthis ran 123 builds in a week (~18/day) at
# 5-13 minutes each. A listbot job is well under a minute.
#
# The structural protection is in box-poll.sh, which claims at most one job per
# pass with buildthis first, so a steady stream of builds starves listbot rather
# than the reverse. These two are the belt to that's braces.

# Per account, per hour. 10 is a lot of list edits for one person in an hour and
# nowhere near enough to matter next to a build.
RATE_LIMIT_TAGS = "10"
RATE_LIMIT_WINDOW_MINUTES = "60"

# How many accounts may be signed in at once. Bounds the number of people who
# can generate load at all, rather than what any one of them spends. 25 is a
# "friends and whoever finds it" number; raise it by editing this line if it
# fills up and nothing has caught fire. 0 disables the cap.
MAX_ACCOUNTS = "25"

# Key id for the client-assertion key, matching the `kid` in /jwks.json.
CLIENT_KEY_KID = "listbot-client-1"

# Public half of that key, as a JWK. Public values only (crv/x/y) — not a
# secret. It's a var rather than derived because the private key is imported
# non-extractable, so WebCrypto can't recover the public half from it.
# `node audit/listbot-keygen.mjs` prints this.
CLIENT_PUBLIC_JWK = '{"kty":"EC","crv":"P-256","x":"1fiM-Lh4gGb6VYzp9w6gLUxYNnSuNXkbNTj45po9hAs","y":"H_wH1fcSbBIveuDHqWQID_ikQ2JkBY-vH923X4uc-d0"}'

# Secrets (wrangler secret put, never in this file):
#   BOT_APP_PASSWORD   -> the bot account's app password. Reads the bot's own
#                         notifications and posts its replies. Touches no lists.
#   CLIENT_PRIVATE_KEY -> base64url PKCS#8 P-256 private key; signs the client
#                         assertions that authenticate this confidential client
#                         to each PDS's token endpoint.
#   SESSION_ENC_KEY    -> AES-GCM key material for the stored OAuth sessions.
#                         THE security boundary for every user's refresh token.
#                         Rotating it invalidates every session (users just sign
#                         in again); losing it locks every session out.
