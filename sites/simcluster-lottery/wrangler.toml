name = "atprotozoa-simcluster-lottery"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @fromthewestmeadow.com: "simcluster lottery where you can come buy tickets
# and there are hourly daily and weekly draws that track your wallet balance
# with oauth login with balance reset monthly and a leader board for wallet
# balances with the goal to make the most money." Sign in with Bluesky (bare
# `atproto` scope — this site never writes to your PDS, see
# public/lib/oauth.js), buy tickets for three independently-clocked draws,
# and a single winner per draw takes the whole pot. Play money only — same
# "toy, not a casino" compromise as sites/notgambling: chips can't be bought
# or cashed out for anything real, and the whole point of the monthly reset
# is that nobody's balance is meant to mean anything past a month anyway.
#
# One Durable Object ("global") holds wallets, all three draws' ticket
# pools, resolution history, and the leaderboard — same single-writer shape
# as sites/guestbet's Market DO, extended to three independent clocks
# instead of one. A storage alarm resolves whichever draw is soonest due;
# every request also defensively resolves any draw whose clock has run out,
# so a missed/late alarm can't wedge a round (see src/index.ts).
#
# A brand-new site served at the root of its own hostname — no
# bisks.net/<name> path route, no mount-prefix stripping.
routes = [
  { pattern = "simcluster-lottery.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "LOTTERY"
class_name = "Lottery"

# new_sqlite_classes, not new_classes — legacy KV-backed DOs need Workers
# Paid; this account is on Free. See sites/the-place/wrangler.toml.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lottery"]
