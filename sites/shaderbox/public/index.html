<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shaderbox — shaders and a viewer</title>
<meta name="description" content="A shelf of neat-looking fragment shaders with a live viewer and editor. Pick one, drag through it, tweak the GLSL, share it.">
<meta property="og:title" content="shaderbox">
<meta property="og:description" content="A shelf of neat-looking fragment shaders with a live viewer and editor.">
<meta property="og:image" content="https://shaderbox.bisks.net/og.png">
<meta property="og:url" content="https://shaderbox.bisks.net/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://shaderbox.bisks.net/og.png">
<style>
  :root { color-scheme: dark; --bg:#0a0a12; --fg:#e6e6f2; --dim:#8b8ba3; --acc:#ff7ac6; --line:#23233a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
  header, main, footer { max-width:1100px; margin:0 auto; padding:16px; }
  h1 { margin:0; font-size:26px; letter-spacing:.02em; }
  .tag { color:var(--dim); margin:2px 0 0; }
  #stage { position:relative; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#000; }
  #view { display:block; width:100%; aspect-ratio:16/9; cursor:crosshair; }
  #nogl { padding:40px; text-align:center; color:var(--dim); }
  #nogl[hidden] { display:none; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:10px 0; }
  button, .btn { background:#171726; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 12px; font:inherit; cursor:pointer; text-decoration:none; }
  button:hover, .btn:hover { border-color:var(--acc); }
  #title { font-weight:600; margin-right:auto; }
  #title small { color:var(--dim); font-weight:400; margin-left:8px; }
  #shelf { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px,1fr)); gap:10px; margin:14px 0; }
  .card { padding:0; overflow:hidden; text-align:left; }
  .card img { display:block; width:100%; aspect-ratio:16/9; background:#111; }
  .card span { display:block; padding:6px 10px; }
  .card.on { border-color:var(--acc); }
  details { margin-top:8px; }
  summary { cursor:pointer; color:var(--dim); }
  #code { width:100%; height:300px; background:#0e0e1a; color:#d8d8ee; border:1px solid var(--line); border-radius:8px; padding:10px; font:13px/1.45 ui-monospace, Menlo, monospace; tab-size:2; resize:vertical; }
  #err { color:#ff8b8b; white-space:pre-wrap; font:12px ui-monospace, monospace; min-height:1.4em; }
  footer { color:var(--dim); font-size:13px; }
  footer a { color:var(--dim); }
</style>
</head>
<body>
<header>
  <h1>shaderbox</h1>
  <p class="tag">a shelf of fragment shaders and a viewer to poke at them</p>
</header>
<main>
  <div id="stage">
    <canvas id="view"></canvas>
    <div id="nogl" hidden>this browser has no WebGL, so the shaders have nowhere to run.</div>
  </div>
  <div class="bar">
    <div id="title"></div>
    <button id="pause" type="button">pause</button>
    <button id="restart" type="button">restart</button>
    <button id="full" type="button">fullscreen</button>
    <button id="shot" type="button">save png</button>
    <a id="share" class="btn" target="_blank" rel="noopener">post to bluesky</a>
  </div>
  <div id="shelf"></div>
  <details id="editor">
    <summary>edit the GLSL (uniforms: iTime, iResolution, iMouse)</summary>
    
    <textarea id="code" spellcheck="false"></textarea>
    <div id="err"></div>
    <div class="bar"><button id="copylink" type="button">copy link to this code</button></div>
  </details>
</main>
<footer>
  <a href="https://rateyourbuild.bisks.net/site/shaderbox">rate this on rateyourbuild →</a>
</footer>
<script type="module" src="app.js"></script>
</body>
</html>
