name = "atprotozoa-didsigil"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Resolves a Bluesky handle
# to its DID (com.atproto.identity.resolveHandle, public AppView, anonymous)
# and hashes the DID string into a seed for a deterministic radial kaleidoscope
# — same identity always draws the same sigil. No writes, no accounts, no
# per-request server logic.
assets = { directory = "./public" }

routes = [{ pattern = "didsigil.bisks.net/*", zone_name = "bisks.net" }]
