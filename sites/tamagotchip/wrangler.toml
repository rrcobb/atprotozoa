name = "atprotozoa-tamagotchip"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [{ pattern = "tamagotchip.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /f/<code> is dynamic (personalized OG tags per shared
# firmware), same pattern as sites/didscope and sites/windmill.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
