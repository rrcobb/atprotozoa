name = "atprotozoa-tamagotchip"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [{ pattern = "tamagotchip.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /f/<code> is dynamic (personalized OG tags per shared
# firmware), same pattern as sites/didscope and sites/windmill.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# redeploy nudge (2026-08-07): pnpm-lock.yaml fell out of sync with the workspace
# starting at the lovecoupons build and silently blocked every deploy since —
# CI's `pnpm install --frozen-lockfile` failed `check`, so `deploy` never ran
# for any site touched in that window. Lockfile fixed; this comment forces this
# site back into the changed-dirs diff so it actually redeploys. See notes/20-deploy.md.
