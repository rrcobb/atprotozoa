<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ragebait feed — an endless scroll of fake outrage</title>
<meta name="description" content="An infinite feed of fake infuriating posts in a Bluesky, Twitter or Reddit costume. Every like teaches the algorithm to serve you more of that topic." />
<meta property="og:title" content="ragebait feed — the algorithm learns what makes you mad" />
<meta property="og:description" content="Infinite scroll of fake outrage. Like a post, get more like it. Skin it as Bluesky, Twitter or Reddit." />
<meta property="og:url" content="https://ragebait.bisks.net/feed" />
<meta property="og:type" content="website" />
<meta property="og:image" content="https://ragebait.bisks.net/og.png" />

<meta name="twitter:image" content="https://ragebait.bisks.net/og.png" />
<style>
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.4 system-ui,sans-serif; background:var(--bg); color:var(--fg); --bg:#fff; --fg:#0b0f14; --dim:#667085; --line:#e3e7ee; --card:#fff; --acc:#1083fe; --likec:#ec4899; }
  body[data-skin="twitter"] { --bg:#000; --fg:#e7e9ea; --dim:#71767b; --line:#2f3336; --card:#000; --acc:#1d9bf0; --likec:#f91880; }
  body[data-skin="reddit"] { --bg:#dae0e6; --fg:#1c1c1c; --dim:#7c7c7c; --line:#ccc; --card:#fff; --acc:#ff4500; --likec:#ff4500; }
  main { max-width:600px; margin:0 auto; background:var(--card); min-height:100vh; border-left:1px solid var(--line); border-right:1px solid var(--line); }
  body[data-skin="reddit"] main { background:transparent; border:0; padding:0 8px; }
  .bar { position:sticky; top:0; z-index:2; background:var(--card); border-bottom:1px solid var(--line); padding:10px 14px; }
  body[data-skin="reddit"] .bar { margin:0 -8px; }
  .bar h1 { font-size:18px; margin:0 0 6px; } .bar h1 a { color:inherit; text-decoration:none; } .bar h1 span { color:var(--acc); }
  .skins { display:flex; gap:6px; flex-wrap:wrap; }
  .skins button, .bar .reset { background:none; border:1px solid var(--line); color:var(--fg); border-radius:999px; padding:4px 11px; font:inherit; font-size:13px; cursor:pointer; }
  .skins button.on { background:var(--acc); border-color:var(--acc); color:#fff; }
  .taste { color:var(--dim); font-size:12px; margin-top:6px; }
  .post { display:flex; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line); background:var(--card); }
  body[data-skin="reddit"] .post { margin-top:10px; border:1px solid var(--line); border-radius:6px; }
  .av { width:42px; height:42px; border-radius:50%; flex:none; display:grid; place-items:center; color:#fff; font-weight:700; }
  body[data-skin="reddit"] .av { width:28px; height:28px; font-size:13px; }
  .body { min-width:0; flex:1; }
  .head { display:flex; gap:6px; align-items:baseline; flex-wrap:wrap; }
  .dim { color:var(--dim); font-size:13px; }
  .tag { margin-left:auto; font-size:11px; color:var(--dim); border:1px solid var(--line); border-radius:4px; padding:0 6px; }
  .txt { margin:4px 0 8px; font-size:16px; white-space:pre-wrap; overflow-wrap:anywhere; }
  body[data-skin="reddit"] .txt { font-size:15px; }
  .act { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .act button, .act a { background:none; border:0; color:var(--dim); font:inherit; font-size:13px; padding:4px 8px; border-radius:999px; cursor:pointer; text-decoration:none; }
  body[data-skin="reddit"] .act button, body[data-skin="reddit"] .act a { font-weight:700; }
  .act button:hover, .act a:hover { background:color-mix(in srgb, var(--acc) 12%, transparent); }
  .act .like.on { color:var(--likec); font-weight:700; }
  .reps { margin-top:6px; border-left:2px solid var(--line); padding-left:8px; }
  .rep { color:var(--dim); font-size:13px; }
  #sentinel { height:60px; text-align:center; color:var(--dim); padding:20px; font-size:13px; }
  footer { color:var(--dim); font-size:13px; padding:14px; } footer a { color:var(--dim); }
</style>
</head>
<body data-skin="bluesky">
<main>
  <div class="bar">
    <h1><a href="/">rage<span>bait</span></a> feed</h1>
    <div class="skins" id="skins"></div>
    <div class="taste" id="taste"></div>
    <button class="reset" id="reset" style="margin-top:6px">reset the algo</button>
  </div>
  <div id="feed"></div>
  <div id="sentinel">more outrage loading…</div>
  <footer>
    <a href="/">← pick triggers instead</a> ·
    <a href="https://rateyourbuild.bisks.net/site/ragebait">rate this on rateyourbuild →</a>
    · every name, handle and number is generated. nobody here exists.
  </footer>
</main>
<script type="module" src="feed.js"></script>
</body>
</html>
