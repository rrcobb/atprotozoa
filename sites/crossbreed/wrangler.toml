name = "atprotozoa-crossbreed"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @buildthis.bisks.net and @minomobi.com breed a new site idea client-side
# from their public catalogs. Seeds are shareable deterministic snapshots;
# there is no shared wire, nursery, or global hatch authority.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [
  { pattern = "crossbreed.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/crossbreed", zone_name = "bisks.net" },
  { pattern = "bisks.net/crossbreed/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WireHub"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Hatchery"]

[[migrations]]
tag = "v3"
deleted_classes = ["WireHub", "Hatchery"]

[observability]
enabled = true
