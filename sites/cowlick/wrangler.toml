name = "atprotozoa-cowlick"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A cozy fidget/ASMR toy:
# a hairy 3D surface (sphere, torus, torus knot, or faceted gem) rendered with
# custom WebGL shaders (three.js). Drag across the fur to comb it flat along
# your stroke — it springs back over time. Drag empty space to look around,
# WASD/QE to fly the camera. Named for the "cowlick" the Hairy Ball Theorem
# guarantees on any sphere-like surface (the torus gets to cheat). Built after
# @antiali.as asked for "comb a hairy sphere with your finger, cf Sphere
# Vector Field Theory". No secrets, no server.
assets = { directory = "./public" }

routes = [{ pattern = "cowlick.bisks.net", custom_domain = true }]
