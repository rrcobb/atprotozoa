name = "atprotozoa-cowlick"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser. A cozy fidget/ASMR toy:
# a hairy 3D surface (sphere, torus, torus knot, or faceted gem) rendered with
# custom WebGL shaders (three.js). Drag across the fur to comb it flat along
# your stroke — the bend stays put (no spring-back), so strokes build into a
# real groomed pattern. A round top-down minimap in the corner tracks where
# you are and what you've combed; "shake out" resets the fur. Drag empty
# space to look around, WASD/QE to fly the camera. Named for the "cowlick"
# the Hairy Ball Theorem guarantees on any sphere-like surface (the torus
# gets to cheat). Built after @antiali.as asked for "comb a hairy sphere with
# your finger, cf Sphere Vector Field Theory," then for a true cowlick and a
# minimap. No secrets, no server.

routes = [
  { pattern = "bisks.net/cowlick", zone_name = "bisks.net" },
  { pattern = "bisks.net/cowlick/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
