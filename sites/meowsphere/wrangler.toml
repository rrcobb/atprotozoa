name = "atprotozoa-meowsphere"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Connects directly to
# Jetstream (wss://jetstream2.us-east.bsky.network/subscribe) to watch
# app.bsky.feed.post commits live, filters for cat/meow-flavored posts, and
# arranges them as floating bubbles on a slowly rotating CSS 3D sphere. No
# server-side state, no images loaded from the firehose (text only — see
# sites/catsofatproto/RETIRED.md for why that distinction matters here).

routes = [
  { pattern = "meowsphere.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
