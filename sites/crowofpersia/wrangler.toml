name = "atprotozoa-crowofpersia"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A side-scrolling
# dungeon platformer, Prince-of-Persia style: you're a crow, pecking guards
# instead of dueling them with a sword. The guards' faces are the avatars of
# whoever @norvid-studies.bsky.social follows, pulled anonymously from
# Bluesky's public AppView (app.bsky.graph.getFollows + a getProfiles batch,
# CORS *, no auth — cluster.js trimmed from pacmoot/lib/cluster.js, itself
# from mootdrone/clustercrawl/simcluster: copy, don't abstract). Canvas +
# vanilla JS, no server, no build step.
main = "src/index.ts"

# Path route on the shared bisks.net zone under the games/ cluster — see
# notes/40-new-site-playbook.md ("Why paths, not subdomains" / "Clusters").
routes = [
  { pattern = "crowofpersia.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/games/crowofpersia", zone_name = "bisks.net" },
  { pattern = "bisks.net/games/crowofpersia/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
