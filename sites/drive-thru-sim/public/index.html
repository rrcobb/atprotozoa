<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drive thru sim</title>
<meta name="description" content="you are the voice in the speaker. take the order, build the bag, beat the line.">
<meta property="og:title" content="drive thru sim">
<meta property="og:description" content="you are the voice in the speaker. take the order, build the bag, beat the line.">
<meta property="og:image" content="https://drive-thru-sim.bisks.net/og.png">
<meta property="og:url" content="https://drive-thru-sim.bisks.net/">

<body>
<header>
  <h1>🚗 drive thru sim</h1>
  <p class="sub">you are the voice in the speaker. take the order, build the bag, beat the line.</p>
</header>
<main>
  <section class="panel">
    <div class="stat"><span>served <b id="served">0</b></span><span>tips $<b id="tips">0</b></span><span>strikes <b id="strikes">0</b>/3</span></div>
    <div class="lane" id="lane" aria-label="cars in line"></div>
    <div class="bubble" id="bubble">press "open window" to start your shift</div>
    <div class="bar"><div id="pat"></div></div>
  </section>
  <section class="panel">
    <div class="menu" id="menu"></div>
    <p>bag: <b id="bag">(empty)</b></p>
    <button id="clear" type="button">dump bag</button>
    <button id="serve" type="button">hand it over</button>
    <button id="start" type="button">open window</button>
    <p class="msg" id="msg"></p>
  </section>

  <p class="share"><a id="share" href="#" target="_blank" rel="noopener">share on bluesky</a></p>
</main>
<footer>
  <a href="https://rateyourbuild.bisks.net/site/drive-thru-sim">rate this on rateyourbuild →</a>
</footer>
<script>
// games call setShare(text) when there is a result worth posting.
function setShare(t){document.getElementById("share").href="https://bsky.app/intent/compose?text="+encodeURIComponent(t+"\n"+"https://drive-thru-sim.bisks.net/");}
setShare("drive thru sim");
</script>
<script src="game.js"></script>
<script src="ring.js" data-site="drive-thru-sim"></script>
</body>
