name = "atprotozoa-bailiwick"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @kitto.nekoweb.org: a cozy semi-idle manorial-bailiff game. The whole game
# is static; the save is one record in the player's own PDS.

routes = [
  { pattern = "bailiwick.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
