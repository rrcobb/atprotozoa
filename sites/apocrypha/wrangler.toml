name = "atprotozoa-apocrypha"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site. A build script (build-data.mjs) precomputes
# public/data/quotes.json and public/data/figures.json ahead of time — the
# page itself does no live API calls, so this Worker's only job is serving
# public/ via ASSETS.

routes = [
  { pattern = "apocrypha.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
