name = "atprotozoa-verdict"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static + client-side OAuth (public client) — no server surface needed.
# One post, one verdict, written straight to the user's own PDS as a custom
# lexicon record (net.bisks.verdict.judgment).

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# verdict.bisks.net is being retired to free a slot against the zone's
# custom-domain cap (see notes/20-deploy.md). Migrated to bisks.net/verdict
# instead. See notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "bisks.net/verdict", zone_name = "bisks.net" },
  { pattern = "bisks.net/verdict/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
