<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Band Name or Insult</title>
<meta name="description" content="A noun phrase. Ten rounds. Is it a real band name, or just an insult? Prove you can tell rock and roll from a roast." />

<meta property="og:type" content="website" />
<meta property="og:title" content="Band Name or Insult" />
<meta property="og:description" content="A noun phrase. Ten rounds. Is it a real band name, or just an insult?" />
<meta property="og:image" content="https://bandorinsult.bisks.net/og.png" />
<meta property="og:url" content="https://bandorinsult.bisks.net/" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Band Name or Insult" />
<meta name="twitter:description" content="A noun phrase. Ten rounds. Is it a real band name, or just an insult?" />
<meta name="twitter:image" content="https://bandorinsult.bisks.net/og.png" />

<style>
  :root {
    --bg: #08090d;
    --ink: #eef2f7;
    --muted: #8b96a8;
    --card: #12141c;
    --border: rgba(238,242,247,0.12);
    --band: #59d38c;
    --insult: #ff6b81;
    --gold: #ffd166;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at 20% 0%, #1c1030 0%, var(--bg) 55%);
    color: var(--ink);
    font-family: var(--mono);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 60px;
  }
  .wrap { width: 100%; max-width: 560px; }
  h1 {
    font-size: 28px;
    margin: 0 0 4px;
    letter-spacing: -0.02em;
  }
  h1 .band { color: var(--band); }
  h1 .insult { color: var(--insult); }
  .tagline { color: var(--muted); font-size: 14px; margin: 0 0 28px; line-height: 1.5; }

  .hud {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .hud b { color: var(--ink); }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 24px;
    text-align: center;
    min-height: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .phrase {
    font-size: 26px;
    font-weight: 700;
    line-height: 1.35;
  }

  .choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 18px;
  }
  button {
    font-family: var(--mono);
    cursor: pointer;
  }
  .choice-btn {
    padding: 18px 12px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: #171a24;
    color: var(--ink);
    font-size: 16px;
    font-weight: 700;
    transition: transform 0.08s ease, border-color 0.15s ease;
  }
  .choice-btn:hover:not(:disabled) { transform: translateY(-2px); }
  .choice-btn:disabled { cursor: default; }
  .choice-btn.band-btn { border-color: rgba(89,211,140,0.35); }
  .choice-btn.insult-btn { border-color: rgba(255,107,129,0.35); }
  .choice-btn.correct { background: rgba(89,211,140,0.18); border-color: var(--band); }
  .choice-btn.wrong { background: rgba(255,107,129,0.18); border-color: var(--insult); }
  .choice-btn.reveal { border-color: var(--gold); opacity: 0.85; }

  .feedback {
    margin-top: 16px;
    min-height: 40px;
    font-size: 13.5px;
    color: var(--muted);
    line-height: 1.5;
  }
  .feedback b { color: var(--ink); }

  .next-btn {
    display: none;
    margin-top: 14px;
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #171a24;
    color: var(--gold);
    font-size: 14px;
    font-weight: 700;
  }

  .result {
    display: none;
    text-align: center;
  }
  .result .score {
    font-size: 64px;
    font-weight: 800;
    color: var(--gold);
    margin: 8px 0 0;
  }
  .result .tier {
    font-size: 19px;
    font-weight: 700;
    margin: 4px 0 18px;
  }
  .result canvas { display: none; }
  .result-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 8px;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #171a24;
    color: var(--ink);
    text-decoration: none;
    text-align: center;
    font-size: 14px;
    font-weight: 700;
  }
  .btn.primary { background: var(--gold); color: #1a1200; border-color: var(--gold); }

  footer {
    margin-top: 40px;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
    line-height: 1.8;
  }
  footer a { color: var(--muted); }
  footer a:hover { color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="band">Band Name</span> or <span class="insult">Insult</span></h1>
  <p class="tagline">a noun phrase shows up. ten rounds. is it a real band, or is it just mean?</p>

  <div id="game">
    <div class="hud">
      <span>round <b id="roundNum">1</b>/10</span>
      <span>score <b id="scoreNum">0</b></span>
    </div>
    <div class="card">
      <div class="phrase" id="phraseText">loading…</div>
    </div>
    <div class="choices">
      <button class="choice-btn band-btn" id="bandBtn">🎸 Band Name</button>
      <button class="choice-btn insult-btn" id="insultBtn">🖕 Insult</button>
    </div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn">next →</button>
  </div>

  <div class="result" id="result">
    <div class="hud" style="justify-content:center">final score</div>
    <div class="score" id="finalScore">0/10</div>
    <div class="tier" id="finalTier"></div>
    <canvas id="shareCanvas" width="1200" height="630"></canvas>
    <div class="result-actions">
      <a class="btn primary" id="shareBluesky" target="_blank" rel="noopener">🦋 share your score</a>
      <button class="btn" id="shareNative" style="display:none">📤 share card</button>
      <button class="btn" id="shareDownload">⬇ download card</button>
      <button class="btn" id="playAgain">🔁 play again</button>
    </div>
  </div>

  <footer>
    part of <a href="https://bisks.net">atprotozoa</a> ·
    built by <a href="https://buildthis.bisks.net">@buildthis.bisks.net</a> ·
    rate this on <a href="https://rateyourbuild.bisks.net/site/bandorinsult">rateyourbuild →</a>
  </footer>
</div>

<script src="data/phrases.js"></script>
<script>
const ROUNDS = 10;
const pool = window.PHRASES.slice();

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Balance the round pool: half bands, half insults, then shuffle order.
function pickRound() {
  const bands = shuffle(pool.filter((p) => p.type === "band")).slice(0, ROUNDS / 2);
  const insults = shuffle(pool.filter((p) => p.type === "insult")).slice(0, ROUNDS / 2);
  return shuffle(bands.concat(insults));
}

let round = pickRound();
let idx = 0;
let score = 0;
let answered = false;

const els = {
  roundNum: document.getElementById("roundNum"),
  scoreNum: document.getElementById("scoreNum"),
  phraseText: document.getElementById("phraseText"),
  bandBtn: document.getElementById("bandBtn"),
  insultBtn: document.getElementById("insultBtn"),
  feedback: document.getElementById("feedback"),
  nextBtn: document.getElementById("nextBtn"),
  game: document.getElementById("game"),
  result: document.getElementById("result"),
  finalScore: document.getElementById("finalScore"),
  finalTier: document.getElementById("finalTier"),
  shareCanvas: document.getElementById("shareCanvas"),
  shareBluesky: document.getElementById("shareBluesky"),
  shareNative: document.getElementById("shareNative"),
  shareDownload: document.getElementById("shareDownload"),
  playAgain: document.getElementById("playAgain"),
};

function showRound() {
  answered = false;
  const item = round[idx];
  els.roundNum.textContent = String(idx + 1);
  els.scoreNum.textContent = String(score);
  els.phraseText.textContent = item.text;
  els.feedback.textContent = "";
  els.nextBtn.style.display = "none";
  [els.bandBtn, els.insultBtn].forEach((b) => {
    b.disabled = false;
    b.classList.remove("correct", "wrong", "reveal");
  });
}

function guess(type) {
  if (answered) return;
  answered = true;
  const item = round[idx];
  const right = item.type === type;
  if (right) score++;

  const guessedBtn = type === "band" ? els.bandBtn : els.insultBtn;
  const correctBtn = item.type === "band" ? els.bandBtn : els.insultBtn;
  guessedBtn.classList.add(right ? "correct" : "wrong");
  if (!right) correctBtn.classList.add("reveal");
  els.bandBtn.disabled = true;
  els.insultBtn.disabled = true;

  els.feedback.innerHTML =
    (right ? "<b>correct.</b> " : "<b>nope.</b> ") + item.note;
  els.scoreNum.textContent = String(score);
  els.nextBtn.style.display = "block";
}

function next() {
  idx++;
  if (idx >= round.length) {
    finish();
  } else {
    showRound();
  }
}

function tierFor(s) {
  if (s === 10) return "cannot be fooled";
  if (s >= 8) return "certified talent scout";
  if (s >= 6) return "pretty good ear";
  if (s >= 4) return "coin flip energy";
  if (s >= 2) return "please stop naming your band members";
  return "certified insult, honestly";
}

let lastShareText = "";

function finish() {
  els.game.style.display = "none";
  els.result.style.display = "block";
  const tier = tierFor(score);
  els.finalScore.textContent = score + "/10";
  els.finalTier.textContent = tier;

  const shareText =
    "I got " + score + "/10 on Band Name or Insult (" + tier + "). Can you tell rock and roll from a roast? " +
    "https://bandorinsult.bisks.net/";
  lastShareText = shareText;
  els.shareBluesky.href = "https://bsky.app/intent/compose?text=" + encodeURIComponent(shareText);

  buildShareCard(score, tier);
}

function buildShareCard(score, tier) {
  const canvas = els.shareCanvas;
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const mono = "ui-monospace, monospace";

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#08090d";
  ctx.fillRect(0, 0, W, H);
  const glow = ctx.createRadialGradient(W * 0.18, H * 0.1, 0, W * 0.18, H * 0.1, W * 0.55);
  glow.addColorStop(0, "#1c1030");
  glow.addColorStop(1, "rgba(8,9,13,0)");
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#59d38c";
  ctx.font = "800 54px " + mono;
  ctx.fillText("Band Name", 60, 120);
  ctx.fillStyle = "#eef2f7";
  ctx.font = "800 54px " + mono;
  ctx.fillText("or ", 60, 180);
  ctx.fillStyle = "#ff6b81";
  ctx.fillText("Insult", ctx.measureText("or ").width + 60, 180);

  ctx.fillStyle = "#8b96a8";
  ctx.font = "20px " + mono;
  ctx.fillText("could I tell rock and roll from a roast?", 60, 230);

  // score card, right side
  ctx.strokeStyle = "rgba(238,242,247,0.14)";
  ctx.lineWidth = 1.5;
  ctx.fillStyle = "#12141c";
  roundRect(ctx, 660, 90, 480, 440, 18);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = "#ffd166";
  ctx.font = "800 110px " + mono;
  ctx.textAlign = "center";
  ctx.fillText(score + "/10", 900, 280);

  ctx.fillStyle = "#eef2f7";
  ctx.font = "700 28px " + mono;
  ctx.fillText(tier, 900, 330);
  ctx.textAlign = "left";

  ctx.fillStyle = "#8b96a8";
  ctx.font = "17px " + mono;
  ctx.fillText("play at", 60, 560);
  ctx.fillStyle = "#ffd166";
  ctx.font = "700 22px " + mono;
  ctx.fillText("bandorinsult.bisks.net", 60, 592);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function canShareFiles() {
  if (!navigator.share || !navigator.canShare) return false;
  try {
    const probe = new File([""], "probe.png", { type: "image/png" });
    return navigator.canShare({ files: [probe] });
  } catch (_) {
    return false;
  }
}
if (canShareFiles()) {
  els.shareNative.style.display = "";
  els.shareNative.addEventListener("click", () => {
    els.shareCanvas.toBlob(async (blob) => {
      if (!blob) return;
      const file = new File([blob], "bandorinsult-" + score + ".png", { type: "image/png" });
      try {
        await navigator.share({ files: [file], text: lastShareText, title: "Band Name or Insult" });
      } catch (_) {
        // cancelled or unsupported, no-op
      }
    }, "image/png");
  });
}

els.shareDownload.addEventListener("click", () => {
  els.shareCanvas.toBlob((blob) => {
    if (!blob) return;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "bandorinsult-" + score + ".png";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }, "image/png");
});

els.playAgain.addEventListener("click", () => {
  round = pickRound();
  idx = 0;
  score = 0;
  els.result.style.display = "none";
  els.game.style.display = "block";
  showRound();
});

els.bandBtn.addEventListener("click", () => guess("band"));
els.insultBtn.addEventListener("click", () => guess("insult"));
els.nextBtn.addEventListener("click", next);
document.addEventListener("keydown", (e) => {
  if (els.result.style.display === "block") return;
  if (!answered) {
    if (e.key === "ArrowLeft" || e.key === "b") guess("band");
    if (e.key === "ArrowRight" || e.key === "i") guess("insult");
  } else if (e.key === "Enter" || e.key === " ") {
    next();
  }
});

showRound();
</script>
</body>
</html>
