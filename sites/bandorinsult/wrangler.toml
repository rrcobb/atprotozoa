# sites/bandorinsult/wrangler.toml
#
# Pure static site — everything runs in the browser. Show a noun phrase,
# guess whether it's a real band name or an insult. No accounts, no atproto
# records, no server state; the round pool lives in public/data/phrases.js.
name = "atprotozoa-bandorinsult"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [
  { pattern = "bandorinsult.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
