name = "atprotozoa-normalometer"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Redeployed 2026-09-04: this site's original build push failed CI's `check`
# job, which skips `deploy` repo-wide, and no later push happened to touch
# this dir again to retrigger it — so it sat live-linked on the gallery but
# 404ing since 2026-08-17. `check` passes clean now. See notes/20-deploy.md.

routes = [
  { pattern = "normalometer.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
