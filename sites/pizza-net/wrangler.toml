name = "atprotozoa-pizza-net"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# A recreation of "pizza.net", the fictional online pizza-ordering site from
# The Net (1995) — the scene where Sandra Bullock's character orders a large
# with mushrooms and pesto over the World Wide Web, years before that was a
# real thing. Static toy, no server-side state; the "order" is entirely
# client-side theatre.
routes = [{ pattern = "pizza-net.bisks.net/*", zone_name = "bisks.net" }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = false
