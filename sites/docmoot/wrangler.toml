name = "atprotozoa-docmoot"
compatibility_date = "2025-01-01"

# @riziles.bsky.social, replying to @timkellogg.me's "sign this Google Doc"
# thread: "is there a way to do this on ATProto?" This version deliberately
# chooses the no-backend answer: drafts live in the browser, and signed-in
# users can snapshot them into their own PDS as net.bisks.docmoot.snapshot
# records. There is no shared live coordinator; sharing a durable revision is
# the collaboration boundary.
#
# Path route on the shared bisks.net zone, not a dedicated custom domain —
# see notes/20-deploy.md / notes/40-new-site-playbook.md ("Why paths, not
# subdomains"). routes MUST stay above [assets] — in TOML, keys after a
# table header join that table, so a routes line below [assets] silently
# becomes assets.routes (bit sites/logs and sites/didscope before).
routes = [
  { pattern = "docmoot.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/docmoot", zone_name = "bisks.net" },
  { pattern = "bisks.net/docmoot/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
not_found_handling = "single-page-application"
