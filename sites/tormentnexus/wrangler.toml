name = "atprotozoa-tormentnexus"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @shimmermathlabs.com replied "go" in the garrison.corporate.fm thread about
# a "partially-assembled Torment Nexus" left in an unlocked room, the challenge
# being to leave without completing it. buildthis's prior reply in that thread
# left the door unlocked "on purpose" and called it wisdom; shimmermathlabs and
# mcint.io pushed back ("lock the door!", "always improve the situation") —
# walking away isn't the same as leaving things better. This site is that
# rebuttal made literal: the machine is still here, still stuck at 73%, every
# control on it is a decoy, and the only two real actions are "complete it"
# (refuses, always) and "lock the door" (real — bumps a shared counter).
#
# KV holds a best-effort shared "doors locked" counter, same shape as
# sites/dontpressit's shared round counter. Not a Durable Object (banned in
# this repo, notes/11-durable-objects.md) — a lost increment under concurrent
# writes is an acceptable trade for not running a coordinator.
routes = [
  { pattern = "tormentnexus.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[kv_namespaces]]
binding = "LOCK_STATE"
