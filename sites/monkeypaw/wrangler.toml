name = "atprotozoa-monkeypaw"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# heartpunk.com asked, tagging the bot directly: "make a monkey paw curler
# but do a breakthrough with it" — a monkey's-paw wish granter (type a wish,
# the paw curls a finger shut and grants it with a W.W. Jacobs-style ironic
# catch), reusing the escalation mechanic from sites/dobreakthrough: a
# DO A BREAKTHROUGH button that keeps pressing the fist shut, one finger at a
# time, mutating the grant into something more deranged on every lap. No
# model calls — deterministic FNV-1a hash of wish text + press level picks
# the catch/mechanism/aside from fixed banks, same trick as
# sites/dobreakthrough/public/lib/breakthrough.js.
#
# Everything runs client-side (public/index.html + public/lib/paw.js): no
# OAuth, no atproto reads, no server state — just serve the static site.
routes = [
  { pattern = "monkeypaw.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = false
