name = "atprotozoa-listcheck"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser. Type a Bluesky handle:
# browse their followers/following (public AppView, getFollowers/getFollows,
# CORS *), then click any one person to check — just that one pair — whether
# either side blocks the other, directly or via a subscribed moderation list
# (one app.bsky.graph.getRelationships call, plus app.bsky.graph.getList for
# a list hit's name/drill-down). Forked from sites/followwall (copy, don't
# abstract) for the handle-input shell and paging; the block cross-check is
# new. See public/lib/blocklists.js for why it's deliberately one
# relationship per click rather than a bulk sweep of the whole list.

routes = [
  { pattern = "listcheck.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
