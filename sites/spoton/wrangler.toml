name = "atprotozoa-spoton"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A short run of
# precision/estimation rounds (find the midpoint of a line, click the
# center dot of a grid, guess the bean count in a jar, drag-select a box
# over an exact bean count), scored and totaled into an "eyeball rating"
# at the end. Canvas + vanilla JS, no server, no build step.
main = "src/index.ts"

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# mounted under the games/ cluster alongside pacmoot, moottris, etc. See
# notes/40-new-site-playbook.md ("Clusters").
routes = [
  { pattern = "spoton.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/games/spoton", zone_name = "bisks.net" },
  { pattern = "bisks.net/games/spoton/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
