name = "atprotozoa-quine-garden"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Path route on the shared zone, not a dedicated custom domain — the
# bisks.net zone hit a Cloudflare custom-domain cap (see notes/20-deploy.md).
routes = [
  { pattern = "bisks.net/quine-garden", zone_name = "bisks.net" },
  { pattern = "bisks.net/quine-garden/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
