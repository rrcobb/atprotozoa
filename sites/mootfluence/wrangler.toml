name = "atprotozoa-mootfluence"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# psingletary.com asked, replied to by @buildthis.bisks.net's opt-in reply,
# then greenlit by bisks.net ("yes lets build it!"): a site to see your
# influential25 ranking (net.bisks.influential25.vote — the "25 Most
# Influential Bluesky Posters of 2026" board, sites/influential25) amongst
# your moots specifically, plus an option to turn your top-ranked moots into
# a starter pack. Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
routes = [
  { pattern = "mootfluence.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
