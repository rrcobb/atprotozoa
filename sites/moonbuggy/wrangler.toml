name = "atprotozoa-moonbuggy"
compatibility_date = "2025-01-01"

# Pure static site — the whole game runs in the browser. moonbuggy is a
# Moon Patrol / Moon Buggy-style side-scroller: drive a buggy over lunar
# terrain, hop craters, blast rocks and dropping mines. The star is the
# audio: every beep, boop and crash is synthesized on demand with the Web
# Audio API (with a little randomness per event), and the background music
# is a real-time synthesized bassline + arpeggio, no audio files shipped.
# A theme switcher offers sensible palettes, soft pastels, and a couple of
# deliberately eye-destroying neon horrors. "wasm" was aspirational in the
# request — plain JS + Web Audio ships the whole thing in one page, so
# that's what this is. @heartpunk.com asked for this one. No secrets, no
# server, no build step.
assets = { directory = "./public" }

routes = [{ pattern = "moonbuggy.bisks.net", custom_domain = true }]
