<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pwaslots — app idea slot machine</title>
<meta name="description" content="Pull the lever: a PWA feature + an atproto feature + a market segment = your next app idea.">
<meta property="og:type" content="website">
<meta property="og:title" content="pwaslots — app idea slot machine">
<meta property="og:description" content="PWA feature + atproto feature + market segment. Pull the lever.">
<meta property="og:url" content="https://pwaslots.bisks.net/">
<meta property="og:image" content="https://pwaslots.bisks.net/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://pwaslots.bisks.net/og.png">
<style>
*{box-sizing:border-box}
body{margin:0;background:#1a0f2e;color:#fff4d6;font:16px/1.4 system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 12px}
h1{margin:0;font-size:2rem;letter-spacing:.04em;color:#ffd23f;text-shadow:0 2px 0 #b3401f}
.sub{margin:4px 0 18px;opacity:.8;text-align:center}
.machine{background:linear-gradient(#c8321f,#8f1d12);border:4px solid #ffd23f;border-radius:20px;padding:18px;max-width:920px;width:100%;box-shadow:0 10px 0 #4d0d07}
.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.col{display:flex;flex-direction:column;gap:8px}
.label{text-align:center;font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:#ffd23f}
.reel{height:150px;background:#fffdf4;color:#2a1330;border:3px inset #b8a46a;border-radius:10px;overflow:hidden;position:relative}
.reel::before,.reel::after{content:"";position:absolute;left:0;right:0;height:30px;z-index:2;pointer-events:none}
.reel::before{top:0;background:linear-gradient(#0003,#0000)}
.reel::after{bottom:0;background:linear-gradient(#0000,#0003)}
.strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.cell{height:150px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px;font-weight:700;font-size:1.05rem}
.btns{display:flex;gap:6px}
.btns button{flex:1;padding:8px;border:2px solid #ffd23f;background:#4d0d07;color:#ffd23f;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}
.btns button:hover{background:#6b1409}
.btns button.on{background:#ffd23f;color:#4d0d07}
.pull{display:block;margin:18px auto 0;padding:14px 40px;font:inherit;font-size:1.3rem;font-weight:800;border:0;border-radius:999px;background:#ffd23f;color:#4d0d07;cursor:pointer;box-shadow:0 5px 0 #b38a00}
.pull:active{transform:translateY(3px);box-shadow:0 2px 0 #b38a00}
.pull:disabled{opacity:.6}
.idea{max-width:920px;width:100%;margin-top:20px;background:#2b1b47;border-radius:14px;padding:16px 18px}
.idea p{margin:0 0 10px;font-size:1.15rem}
.idea .row{display:flex;gap:10px;flex-wrap:wrap}
.idea a,.idea button{padding:8px 14px;border-radius:8px;border:0;background:#ffd23f;color:#4d0d07;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
.idea small{display:block;margin-top:10px;opacity:.7}
footer{margin-top:24px;font-size:.85rem;opacity:.75;text-align:center;display:flex;gap:6px 14px;flex-wrap:wrap;justify-content:center}
footer a{color:#ffd23f}
@media(max-width:640px){.reels{grid-template-columns:1fr}.reel{height:90px}.cell{height:90px}}
</style>
</head>
<body>
<h1>🎰 <span id="t">pwaslots</span></h1>
<p class="sub">Three reels. One app idea. Re-roll any reel, or hold it and pull again.</p>

<div class="machine">
  <div class="reels" id="reels"></div>
  <button class="pull" id="pull" type="button">PULL</button>
</div>

<div class="idea" id="idea">
  <p id="ideatext">Pull the lever.</p>
  <div class="row">
    <a id="share" href="#" target="_blank" rel="noopener">Post to Bluesky</a>
    <button id="copy" type="button">Copy</button>
  </div>
  <small>Features are loosely chosen; mashing them together is the fun part.</small>
</div>

<footer>
  <span>PWA ideas inspired by <a href="https://whatpwacando.today">whatpwacando.today</a></span>
  <a href="https://rateyourbuild.bisks.net/site/pwaslots">rate this on rateyourbuild →</a>
  <a href="https://nanofomo.bisks.net/">November is #NaNoFoMo: pledge not to foom →</a>
</footer>

<script>
const DATA = {
  pwa: {
    label: 'PWA feature',
    items: ['Offline service worker','Web Push notifications','Install to home screen','Background Sync','Background Fetch','Web Share API','Geolocation','Camera & microphone capture','Barcode detection','Web Bluetooth','Web NFC','Screen Wake Lock','Vibration API','Contact Picker','File System Access','File Handling','Protocol handling','App shortcuts','Window Controls Overlay','View Transitions','Media Session','WebAuthn passkeys','WebAuthn PRF encryption','Payment Request','Badging API','Document Picture-in-Picture','Compression Streams','Device orientation / motion','Speech recognition & synthesis','Augmented reality (WebXR)']
  },
  atp: {
    label: 'ATProto feature',
    items: ['OAuth login','Custom lexicon records','Firehose / Jetstream','Feed generator','Labeler','Handle & DID resolution','Blob storage on your PDS','Repo export (getRepo / CAR)','Lists & starter packs','Likes as signals','Quote-post graph','Custom domain handles','did:web identity','PDS migration','Moderation labels','Chat / DMs','Threadgates & postgates','Backlinks via Constellation','Verification badges','Service auth (inter-service JWT)','Post embeds & link cards','Follows graph']
  },
  seg: {
    label: 'Market segment',
    items: ['Beekeepers','Indie game devs','Night-shift nurses','Hobbyist birders','Wedding planners','Long-haul truckers','Home bakers','Climbing gyms','Small-town librarians','Podcast producers','Urban gardeners','Dungeon masters','Food-truck owners','Amateur astronomers','Dog walkers','Language learners','Street musicians','Marathon runners','Thrift resellers','Substitute teachers','Farmers market vendors','Open-source maintainers','Coffee roasters','Tabletop shops']
  }
};
const KEYS = ['pwa','atp','seg'];
const CELL = 150;
const mobile = () => matchMedia('(max-width:640px)').matches;
const cellH = () => mobile() ? 90 : CELL;
const state = {}, held = {};
const $ = id => document.getElementById(id);

function build() {
  const root = $('reels');
  KEYS.forEach(k => {
    const col = document.createElement('div'); col.className = 'col';
    col.innerHTML = '<div class="label"></div><div class="reel"><div class="strip"></div></div>' +
      '<div class="btns"><button type="button" data-act="roll" title="Re-roll this reel">🎲 Re-roll</button>' +
      '<button type="button" data-act="hold" aria-pressed="false">Hold</button></div>';
    col.querySelector('.label').textContent = DATA[k].label;
    col.querySelector('[data-act=roll]').onclick = () => spin([k]);
    const hb = col.querySelector('[data-act=hold]');
    hb.onclick = () => { held[k] = !held[k]; hb.classList.toggle('on', held[k]); hb.setAttribute('aria-pressed', held[k]); };
    root.appendChild(col);
    state[k] = { idx: Math.floor(Math.random() * DATA[k].items.length), strip: col.querySelector('.strip') };
    setStrip(k, [DATA[k].items[state[k].idx]]);
  });
}
function setStrip(k, list) {
  const s = state[k].strip;
  s.style.transition = 'none'; s.style.transform = 'translateY(0)';
  s.innerHTML = '';
  list.forEach(t => { const d = document.createElement('div'); d.className = 'cell'; d.textContent = t; s.appendChild(d); });
}
let busy = 0;
function spin(keys) {
  keys.forEach((k, n) => {
    const items = DATA[k].items, cur = items[state[k].idx];
    let next; do { next = Math.floor(Math.random() * items.length); } while (items.length > 1 && next === state[k].idx);
    // Blur-through strip: current, a run of random items, then the landing item.
    const run = 14 + n * 6, list = [cur];
    for (let i = 0; i < run; i++) list.push(items[Math.floor(Math.random() * items.length)]);
    list.push(items[next]);
    state[k].idx = next;
    setStrip(k, list);
    const s = state[k].strip, h = cellH();
    void s.offsetHeight;
    busy++; $('pull').disabled = true;
    const dur = 900 + n * 350 + Math.random() * 300;
    s.style.transition = `transform ${dur}ms cubic-bezier(.15,.7,.2,1)`;
    s.style.transform = `translateY(${-h * (list.length - 1)}px)`;
    let done = false;
    const fin = () => {
      if (done) return; done = true;
      setStrip(k, [items[next]]);
      if (--busy === 0) { $('pull').disabled = false; update(); }
    };
    s.addEventListener('transitionend', fin, { once: true });
    setTimeout(fin, dur + 200); // fallback if transitionend never fires (hidden tab)
  });
}
function idea() {
  const g = k => DATA[k].items[state[k].idx];
  return `App idea: ${g('seg')} get a PWA built on "${g('pwa')}" + atproto "${g('atp')}".`;
}
function update() {
  const t = idea();
  $('ideatext').textContent = t;
  $('share').href = 'https://bsky.app/intent/compose?text=' + encodeURIComponent(t + '\n\nhttps://pwaslots.bisks.net/');
}
$('pull').onclick = () => { const ks = KEYS.filter(k => !held[k]); if (ks.length) spin(ks); };
$('copy').onclick = () => { navigator.clipboard && navigator.clipboard.writeText(idea()); $('copy').textContent = 'Copied'; setTimeout(() => $('copy').textContent = 'Copy', 1200); };
build(); update();
</script>
</body>
</html>
