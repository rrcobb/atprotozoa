name = "atprotozoa-quotebucket"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# quotebucket (quotebucket.bisks.net): a crow watches a bucket. Every time
# @norvid-studies.bsky.social quote-posts something, the crow flies up and
# drops a bisk in the bucket. Pure static site — everything runs client-side
# against Bluesky's public, anonymous AppView (api.bsky.app, CORS *):
# getAuthorFeed on norvid's DID, filtered to posts with a record embed
# (a quote) authored by them (not a repost). The "day" is a fixed UTC
# midnight-to-midnight window computed the same way by every visitor, so the
# bucket count and countdown agree across browsers with no shared server
# state at all. Every 24h the bucket tips and the count resets.
routes = [
  { pattern = "quotebucket.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true
