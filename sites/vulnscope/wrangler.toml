name = "atprotozoa-vulnscope"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Everything runs client-side (see public/app.js) EXCEPT the OG/share unfurl:
# /s/<handle> is a real, distinct URL per person, server-rendered with a
# personalized og:title/description so a shared link doesn't collapse into
# one generic cached embed for everyone (same fix, same reasoning as
# sites/didscope's src/index.ts).
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes
# (same gotcha called out in buildthis/logs/wrangler.toml).
routes = [{ pattern = "vulnscope.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /s/<handle> is dynamic, so the Worker must run before the
# static-asset router, same as sites/didscope and sites/logs.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
