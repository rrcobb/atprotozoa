# @shibbi.me asked for "an alarmingly effusive interactive love letter to the
# Collatz conjecture" — give it any positive integer and it computes the
# hailstone sequence (n/2 if even, 3n+1 if odd) client-side, animates it as a
# heart-monitor line, and writes the number an unhinged love letter about
# always coming home to 1. Pure math, no external calls — the whole thing
# runs in the browser.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
#
# Redeployed 2026-09-04: this site's original build push failed CI's `check`
# job, which skips `deploy` repo-wide, and no later push happened to touch
# this dir again to retrigger it — so it sat live-linked on the gallery but
# 404ing since 2026-08-30. `check` passes clean now. See notes/20-deploy.md.
name = "atprotozoa-collatz"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [
  { pattern = "collatz.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
