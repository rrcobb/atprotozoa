name = "atprotozoa-thewall"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Follow-up to sites/corkboard (random-yarn version) for
# @dulanyw.bsky.social, in a thread started by catblanketflower.yuwakisa.com.
# The ask this time: an infinite pannable board where you can import real
# skeets (not just typed strings), draw your OWN yarn between pieces instead
# of random connections, and have the board persist under a link you can
# come back to and keep updating — multiplayer "encouraged but not required".
#
# That persistence + shared-editing requirement is exactly what corkboard's
# fully-client, URL-encoded-state design can't do (a share link there is a
# frozen snapshot, and there's no server to have multiple people write to).
# So: one Durable Object per board id, holding cards + yarn in transactional
# storage, with a small HTTP API the client polls — same shape as
# sites/the-place's shared Canvas DO (see its wrangler.toml/src/index.ts for
# the reference pattern), just keyed per-board via idFromName(boardId)
# instead of a single "global" instance.
routes = [
  { pattern = "thewall.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
# Board pages are shareable/linkable at /b/<id>, a client-routed path with no
# matching file on disk — single-page-application fallback serves index.html
# for any such path and app.js reads the id off location.pathname. Same
# pattern as sites/immortals.
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "BOARD"
class_name = "Board"

# new_sqlite_classes, not new_classes — legacy KV-backed DOs need Workers
# Paid; this account is on Free. See notes/20-deploy.md and the same fix
# noted in sites/the-place, sites/ratioed, sites/mootrider.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Board"]
