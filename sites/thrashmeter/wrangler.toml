name = "atprotozoa-thrashmeter"
compatibility_date = "2025-01-01"

# Frontend-only site: the browser reads the account CAR and keeps results local.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
#
routes = [
  { pattern = "thrashmeter.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Thrashboard"]

[[migrations]]
tag = "v2"
deleted_classes = ["Thrashboard"]
