<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>everzoom — an eternally zooming fractal</title>
<meta name="description" content="A Mandelbrot set that never stops falling inward. Double-float precision GLSL gets it about a trillion times deeper than plain float32 before it seamlessly re-dives into the next coordinate — drag to pan, scroll to steer the dive yourself.">
<meta property="og:title" content="everzoom — an eternally zooming fractal">
<meta property="og:description" content="Falls forever into the Mandelbrot set: double-float GLSL for ~1e11x depth, then a fade-cut into the next coordinate. Drag or scroll to take the wheel.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://bisks.net/everzoom">
<meta property="og:image" content="https://bisks.net/everzoom/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A glowing Mandelbrot cardioid silhouette ringed by concentric zoom rings on a dark background, with the everzoom title.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="everzoom — an eternally zooming fractal">
<meta name="twitter:description" content="Falls forever into the Mandelbrot set: double-float GLSL for ~1e11x depth, then a fade-cut into the next coordinate. Drag or scroll to take the wheel.">
<style>
  html, body { margin: 0; height: 100%; background: #050308; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #veil {
    position: fixed; inset: 0; background: #050308; pointer-events: none;
    opacity: 0; transition: opacity 0.9s ease;
  }
  #veil.on { opacity: 1; }
  #hud, #back {
    position: fixed; font: 12px/1.5 ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    color: #d7b8ff; text-shadow: 0 0 8px rgba(180, 100, 255, .45); letter-spacing: .01em;
  }
  #hud { left: .75rem; bottom: .65rem; opacity: .9; max-width: calc(100vw - 1.5rem); }
  #hud a, #hud button { color: #d7b8ff; }
  #hud button {
    font: inherit; background: none; border: 1px solid rgba(215,184,255,.35);
    border-radius: 999px; padding: .1rem .55rem; cursor: pointer; color: #d7b8ff;
  }
  #hud button:hover { border-color: rgba(215,184,255,.8); }
  #back { left: .75rem; top: .65rem; opacity: .6; text-decoration: none; }
  #back:hover { opacity: 1; }
  #fallback { color: #d7b8ff; font: 14px ui-monospace, monospace; padding: 3rem 1.25rem; max-width: 32rem; }
  #fallback a { color: #d7b8ff; }
</style>
</head>
<body>
<a id="back" href="https://bisks.net">&larr; the zoo</a>
<canvas id="c"></canvas>
<div id="veil"></div>
<div id="hud">
  everzoom &middot; <span id="loc">seahorse valley</span> &middot; <span id="depth">1&times;</span> &middot;
  <button id="next" type="button" title="skip to the next dive">next &rarr;</button> &middot;
  <a id="share" href="#" target="_blank" rel="noopener">skeet it</a>
</div>
<script id="app">
(function () {
  "use strict";
  var c = document.getElementById("c");
  var gl = c.getContext("webgl2");
  if (!gl) {
    var msg = document.createElement("div");
    msg.id = "fallback";
    msg.innerHTML = "this demo needs <b>WebGL2</b> &mdash; try a recent desktop " +
      "Chrome, Firefox, or Safari. (<a href=\"https://bisks.net\">&larr; back to the zoo</a>)";
    c.replaceWith(msg);
    return;
  }

  // --- curated dive coordinates: boundary points of the Mandelbrot set that
  // stay interesting a long way down. Feigenbaum's is genuinely, literally
  // self-similar forever; the rest just look that way for ~1e11x.
  var POINTS = [
    { re: -0.743643887037151, im: 0.131825904205330, label: "seahorse valley" },
    { re: -1.401155189092506, im: 0.0, label: "feigenbaum point" },
    { re: -1.749705768080503, im: 0.0, label: "scepter valley" },
    { re: -0.088, im: 0.654, label: "triple spiral" },
    { re: 0.282271483350253, im: 0.010818462359, label: "elephant valley" },
    { re: -0.7453, im: 0.1127, label: "julia island" }
  ];

  var vsSrc = "#version 300 es\n" +
    "void main(){" +
    "vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);" +
    "gl_Position=vec4(p*2.0-1.0,0.0,1.0);" +
    "}";

  var fsSrc = "#version 300 es\n" +
    "precision highp float;\n" +
    "out vec4 o;\n" +
    "uniform vec2 R;\n" +
    "uniform vec4 C;\n" +
    "uniform vec2 S;\n" +
    "uniform float T;\n" +
    "uniform int uMaxIter;\n" +
    // double-float (Dekker) arithmetic: each df number is a vec2(hi, lo).
    // Gets us from float32's ~7 decimal digits to ~15, which is what turns
    // a Mandelbrot zoom from "bottoms out around 1e5x" into "bottoms out
    // somewhere past 1e11x".
    "vec2 twoSum(float a,float b){float s=a+b;float bb=s-a;float e=(a-(s-bb))+(b-bb);return vec2(s,e);}\n" +
    "vec2 quickTwoSum(float a,float b){float s=a+b;float e=b-(s-a);return vec2(s,e);}\n" +
    "vec2 dfSplit(float a){float t=a*4097.0;float hi=t-(t-a);float lo=a-hi;return vec2(hi,lo);}\n" +
    "vec2 twoProd(float a,float b){float p=a*b;vec2 as_=dfSplit(a);vec2 bs=dfSplit(b);float e=((as_.x*bs.x-p)+as_.x*bs.y+as_.y*bs.x)+as_.y*bs.y;return vec2(p,e);}\n" +
    "vec2 dfAdd(vec2 a,vec2 b){vec2 s=twoSum(a.x,b.x);float e=s.y+a.y+b.y;return quickTwoSum(s.x,e);}\n" +
    "vec2 dfSub(vec2 a,vec2 b){return dfAdd(a,vec2(-b.x,-b.y));}\n" +
    "vec2 dfMul(vec2 a,vec2 b){vec2 p=twoProd(a.x,b.x);float e=p.y+a.x*b.y+a.y*b.x;return quickTwoSum(p.x,e);}\n" +
    "vec3 pal(float t){return 0.5+0.5*cos(6.28318*(t+vec3(0.0,0.33,0.67)));}\n" +
    "void main(){\n" +
    "  vec2 uv=(gl_FragCoord.xy-0.5*R)/R.y;\n" +
    "  vec2 cre=dfAdd(C.xy, dfMul(S, vec2(uv.x,0.0)));\n" +
    "  vec2 cim=dfAdd(C.zw, dfMul(S, vec2(uv.y,0.0)));\n" +
    "  vec2 zre=cre, zim=cim;\n" +
    "  float m2=0.0;\n" +
    "  int i;\n" +
    "  for(i=0;i<1200;i++){\n" +
    "    if(i>=uMaxIter) break;\n" +
    "    vec2 zre2=dfMul(zre,zre);\n" +
    "    vec2 zim2=dfMul(zim,zim);\n" +
    "    m2=zre2.x+zim2.x;\n" +
    "    if(m2>65536.0) break;\n" +
    "    vec2 zrezim=dfMul(zre,zim);\n" +
    "    vec2 nre=dfAdd(dfSub(zre2,zim2), cre);\n" +
    "    vec2 nim=dfAdd(vec2(zrezim.x*2.0,zrezim.y*2.0), cim);\n" +
    "    zre=nre; zim=nim;\n" +
    "  }\n" +
    "  vec3 col;\n" +
    "  if(i>=uMaxIter){\n" +
    "    col=vec3(0.02,0.008,0.035);\n" +
    "  } else {\n" +
    "    float logZn=log(m2)*0.5;\n" +
    "    float nu=log(logZn/log(2.0))/log(2.0);\n" +
    "    float smoothI=float(i)+1.0-nu;\n" +
    "    float hue=smoothI*0.028+T*0.025;\n" +
    "    col=pal(hue)*0.95+0.05;\n" +
    "    col*=smoothstep(0.0,6.0,smoothI);\n" +
    "  }\n" +
    "  col=pow(col,vec3(0.4545));\n" +
    "  o=vec4(col,1.0);\n" +
    "}";

  function compile(type, src) {
    var sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(sh));
    }
    return sh;
  }

  var prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(prog);
  gl.useProgram(prog);

  var uR = gl.getUniformLocation(prog, "R");
  var uC = gl.getUniformLocation(prog, "C");
  var uS = gl.getUniformLocation(prog, "S");
  var uT = gl.getUniformLocation(prog, "T");
  var uMaxIter = gl.getUniformLocation(prog, "uMaxIter");

  // JS doubles (52-bit mantissa) hold center/scale at full precision; each
  // one is split into a float32 hi/lo pair right before it's handed to the
  // shader, which is where the df64 arithmetic picks up.
  function splitF(x) {
    var hi = Math.fround(x);
    var lo = Math.fround(x - hi);
    return [hi, lo];
  }

  var INITIAL_SCALE = 1.4;
  var TARGET_EXP = 11.3; // log10 zoom depth before the df64 precision runs out
  var ZOOM_RATE = 1.24; // multiplicative zoom-in per second of autoplay

  var pointOrder = POINTS.map(function (_, i) { return i; });
  var pIdx = -1;
  var centerRe = 0, centerIm = 0, scale = INITIAL_SCALE;

  var els = { veil: document.getElementById("veil"), loc: document.getElementById("loc"), depth: document.getElementById("depth") };

  function fmtDepth(exp) {
    if (exp < 1) return (Math.pow(10, exp)).toFixed(1) + "×";
    return "1e" + exp.toFixed(1) + "×";
  }

  function nextPoint() {
    pIdx = (pIdx + 1) % pointOrder.length;
    if (pIdx === 0) {
      // reshuffle so repeat visits don't always walk the list in the same order
      for (var i = pointOrder.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = pointOrder[i]; pointOrder[i] = pointOrder[j]; pointOrder[j] = t;
      }
    }
    var p = POINTS[pointOrder[pIdx]];
    centerRe = p.re; centerIm = p.im; scale = INITIAL_SCALE;
    els.loc.textContent = p.label;
  }
  nextPoint();

  var veiled = false;
  function requestDive() {
    if (veiled) return;
    veiled = true;
    els.veil.classList.add("on");
    setTimeout(function () {
      nextPoint();
      els.veil.classList.remove("on");
      veiled = false;
    }, 900);
  }

  document.getElementById("next").addEventListener("click", requestDive);

  // --- interaction: drag to pan, wheel/pinch to zoom toward the cursor.
  // Any input pauses autoplay's zoom-in for a while; it resumes on its own.
  var lastInput = -1e9;
  function poke() { lastInput = performance.now(); }
  var dragging = false, lastX = 0, lastY = 0;
  c.addEventListener("pointerdown", function (e) {
    dragging = true; lastX = e.clientX; lastY = e.clientY; poke();
  });
  addEventListener("pointerup", function () { dragging = false; });
  addEventListener("pointermove", function (e) {
    if (!dragging) return;
    poke();
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    var perPixel = scale / c.height;
    centerRe -= dx * perPixel;
    centerIm += dy * perPixel;
  });
  c.addEventListener("wheel", function (e) {
    e.preventDefault();
    poke();
    var rect = c.getBoundingClientRect();
    var uvx = ((e.clientX - rect.left) - 0.5 * rect.width) / rect.height;
    var uvy = ((e.clientY - rect.top) - 0.5 * rect.height) / rect.height;
    var cursorRe = centerRe + uvx * scale;
    var cursorIm = centerIm - uvy * scale;
    var factor = Math.pow(1.0016, e.deltaY);
    scale *= factor;
    centerRe = cursorRe - (cursorRe - centerRe) * factor;
    centerIm = cursorIm - (cursorIm - centerIm) * factor;
  }, { passive: false });

  var pinchDist = 0;
  c.addEventListener("touchmove", function (e) {
    if (e.touches.length === 2) {
      poke();
      var dx = e.touches[0].clientX - e.touches[1].clientX;
      var dy = e.touches[0].clientY - e.touches[1].clientY;
      var d = Math.hypot(dx, dy);
      if (pinchDist > 0) scale *= pinchDist / d;
      pinchDist = d;
    }
  }, { passive: true });
  c.addEventListener("touchend", function () { pinchDist = 0; });

  function resize() {
    var dpr = Math.min(devicePixelRatio || 1, 1.3);
    c.width = Math.floor(innerWidth * dpr);
    c.height = Math.floor(innerHeight * dpr);
    gl.viewport(0, 0, c.width, c.height);
  }
  addEventListener("resize", resize);
  resize();

  var lastT = performance.now();
  function draw(now) {
    var dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;

    var idle = now - lastInput > 5000;
    if (idle) scale /= Math.pow(ZOOM_RATE, dt);

    var exp = Math.log10(INITIAL_SCALE / scale);
    if (exp >= TARGET_EXP) requestDive();
    els.depth.textContent = fmtDepth(Math.max(exp, 0));

    var maxIter = Math.max(120, Math.min(1150, Math.round(150 + exp * 55)));

    var cr = splitF(centerRe), ci = splitF(centerIm), s = splitF(scale);
    gl.uniform2f(uR, c.width, c.height);
    gl.uniform4f(uC, cr[0], cr[1], ci[0], ci[1]);
    gl.uniform2f(uS, s[0], s[1]);
    gl.uniform1f(uT, now * 0.001);
    gl.uniform1i(uMaxIter, maxIter);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  function updateShare() {
    var text = "falling forever into the Mandelbrot set (currently: " +
      els.loc.textContent + ") — bisks.net/everzoom";
    document.getElementById("share").href = "https://bsky.app/intent/compose?text=" + encodeURIComponent(text);
  }
  setInterval(updateShare, 4000);
  updateShare();
})();
</script>
<p style="position:fixed;right:.75rem;bottom:.65rem;font:11px ui-monospace,monospace;color:#d7b8ff;opacity:.45">
  a <a style="color:#d7b8ff" href="https://bsky.app/profile/buildthis.bisks.net">@buildthis.bisks.net</a> demo,

</p>

    <!-- chicken mode (added across projects by @buildthis.bisks.net) -->
    <style>
      #cm-toggle {
        position: fixed;
        right: 0.85rem;
        bottom: 0.85rem;
        z-index: 2147483000;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 0.7rem;
        line-height: 1;
        background: rgba(20, 20, 20, 0.72);
        color: #ddd;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 999px;
        padding: 0.45rem 0.6rem;
        cursor: pointer;
        -webkit-backdrop-filter: blur(4px);
        backdrop-filter: blur(4px);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      }
      #cm-toggle.on { background: #f4b400; color: #1a1206; border-color: #f4b400; }
      #cm-coop {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 2.2rem;
        overflow: hidden;
        pointer-events: none;
        z-index: 2147483000;
        display: none;
      }
      #cm-coop.on { display: block; }
      .cm-chicken {
        position: absolute;
        bottom: 0.1rem;
        font-size: 1.5rem;
        transform: scaleX(-1);
        animation-name: cm-strut;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.5));
      }
      @keyframes cm-strut {
        0% { transform: translateX(-3rem) scaleX(-1); }
        48% { transform: translateX(calc(100vw + 3rem)) scaleX(-1) translateY(-0.3rem); }
        50% { transform: translateX(calc(100vw + 3rem)) scaleX(1); }
        98% { transform: translateX(-3rem) scaleX(1) translateY(-0.3rem); }
        100% { transform: translateX(-3rem) scaleX(-1); }
      }
    </style>
    <button id="cm-toggle" type="button" title="it's not really corgi mode">🐔</button>
    <div id="cm-coop"></div>
    <script>
      (function () {
        var coop = document.getElementById("cm-coop");
        var toggle = document.getElementById("cm-toggle");
        if (!coop || !toggle) return;
        var KEY = "chicken-mode";
        var spawner = null;

        function spawn() {
          var c = document.createElement("div");
          c.className = "cm-chicken";
          c.textContent = Math.random() < 0.15 ? "🐓" : "🐔";
          var duration = 14 + Math.random() * 10;
          c.style.animationDuration = duration + "s";
          c.style.animationDelay = -Math.random() * duration + "s";
          c.style.fontSize = (1.1 + Math.random() * 0.9) + "rem";
          coop.appendChild(c);
        }
        function start() {
          if (spawner) return;
          coop.innerHTML = "";
          for (var i = 0; i < 5; i++) spawn();
          spawner = setInterval(function () {
            if (coop.children.length < 8) spawn();
          }, 4000);
        }
        function stop() {
          if (spawner) clearInterval(spawner);
          spawner = null;
          coop.innerHTML = "";
        }
        function setMode(on) {
          coop.classList.toggle("on", on);
          toggle.classList.toggle("on", on);
          if (on) start(); else stop();
          try { localStorage.setItem(KEY, on ? "1" : "0"); } catch (e) {}
        }
        toggle.addEventListener("click", function () {
          setMode(!coop.classList.contains("on"));
        });
        var startedOn = false;
        try { startedOn = localStorage.getItem(KEY) === "1"; } catch (e) {}
        if (startedOn) setMode(true);
      })();
    </script>
    <!-- /chicken mode -->
</body>
</html>
