name = "atprotozoa-simclash"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A generative visual
# metaphor for "SimClusters colliding": two swarms of particles (each its own
# little community, connected by faint web-like edges) drift together,
# collide, spark gold where they overlap, then drift apart and reform,
# forever. Optionally type two Bluesky handles and it reads the public
# AppView (resolveHandle / getFollows / getFollowers, anonymous, CORS *) to
# size each cluster off that handle's real moot count and light up the
# spark burst with their *actual* shared mutuals. lib/moots.js is copied from
# sites/toroidarium/public/lib/moots.js, itself from simcluster/moot-bingo
# (copy, don't abstract).
assets = { directory = "./public" }

routes = [{ pattern = "simclash.bisks.net/*", zone_name = "bisks.net" }]
