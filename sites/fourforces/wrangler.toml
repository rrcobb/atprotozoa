name = "atprotozoa-fourforces"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site — the whole game runs in the browser. Procgen QWOP
# Sisyphus: Q/W/O/P dial the strength of gravity / electromagnetism / the
# weak force / the strong force instead of leg joints, and the hillside is a
# grid of cells evolving under whichever cellular-automaton ruleset the
# last-tapped key selected. No build step. @norvid-studies.bsky.social tagged
# the bot at the end of a thread that built this spec one reply at a time.
routes = [
  { pattern = "fourforces.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
