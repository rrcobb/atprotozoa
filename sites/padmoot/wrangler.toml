name = "atprotozoa-padmoot"
compatibility_date = "2025-01-01"

# Pure static + client-side OAuth (public client) — no server surface needed.
# Patterns are custom lexicon records (net.bisks.padmoot.pattern) written
# straight to each user's own PDS from the browser.
assets = { directory = "./public" }

routes = [{ pattern = "padmoot.bisks.net", custom_domain = true }]

# workers_dev fallback: padmoot.bisks.net never got a DNS record on its first
# deploy — this hit the zone's custom-domain cap documented in
# notes/20-deploy.md (same failure as sites/lasercats, sites/pvnp,
# sites/sonnethype, sites/windmill; confirmed again 2026-07-26, still
# unresolved, needs someone with dash.cloudflare.com access). Custom-domain
# route creation failing shouldn't also block the workers.dev route, so this
# gives a working link in the meantime — drop it once the custom domain is
# actually live.
workers_dev = true
