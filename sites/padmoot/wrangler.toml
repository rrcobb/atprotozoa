name = "atprotozoa-padmoot"
compatibility_date = "2025-01-01"

# Pure static + client-side OAuth (public client) — no server surface needed.
# Patterns are custom lexicon records (net.bisks.padmoot.pattern) written
# straight to each user's own PDS from the browser.
assets = { directory = "./public" }

routes = [{ pattern = "padmoot.bisks.net", custom_domain = true }]
