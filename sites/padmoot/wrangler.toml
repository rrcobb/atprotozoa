name = "atprotozoa-padmoot"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static + client-side OAuth (public client) — no server surface needed.
# Patterns are custom lexicon records (net.bisks.padmoot.pattern) written
# straight to each user's own PDS from the browser.

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# padmoot.bisks.net never got a DNS record (the zone's custom-domain cap, see
# notes/20-deploy.md; same failure as sites/lasercats, sites/pvnp,
# sites/sonnethype, sites/windmill before they migrated). Migrated to
# bisks.net/padmoot instead. See notes/40-new-site-playbook.md ("Why paths,
# not subdomains").
routes = [
  { pattern = "padmoot.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/padmoot", zone_name = "bisks.net" },
  { pattern = "bisks.net/padmoot/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
