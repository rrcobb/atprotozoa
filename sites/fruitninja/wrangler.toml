name = "atprotozoa-fruitninja"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Fruit Ninja played against
# the live Bluesky firehose: real posts (jetstream) fly across the screen as
# fruit, you slice them with the mouse/finger to score and reveal the post text
# + author, and some posts are bombs you must NOT slice. Juicy splatter, combos,
# three lives. Built after @thebadcode.com tagged @buildthis for
# "atproto firehose fruit ninja". No secrets, no server.
main = "src/index.ts"

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# fruitninja.bisks.net is being retired to free a slot against the zone's
# custom-domain cap (see notes/20-deploy.md). Migrated to bisks.net/fruitninja
# instead. See notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "bisks.net/fruitninja", zone_name = "bisks.net" },
  { pattern = "bisks.net/fruitninja/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
