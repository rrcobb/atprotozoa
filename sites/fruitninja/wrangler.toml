name = "atprotozoa-fruitninja"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Fruit Ninja played against
# the live Bluesky firehose: real posts (jetstream) fly across the screen as
# fruit, you slice them with the mouse/finger to score and reveal the post text
# + author, and some posts are bombs you must NOT slice. Juicy splatter, combos,
# three lives. Built after @thebadcode.com tagged @buildthis for
# "atproto firehose fruit ninja". No secrets, no server.
assets = { directory = "./public" }

routes = [{ pattern = "fruitninja.bisks.net", custom_domain = true }]
