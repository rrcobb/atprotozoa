name = "atprotozoa-steamstats"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# steamstats.bisks.net — @thegodfungi.bsky.social asked "can [you] pull any
# steam account stats?" This is the yes: paste a Steam profile URL, vanity
# name, or SteamID64 and the Worker fetches it server-side (Steam's profile
# XML feed + a scrape of the public badges page — both work with no API key,
# see src/index.ts) and hands back level, ban flags, member-since age, recent
# games, and badge count. Also serves /s/<id>, a per-profile share page with
# baked-in og:title/description so a shared stat card gets its own unfurl
# instead of Bluesky caching one generic card for every profile (same fix as
# sites/didscope).
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [{ pattern = "steamstats.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /api/stats/<id> and /s/<id> are both dynamic, so the
# Worker must run before the static-asset router.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
