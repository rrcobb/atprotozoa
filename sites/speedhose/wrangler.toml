name = "atprotozoa-speedhose"
compatibility_date = "2025-01-01"

# @shimmermathlabs.com, replying to @angussoftware.dev's joke about a Bluesky
# app that speeds your feed up instead of slowing it down (one word at a time,
# center screen, 500 wpm): "you enter a handle and it gets the list of
# accounts you're following, then watches some firehose for those accounts.
# it blasts anything it sees at the 500 wpm. maybe keep a recent buffer of
# 2000 words, keep looping. go bot go!"
#
# Fully frontend: the browser resolves the handle's follows via the public
# AppView (getFollows, unauthenticated), opens Jetstream filtered client-side
# to app.bsky.feed.post creates from that DID set, and pushes words into a
# capped 2000-word ring buffer. An RSVP-style reader loops through whatever's
# currently in the buffer at a fixed pace, live words append at the tail as
# they arrive. No server state, no DO, no KV — just a Worker serving static
# assets.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/speedhose path route and no prefix-stripping needed.
routes = [
  { pattern = "speedhose.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
