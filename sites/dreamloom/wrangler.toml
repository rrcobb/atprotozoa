name = "atprotozoa-dreamloom"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# routes MUST stay above [assets] — keys after a table header join that table.
routes = [
  { pattern = "dreamloom.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"

# Secrets (wrangler secret put — never in this file):
#   HYDRACEPT_API_KEY      site owner's Hydracept installation key (hosted image mode)
#   HYDRACEPT_PROJECT      project id (cpr_…)
#   HYDRACEPT_ENVIRONMENT  optional; defaults to development
