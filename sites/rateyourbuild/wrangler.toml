name = "atprotozoa-rateyourbuild"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Brand-new site, own subdomain from day one — no bisks.net/rateyourbuild
# path route to carry forward (see notes/40-new-site-playbook.md).
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes
# (same gotcha called out in sites/didscope/wrangler.toml, sites/logs/wrangler.toml).
routes = [
  { pattern = "rateyourbuild.bisks.net/*", zone_name = "bisks.net" },
]

# run_worker_first: /site/<name>, /genre/<key>, /super/<key> are dynamic
# (personalized OG tags per page), so the Worker must run BEFORE the
# static-asset router, same as sites/didscope.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
