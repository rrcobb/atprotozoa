name = "atprotozoa-mcskeets"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Everything still runs client-side (see public/index.html) EXCEPT the OG/share
# unfurl, which has a small server surface: the Worker renders /s/<handle>
# (src/index.ts) with per-handle og:title/og:description/og:url baked
# server-side, then falls through to ASSETS for everything else. Type a
# Bluesky handle, it resolves the DID (com.atproto.identity.resolveHandle)
# and reads a drive-thru order off characters of the DID — sandwich, side,
# drink, dessert, all hand-written tables — plus a deterministic chance the
# soft-serve machine is "down" (it's real McDonald's lore: the ice cream
# machine is a running joke about how often it's broken). Built off
# @cee.wtf tagging the bot with one word: "mcdonalds". No secrets.
#
# Path route on the shared bisks.net zone, not a dedicated custom domain —
# mcskeets.bisks.net never provisioned (the zone hit Cloudflare's custom-domain
# cap, see notes/20-deploy.md), so it's mounted at bisks.net/mcskeets. The
# Worker strips the /mcskeets prefix before its /s/<handle> matching + ASSETS
# fallthrough (see src/index.ts).
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes
# (same gotcha called out in buildthis/logs/wrangler.toml).
routes = [
  { pattern = "bisks.net/mcskeets", zone_name = "bisks.net" },
  { pattern = "bisks.net/mcskeets/*", zone_name = "bisks.net" },
]

# run_worker_first: /s/<handle> is dynamic (personalized OG tags per share), so
# the Worker must run BEFORE the static-asset router, same as sites/logs.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
