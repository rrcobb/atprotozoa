# Everything still runs client-side (public/index.html + lib/moots.js do the
# real dialing/TTS): it reads Bluesky's public AppView (resolveHandle /
# getFollows / getFollowers / getAuthorFeed, all anonymous, CORS *) to find a
# handle's moots (mutuals), lets you "dial" one off a speed-dial keypad, and
# reads their latest post aloud with the browser's built-in text-to-speech —
# like calling an old answering machine. The only server surface is
# /call/<selfHandle>/<mootHandle> (src/index.ts): a distinct, shareable URL
# per call with personalized OG tags, so sharing a call unfurls a card about
# that specific call instead of one generic card for every share.
name = "atprotozoa-dial-a-mutual"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [{ pattern = "dial-a-mutual.bisks.net", custom_domain = true }]

# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes
# (same gotcha called out in buildthis/logs/wrangler.toml).
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
