# Pure static site — everything runs in the browser. It reads Bluesky's public
# AppView (resolveHandle / getFollows / getFollowers / getAuthorFeed, all
# anonymous, CORS *) to find a handle's moots (mutuals), lets you "dial" one
# off a speed-dial keypad, and reads their latest post aloud with the browser's
# built-in text-to-speech — like calling an old answering machine.
name = "atprotozoa-dial-a-mutual"
compatibility_date = "2025-01-01"
assets = { directory = "./public" }

routes = [{ pattern = "dial-a-mutual.bisks.net", custom_domain = true }]
