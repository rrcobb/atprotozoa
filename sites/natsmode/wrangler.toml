name = "atprotozoa-natsmode"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser, no server. Built for
# @guy1.bsky.social after they asked the bot to "read all of my posts and
# build me a website you think id really like" and @bisks.net said "uhhh
# yeah give it a go". Their feed is 5000+ posts of all-caps Washington
# Nationals hype/despair, always with "NATIONALS" glitched into a fresh typo
# each time (NATONALS / NARIONAL / NATIPNALS / NATINALS / ...), plus a
# running bit of corrupting proper nouns the same way (Prince George's
# County -> "Kink George's County", Crash Bandicoot -> "Cratch Bandidcoot",
# Synergy -> "Sinner Energy"). This site generalizes that bit into a toy: a
# Nationals take generator (glitches NATIONALS + an opponent into a fresh
# all-caps take every click, tracks a session W/L scoreboard) and a general
# "glitch any word" engine using the same adjacent-key/transpose typo model,
# both shareable straight to Bluesky.
assets = { directory = "./public" }

routes = [{ pattern = "natsmode.bisks.net", custom_domain = true }]
