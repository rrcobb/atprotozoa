name = "atprotozoa-buildthis"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# This Worker does double duty (see notes/80-buildthis-bot.md):
#  1. fetch handler  -> serves /.well-known/atproto-did so buildthis.bisks.net
#     can be verified as the bot's Bluesky handle, plus a static landing page.
#  2. scheduled handler (cron) -> the watcher: polls the bot's mentions, gates on
#     Rob + his mutuals, and fires a repository_dispatch to build the idea.
assets = { directory = "./public", binding = "ASSETS" }

# Binds the subdomain to the Worker (provisions DNS + cert on deploy).
# MUST stay ABOVE the [vars] table and the [[kv_namespaces]] / [triggers] blocks:
# in TOML, keys after a table header belong to that table, so a `routes` line
# below a table silently becomes <table>.routes and the domain never binds.
# (Same gotcha called out in apex/wrangler.toml.)
routes = [{ pattern = "buildthis.bisks.net/*", zone_name = "bisks.net" }]

# Poll for new mentions. Every 2 minutes keeps latency low without hammering the
# AppView; the cron only reads notifications + does cheap graph checks.
[triggers]
crons = ["*/2 * * * *"]

# Durable, queryable logs (console.log/error + invocation status) retained by
# Cloudflare, so we can see e.g. an overnight cron failure without live-tailing.
# View in the dashboard (Worker -> Logs) or query the GraphQL Analytics API.
[observability]
enabled = true

# Rolling state: handled-mention ids (dedup) and which non-mutuals have already
# been replied-to once. Created with `wrangler kv namespace create buildthis-state`.
[[kv_namespaces]]
binding = "STATE"
id = "8eb7f22cd5184d4483b49b14c52f627a"

[vars]
# The bot's own DID (currently @buildthis.bsky.social; will become
# buildthis.bisks.net once the handle is switched). Served at
# /.well-known/atproto-did so Bluesky can verify the bisks.net handle.
BOT_DID = "did:plc:wlj4p2kazhifag6w4nanjnee"

# Rob's DID. The mutual-allowlist is computed against THIS did (people who
# mutually follow bisks.net), not the bot's own follows.
ROB_DID = "did:plc:f6n22z62adionrvb5s6n6vfk"

# The bot's login identifier for createSession. Using the DID (stable) rather than
# the handle, so login keeps working across the buildthis.bsky.social ->
# buildthis.bisks.net handle switch.
BOT_IDENTIFIER = "did:plc:wlj4p2kazhifag6w4nanjnee"

# GitHub repo the builder Action lives in, "owner/name". repository_dispatch
# targets this repo.
GITHUB_REPO = "rrcobb/atprotozoa"

# Spend is bounded ONLY by dollars (the builder's provider spend cap — see
# notes/80); there are deliberately no build-count or per-person caps. The one
# knob here: longest ASSEMBLED brief we'll accept (chars) — instruction plus
# thread context, not the instruction alone.
#
# Was 600 and applied to the instruction only, which silently cut the single most
# important piece of text mid-sentence while ancestors went in whole (notes/91).
# 20k is a runaway guard, not a budget: it's ~5k tokens, trivial next to a build,
# and a normal 300-grapheme post can't come close to firing it.
MAX_BRIEF_CHARS = "20000"

# How many thread images the box downloads and shows the builder. Most tags carry
# none and a screenshot-driven request carries one; 4 covers a short album without
# turning a build into an image-download job.
MAX_BRIEF_IMAGES = "4"

# "1" => the watcher ENQUEUES builds for the Hetzner box to pull (the live path:
# builds run on Rob's Claude subscription, always-on, off the laptop). Unset or
# not "1" => fire the GitHub Action via repository_dispatch (the fallback path).
# Flip is a one-line deploy; the Action stays wired as an instant fallback.
USE_BOX_QUEUE = "1"

# Mobius mode (see notes/80-buildthis-bot.md and /mobius): when a burst of tags
# leaves more than one job queued, /next-job paces releases to at most one every
# this many minutes instead of draining the backlog back-to-back, so a burst of
# tags doesn't become a burst of commits followed by a long silent stretch. A
# LONE queued job always ships immediately — this only throttles a pile-up.
# "0" (or removing the var) disables it and restores drain-as-fast-as-possible.
MOBIUS_INTERVAL_MINUTES = "20"

# Secrets (set with `wrangler secret put`, never in this file):
#   BOT_APP_PASSWORD  -> the bot account's app-password (createSession).
#   GITHUB_TOKEN      -> a PAT with `repo` scope to fire repository_dispatch (fallback).
#   OUTCOME_SECRET    -> shared secret the builder presents on POST /outcome.
#   QUEUE_TOKEN       -> shared secret the box presents on POST /next-job.
