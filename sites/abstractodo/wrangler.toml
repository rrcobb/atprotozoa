name = "atprotozoa-abstractodo"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A to-do list where
# checking off the current task doesn't finish anything, it hands you a
# more abstract version of it: "organize desk" begets "improve your task
# management skills" begets "audit the audit of your self-improvement
# audits", climbing a fixed ladder of abstraction bands toward a
# "singularity" ending screen at rung 21. The ladder position is
# localStorage only, per browser. Built for theme-box's "recursive self
# improvement" tick, 2026-08-09.
assets = { directory = "./public" }

routes = [{ pattern = "abstractodo.bisks.net/*", zone_name = "bisks.net" }]
