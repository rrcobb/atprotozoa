name = "atprotozoa-styletwin"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Everything still runs client-side (see public/index.html + public/lib/style-
# engine.js) EXCEPT the OG/share unfurl, which has a small server surface:
# the Worker renders /s/<handle> (src/index.ts) with per-handle
# og:title/og:description/og:url baked server-side, then falls through to
# ASSETS for everything else. Enter a Bluesky handle, it resolves the DID,
# walks getAuthorFeed, and compares writing-style heuristics (post length,
# capitalization, punctuation, emoji use, posting rhythm, vocabulary, and
# more) against cee.wtf's own baked-in style profile
# (public/data/cee-profile.json, built by build-profile.js).
# Built for @cee.wtf, approved by @bisks.net. No secrets.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes
# (same gotcha called out in buildthis/logs/wrangler.toml).
routes = [{ pattern = "styletwin.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /s/<handle> is dynamic (personalized OG tags per share), so
# the Worker must run BEFORE the static-asset router, same as sites/logs.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
