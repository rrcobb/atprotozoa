name = "atprotozoa-girlreadingthis"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# girlreadingthis.bisks.net: a tiny affirmation generator, one line finishing
# the sentence "the girl reading this ___". Picking and rerolling a line is
# entirely client-side (public/index.html). The one server surface: /m/<id>
# is a shareable link to one specific line, and a Worker stamps that line
# into og:title/og:description/og:url server-side before falling through to
# ASSETS — same fix as sites/gratitude-garden's /b/<code>, for the same
# reason: a plain static page can't vary its OG tags per line, so every
# shared link would unfurl as one generic card forever.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [{ pattern = "girlreadingthis.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /m/<id> is dynamic, so the Worker must run BEFORE the
# static-asset router, same as gratitude-garden/didscope/logs.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
