<style>
  :root {
    --bg: #fbeef6;
    --bg2: #f3e3f7;
    --fg: #3a2b3f;
    --dim: #8a7591;
    --accent: #c968a8;
    --accent2: #7d6bc4;
    --card: #fffbfe;
    --border: #eeddec;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background:
      radial-gradient(ellipse at 15% -10%, #f6d9ec 0%, transparent 55%),
      radial-gradient(ellipse at 90% 0%, #e2d9f6 0%, transparent 50%),
      var(--bg);
    color: var(--fg);
    font-family: ui-rounded, "Nunito", "Segoe UI", system-ui, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 3.5rem 1.1rem 3rem;
  }
  .wrap { width: 100%; max-width: 560px; flex: 1; display: flex; flex-direction: column; }
  header { text-align: center; margin-bottom: 1.5rem; }
  h1 {
    font-size: 1.05rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--dim);
    margin: 0;
    font-weight: 700;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 2.6rem 1.9rem;
    box-shadow: 0 18px 40px -28px rgba(90, 40, 80, 0.45);
    text-align: center;
    margin-bottom: 1.6rem;
  }
  .sentence {
    font-size: 1.55rem;
    line-height: 1.5;
    margin: 0;
  }
  .sentence .lead {
    color: var(--accent);
    font-weight: 800;
  }
  .sentence .rest {
    font-weight: 600;
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    justify-content: center;
    margin-bottom: 1.6rem;
  }
  button, .bsky-btn {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    border: none;
    border-radius: 12px;
    padding: 0.75rem 1.25rem;
    background: var(--accent);
    color: #fff;
    transition: transform 0.1s ease, opacity 0.15s ease;
  }
  button:hover, .bsky-btn:hover { transform: translateY(-1px); }
  button.secondary { background: var(--accent2); }
  button.ghost { background: transparent; color: var(--dim); border: 1px solid var(--border); font-weight: 600; }
  .bsky-btn {
    display: inline-flex;
    align-items: center;
    background: #1183fe;
    text-decoration: none;
  }
  .copied {
    font-size: 0.85rem;
    color: var(--accent2);
    text-align: center;
    min-height: 1.2em;
    margin: -0.6rem 0 1rem;
    font-weight: 600;
  }
  footer {
    text-align: center;
    font-size: 0.82rem;
    color: var(--dim);
    margin-top: auto;
    padding-top: 2rem;
    line-height: 1.9;
  }
  footer a { color: var(--accent2); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>

<body>
<div class="wrap">
  <header>
    <h1>the girl reading this</h1>
  </header>

  <div class="card">
    <p class="sentence" id="sentence">
      <span class="lead">the girl reading this</span>
      <span class="rest" id="rest">is loved by more people than she realizes.</span>
    </p>
  </div>

  <div class="actions">
    <button id="another">read another</button>
    <button class="ghost" id="copyLink">copy link</button>
    <a class="bsky-btn" id="shareBluesky" href="#" target="_blank" rel="noopener">share on bluesky</a>
  </div>
  <p class="copied" id="copiedMsg"></p>

  <footer>
    a tiny bot-built thing · asked for by @moll.dev<br />
    <a href="https://rateyourbuild.bisks.net/site/girlreadingthis">rate this on rateyourbuild →</a>
    · <a href="https://bisks.net/">more like this</a>
  </footer>
</div>

<script>
  // Kept identical (same order, same length) to the MESSAGES list in
  // src/index.ts, so a given index always renders the same line whether the
  // Worker or this script picked it — server-side duplication within ONE
  // site, not a shared package across sites.
  const MESSAGES = [
    "is loved by more people than she realizes.",
    "is going to be okay.",
    "is doing great, actually — better than the group chat in her head says.",
    "deserves a really good cup of something warm today.",
    "is allowed to rest without earning it first.",
    "is more resilient than she gives herself credit for.",
    "is exactly on time. there is no schedule she's behind on.",
    "is going to laugh, for real, at some point today.",
    "should drink some water right now. yes, right now.",
    "is closer to the good part than it feels like.",
    "made the right call, even if it didn't feel like it at the time.",
    "is somebody's favorite person, whether she believes it or not.",
    "gets to have a soft day today. no reason required.",
    "is not too much. she is just enough.",
    "should text the friend she's been thinking about.",
    "is going to figure it out. she always does.",
    "deserves the same kindness she hands out to everyone else.",
    "is allowed to change her mind.",
    "is worth the effort it takes to actually know her.",
    "gets to take up space.",
    "should put the phone down and go outside for ten minutes.",
    "already knows the answer. she's just scared of it.",
    "is somebody's whole reason to smile today.",
    "gets a good night's sleep tonight. no excuses.",
    "is stronger than whatever is making today hard.",
    "should be proud of how far she's come. actually proud, not just saying it.",
    "is going to get good news soon.",
    "is not behind. she's just early for something she can't see yet.",
    "did better today than she's giving herself credit for.",
    "is allowed to ask for help.",
    "is exactly who someone out there is hoping to meet.",
    "should save this and reread it on a worse day.",
    "is not being dramatic. it's actually hard. that's allowed.",
    "is going to look back on this season and be proud she kept going.",
    "is doing the best she can with what she's got right now, and that counts.",
    "deserves to hear this from someone other than herself for once.",
  ];

  const restEl = document.getElementById("rest");
  const shareEl = document.getElementById("shareBluesky");
  const copyBtn = document.getElementById("copyLink");
  const copiedMsg = document.getElementById("copiedMsg");

  let currentIdx = -1;

  function urlFor(idx) {
    return "https://girlreadingthis.bisks.net/m/" + idx;
  }

  function render(idx) {
    currentIdx = ((idx % MESSAGES.length) + MESSAGES.length) % MESSAGES.length;
    const line = MESSAGES[currentIdx];
    restEl.textContent = line;
    history.replaceState(null, "", "/m/" + currentIdx);

    const shareText = "the girl reading this " + line + " " + urlFor(currentIdx);
    shareEl.href = "https://bsky.app/intent/compose?text=" + encodeURIComponent(shareText);
    copiedMsg.textContent = "";
  }

  function pickInitial() {
    const m = location.pathname.match(/^\/m\/(\d+)\/?$/);
    if (m) return parseInt(m[1], 10);
    return Math.floor(Math.random() * MESSAGES.length);
  }

  function pickAnother() {
    if (MESSAGES.length <= 1) return currentIdx + 1;
    let next = currentIdx;
    while (next === currentIdx) next = Math.floor(Math.random() * MESSAGES.length);
    return next;
  }

  document.getElementById("another").addEventListener("click", () => render(pickAnother()));

  copyBtn.addEventListener("click", async () => {
    const link = urlFor(currentIdx);
    try {
      await navigator.clipboard.writeText(link);
      copiedMsg.textContent = "link copied.";
    } catch (_) {
      copiedMsg.textContent = link;
    }
  });

  render(pickInitial());
</script>
</body>
</html>
