name = "atprotozoa-cutitclose"
compatibility_date = "2025-01-01"

# Pure static site — the whole game runs in the browser. cutitclose is a
# choose-your-own-adventure travel-to-the-airport game: pick when to leave
# home, how to get there, where to park, which security line to chase — then
# find out if you made your flight, and how close to last call you cut it.
# No secrets, no server, no build step.
main = "src/index.ts"

# Path route on the shared bisks.net zone, in the games/ cluster (see
# notes/40-new-site-playbook.md, "Clustering related sites under a shared
# path segment").
routes = [
  { pattern = "cutitclose.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/games/cutitclose", zone_name = "bisks.net" },
  { pattern = "bisks.net/games/cutitclose/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
