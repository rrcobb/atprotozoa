<style>
  html,body{margin:0;height:100%;background:#05030a;color:#a9a3c8;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
  header{position:fixed;top:12px;left:16px;right:16px;pointer-events:none}
  h1{margin:0;font-size:18px;font-weight:600;color:#ece6ff;letter-spacing:.08em}
  .sub{opacity:.7}
  #stats{margin-top:6px;opacity:.85;font-variant-numeric:tabular-nums}
  #panel{position:fixed;right:16px;top:14px;display:flex;gap:10px;align-items:center}
  button,a.btn{font:inherit;color:#ddd6ff;background:#150f26;border:1px solid #473a78;border-radius:4px;padding:4px 10px;cursor:pointer;text-decoration:none}
  button:hover,a.btn:hover{background:#221a3d}
  button.on{background:#5a45a8;color:#fff}
  footer{position:fixed;left:16px;right:16px;bottom:14px;display:flex;gap:14px;flex-wrap:wrap;opacity:.65;font-size:12px;pointer-events:none}
  footer a{color:#b9a8ff;pointer-events:auto}
  #status{color:#fc8}
</style>

<body>
<canvas id="cv"></canvas>
<header>
  <h1>HILBERT SPACE</h1>
  <div class="sub">every post is all of its words at once, until something looks at it</div>
  <div id="stats"><span id="status">connecting to the firehose…</span></div>
</header>
<div id="panel">
  <button id="observe" type="button">observe everything</button>
  <a class="btn" id="share" target="_blank" rel="noopener">share</a>
</div>
