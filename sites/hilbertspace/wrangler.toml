name = "atprotozoa-hilbertspace"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site: the Jetstream firehose is read and folded into an
# n-dimensional Hilbert curve entirely in the browser. No secrets, no state.
routes = [{ pattern = "hilbertspace.bisks.net/*", zone_name = "bisks.net" }]

[assets]
directory = "./public"
binding = "ASSETS"
