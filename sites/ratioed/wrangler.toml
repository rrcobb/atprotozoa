name = "atprotozoa-ratioed"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @goose.art asked for a dashboard of the most ratioed posts on Bluesky in the
# last hour. "Ratioed" = a post whose replies badly outnumber its likes — the
# room showed up to argue, not to applaud.
#
# The Worker watches the live firehose (Jetstream) for root-level posts, queues
# each one for a stats check a few minutes later (via the public, unauthenticated
# AppView — no login, no secret needed), and scores replyCount vs likeCount. All
# of that lives in ONE Durable Object (name "global") holding the check queue +
# the rolling ~1 hour leaderboard, same shape as sites/the-place's Canvas DO.
#
# Path route on the shared bisks.net zone, not a dedicated custom domain —
# ratioed.bisks.net never provisioned (the zone hit Cloudflare's custom-domain
# cap, see notes/20-deploy.md), so it's mounted at bisks.net/ratioed. The Worker
# strips the /ratioed prefix before routing to the DO / ASSETS (see src/index.ts).
#
# routes MUST stay above [assets] — in TOML, keys after a table header join that
# table, so a routes line below [assets] silently becomes assets.routes (same
# gotcha called out in sites/logs, sites/didscope, sites/the-place).
routes = [
  { pattern = "bisks.net/ratioed", zone_name = "bisks.net" },
  { pattern = "bisks.net/ratioed/*", zone_name = "bisks.net" },
]

# The Worker runs first for everything now: it must strip the /ratioed mount
# prefix before the asset router (which has no idea it isn't at the domain root)
# ever sees the request. (Was run_worker_first = ["/", "/api/*"] on the old
# subdomain; those root-relative patterns don't match the mounted paths.)
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "TRACKER"
class_name = "RatioTracker"

# new_sqlite_classes, not new_classes — legacy KV-backed DOs need Workers Paid;
# this account is on Free. See sites/the-place/wrangler.toml for the full story
# (that's the site that first surfaced this as a deploy failure).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RatioTracker"]
