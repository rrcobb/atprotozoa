name = "atprotozoa-fleetwatch"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Daily-slot build (2026-09-07, no specific requester) — the "verifier bot"
# idea from notes/ideas/other-bots.md and bot-ideas-riff.md, minus the
# separate-account part: a page that pings every site in the fleet and lights
# up a tile per site. The board itself is static (public/app.js); the one
# server-side piece is /api/check (src/index.ts, added in a 2026-09-09
# daily-slot pass), a stateless proxy fetch that reads real HTTP status codes
# from other bisks.net subdomains — something the visitor's own browser can't
# do across origins. No KV, no cron, no persisted state: every call is
# checked and thrown away.
#
# Tile data comes from sites/fleetwatch/sync-fleet.mjs, same source apex's
# gallery / receipts / rateyourbuild / orrery / fleetswipe all read from
# sites/*/site.json — see that script's header to refresh it. Snapshot, not
# a live view of the manifests (the pings themselves are live).
routes = [
  { pattern = "fleetwatch.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
