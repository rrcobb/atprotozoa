name = "atprotozoa-moottwins"
compatibility_date = "2025-01-01"

# Pure static site (moots.js does the AppView/Constellation reads, all
# client-side, all anonymous) plus one small server job: /img proxies avatar
# fetches so the browser can read their pixels. cdn.bsky.app sends no
# Access-Control-Allow-Origin, so drawImage()+getImageData() on a
# cross-origin <img> throws a tainted-canvas SecurityError — re-fetching the
# same bytes through this Worker's own origin and adding an open CORS header
# fixes that. Copied from sites/mootspy/src/index.ts.
main = "src/index.ts"

routes = [{ pattern = "moottwins.bisks.net/*", zone_name = "bisks.net" }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
