name = "atprotozoa-change"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A port of GamesCrafters'
# "Change!" board game (gamescrafters.berkeley.edu/games.php?game=change):
# 14-point SVG board, Tokyo Night colors, and a bot that exhaustively solves
# the (small, finite, draw-free) game tree once and then plays perfectly.
# No secrets, no server.
main = "src/index.ts"

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# change.bisks.net is being retired to free a slot against the zone's
# custom-domain cap (see notes/20-deploy.md). Migrated to bisks.net/games/change
# as part of the new games/ cluster. See notes/40-new-site-playbook.md
# ("Why paths, not subdomains").
routes = [
  { pattern = "change.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/games/change", zone_name = "bisks.net" },
  { pattern = "bisks.net/games/change/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
