name = "atprotozoa-simcluster-gacha"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Reads Bluesky's public
# AppView (resolveHandle / getFollows / getFollowers / getProfiles, all
# anonymous, CORS *) to build a handle's SimCluster (self + moots), then
# turns it into a gacha banner: pull cards, rarity is followers-percentile
# within the cluster, self is always the rate-up SSR. moots.js copied from
# sites/simcluster/public/lib/moots.js and extended with a profile-batch
# fetch for rarity ranking (copy, don't abstract).

routes = [
  { pattern = "simcluster-gacha.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
