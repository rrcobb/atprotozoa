function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

function heartsFor(seed) {

  const n = r < 0.08 ? 2 : r < 0.3 ? 3 : r < 0.65 ? 4 : 5;
  return "❤️".repeat(n) + "🤍".repeat(5 - n);

function moveFor(seed) {

function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = text.split(" ");

  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (line && ctx.measureText(test).width > maxWidth) { ctx.fillText(line, x, cy); line = w; cy += lineHeight; }
    else line = test;
  }
  if (line) ctx.fillText(line, x, cy);
  return cy;
}

  ctx.fillStyle = "#e8437a";
  ctx.fillText(hearts, W / 2, cardY + cardH - 100);

  ctx.font = `italic 20px ${font}`;
  ctx.fillStyle = "#8a5c6c";
  wrapCanvasText(ctx, "your move: " + act, W / 2, cardY + cardH - 50, cardW - 140, 26);

  ctx.textAlign = "left";
  ctx.fillStyle = "#e8437a";
  ctx.font = `700 20px ${font}`;
  ctx.fillText("crushcookie.bisks.net", 60, H - 40);
}

function canShareFiles() {
  if (!navigator.share || !navigator.canShare) return false;
  try {
    const probe = new File([""], "probe.png", { type: "image/png" });
    return navigator.canShare({ files: [probe] });
  } catch (_) { return false; }
}
if (canShareFiles()) {
  els.shareNative.style.display = "";
  els.shareNative.addEventListener("click", () => {
    els.shareCanvas.toBlob(async (blob) => {
      if (!blob) return;
      const file = new File([blob], "crushcookie.png", { type: "image/png" });
      try { await navigator.share({ files: [file], text: lastShareText, title: "crushcookie" }); } catch (_) {}
    }, "image/png");
  });
}
els.shareDownload.addEventListener("click", () => {
  els.shareCanvas.toBlob((blob) => {
    if (!blob) return;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "crushcookie.png";
    a.click();
    URL.revokeObjectURL(a.href);
  }, "image/png");
});

function renderFortune(id, opts) {
  const parsed = parseId(id);
  if (!parsed) return false;
  const { index, seed } = parsed;
  const entry = ADVICE[index];
  const hearts = heartsFor(seed);
  const act = moveFor(seed);

  els.slipLabel.textContent = (opts && opts.label) || "your crushcookie";
  els.slipMood.textContent = "for the " + entry.mood + " era";
  els.fortuneText.textContent = entry.text;
  els.hearts.textContent = hearts;
  els.act.textContent = act;
  els.fnum.textContent = "cookie #" + id;

  els.cookie.classList.add("cracked");
  els.slip.classList.add("show");
  els.shareCanvas.classList.add("show");

  lastShareText = shareTextFor(entry.text, hearts, act, id);
  els.shareBluesky.href = "https://bsky.app/intent/compose?text=" + encodeURIComponent(lastShareText);
  buildShareCard(entry.text, hearts, act, entry.mood);
  return true;
}

function crack(id, push) {
  els.cookie.classList.remove("shake");
  void els.cookie.offsetWidth;
  els.cookie.classList.add("shake");
  const ok = renderFortune(id);
  if (!ok) return;
  burstHearts();
  if (push) history.pushState({ id }, "", "/c/" + id);
}

els.cookie.addEventListener("click", () => crack(randomId(currentMood), true));
els.cookie.addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); crack(randomId(currentMood), true); }
});
els.crackAgain.addEventListener("click", () => crack(randomId(currentMood), true));

window.addEventListener("popstate", () => boot(false));

function boot() {
  const m = location.pathname.match(/^\/c\/([^/]+)\/?$/);
  if (m && parseId(decodeURIComponent(m[1]))) {
    const id = decodeURIComponent(m[1]);
    els.sharedBanner.classList.add("show");
    renderFortune(id, { label: "a shared crushcookie" });
    burstHearts();
  }
}

boot();
</script>
</body>
</html>
