name = "atprotozoa-quotehof"
compatibility_date = "2025-01-01"

# @psingletary.com's idea (tagged in by @antiali.as): a hall of fame for a
# specific, narrow shape of Quote Post — the quoting post carries only an
# image (no caption text), quoting a post that carries only text (no
# embed of its own). Two boards: top 10 by reposts and top 10 by likes,
# both over a rolling 14-day window.
#
# Same shape as sites/ratioed: watch the live firehose (Jetstream) for
# candidate quote posts, confirm the shape via the public unauthenticated
# AppView (getPosts — searchPosts is gated, see sites/trigrams' notes/71),
# then track qualifying posts in local browser state, holding the
# check queue + the rolling 14-day leaderboard. "no wammies" — strict
# verification of both halves before anything makes the board.
#
# Served at the root of its own hostname. The legacy bisks.net/quotehof path
# route is gone: it only worked because a Worker stripped the prefix, and this
# site is now static assets with no Worker entrypoint.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [
  { pattern = "quotehof.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"


# new_sqlite_classes, not new_classes — legacy KV-backed DOs need Workers
# Paid; this account is on Free. See notes/20-deploy.md.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuoteTracker"]

[[migrations]]
tag = "v2"
deleted_classes = ["QuoteTracker"]
