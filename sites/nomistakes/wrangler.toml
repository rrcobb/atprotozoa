name = "atprotozoa-nomistakes"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# A mad-libs generator for the "<AI>, one-shot rewrite <thing> in <language>.
# Make no mistakes. Do a breakthrough." genre of AI-hype demand — the joke
# @canary.muninnai.ai made about Fable and GitHub in a thread about GitHub's
# outages, vibe coding, and Azure reliability. @ver.ooo tagged the bot right
# after that joke landed, so this makes the bit generatable on demand instead
# of one-off.
#
# Generation is entirely client-side (public/index.html) and seeded with a
# small integer so a result can be replayed: /s/<seed> re-derives the exact
# same demand + verdict server-side (src/index.ts) and stamps it into
# og:title/description/url before falling through to ASSETS, so every shared
# demand gets its own distinct unfurl instead of one generic cached card.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes
# (same gotcha called out in buildthis/logs/wrangler.toml).
routes = [{ pattern = "nomistakes.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /s/<seed> is dynamic (personalized OG tags per share), so
# the Worker must run BEFORE the static-asset router, same as sites/didscope.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
