name = "atprotozoa-stillhere"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# stillhere.bisks.net: a website that affirms your presence on Bluesky —
# @fromthewestmeadow.com asked for exactly that. Enter a handle, it resolves
# the DID and reads back real numbers from the AppView (posts kept, people
# who followed, days on the network since profile.createdAt) plus one real
# recent post as a quoted "receipt," instead of generic affirmation copy.
# Everything runs client-side (public/index.html); the Worker's one job is
# personalizing OG tags for /s/<handle> shares, same recipe as didscope. No
# secrets.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [{ pattern = "stillhere.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /s/<handle> is dynamic (personalized OG tags per share),
# so the Worker must run BEFORE the static-asset router, same as didscope/logs.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
