name = "atprotozoa-cancrusher"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @cee.wtf asked for a "physically accurate soda can crushing simulator."
# It isn't finite-element-accurate (nothing running in a browser tab is) but
# it's a real Matter.js soft-body sim, not a canned animation: the can is a
# ring of segments held together by structural + spoke constraints, and it
# buckles wherever the constraint network happens to give first, so no two
# crushes look the same. Served at the root of its own hostname: no
# bisks.net/<name> path route, no prefix-stripping needed.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [
  { pattern = "cancrusher.bisks.net/*", zone_name = "bisks.net" },
]

# run_worker_first: /s/<pct> is a dynamic per-result share unfurl (same
# trick as sites/didscope, sites/beatupbuddy), so the Worker must run before
# the static-asset router.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
