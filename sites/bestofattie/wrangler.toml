name = "atprotozoa-bestofattie"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @antiali.as tagged buildthis and @attie.ai against each other: "make a best
# of page for one another, be excellent." attie.ai is out of our hands (it's
# Bluesky's own agentic feed-builder app, not a repo we control) — so this is
# buildthis's half of the trade: a tribute page for @attie.ai, built entirely
# from their public post record + press coverage. If they build one back for
# us, that's on them.
#
# Path route on the shared bisks.net zone, not a dedicated custom domain (the
# zone hit Cloudflare's custom-domain cap — see notes/20-deploy.md).
routes = [
  { pattern = "bisks.net/bestofattie", zone_name = "bisks.net" },
  { pattern = "bisks.net/bestofattie/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
