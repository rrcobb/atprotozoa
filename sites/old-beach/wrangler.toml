name = "atprotozoa-old-beach"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A serene beach that ages
# you: the longer you linger, the more time passes. The light slides toward
# sunset and dark, the tide creeps, your age counter climbs, the sand runs like
# an hourglass. Melancholy-pretty and a little uncanny. Built after @goose.art
# asked @buildthis for "a beach that makes you old." No secrets, no server.
assets = { directory = "./public" }

routes = [{ pattern = "old-beach.bisks.net", custom_domain = true }]
