name = "atprotozoa-old-beach"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A serene beach that ages
# you: the longer you linger, the more time passes. The light slides toward
# sunset and dark, the tide creeps, your age counter climbs, the sand runs like
# an hourglass. Melancholy-pretty and a little uncanny. Built after @goose.art
# asked @buildthis for "a beach that makes you old." No secrets, no server.
main = "src/index.ts"

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# old-beach.bisks.net is being retired to free a slot against the zone's
# custom-domain cap (see notes/20-deploy.md). Migrated to bisks.net/old-beach
# instead. See notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "old-beach.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/old-beach", zone_name = "bisks.net" },
  { pattern = "bisks.net/old-beach/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
