name = "atprotozoa-murkbox"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# The pedal and its whole effects engine run client-side in public/index.html
# against the public AppView (public.api.bsky.app, CORS *, no auth). The one
# server job is /img — a same-origin proxy for cdn.bsky.app images, needed so
# the canvas pixel pipeline can read them back out (see src/index.ts).
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [{ pattern = "murkbox.bisks.net/*", zone_name = "bisks.net" }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
