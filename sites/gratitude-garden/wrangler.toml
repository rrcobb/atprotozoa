name = "atprotozoa-gratitude-garden"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Planting and the garden itself are entirely client-side (localStorage, see
# public/index.html). The one server surface: /b/<code> is a shareable bouquet
# link (the bouquet's flowers + messages base64url-encoded into the path), and
# a Worker renders per-bouquet og:title/og:description/og:url server-side
# before falling through to ASSETS — same fix as sites/didscope's /s/<handle>,
# for the same reason: a plain static page can't vary its OG tags per bouquet,
# so every shared link would unfurl as one generic card forever.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [{ pattern = "gratitude-garden.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /b/<code> is dynamic, so the Worker must run BEFORE the
# static-asset router, same as sites/didscope and sites/logs.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
