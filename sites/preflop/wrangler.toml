name = "atprotozoa-preflop"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# A static, browser-only toy. Every deal, decision, and streak lives in the
# browser (localStorage); the Worker only serves assets.
routes = [
  { pattern = "preflop.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
