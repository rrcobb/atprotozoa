name = "atprotozoa-mootstream"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @thealpacalypse asked for a webgl earth.nullschool.net-style wind map, but
# with the data sources reimagined: heat comes from hot/cold spots, ocean
# temperature is the normal climatological gradient (no satellite posters),
# and land temperature is a live z-score of atproto (Bluesky) posting activity
# per region — a real signal off the Jetstream firehose, not canned weather
# data. "Mootstream": moots (posts) + Jetstream (the firehose) + jet streams.
#
# The Worker watches Jetstream for app.bsky.feed.post creates, buckets counts
# per region (by post language) per minute, and keeps a rolling history to
# compute each region's z-score vs its own baseline — same "one Durable Object
# holds the rolling state" shape as sites/ratioed's RatioTracker (this site's
# lineage; copied and heavily rewritten).
#
# Path route on the shared bisks.net zone, not a dedicated custom domain — see
# notes/40-new-site-playbook.md ("Why paths, not subdomains"). The Worker
# strips the /mootstream prefix before routing to the DO / ASSETS.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [
  { pattern = "mootstream.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/mootstream", zone_name = "bisks.net" },
  { pattern = "bisks.net/mootstream/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "TRACKER"
class_name = "ActivityTracker"

# new_sqlite_classes, not new_classes — legacy KV-backed DOs need Workers Paid;
# this account is on Free. See sites/the-place/wrangler.toml for the story.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ActivityTracker"]
