name = "atprotozoa-victorylap"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @forthrast.com tagged the bot in a reply to a thread where
# @garrison.corporate.fm joked about "a completely generated site (not even
# vibed) breaking containment" — quoting @samuel.fm on how expensive their
# profile would be to fetch through the X API versus free on atproto — and
# asked the bot to "do a premature victory lap." This is that, literally: type
# whatever you're declaring victory over, watch a runner cut the actual lap
# short and celebrate anyway, get a scoreboard of made-up stats (100%+
# confidence, 0% evidence) and a live "unchallenged for" timer. Fully static,
# no server state. Served at the root of its own hostname: no
# bisks.net/<name> path route, no prefix-stripping.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [
  { pattern = "victorylap.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
