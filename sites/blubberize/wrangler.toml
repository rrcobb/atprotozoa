name = "atprotozoa-blubberize"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Type your own handle and
# a target's: reads Bluesky's public AppView anonymously (getProfile, CORS *,
# no auth) for both, draws each as a seal sized off real followersCount (sqrt
# scale so it doesn't blow out on a huge account), then FISSION splits half
# your seal's blubber onto the target and stamps them BLUBBERIZED — a purely
# cosmetic joke, no real posting ability is touched. @norvid-studies.bsky.social
# asked for this off a reply to a "Bluesky but every account is a seal sized
# by followers" post: "you can projectilely fission of half your blubber
# (followers) to render blubberized (unable to post) another account."

routes = [
  { pattern = "blubberize.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
