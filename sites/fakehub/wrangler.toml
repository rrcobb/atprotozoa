name = "atprotozoa-fakehub"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Fully client-side: the page reads a public profile + recent feed from the
# AppView, looks at the avatar's pixels on a canvas, and invents a GitHub
# profile. The Worker only forwards to ASSETS. No secrets, no bindings.
#
# routes MUST stay above [assets] (TOML: keys after a table header join it).
routes = [{ pattern = "fakehub.bisks.net/*", zone_name = "bisks.net" }]

[assets]
directory = "./public"
binding = "ASSETS"
