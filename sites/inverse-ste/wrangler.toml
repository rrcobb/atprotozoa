name = "atprotozoa-inverse-ste"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Fully client-side linter; the Worker only forwards to static assets.
# routes MUST stay above [assets] (TOML: later keys join the last table).
routes = [{ pattern = "inverse-ste.bisks.net/*", zone_name = "bisks.net" }]

[assets]
directory = "./public"
binding = "ASSETS"
