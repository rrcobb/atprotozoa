# lesswrongaday: one day of LessWrong history at a time, replayed on a clock.
# The Worker is a stateless GET proxy for LessWrong's GraphQL API (which sends
# no CORS headers). No KV, no Durable Objects, no AI.
name = "atprotozoa-lesswrongaday"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [
  { pattern = "lesswrongaday.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
