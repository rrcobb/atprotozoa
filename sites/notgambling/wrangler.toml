name = "atprotozoa-notgambling"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @gracekind.net tagged the bot, replying in a thread where
# @jimray.bsky.team had *just* said "please do make an NCAA bracket app,
# please do NOT make gambling apps" — with "make a gambling app." Read
# literally, and read as a bit: the compromise is a casino that's honest
# about being fake. Chips seed to a fixed starting stack, are worthless,
# non-transferable, and there is no way to pay in real money — the entire
# "economy" lives in localStorage, so the house edge is real but the stakes
# never are. No server-side state at all; see public/index.html.
routes = [
  { pattern = "notgambling.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = false
