<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>nlball — the NL clip oracle</title>
<meta name="description" content="A magic eight ball that answers in pastiche Northernlion commentary. Ask, shake, receive a tangentially appropriate clip.">
<meta property="og:title" content="nlball — the NL clip oracle">
<meta property="og:description" content="A magic eight ball that answers in pastiche Northernlion commentary. Ask, shake, receive a tangentially appropriate clip.">
<meta property="og:url" content="https://nlball.bisks.net/">
<meta name="twitter:card" content="summary">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#07090c;color:#b9c7c2;font-family:ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
  h1{font-size:1.1rem;letter-spacing:.3em;text-transform:uppercase;margin:8px 0 4px;color:#d8e6e0;font-weight:400}
  .sub{font-size:.8rem;opacity:.6;margin:0 0 20px;text-align:center}
  .q{width:min(420px,100%);background:#0d1217;border:1px solid #23303a;color:#d8e6e0;padding:10px 12px;font:inherit;border-radius:4px}
  .ball{position:relative;width:min(300px,78vw);aspect-ratio:1;border-radius:50%;margin:24px 0 12px;border:0;cursor:pointer;padding:0;
    background:radial-gradient(circle at 32% 28%,#4a5560 0,#161c22 22%,#05070a 70%);box-shadow:0 20px 50px #000,inset 0 0 40px #000;transition:transform .1s}
  .ball:focus-visible{outline:2px solid #5fd4a8;outline-offset:6px}
  .ball.shake{animation:shake .6s}
  @keyframes shake{0%,100%{transform:translate(0)}15%{transform:translate(-14px,6px) rotate(-6deg)}35%{transform:translate(12px,-8px) rotate(5deg)}55%{transform:translate(-10px,-4px) rotate(-4deg)}75%{transform:translate(8px,6px) rotate(3deg)}}
  .win{position:absolute;left:50%;top:52%;width:52%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#02050a;box-shadow:inset 0 0 18px #000,0 0 0 3px #1b242c;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .tri{width:84%;padding:6px;text-align:center;font-size:clamp(.5rem,2.3vw,.72rem);line-height:1.25;color:#5fd4a8;text-shadow:0 0 8px #5fd4a855;transition:opacity .5s}
  .tri.dim{opacity:0}
  .eight{position:absolute;left:34%;top:9%;font-size:1.6rem;color:#e8eef0;opacity:.9;pointer-events:none}
  .hint{font-size:.75rem;opacity:.5;margin:0 0 14px}
  .out{width:min(520px,100%);min-height:3em;text-align:center;font-size:.95rem;line-height:1.5;color:#d8e6e0;margin:6px 0}
  .out[hidden]{display:none}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  .row[hidden]{display:none}
  .row a,.row button{font:inherit;font-size:.8rem;color:#5fd4a8;background:none;border:1px solid #23303a;padding:7px 12px;border-radius:4px;text-decoration:none;cursor:pointer}
  footer{margin-top:auto;padding-top:32px;font-size:.72rem;opacity:.55;text-align:center;line-height:1.8}
  footer a{color:inherit}
</style>
</head>
<body>
<h1>nl<span id="mark">b</span>all</h1>
<p class="sub">the NL clip oracle. ask something. receive a tangentially appropriate clip.</p>
<input id="q" class="q" type="text" placeholder="your question (optional, the ball knows anyway)" autocomplete="off">
<button id="ball" class="ball" type="button" aria-label="Shake the ball">
  <span class="eight">8</span>
  <span class="win"><span id="tri" class="tri">ask.</span></span>
</button>
<p class="hint">click, tap, or press enter to shake</p>
<p id="out" class="out" aria-live="polite" hidden></p>
<div id="row" class="row" hidden>
  <a id="share" target="_blank" rel="noopener">post to bluesky</a>
  <button id="again" type="button">shake again</button>
</div>
<footer>
  all lines are original pastiche in the manner of Northernlion, not quotations.<br>
  November is #NaNoFoMo: <a href="https://nanofomo.bisks.net/">pledge not to foom →</a> ·
  <a href="https://rateyourbuild.bisks.net/site/nlball">rate this on rateyourbuild →</a>
</footer>
<script>
// Each entry: short = what shows in the ball's window, full = the "clip".
// All text is original pastiche of a deadpan streamer commentary register (Northernlion-style), not quoted material.
const CLIPS = [
  ["YEAH, PROBABLY","Yeah, probably. I mean, you're not going to like how it plays out, but sure, we're locked in."],
  ["BIG MISTAKE","Oh, okay, so we're doing that. Interesting. Chat is typing very fast right now, for what it's worth."],
  ["IT'S A TRAP","That's a trap. I'm not saying I'd never walk into it, I'm saying I've walked into it before and I know the room."],
  ["WE'RE SO BACK","We're so back. Which is a funny thing to say about a run that has not yet done anything."],
  ["NOT LIKE THIS","No. Not like this. Put the item down, put it down slowly, we can still make a good decision here."],
  ["CHECK THE ODDS","The odds are fine. The odds were never the problem, it's the guy making the decisions, and we both know who that is."],
  ["REPLY HAZY","Hazy. Unclear. I'd need to see the next room, and honestly the next room is where dreams go to get a bad seed."],
  ["GREAT VALUE","That's great value, actually. Nobody's going to say it but it's great value, and I'll die on that hill, briefly."],
  ["DON'T TAKE IT","Don't take it. I know it looks good. Everything looks good right before it's a problem."],
  ["COIN FLIP","It's a coin flip, and I've been wrong on coin flips live on stream in front of a lot of very supportive people."],
  ["SIGNS POINT TO YES","Signs point to yes. Also signs point to a thing happening that I'll have to talk about for forty minutes."],
  ["STRATEGIC RETREAT","I'm going to do the thing where I say it's a strategic decision, and then we all move on with our lives."],
  ["WELL, THAT'S RUN","Well, that's the run. Gonna sit with that for a second. Okay, no, that's enough, next one."],
  ["GOATED, FRANKLY","Goated, frankly. I'm not going to elaborate because the clip would write itself."],
  ["ABSOLUTELY NOT","Absolutely not. And I want it noted that I said that before it all went wrong, in a calm and reasonable tone."],
  ["SKILL ISSUE","Skill issue, but a loving one. The kind where you say it and then immediately offer a snack."],
  ["IT'S FINE","It's fine. Everything's fine. I've got a plan, and by plan I mean a feeling in my stomach."],
  ["LET HIM COOK","Let him cook. Or don't, I'm not your dad, but the pan is hot and the kitchen is yours."],
  ["TECHNICALLY YES","Technically yes. Which is the best kind of yes, because nobody can check the technicalities."],
  ["MY SOURCES: CHAT","My sources say no. My sources are chat, so take that with the appropriate amount of salt, and also a pinch of chaos."]
];
const $ = id => document.getElementById(id);
const ball = $("ball"), tri = $("tri"), out = $("out"), row = $("row"), q = $("q");
let busy = false, last = -1, current = null;

function shake(){
  if (busy) return;
  busy = true;
  out.hidden = true; row.hidden = true;
  tri.classList.add("dim");
  ball.classList.remove("shake"); void ball.offsetWidth; ball.classList.add("shake");
  setTimeout(() => {
    let i;
    do { i = Math.floor(Math.random() * CLIPS.length); } while (i === last && CLIPS.length > 1);
    last = i;
    current = CLIPS[i];
    tri.textContent = current[0];
    tri.classList.remove("dim");
    const asked = q.value.trim();
    out.textContent = current[1];
    out.hidden = false;
    const text = (asked ? "Q: " + asked + "\n\n" : "") + "nlball says: " + current[0] + "\n“" + current[1] + "”\n\nhttps://nlball.bisks.net/";
    $("share").href = "https://bsky.app/intent/compose?text=" + encodeURIComponent(text);
    row.hidden = false;
    busy = false;
  }, 650);
}
ball.addEventListener("click", shake);
$("again").addEventListener("click", shake);
q.addEventListener("keydown", e => { if (e.key === "Enter") shake(); });
// secret prefill link: the page has no handle input, so nothing to wire here.
</script>
</body>
</html>
