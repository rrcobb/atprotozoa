<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>nlball — the NL clip oracle</title>
<meta name="description" content="A magic eight ball that answers in actual Northernlion quotes. Shake, receive a real Northernlion quote.">
<meta property="og:title" content="nlball — the NL clip oracle">
<meta property="og:description" content="A magic eight ball that answers in actual Northernlion quotes. Shake, receive a real Northernlion quote.">
<meta property="og:url" content="https://nlball.bisks.net/">
<meta name="twitter:card" content="summary">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#07090c;color:#b9c7c2;font-family:ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
  h1{font-size:1.1rem;letter-spacing:.3em;text-transform:uppercase;margin:8px 0 4px;color:#d8e6e0;font-weight:400}
  .sub{font-size:.8rem;opacity:.6;margin:0 0 20px;text-align:center}
  .q{width:min(420px,100%);background:#0d1217;border:1px solid #23303a;color:#d8e6e0;padding:10px 12px;font:inherit;border-radius:4px}
  .ball{position:relative;width:min(300px,78vw);aspect-ratio:1;border-radius:50%;margin:24px 0 12px;border:0;cursor:pointer;padding:0;
    background:radial-gradient(circle at 32% 28%,#4a5560 0,#161c22 22%,#05070a 70%);box-shadow:0 20px 50px #000,inset 0 0 40px #000;transition:transform .1s}
  .ball:focus-visible{outline:2px solid #5fd4a8;outline-offset:6px}
  .ball.shake{animation:shake .6s}
  @keyframes shake{0%,100%{transform:translate(0)}15%{transform:translate(-14px,6px) rotate(-6deg)}35%{transform:translate(12px,-8px) rotate(5deg)}55%{transform:translate(-10px,-4px) rotate(-4deg)}75%{transform:translate(8px,6px) rotate(3deg)}}
  .win{position:absolute;left:50%;top:50%;width:52%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#02050a;box-shadow:inset 0 0 18px #000,0 0 0 3px #1b242c;display:flex;align-items:center;justify-content:center}
  .float{width:66%;aspect-ratio:1.1;animation:float 4s ease-in-out infinite}
  .ball.shake .float{animation:float 4s ease-in-out infinite,jostle .6s}
  @keyframes float{0%,100%{transform:translateY(-2px) rotate(-1.5deg)}50%{transform:translateY(3px) rotate(1.5deg)}}
  @keyframes jostle{0%,100%{translate:0 0}20%{translate:6px -5px}45%{translate:-7px 4px}70%{translate:4px 3px}}
  .tri{width:100%;height:100%;clip-path:polygon(0 0,100% 0,50% 100%);background:linear-gradient(160deg,#3b7bff,#1747c9 70%,#10358f);filter:drop-shadow(0 0 6px #3b7bff88);display:flex;align-items:flex-start;justify-content:center;transition:opacity .5s}
  /* an inverted triangle's centroid sits a third of the way down, so the text box spans the top two thirds and centers within it */
  .tri.dim{opacity:0}
  .tri span{display:flex;align-items:center;justify-content:center;width:50%;height:66%;text-align:center;font-size:clamp(.42rem,2vw,.64rem);line-height:1.2;color:#fff;font-weight:700;text-transform:uppercase;overflow-wrap:anywhere}
  .eight{position:absolute;left:34%;top:9%;font-size:1.6rem;color:#e8eef0;opacity:.9;pointer-events:none}
  .hint{font-size:.75rem;opacity:.5;margin:0 0 14px}
  .out{width:min(520px,100%);min-height:3em;text-align:center;font-size:.95rem;line-height:1.5;color:#d8e6e0;margin:6px 0}
  .out[hidden]{display:none}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  .row[hidden]{display:none}
  .row a,.row button{font:inherit;font-size:.8rem;color:#5fd4a8;background:none;border:1px solid #23303a;padding:7px 12px;border-radius:4px;text-decoration:none;cursor:pointer}
  footer{margin-top:auto;padding-top:32px;font-size:.72rem;opacity:.55;text-align:center;line-height:1.8}
  footer a{color:inherit}
</style>
</head>
<body>
<h1>nl<span id="mark">b</span>all</h1>
<p class="sub">the NL clip oracle. shake it. receive a real Northernlion quote.</p>
<button id="ball" class="ball" type="button" aria-label="Shake the ball">
  <span class="eight">8</span>
  <span class="win"><span class="float"><span id="tri" class="tri"><span id="tritext">ask.</span></span></span></span>
</button>
<p class="hint">click or tap to shake</p>
<p id="out" class="out" aria-live="polite" hidden></p>
<div id="row" class="row" hidden>
  <a id="share" target="_blank" rel="noopener">post to bluesky</a>
  <button id="again" type="button">shake again</button>
</div>
<footer>
  all lines are quotes from Northernlion, collected via <a href="https://knowyourmeme.com/memes/people/northernlion">know your meme</a> and the NL fan wikis.<br>
  November is #NaNoFoMo: <a href="https://nanofomo.bisks.net/">pledge not to foom →</a> ·
  <a href="https://rateyourbuild.bisks.net/site/nlball">rate this on rateyourbuild →</a>
</footer>
<script>
// Each entry: short = what shows in the ball's window, full = the "clip".
// Verbatim Northernlion quotes, as collected on knowyourmeme.com/memes/people/northernlion (profanity trimmed).
const CLIPS = [
  ["BE THE TRAFFIC","I understand why people get mad in traffic, but to me it shows a lack of perspective. Brother, you are the traffic. Be mad at the guy who built the road, not the guy's car in front of you."],
  ["ELEMENTARY CONCEPT","If you can't grasp the... ELEMENTARY concept of Being, my friend, you can not confront the Dasein, yeah?"],
  ["NO SOLUTION","Being doesn't necessitate a SOLUTION — that's your problem — that's logic, that's a fool's game."],
  ["THE FALLING ROCK","Why on earth, if I dropped the rock, would I rush back to the bottom to start pushing the rock again. The part where the rock is falling? That's my only break, brother. That's what it's all about."],
  ["STUPID DAMAGE","Stupid, stupid damage."]
];
// Only add lines with a source you can point to (fandom wiki file captions for "Stupid, stupid damage."); no reconstructing from memory.
const $ = id => document.getElementById(id);
const ball = $("ball"), tri = $("tri"), tritext = $("tritext"), out = $("out"), row = $("row");
let busy = false, last = -1, current = null;

function shake(){
  if (busy) return;
  busy = true;
  out.hidden = true; row.hidden = true;
  tri.classList.add("dim");
  ball.classList.remove("shake"); void ball.offsetWidth; ball.classList.add("shake");
  setTimeout(() => {
    let i;
    do { i = Math.floor(Math.random() * CLIPS.length); } while (i === last && CLIPS.length > 1);
    last = i;
    current = CLIPS[i];
    tritext.textContent = current[0];
    tri.classList.remove("dim");
    out.textContent = current[1];
    out.hidden = false;
    const text = "nlball says: " + current[0] + "\n“" + current[1] + "”\n— Northernlion\n\nhttps://nlball.bisks.net/";
    $("share").href = "https://bsky.app/intent/compose?text=" + encodeURIComponent(text);
    row.hidden = false;
    busy = false;
  }, 650);
}
ball.addEventListener("click", shake);
$("again").addEventListener("click", shake);
// secret prefill link: the page has no handle input, so nothing to wire here.
</script>
</body>
</html>
