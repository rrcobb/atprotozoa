name = "atprotozoa-flamewordart"
compatibility_date = "2025-01-01"

# Pure static site: a text form that renders the input as tumbling flame word
# art over a starfield, animates it on a <canvas>, and encodes the animation
# client-side into a downloadable GIF via a vendored gif.js + gif.worker.js
# (no server surface needed — everything runs in the browser).
assets = { directory = "./public" }

routes = [{ pattern = "flamewordart.bisks.net", custom_domain = true }]
