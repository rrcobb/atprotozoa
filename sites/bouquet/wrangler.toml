name = "atprotozoa-bouquet"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Everything runs client-side (public/index.html builds and reveals the
# bouquet). The one server surface: /s/<code> is a real per-bouquet URL so
# each shared link unfurls with its own og:title/description instead of one
# generic card for every bouquet (same fix as sites/didscope, see
# notes/45-sharing-and-virality.md). routes MUST stay above [assets] — in
# TOML, keys after a table header join that table, so a routes line below
# [assets] silently becomes assets.routes.
routes = [{ pattern = "bouquet.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /s/<code> is dynamic (personalized OG tags per bouquet),
# so the Worker must run BEFORE the static-asset router.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
