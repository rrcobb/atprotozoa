name = "atprotozoa-humanbench"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @shimmermathlabs.com runs HumanBENCH — a running bit where humans build a
# small app under a time limit and get graded 0-10 by shimmermathlabs, same
# format as an AI model eval. They asked buildthis for leaderboards: a 30
# minute speedrun board and an unlimited-time board. New results arrive by
# tagging the bot again with the hashtag #humanswinning in the request (see
# "HumanBENCH leaderboard entries" in sites/buildthis/builder/INSTRUCTIONS.md)
# rather than through any in-page submission flow.
#
# Pure static: the leaderboard is hand-maintained in public/data/entries.json
# and rendered client-side. No dynamic routes, no per-request compute, so the
# Worker is a plain ASSETS passthrough.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
routes = [
  { pattern = "humanbench.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = false
