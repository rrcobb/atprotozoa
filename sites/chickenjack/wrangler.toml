name = "atprotozoa-chickenjack"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @brennan.computer asked for a massively multiplayer blackjack game where
# the dealer runs on a fixed world-time clock, anyone can jump in and out,
# get dealt cards, bet, play, and stack up winnings for as long as they like.
#
# The dealer's clock is real wall-clock time, not player-triggered: a fresh
# hand starts every ROUND_MS, anchored to the epoch (nextBoundary(now, step)
# = floor(now/step)*step), so every visitor anywhere sees the exact same
# phase at the exact same moment — copied from sites/simcluster-lottery's
# multi-boundary trick, simplified to one clock. One KV snapshot holds the
# shared shoe, every player's hand for the current round, balances, and
# lifetime net-winnings ("top chicken" leaderboard). Reads and writes are
# intentionally eventual and non-authoritative because this is a play-money
# toy, not a ledger. Rounds resolve lazily on requests. No login: clients carry
# an opaque id in localStorage, sent as X-Client-Id.
routes = [
  { pattern = "chickenjack.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[kv_namespaces]]
binding = "TABLE_STATE"

# Keep the old class migration history until the retired storage has been
# explicitly deleted. The live site uses only the KV binding above.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Table"]

[[migrations]]
tag = "v2"
deleted_classes = ["Table"]
