name = "atprotozoa-disturbedgamers"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# disturbedgamers.bisks.net — @fromthewestmeadow.com's ask: rank the most
# disturbed horror gamers (score = sum of log2(1+hours) across every horror
# game a player has logged) and rank pairs by their shared horror games
# (compatibility = sum of log2(1+min(hoursA,hoursB)) over shared horror
# games). See src/index.ts for the full writeup — profile data comes from
# Steam's public, key-free profile XML feed (same source as sites/steamstats)
# and horror classification runs off SteamSpy's public tags API (same source
# as sites/steamtags).
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [{ pattern = "disturbedgamers.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /api/analyze and /s/<list> are both dynamic, so the
# Worker must run before the static-asset router.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
