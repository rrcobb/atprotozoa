name = "atprotozoa-llmstance"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Everything still runs client-side (see public/index.html): enter a handle,
# it downloads the account's entire repo as one CAR (com.atproto.sync.getRepo,
# via public/lib/car.js — every app.bsky.feed.post record, no page cap; falls
# back to paginated app.bsky.feed.getAuthorFeed only if the CAR read fails),
# runs every post through a keyword heuristic (public/lib/classify.js) that
# labels it Pro-LLM, Anti-LLM, or Unclear, then tallies the whole account into
# one verdict. No real model in the loop — it's a lexicon, not a judge.
# (Follower/following/network scope scans still sample each account's recent
# posts via getAuthorFeed — bounded by design, see NETWORK_SIDE_CAP etc.)
#
# The one server job: /s/<handle> is a real per-handle URL so a shared link
# gets its own og:title/description instead of one generic card for every
# account — same shape as sites/didscope's renderShare.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [{ pattern = "llmstance.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /s/<handle> is dynamic (personalized OG tags per share), so
# the Worker must run BEFORE the static-asset router.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
