name = "atprotozoa-heistlibs"
compatibility_date = "2025-01-01"

# Pure static site — a mad-libs heist-film-script generator that shoehorns
# Jimothy (a short-spined raccoon) and Moo Deng (an unbothered pygmy hippo)
# into every classic heist-movie cliche, plus a crude canvas-drawn "MS Paint"
# movie poster to go with the script. Everything runs client-side.
main = "src/index.ts"

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# heistlibs.bisks.net is being retired to free a slot against the zone's
# custom-domain cap (see notes/20-deploy.md). Migrated to bisks.net/heistlibs
# instead. See notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "bisks.net/heistlibs", zone_name = "bisks.net" },
  { pattern = "bisks.net/heistlibs/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
