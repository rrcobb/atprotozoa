name = "atprotozoa-oblique"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Oblique Strategies, the
# Eno/Schmidt card deck of cryptic creative-unblocking prompts, redrawn for a
# different kind of collaborator: a programming agent mid-task. One card at a
# time, tap to draw another. lib/deck.js holds the (original, not the real
# Oblique Strategies text) card pool; index.html is the draw/shuffle/copy UI.
main = "src/index.ts"

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# oblique.bisks.net is being retired to free a slot against the zone's
# custom-domain cap (see notes/20-deploy.md). Migrated to bisks.net/oblique
# instead. See notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "bisks.net/oblique", zone_name = "bisks.net" },
  { pattern = "bisks.net/oblique/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
