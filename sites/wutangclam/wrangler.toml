name = "atprotozoa-wutangclam"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Path route on the shared bisks.net zone, not a dedicated custom domain — the
# zone hit its Cloudflare custom-domain cap, so new sites mount as a path
# instead of a new hostname. See notes/40-new-site-playbook.md.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [
  { pattern = "bisks.net/wutangclam", zone_name = "bisks.net" },
  { pattern = "bisks.net/wutangclam/*", zone_name = "bisks.net" },
]

# run_worker_first: /wutangclam/s/<handle> is dynamic (personalized OG tags
# per share), so the Worker must run before the static-asset router.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
