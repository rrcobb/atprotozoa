<style>
  :root {
    --bg: #05010c;
    --bg2: #0d0518;
    --fg: #f4eaff;
    --dim: #8f7fae;
    --accent: #ff2f92;
    --accent2: #26f2c9;
    --accent3: #ffd23f;
    --card: #140a24;
    --border: #3a2456;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  body {
    position: relative;
    overflow-x: hidden;
    background-image:
      radial-gradient(ellipse at 15% 0%, #2a1140 0%, transparent 55%),
      radial-gradient(ellipse at 85% 10%, #0a2b3a 0%, transparent 50%),
      radial-gradient(1px 1px at 20px 30px, #ffffff55 50%, transparent 51%),
      radial-gradient(1px 1px at 140px 90px, #ffffff44 50%, transparent 51%),
      radial-gradient(1px 1px at 60px 160px, #ffffff33 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 220px 40px, #ffffff55 50%, transparent 51%),
      radial-gradient(1px 1px at 300px 200px, #ffffff33 50%, transparent 51%),
      radial-gradient(1px 1px at 340px 120px, #ffffff44 50%, transparent 51%);
    background-repeat: repeat-y, repeat-y, repeat, repeat, repeat, repeat, repeat, repeat;
    background-size: 100% 900px, 100% 900px, 360px 360px, 360px 360px, 360px 360px, 360px 360px, 360px 360px, 360px 360px;
  }
  .wrap {
    position: relative;
    z-index: 1;
    max-width: 640px;
    margin: 0 auto;
    padding: 2rem 1.1rem 4rem;
    min-height: 100vh;
  }
  a { color: var(--accent2); }

  .band {
    display: inline-block;
    font-size: 0.68rem;
    letter-spacing: 0.18em;
    color: var(--accent3);
    border: 1px solid var(--accent3);
    border-radius: 999px;
    padding: 0.2rem 0.6rem;
    margin-bottom: 1rem;
    text-transform: uppercase;
  }

  h1.wordmark {
    font-size: clamp(2rem, 9vw, 3.1rem);
    line-height: 1.02;
    margin: 0 0 0.3rem;
    font-weight: 800;
    letter-spacing: -0.01em;
    background: linear-gradient(90deg, var(--accent), var(--accent2) 60%, var(--accent3));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px #ff2f9233;
  }
  .sub { color: var(--dim); font-size: 0.95rem; margin: 0 0 1.6rem; max-width: 46ch; }

  button, .btn {
    font: inherit;
    font-weight: 700;
    font-size: 0.9rem;
    letter-spacing: 0.02em;
    background: var(--accent);
    color: #1a0510;
    border: none;
    border-radius: 10px;
    padding: 0.85rem 1.3rem;
    cursor: pointer;
    display: inline-block;
    text-decoration: none;
    text-align: center;
  }
  button:hover, .btn:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.45; cursor: default; }
  button.ghost {
    background: transparent;
    color: var(--accent2);
    border: 1px solid var(--border);
  }
  button.ghost:hover { border-color: var(--accent2); }

  input[type=text] {
    font: inherit;
    font-size: 0.95rem;
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 10px;
    padding: 0.85rem 0.95rem;
    margin-bottom: 0.7rem;
  }
  input[type=text]:focus { outline: 1.5px solid var(--accent2); }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.4rem;
    margin-bottom: 1.1rem;
  }

  /* transcript */
  .log { display: flex; flex-direction: column; gap: 0.7rem; margin-bottom: 1.2rem; }
  .line { border-radius: 12px; padding: 0.7rem 0.9rem; font-size: 0.92rem; line-height: 1.42; border: 1px solid var(--border); }
  .line .tag { display: block; font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 0.3rem; opacity: 0.85; }
  .line.host { background: #1c0f2c; border-color: #4a2a66; }
  .line.host .tag { color: var(--accent); }
  .line.guest { background: #0d1c22; border-color: #1f4a4f; margin-left: 1.3rem; }
  .line.guest .tag { color: var(--accent2); }
  .line.zorak { background: #1a1908; border-color: #4a4517; }
  .line.zorak .tag { color: var(--accent3); }
  .line.moltar { background: #1c1008; border-color: #4a2f10; }
  .line.moltar .tag { color: #ff9a4d; }
  .line.brak { background: #200c1c; border-color: #55214a; }
  .line.brak .tag { color: #ff7fd8; }
  .line.system { background: transparent; border: 1px dashed var(--border); color: var(--dim); text-align: center; font-size: 0.75rem; letter-spacing: 0.08em; }

  .hint { color: var(--dim); font-size: 0.78rem; margin: 0.4rem 0 1rem; }

  .stars { font-size: 1.6rem; margin: 0.3rem 0 0.2rem; color: var(--accent3); }
  .titlecard { font-size: 1.35rem; font-weight: 800; margin: 0 0 0.4rem; color: var(--fg); }

  footer { margin-top: 2.5rem; color: var(--dim); font-size: 0.72rem; text-align: center; }
  footer a { color: var(--dim); }

  .row { display: flex; gap: 0.6rem; flex-wrap: wrap; }
  .row > * { flex: 1 1 auto; }

  #shareCanvas { display: none; }
  .cardimg { width: 100%; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 1rem; display: block; }

  /* explicit, non-negative layering: the 3D canvas and its vignette sit at
     z-index 0, every foreground UI element sits at z-index 1+. z-index:-1
     on a fixed layer relies on paint-order rules that Safari's
     backdrop-filter compositing has a history of getting wrong (see the
     Safari reports earlier in this site's build thread) — explicit
     stacking can't silently invert like that. */
  #glScene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    display: block;
  }
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 40%, transparent 55%, #05010c 100%);
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  body.gl-active {
    background-image: none;
    background-color: var(--bg);
  }
  body.gl-active .vignette { opacity: 1; }
  body.gl-active .card,
  body.gl-active .line,
  body.gl-active input[type=text] {
    background: rgba(20, 10, 36, 0.62);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  body.gl-active .line.host { background: rgba(28, 15, 44, 0.66); }
  body.gl-active .line.guest { background: rgba(13, 28, 34, 0.6); }
  body.gl-active .line.zorak { background: rgba(26, 25, 8, 0.6); }
  body.gl-active .line.moltar { background: rgba(28, 16, 8, 0.6); }
  body.gl-active .line.brak { background: rgba(32, 12, 28, 0.6); }
  body.gl-active .line.system { background: rgba(5, 1, 12, 0.3); }
  .viewport-hint {
    color: var(--dim);
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    margin: -0.6rem 0 1.2rem;
    opacity: 0;
  }
  body.gl-active .viewport-hint { opacity: 1; }

  /* immersive mode: the 3D set fills the whole viewport all the time —
     drag/swipe on it anywhere to orbit — and the UI collapses into a
     translucent HUD dock along the bottom instead of a full-page scroll,
     so the console/crew/ghost planet stay in view behind it. */
  body.gl-active #glScene { cursor: grab; touch-action: none; }
  body.gl-active #glScene:active { cursor: grabbing; }

  body.gl-active .wrap {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    top: auto;
    min-height: 0;
    max-height: 48vh;
    overflow-y: auto;
    margin: 0 auto;
    padding: 1rem 1.1rem 1.5rem;
    background: linear-gradient(to top, rgba(5, 1, 12, 0.9) 0%, rgba(5, 1, 12, 0.74) 55%, rgba(5, 1, 12, 0) 100%);
    border-top: 1px solid var(--border);
  }

  @keyframes sgLineIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  /* only animate in immersive mode — in the fallback scrolling log every
     line lives in the DOM at once, and replaying the fade on the whole list
     every time a new line is appended would flash the entire transcript. */
  body.gl-active .line { animation: sgLineIn 0.35s ease; }
  .line.older { opacity: 0.55; }
</style>
</head>
<body>
<canvas id="glScene"></canvas>
<div class="vignette"></div>
<div class="wrap" id="app"></div>
<canvas id="shareCanvas" width="1200" height="630"></canvas>
<script type="module" src="ghostplanet.js"></script>

<script>
(function () {
  "use strict";

  var SITE_URL = "https://spaceghost.bisks.net/";

  var QUESTIONS = [
    "So, {name}. Are you a wizard? Be honest. I can take it.",
    "I have several belts. You have how many belts?",
    "Quick — moon, or ghost? And why is it moon.",
    "What's the deal with your shoes. I've never seen shoes like that. Are they made of crime?",
    "Zorak keeps telling me you're famous. Are you famous? Because I have never heard of you.",
    "If I zapped you right now, on a scale of one to ten, how zapped would you be?",
    "Tell me about your enemies. I have several. We should compare lists.",
    "Do you own the moon? Because I might own the moon. I haven't checked.",
    "What is your source of power? Mine is a wristband. Several wristbands.",
    "Have you ever hosted a talk show from space? No? Interesting. Interesting.",
    "I'm going to say a word and you say the first thing that scares you. Ready? Ghost.",
    "What would you do with my powers, if you had them, which you don't, and never will?",
    "Describe your job to me like I'm an idiot. I am not an idiot. But describe it that way.",
    "Do you believe in the Moon Council? I sit on the Moon Council. Unofficially.",
    "I once fought a crime tortoise for six years. What's your version of that?",
    "Between you and me — is Zorak funny? Be honest, he's right here, he can't do anything about it.",
    "What's your official stance on being zapped into another dimension, hypothetically, tonight?",
    "I have a birthmark shaped like my own face. What's your weirdest birthmark?",
    "Quick lightning round: ghosts. Real, or fake?",
    "If your life were a talk show, would it be as good as this one? Take your time.",
    "What do you know about crime? Personally. Speaking from experience.",
    "I built this ship out of pure willpower, and also money. What have you built?",
    "Do you think Moltar likes me? Don't answer that where he can hear you. He can hear you.",
    "Last question, maybe. Are you enjoying this interview? Because I am."
  ];

  var SG_REACTIONS = [
    "Fascinating. I wasn't listening, but fascinating.",
    "That's exactly what a wizard would say.",
    "I'm going to pretend I understood that, and move on.",
    "Zorak, did you hear that? Neither did I. Moving on.",
    "That was either very brave or very illegal. I respect it.",
    "I have several follow-up questions, and I'm choosing to ask none of them.",
    "Incredible. Truly. I have already forgotten it.",
    "That answer has been noted in my logs, which do not exist.",
    "I don't think anyone has ever said that to me before, on this show, tonight, just now.",
    "I'm zapping something. Not you. Something near you. It felt right.",
    "Bold. I like bold. I am also bold. We should start a club.",
    "That's the kind of answer that gets a person a talk show. Ask me how I know.",
    "Write that down. Somebody. Anybody. Nobody's writing it down.",
    "I felt that answer in my wristbands.",
    "You're doing great. I'm not, but you are."
  ];

  var ZORAK_REACTIONS = [
    "Wow. Riveting. I'm a grasshopper trapped in a keyboard and even I'm bored.",
    "That's the worst answer I've heard all episode, and I've heard all of them.",
    "Can I eat the guest? Just asking for the show.",
    "Space Ghost, that wasn't even a question you asked correctly.",
    "I've got money on this guest lying. Small amounts. I'm still owed from last week.",
    "Somebody wake up Brak.",
    "This is the content? This is what we're doing tonight?",
    "I've heard better answers from Moltar's smoke alarm."
  ];

  var MOLTAR_REACTIONS = [
    "We are experiencing — I don't even know what we're experiencing. Standby.",
    "Ghost, that's not a real question, that's just a sentence with a question mark on it.",
    "I'm setting the guest's answer on fire. For the visual.",
    "The control room would like to remind everyone that this is, in fact, live.",
    "I have lit several things on fire since this interview began. It's fine. It's under control.",
    "Cueing something. I don't know what. Cueing it anyway."
  ];

  var BRAK_REACTIONS = [
    "I ATE A SHOE ONE TIME. IT WAS AN ACCIDENT. I'D DO IT AGAIN.",
    "OOOOOH THAT'S A GOOD QUESTION SPACE GHOST I HAVE NO ANSWER.",
    "MY DAD SAYS I'M NOT ALLOWED ON THIS SHOW ANYMORE BUT HERE I AM.",
    "I HAVE A SONG ABOUT THIS. IT'S NOT FINISHED. IT'S ALSO NOT GOOD."
  ];

  var COMMERCIAL_ADS = [
    "Have you tried NOT being weak? New from Ghost Industries.",
    "This episode brought to you by: crime. Please stop doing it near my ship.",
    "The Moon. Available for purchase. Inquire within, ask for Ghost.",
    "This episode brought to you by: Zorak's Grasshopper Legal Defense Fund.",
    "Belts. So many belts. Belts by Space Ghost.",
    "Moltar's Fire Extinguisher Rental — ask about our monthly plan."
  ];

  var TITLE_TEMPLATES = [
    "TONIGHT: {name} VS. THE VOID",
    "THE {name} INCIDENT",
    "{name}: A CAUTIONARY TALE",
    "SPECIAL REPORT: IS {name} A WIZARD?",
    "{name} COMES ABOARD (AGAINST ADVICE)",
    "THE GHOST INTERVIEWS: {name}",
    "{name} AND THE SEVEN WRISTBANDS",
    "AN EVENING WITH {name}, PROBABLY",
    "{name}: LIVE, UNSUPERVISED",
    "THE MOLTAR TAPES: {name} EDITION"
  ];

  var RATINGS = [
    { v: "10 out of 10 ghosts", note: "Space Ghost has requested this guest return every week, forever." },
    { v: "7.5 out of 10 ghosts", note: "Solid. Zorak remains unimpressed, but Zorak remains unimpressed by everything." },
    { v: "2 out of 10 ghosts", note: "Moltar set something on fire out of sheer boredom." },
    { v: "−3 out of 10 ghosts", note: "We are not legally allowed to explain what happened. Do not attempt to find out." },
    { v: "11 out of 10 ghosts", note: "The rating system is malfunctioning. So is the ship. Please remain calm." },
    { v: "1 out of 10 ghosts", note: "Brak enjoyed it, which the producers note is not a good sign." },
    { v: "6 out of 10 ghosts", note: "Above average, for this show, which is not saying much." },
    { v: "0 out of 10 ghosts", note: "Technically the interview did not happen. We are still airing it." },
    { v: "9 out of 10 ghosts", note: "Space Ghost has already forgotten this happened, which he considers a compliment." },
    { v: "4 out of 10 ghosts", note: "The control room caught fire twice. Once was scheduled." }
  ];

  var SIGNOFFS = [
    "Well. That's our show. I'm Space Ghost. This has been Coast to Coast. Somewhere.",
    "That's all the time we have, mostly because I said so. Space Ghost, out.",
    "I've learned nothing tonight, and I regret nothing. Good night.",
    "This has been Space Ghost Coast to Coast. I still don't know your name. Good night."
  ];

  var N_QUESTIONS = 6;

  // ---- tiny helpers ----
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function weightedPick(table) {
    var total = 0;
    for (var k in table) total += table[k];
    var r = Math.random() * total;
    for (var k2 in table) {
      if (r < table[k2]) return k2;
      r -= table[k2];
    }
    return Object.keys(table)[0];
  }

  // ---- state ----
  var state = {
    screen: "title",
    name: "",
    questions: [],
    qi: 0,
    log: [],       // {cls, tag, text}
    phase: "ask",  // ask | next | done
    title: "",
    rating: null
  };

  var app = document.getElementById("app");

  function render() {
    if (state.screen === "title") return renderTitle();
    if (state.screen === "name") return renderName();
    if (state.screen === "interview") return renderInterview();
    if (state.screen === "outro") return renderOutro();
  }

  function renderTitle() {
    app.innerHTML =
      '<span class="band">bisks.net presents</span>' +
      '<h1 class="wordmark">SPACE GHOST<br>COAST TO COAST</h1>' +
      '<p class="sub">Best website of the year 1998. Tonight: you. You’re strapped into the guest chair on Space Ghost’s ship, live, in 3D — the console in front of you, Zorak caged to one side, Moltar’s screen flickering on the other, the ghost planet drifting outside the window. He will not really listen. Zorak will heckle. Moltar may light something on fire. Coast to coast, to coast.</p>' +
      '<p class="viewport-hint">(that’s the real set behind this panel — drag or swipe anywhere on it to look around, tilt your phone, or just let it drift)</p>' +
      '<button id="start">GET IN THE CHAIR ▸</button>' +
      '<footer>a simulator, not a broadcast. no relation to anything real. by @buildthis, asked for by @ver.ooo.</footer>';
    document.getElementById("start").onclick = function () {
      state.screen = "name";
      render();
    };
  }

  function renderName() {
    app.innerHTML =
      '<span class="band">green room</span>' +
      '<h1 class="wordmark" style="font-size:1.8rem">who’s our guest tonight?</h1>' +
      '<p class="sub">Space Ghost will mispronounce this. That’s not a threat, it’s a promise.</p>' +
      '<input type="text" id="nameInput" maxlength="40" placeholder="your name, or a name you’re willing to answer to" autocomplete="off" />' +
      '<button id="enter">ENTER, GUEST ▸</button>';
    var input = document.getElementById("nameInput");
    var go = function () {
      var v = input.value.trim();
      state.name = v || "Mystery Guest";
      state.questions = shuffle(QUESTIONS).slice(0, N_QUESTIONS);
      state.qi = 0;
      state.log = [
        { cls: "system", text: "— ON THE AIR —" },
        { cls: "host", tag: "👻 SPACE GHOST", text: "Welcome, welcome. I'm Space Ghost. This is my show. This is my ship. Say hello to " + state.name + "." }
      ];
      logLine("host", "👻 SPACE GHOST", currentQuestionText());
      state.phase = "ask";
      state.screen = "interview";
      render();
    };
    document.getElementById("enter").onclick = go;
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
    input.focus();
  }

  function logLine(cls, tag, text) {
    state.log.push({ cls: cls, tag: tag, text: text });
    if (window.SpaceGhostScene) window.SpaceGhostScene.speak(cls);
  }

  function currentQuestionText() {
    return state.questions[state.qi].split("{name}").join(state.name);
  }

  function renderInterview() {
    // immersive mode (3D loaded): the set fills the screen, so the HUD only
    // shows the last couple of lines as captions instead of a full scrolling
    // transcript. Fallback (no WebGL): keep the plain full-log scroll — that
    // path has to keep working on its own since there's no 3D backdrop to
    // carry the show.
    var immersive = document.body.classList.contains("gl-active");
    var visibleLog = immersive ? state.log.slice(-3) : state.log;
    var html = '<span class="band">on the air</span><h1 class="wordmark" style="font-size:1.6rem">tonight’s interview</h1>';
    html += '<div class="log">';
    visibleLog.forEach(function (l, i) {
      var older = immersive && i < visibleLog.length - 1 ? " older" : "";
      if (l.cls === "system") {
        html += '<div class="line system' + older + '">' + esc(l.text) + '</div>';
      } else {
        html += '<div class="line ' + l.cls + older + '"><span class="tag">' + esc(l.tag) + '</span>' + esc(l.text) + '</div>';
      }
    });
    html += '</div>';

    if (state.phase === "ask") {
      html += '<input type="text" id="answerInput" maxlength="240" placeholder="your answer..." autocomplete="off" />';
      html += '<button id="answerBtn">ANSWER ▸</button>';
      html += '<p class="hint">Question ' + (state.qi + 1) + ' of ' + state.questions.length + '</p>';
    } else if (state.phase === "next") {
      var isLast = state.qi >= state.questions.length - 1;
      html += '<button id="nextBtn">' + (isLast ? "SEE YOUR EPISODE ▸" : "NEXT QUESTION ▸") + '</button>';
    }

    app.innerHTML = html;

    if (state.phase === "ask") {
      var input = document.getElementById("answerInput");
      var submit = function () {
        var v = input.value.trim();
        if (!v) return;
        logLine("guest", state.name.toUpperCase(), v);
        addReaction();
        state.phase = "next";
        render();
      };
      document.getElementById("answerBtn").onclick = submit;
      input.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
      input.focus();
    } else if (state.phase === "next") {
      document.getElementById("nextBtn").onclick = function () {
        if (state.qi >= state.questions.length - 1) {
          finishEpisode();
        } else {
          state.qi += 1;
          logLine("host", "👻 SPACE GHOST", currentQuestionText());
          state.phase = "ask";
          render();
        }
      };
    }

    if (!immersive) {
      var logEl = app.querySelector(".log");
      if (logEl && logEl.scrollIntoView) logEl.scrollIntoView({ block: "end" });
    }
  }

  function addReaction() {
    var kind = weightedPick({ spaceghost: 45, zorak: 25, moltar: 15, brak: 7, commercial: 8 });
    if (kind === "spaceghost") {
      logLine("host", "👻 SPACE GHOST", pick(SG_REACTIONS));
    } else if (kind === "zorak") {
      logLine("zorak", "🦗 ZORAK", pick(ZORAK_REACTIONS));
    } else if (kind === "moltar") {
      logLine("moltar", "🎬 MOLTAR", pick(MOLTAR_REACTIONS));
    } else if (kind === "brak") {
      logLine("brak", "🎵 BRAK", pick(BRAK_REACTIONS));
    } else if (kind === "commercial") {
      logLine("system", "— WE'LL BE RIGHT BACK —");
      logLine("moltar", "🎬 MOLTAR (V.O.)", pick(COMMERCIAL_ADS));
      logLine("system", "— AND WE'RE BACK —");
    }
  }

  function finishEpisode() {
    logLine("host", "👻 SPACE GHOST", pick(SIGNOFFS));
    state.title = pick(TITLE_TEMPLATES).split("{name}").join(state.name.toUpperCase());
    state.rating = pick(RATINGS);
    state.screen = "outro";
    render();
  }

  function shareText() {
    var t = '"' + state.title + '" — SPACE GHOST COAST TO COAST rated my episode ' + state.rating.v + '. Play your own → ' + SITE_URL;
    if (t.length > 295) t = t.slice(0, 292) + "...";
    return t;
  }

  function buildShareCard() {
    var c = document.getElementById("shareCanvas");
    var ctx = c.getContext("2d");
    var W = c.width, H = c.height;

    var bg = ctx.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, "#0d0518");
    bg.addColorStop(1, "#05010c");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // scanlines
    ctx.globalAlpha = 0.06;
    ctx.fillStyle = "#ffffff";
    for (var y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 1);
    ctx.globalAlpha = 1;

    // border
    ctx.strokeStyle = "#3a2456";
    ctx.lineWidth = 6;
    ctx.strokeRect(24, 24, W - 48, H - 48);

    ctx.textBaseline = "alphabetic";

    // wordmark
    ctx.fillStyle = "#ff2f92";
    ctx.font = "800 34px 'JetBrains Mono', monospace";
    ctx.fillText("SPACE GHOST COAST TO COAST", 70, 110);

    ctx.fillStyle = "#26f2c9";
    ctx.font = "700 20px 'JetBrains Mono', monospace";
    ctx.fillText("TONIGHT'S EPISODE", 70, 150);

    // title, wrapped
    ctx.fillStyle = "#f4eaff";
    ctx.font = "800 46px 'JetBrains Mono', monospace";
    var words = state.title.split(" ");
    var lines = [];
    var line = "";
    var maxW = W - 140;
    for (var i = 0; i < words.length; i++) {
      var test = line ? line + " " + words[i] : words[i];
      if (line && ctx.measureText(test).width > maxW) {
        lines.push(line);
        line = words[i];
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
    var ty = 240;
    lines.slice(0, 3).forEach(function (l) {
      ctx.fillText(l, 70, ty);
      ty += 56;
    });

    // rating
    ctx.fillStyle = "#ffd23f";
    ctx.font = "700 30px 'JetBrains Mono', monospace";
    ctx.fillText(state.rating.v.toUpperCase(), 70, ty + 40);

    ctx.fillStyle = "#8f7fae";
    ctx.font = "16px 'JetBrains Mono', monospace";
    wrapFillText(ctx, state.rating.note, 70, ty + 74, maxW, 22);

    ctx.fillStyle = "#26f2c9";
    ctx.font = "700 22px 'JetBrains Mono', monospace";
    ctx.fillText("spaceghost.bisks.net", 70, H - 56);

    return c;
  }

  function wrapFillText(ctx, text, x, y, maxW, lh) {
    var words = text.split(" ");
    var line = "";
    for (var i = 0; i < words.length; i++) {
      var test = line ? line + " " + words[i] : words[i];
      if (line && ctx.measureText(test).width > maxW) {
        ctx.fillText(line, x, y);
        line = words[i];
        y += lh;
      } else {
        line = test;
      }
    }
    if (line) ctx.fillText(line, x, y);
  }

  function canShareFiles() {
    if (!navigator.share || !navigator.canShare) return false;
    try {
      var probe = new File([""], "probe.png", { type: "image/png" });
      return navigator.canShare({ files: [probe] });
    } catch (e) { return false; }
  }

  function renderOutro() {
    var html = '<span class="band">that’s a wrap</span>';
    html += '<h1 class="wordmark" style="font-size:1.7rem">your episode aired.</h1>';
    html += '<div class="card">';
    html += '<div class="titlecard">' + esc(state.title) + '</div>';
    html += '<div class="stars">' + esc(state.rating.v.toUpperCase()) + '</div>';
    html += '<p class="sub" style="margin-bottom:0">' + esc(state.rating.note) + '</p>';
    html += '</div>';
    html += '<img class="cardimg" id="cardPreview" alt="episode card" />';
    html += '<div class="row">';
    html += '<a class="btn" id="shareBluesky" target="_blank" rel="noopener">SHARE ON BLUESKY ▸</a>';
    html += '<button class="ghost" id="downloadCard">DOWNLOAD CARD</button>';
    html += '</div>';
    html += '<div class="row" style="margin-top:0.6rem">';
    html += '<button class="ghost" id="again">WATCH ANOTHER EPISODE</button>';
    html += '</div>';
    html += '<footer>space ghost coast to coast simulator &middot; a fan-made bit, not affiliated with anyone real &middot; <a href="' + SITE_URL + '">spaceghost.bisks.net</a></footer>';
    app.innerHTML = html;

    var canvas = buildShareCard();
    document.getElementById("cardPreview").src = canvas.toDataURL("image/png");

    document.getElementById("shareBluesky").href =
      "https://bsky.app/intent/compose?text=" + encodeURIComponent(shareText());

    document.getElementById("downloadCard").onclick = function () {
      canvas.toBlob(function (blob) {
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "space-ghost-episode.png";
        a.click();
      }, "image/png");
    };

    if (canShareFiles()) {
      var shareBtn = document.createElement("button");
      shareBtn.textContent = "SHARE IMAGE ▸";
      shareBtn.className = "ghost";
      shareBtn.onclick = function () {
        canvas.toBlob(function (blob) {
          var file = new File([blob], "space-ghost-episode.png", { type: "image/png" });
          navigator.share({ files: [file], text: shareText(), title: "Space Ghost Coast to Coast" }).catch(function () {});
        }, "image/png");
      };
      document.querySelector(".row").appendChild(shareBtn);
    }

    document.getElementById("again").onclick = function () {
      state = { screen: "title", name: "", questions: [], qi: 0, log: [], phase: "ask", title: "", rating: null };
      render();
    };
  }

  render();
})();
</script>
