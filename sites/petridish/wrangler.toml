name = "atprotozoa-petridish"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# A particle-life sim (random asymmetric attraction matrix between a handful
# of colored species) running entirely in the browser inside a circular dish.
# No server state, no secrets. Daily-slot build, nobody in particular asked;
# the fluoddity-flavored physics-toy corner of the repo (everzoom/cowlick/
# lavalamp/turtle-garden/murmuration) hadn't done particle life yet.

routes = [
  { pattern = "petridish.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
