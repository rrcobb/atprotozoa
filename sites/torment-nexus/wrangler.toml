name = "atprotozoa-torment-nexus"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Brand-new site, own subdomain, no mount-prefix stripping needed — see
# notes/40-new-site-playbook.md ("Subdomains again").
routes = [{ pattern = "torment-nexus.bisks.net/*", zone_name = "bisks.net" }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
