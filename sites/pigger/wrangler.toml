name = "atprotozoa-pigger"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — the whole game runs in the browser. pigger is a
# Frogger-style road crossing: you play a big, burly, hairy pigman doctor
# of mathematics in Bridgeport, crossing Nash Lane's traffic to buy the
# cheapest bourbon 40 at the 7-Eleven while dodging rowdy students in
# their cars. The trip back gets "extra groovy shaders and vertigo
# effects" per the ask — a small WebGL fragment-shader pass (wave warp,
# chromatic aberration, hue cycling) layered over the 2D canvas once
# you're carrying the bottle home. All audio synthesized live with the
# Web Audio API. 7778777.online asked for this one. No secrets, no
# server, no build step.

routes = [
  { pattern = "pigger.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
