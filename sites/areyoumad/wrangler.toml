name = "atprotozoa-areyoumad"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Path route on the shared bisks.net zone, not a dedicated custom domain — see
# notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "areyoumad.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/areyoumad", zone_name = "bisks.net" },
  { pattern = "bisks.net/areyoumad/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
