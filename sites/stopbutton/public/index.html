<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>stopbutton — bad advice from the jetstream</title>
<meta name="description" content="A big stop button. Press it and a post from the last 30 seconds becomes seven words of bad advice under pfrazee's avatar.">
<meta property="og:title" content="stopbutton">
<meta property="og:description" content="A big stop button. Press it and a post from the last 30 seconds becomes seven words of bad advice under pfrazee's avatar.">
<meta property="og:image" content="https://stopbutton.bisks.net/og.png">
<meta property="og:url" content="https://stopbutton.bisks.net/">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root { color-scheme: dark; }
  body { margin:0; font:16px/1.5 system-ui,sans-serif; background:#14101a; color:#e8e4f0; }
  main { max-width:560px; margin:0 auto; padding:28px 16px 48px; text-align:center; }
  h1 { margin:0 0 4px; font-size:30px; }
  .sub { color:#9a93ab; margin:0 0 24px; }
  #stop { width:240px; height:240px; border-radius:50%; border:10px solid #fff; background:#d92b2b; color:#fff; font:900 52px system-ui,sans-serif; letter-spacing:2px; cursor:pointer; box-shadow:0 8px 0 #7d1414, 0 0 40px #d92b2b66; }
  #stop:active { transform:translateY(6px); box-shadow:0 2px 0 #7d1414; }
  #stop:disabled { background:#5a3a3a; box-shadow:none; cursor:wait; }
  #live { color:#9a93ab; font-size:14px; margin:18px 0; min-height:21px; }
  #status { color:#f0a3a3; margin:8px 0; }
  #status[hidden], #result[hidden] { display:none; }
  #result { margin-top:20px; }
  canvas { width:100%; height:auto; border-radius:10px; display:block; background:#000; }
  #source { color:#9a93ab; font-size:13px; margin:10px 0; font-style:italic; }
  .row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:12px 0; }
  button.alt, .btn { font:inherit; background:#3b82f6; color:#fff; border:0; border-radius:8px; padding:9px 14px; cursor:pointer; text-decoration:none; display:inline-block; }
  button.alt { background:#2a3144; }
  footer { margin-top:32px; color:#6d6880; font-size:13px; }
  footer a { color:#a9b8ff; }
</style>
</head>
<body>
<main>
  <h1>stopbutton</h1>
  <p class="sub">Press it. A post from the last 30 seconds becomes terrible advice.</p>
  <button id="stop" type="button" disabled>STOP</button>
  <div id="live">connecting to the jetstream…</div>
  <div id="status" hidden></div>
  <div id="result" hidden>
    <canvas id="canvas" width="1024" height="1280"></canvas>
    <div id="source"></div>
    <div class="row">
      <button id="again" class="alt" type="button">Another one</button>
      <button id="download" class="alt" type="button">Download PNG</button>
      <a id="share" class="btn" target="_blank" rel="noopener">Post on Bluesky</a>
    </div>
  </div>
  <footer>
    <a href="https://rateyourbuild.bisks.net/site/stopbutton">rate this on rateyourbuild →</a> ·
    <a href="https://nanofomo.bisks.net/">November is #NaNoFoMo: pledge not to foom →</a>
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>
