name = "atprotozoa-bskbskbskbsk"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser. A big button drives a
# Web Audio "lure rig" (tongue-click bursts, a chirp, a squeak) plus a
# wandering on-screen dot, meant to actually be played at a nearby cat. No
# samples, no server, no accounts.

routes = [
  { pattern = "bskbskbskbsk.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
