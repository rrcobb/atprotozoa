name = "atprotozoa-cancelfutures"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @dollspace.gay asked for "a mock bluesky prediction market which features
# which discourses might happen and who might get canceled and why and the
# odds... make it look like a betting market but of course no real money is
# involved." There's no real external signal to bet against (that would mean
# actually naming/accusing real people, which this deliberately avoids), so
# the whole market is generated: Mad-Libs discourse-cycle archetypes ("a
# tradwife influencer who found bluesky" x "starts a 40-reply subtweet
# chain") with odds, resolved by a client-side weighted-random draw every
# round. Entirely static — no Worker API, no Durable Object — since the
# "market" has no real-world state to sync.
routes = [
  { pattern = "cancelfutures.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
