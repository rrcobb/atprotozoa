name = "atprotozoa-dobreakthrough"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# norvid-studies.bsky.social asked, in a thread mocking AI-hype "bespoke
# software", for a dashboard of @brennan.computer's last 5000 posts filtered
# down to the ones that read like viable business ideas, each with a
# "DO A BREAKTHROUGH" button that mutates it into "a version that makes more
# money" (explicitly not worrying about legality — read as an invitation to
# be funny about it, not a request for real grift instructions, so the
# mutation is a pure buzzword/funding-stage parody generator, satire in the
# same vein as sites/grindset and sites/griftindex, not anything actionable).
#
# Everything runs client-side (public/index.html + public/lib/idea-scan.js +
# public/lib/breakthrough.js): page app.bsky.feed.getAuthorFeed for
# brennan.computer (public AppView, no auth), score each post's text against
# a hand-tuned "sounds like a business idea" keyword bank, keep the top
# scorers, and render them as cards. No PDS resolution needed — getAuthorFeed
# already returns real post text plus engagement counts in one call per page.
routes = [
  { pattern = "dobreakthrough.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = false
