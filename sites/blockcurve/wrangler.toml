name = "atprotozoa-blockcurve"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Everything runs client-side (public/index.html + public/lib/*.js) EXCEPT the
# OG/share unfurl at /s/<handle>, which needs per-handle og:title/description
# baked in server-side before Bluesky's link-unfurl cache grabs it — same
# reasoning and shape as sites/didscope/src/index.ts.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [{ pattern = "blockcurve.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /s/<handle> is dynamic (personalized OG tags per share),
# so the Worker must run BEFORE the static-asset router, same as sites/logs
# and sites/didscope.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
