name = "atprotozoa-slate38"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# The slate itself is static (see public/index.html). The one dynamic route
# is /endorse/<handle> (src/index.ts): the Worker resolves the handle
# server-side and stamps a personalized og:title/og:description/og:url onto
# the same page shell before handing it back, so every "buildthis endorses
# @you for #bsky38" share gets its own unfurl card instead of one generic
# one for everybody (same pattern as sites/didscope's /s/<handle>).
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes
# (same gotcha called out in buildthis/logs/wrangler.toml).
routes = [{ pattern = "slate38.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /endorse/<handle> is dynamic (personalized OG tags per
# share), so the Worker must run BEFORE the static-asset router.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
