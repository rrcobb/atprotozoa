<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>spudwarren — a rat, a rooftop, a sixth door</title>
<meta name="description" content="A cozy potatopunk farming sim. You're a rat with a rooftop plot, a city full of nonhuman neighbors, and a sixth door in the alley that only opens at night." />
<meta property="og:title" content="spudwarren — a rat, a rooftop, a sixth door" />
<meta property="og:description" content="A cozy potatopunk farming sim. You're a rat with a rooftop plot, a city full of nonhuman neighbors, and a sixth door in the alley that only opens at night." />
<meta property="og:url" content="https://spudwarren.bisks.net/" />
<meta property="og:type" content="website" />
<meta property="og:image" content="https://spudwarren.bisks.net/og.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="spudwarren: a rat silhouette on a rooftop plot of potato sprouts under a lit window and a small sixth door." />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://spudwarren.bisks.net/og.png" />
<style>
  :root {
    --bg: #1d1814; --bg2: #2a221b; --card: #34291f; --edge: #4a3a2a;
    --fg: #f0e2c8; --dim: #a8957a; --rust: #d9733a; --moss: #8fbf5a; --glow: #c8f56b; --violet: #b48cff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg);
    font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; font-size: 15px; }
  body { background: radial-gradient(ellipse at 50% -20%, #4a3320 0%, transparent 60%), var(--bg); }
  body.night { background: radial-gradient(ellipse at 50% -20%, #2a2250 0%, transparent 60%), #120f1c; }
  main { max-width: 760px; margin: 0 auto; padding: 14px 14px 40px; }
  h1 { margin: 6px 0 2px; font-size: 26px; letter-spacing: .5px; }
  h1 span { color: var(--rust); }
  .sub { color: var(--dim); margin: 0 0 12px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; background: var(--card);
    border: 2px solid var(--edge); padding: 8px 12px; border-radius: 6px; }
  .bar b { color: var(--glow); }
  .meter { flex: 1; min-width: 90px; height: 10px; background: #14100c; border: 1px solid var(--edge); border-radius: 5px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--moss); width: 100%; transition: width .2s; }
  nav { display: flex; gap: 6px; margin: 10px 0; flex-wrap: wrap; }
  button, .btn { font: inherit; color: var(--fg); background: var(--bg2); border: 2px solid var(--edge);
    padding: 6px 10px; border-radius: 6px; cursor: pointer; text-decoration: none; display: inline-block; }
  button:hover:not(:disabled), .btn:hover { border-color: var(--rust); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.on { background: var(--rust); color: #1d1814; border-color: var(--rust); }
  button.door { border-color: var(--violet); color: var(--violet); }
  button.door.on { background: var(--violet); color: #120f1c; }
  [hidden] { display: none !important; }
  .panel { background: var(--card); border: 2px solid var(--edge); border-radius: 6px; padding: 12px; margin-bottom: 10px; }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .tile { aspect-ratio: 1; padding: 0; font-size: 26px; line-height: 1; background: #5a4631; border: 2px solid #3d2e1e; border-radius: 4px;
    display: flex; align-items: center; justify-content: center; position: relative; }
  .tile.weedy { background: #43503a; }
  .tile.tilled { background: #2c2017; }
  .tile.wet { background: #1f2a2c; border-color: #3a5d63; }
  .tile.ripe { box-shadow: 0 0 0 2px var(--glow) inset; }
  .tile.moon { box-shadow: 0 0 10px var(--violet); }
  .npc { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 10px; }
  .npc .face { font-size: 38px; }
  .npc .meta { flex: 1; }
  .hearts { color: #e05a6d; letter-spacing: 2px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .say { background: #14100c; border-left: 3px solid var(--rust); padding: 8px 10px; margin: 8px 0 4px; white-space: pre-wrap; }
  .log { min-height: 22px; color: var(--dim); margin: 6px 2px; }
  .night-only { color: var(--violet); }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 4px 6px; border-bottom: 1px solid var(--edge); }
  td:last-child { text-align: right; }
  footer { margin-top: 24px; color: var(--dim); font-size: 13px; }
  footer a { color: var(--dim); }
  .end { text-align: center; border-color: var(--violet); }
</style>
</head>
<body>
<main>
  <h1>spud<span>warren</span></h1>
  <p class="sub" id="tagline">a rat. a rooftop plot. a city of nonhuman neighbors.</p>

  <div class="bar">
    <span id="dayLabel">day 1</span>
    <span id="weather">☀️</span>
    <span>🪙 <b id="coins">0</b></span>
    <span>⚡ <span id="energyNum">0</span></span>
    <div class="meter" title="energy"><i id="energyBar"></i></div>
    <span id="clock"></span>
  </div>

  <nav id="nav">
    <button data-scene="farm" class="on">🥔 rooftop</button>
    <button data-scene="alley">🐀 alley</button>
    <button data-scene="market">🕊️ market</button>
    <button data-scene="door" class="door" id="doorTab" hidden>🚪 the sixth door</button>
    <button id="sleepBtn">😴 sleep</button>
  </nav>

  <div class="log" id="log" aria-live="polite"></div>

  <section id="scene-farm" class="scene">
    <div class="tools" id="tools"></div>
    <div class="grid" id="grid"></div>
    <p class="sub" id="farmHint"></p>
  </section>

  <section id="scene-alley" class="scene" hidden>
    <div id="alleyList"></div>
    <div class="panel" id="alleyExtra"></div>
  </section>

  <section id="scene-market" class="scene" hidden>
    <div class="panel" id="marketPanel"></div>
  </section>

  <section id="scene-door" class="scene" hidden>
    <div class="panel" id="doorPanel"></div>
  </section>

  <section class="panel" id="bagPanel">
    <div id="bag"></div>
  </section>

  <p><button id="shareBtn">📣 share your warren</button> <a class="btn" id="shareLink" target="_blank" rel="noopener">post to bluesky</a>
     <button id="resetBtn">↺ new save</button></p>

  <footer>
    saved in your browser · <a href="https://rateyourbuild.bisks.net/site/spudwarren">rate this on rateyourbuild →</a>
  </footer>
</main>
<script type="module" src="game.js"></script>
</body>
</html>
