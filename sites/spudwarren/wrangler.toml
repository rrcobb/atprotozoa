name = "atprotozoa-spudwarren"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Everything (the farm, the alley, the sixth door) is client-side; the save
# lives in localStorage. The Worker only forwards to static assets.
#
# routes MUST stay above [assets] — keys after a table header join that table.
routes = [{ pattern = "spudwarren.bisks.net/*", zone_name = "bisks.net" }]

[assets]
directory = "./public"
binding = "ASSETS"
