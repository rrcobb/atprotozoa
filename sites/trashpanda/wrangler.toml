name = "atprotozoa-trashpanda"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser. Connects directly to
# Jetstream (wss://jetstream2.us-east.bsky.network/subscribe) and rummages the
# live app.bsky.feed.post stream for anything that reads like "free idea" (and
# its variations — free biz/app/startup idea, "idea for free", etc). No
# server, no backend — a raccoon going through the trash bags in your browser.

routes = [
  { pattern = "trashpanda.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
