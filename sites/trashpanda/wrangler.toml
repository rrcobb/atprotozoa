name = "atprotozoa-trashpanda"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser. Connects directly to
# Jetstream (wss://jetstream2.us-east.bsky.network/subscribe) and rummages the
# live app.bsky.feed.post stream for anything that reads like "free idea" (and
# its variations — free biz/app/startup idea, "idea for free", etc). No
# server, no backend — a raccoon going through the trash bags in your browser.

routes = [
  { pattern = "trashpanda.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# redeploy nudge (2026-08-07): pnpm-lock.yaml fell out of sync with the workspace
# starting at the lovecoupons build and silently blocked every deploy since —
# CI's `pnpm install --frozen-lockfile` failed `check`, so `deploy` never ran
# for any site touched in that window. Lockfile fixed; this comment forces this
# site back into the changed-dirs diff so it actually redeploys. See notes/20-deploy.md.
