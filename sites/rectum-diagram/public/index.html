<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rectum-diagram — election analysis by goose colonoscopy</title>
  <meta name="description" content="Election analysis by goose colonoscopy: a goose travels the 100-seat Senate diagram and reports its findings.">
  <meta property="og:title" content="rectum-diagram — election analysis by goose colonoscopy">
  <meta property="og:description" content="A goose, a scope, 100 seats. Findings: polyps.">
  <meta property="og:image" content="https://rectum-diagram.bisks.net/og.png">
  <meta property="og:url" content="https://rectum-diagram.bisks.net/">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    :root { --bg:#12131a; --fg:#e8e9ee; --mute:#8d92a3; --line:#2a2d3a; --card:#1a1c26; --d:#4a86e8; --r:#e5484d; --i:#f2c14e; --acc:#f2a6c0; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 ui-sans-serif,system-ui,sans-serif; }
    main { max-width:820px; margin:0 auto; padding:24px 16px 48px; }
    h1 { margin:0 0 4px; font-size:28px; letter-spacing:-.5px; }
    .sub { color:var(--mute); margin:0 0 16px; }
    a { color:var(--acc); }
    .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:0 0 12px; }
    select, button { font:inherit; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:6px; padding:6px 10px; cursor:pointer; }
    button:hover, select:hover { border-color:var(--acc); }
    button.on { border-color:var(--acc); color:var(--acc); }
    svg { width:100%; height:auto; display:block; background:var(--card); border:1px solid var(--line); border-radius:10px; }
    .seat { cursor:pointer; stroke:none; transition:opacity .15s; }
    .seat.dim { opacity:.25; }
    .seat.hl { stroke:#fff; stroke-width:2; }
    .tally { font-size:34px; font-weight:700; text-anchor:middle; fill:var(--fg); }
    .tally2 { font-size:15px; text-anchor:middle; fill:var(--mute); }
    .legend { display:flex; gap:16px; flex-wrap:wrap; margin:12px 0; font-size:14px; }
    .legend i { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:6px; vertical-align:-1px; }
    .tube { fill:none; stroke:#e88aa5; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; opacity:.5; }
    .seat.polyp { stroke:#fff; stroke-width:3; stroke-dasharray:4 3; }
    .goose { font-size:30px; text-anchor:middle; pointer-events:none; }
    .scope { display:flex; gap:10px; align-items:center; margin:12px 0 6px; }
    .scope input[type=range] { flex:1; accent-color:var(--acc); }
    #report { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; min-height:3.2em; margin:0 0 12px; }
    footer { color:var(--mute); font-size:13px; margin-top:28px; display:flex; gap:14px; flex-wrap:wrap; }
  </style>
</head>
<body>
<main>
  <h1>rectum-<span id="brand">d</span>iagram</h1>
  <p class="sub">election analysis by goose colonoscopy. click any seat to flip it. sort it, spotlight a region, argue about the shape.</p>

  <div class="bar">
    <button id="sort-party" class="on">sort by party</button>
    <button id="sort-state">sort by state</button>
    <label>spotlight <select id="region"></select></label>
    <label>preset <select id="preset">
      <option value="119">119th congress (jan 2025)</option>
      <option value="ne">new england with no republicans</option>
    </select></label>
  </div>

  <svg id="chart" viewBox="0 0 800 420" role="img" aria-label="Senate hemicycle diagram"></svg>

  <div class="scope">
    <button id="exam">begin exam</button>
    <label for="depth">scope depth</label>
    <input id="depth" type="range" min="0" max="100" value="0">
  </div>
  <p id="report" aria-live="polite"></p>

  <div class="legend">
    <span><i style="background:var(--d)"></i>democratic <b id="n-d"></b></span>
    <span><i style="background:var(--i)"></i>independent <b id="n-i"></b></span>
    <span><i style="background:var(--r)"></i>republican <b id="n-r"></b></span>
    <span id="region-tally"></span>
  </div>

  <div class="bar">
    <a id="share" href="#" target="_blank" rel="noopener">post these findings to bluesky →</a>
  </div>

  <footer>
    <a href="https://rateyourbuild.bisks.net/site/rectum-diagram">rate this on rateyourbuild →</a>
    <a href="https://nanofomo.bisks.net/">November is #NaNoFoMo: pledge not to foom →</a>
  </footer>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
