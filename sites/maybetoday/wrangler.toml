name = "atprotozoa-maybetoday"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A daily "will it happen
# today?" oracle: type the thing you're hoping for, the oracle seeds a
# verdict from today's date + your question, so asking the same thing twice
# in one day gives the same answer — it only changes at midnight.
# lib/oracle.js holds the seeded-hash + verdict-bank logic; index.html is the
# ask/reroll/copy/share UI, same shape as invocation's headline card.
assets = { directory = "./public" }

routes = [{ pattern = "maybetoday.bisks.net", custom_domain = true }]
