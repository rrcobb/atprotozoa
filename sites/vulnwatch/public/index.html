<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>vulnwatch — every new CVE since 20 Oct 2026</title>
<meta name="description" content="A live dashboard of every vulnerability published since 20 October 2026, straight from the NVD: severity, volume, vendors, weakness classes, actively exploited." />
<meta property="og:title" content="vulnwatch — every new CVE since 20 Oct 2026" />
<meta property="og:description" content="A live dashboard of every vulnerability published since 20 October 2026, straight from the NVD." />
<meta property="og:url" content="https://vulnwatch.bisks.net/" />
<meta property="og:type" content="website" />
<meta property="og:image" content="https://vulnwatch.bisks.net/og.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://vulnwatch.bisks.net/og.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <h1>vuln<span>watch</span></h1>
  <p class="sub">every CVE published since <b>20 Oct 2026</b>, live from the NVD</p>
  <div class="bar"><button id="refresh" type="button">refresh</button><span id="status">loading…</span></div>
</header>

<main>
  <div id="error" class="error" hidden></div>

  <section class="tiles" id="tiles"></section>

  <section class="grid">
    <div class="card"><h2>severity</h2><div id="sev"></div></div>
    <div class="card"><h2>published per day</h2><div id="days"></div></div>
    <div class="card"><h2>loudest vendors</h2><div id="vendors"></div></div>
    <div class="card"><h2>weakness classes</h2><div id="cwes"></div></div>
  </section>

  <section class="card feedcard">
    <h2>the feed <span id="count"></span></h2>
    <div class="filters">
      <input id="q" type="search" placeholder="search id, vendor, description…" autocomplete="off" />
      <select id="fsev">
        <option value="">any severity</option>
        <option>CRITICAL</option><option>HIGH</option><option>MEDIUM</option><option>LOW</option><option value="NONE">unscored</option>
      </select>
      <select id="sort">
        <option value="score">worst first</option>
        <option value="new">newest first</option>
      </select>
      <label><input id="kev" type="checkbox" /> exploited in the wild only</label>
    </div>
    <ul id="feed"></ul>
    <button id="more" type="button" hidden>show more</button>
  </section>
</main>

<footer>
  <a id="share" href="#" target="_blank" rel="noopener">post the numbers to bluesky</a> ·
  <a href="https://rateyourbuild.bisks.net/site/vulnwatch">rate this on rateyourbuild →</a> ·
  data: <a href="https://nvd.nist.gov/">NVD</a>; scores are the NVD's or its CNAs' own.
</footer>
<script type="module" src="app.js"></script>
</body>
</html>
