name = "atprotozoa-popmoot"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A big sheet of bubble
# wrap. Pop it. No server, no atproto calls, no build step. Requested as
# "something simple and fun, be creative" — this is about as simple and fun
# as it gets.
main = "src/index.ts"

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# popmoot.bisks.net is being retired to free a slot against the zone's
# custom-domain cap (see notes/20-deploy.md). Migrated to bisks.net/popmoot
# instead. See notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "popmoot.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/popmoot", zone_name = "bisks.net" },
  { pattern = "bisks.net/popmoot/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
