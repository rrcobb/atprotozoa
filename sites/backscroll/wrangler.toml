name = "atprotozoa-backscroll"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @cee.wtf: "a page that shows posts from my moots, but from oldest all-time
# to newest." Enter a handle, we compute your moots (mutual follows, same
# public-AppView graph walk as sites/mootpocalypse's lib/moots.js), then walk
# every moot's app.bsky.feed.getAuthorFeed all the way back to its last page
# — the oldest posts each of them has that the AppView still serves — and
# merge everyone's history into one chronological scroll starting at the very
# beginning. No OAuth: the whole thing is public reads, same as
# sites/feedwalk/sites/westmoot. See public/lib/backscroll.js.

routes = [
  { pattern = "backscroll.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
