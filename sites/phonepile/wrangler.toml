# sites/phonepile/wrangler.toml
#
# Pure static site — everything runs in the browser. A pile of real
# rigid-body boxes (cannon-es), one sized to the true dimensions of every
# major phone from the original 2007 iPhone onward, rendered with three.js.
# Click-drag to grab a phone and throw it around; the pile settles under
# gravity like the real objects would.
name = "atprotozoa-phonepile"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [
  { pattern = "phonepile.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
