name = "atprotozoa-commonplace"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# OAuth site — canonical host must match client-metadata.json's client_id
# exactly, so this claims a plain hostname route (not a path) and nothing
# else. See notes/40-new-site-playbook.md ("Subdomains again").
routes = [
  { pattern = "commonplace.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
