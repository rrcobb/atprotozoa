<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#c15b3f" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

<meta property="og:type" content="website" />
<meta property="og:title" content="{{TITLE}}" />
<meta property="og:description" content="{{DESCRIPTION}}" />
<meta property="og:image" content="https://commonplace.bisks.net/og.png" />
<meta property="og:url" content="{{URL}}" />
<meta name="twitter:card" content="summary_large_image" />

<style>
  :root {
    --paper: #f6f1e6; --paper-dim: #ece3d2; --ink: #2b2420; --ink-dim: #6b5e50;
    --rust: #c15b3f; --card: #fffaf0; --border: #ddccae;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); line-height: 1.6; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 1.5rem 1.1rem 3rem; }
  a.back { font-size: 0.85rem; color: var(--ink-dim); text-decoration: none; }
  h1 { font-family: var(--serif); font-size: 1.7rem; margin: 1rem 0 0.2rem; }
  .sub { color: var(--ink-dim); font-size: 0.9rem; margin-bottom: 1.2rem; }
  .doclist { display: flex; flex-direction: column; gap: 0.5rem; }
  .docrow { display: flex; justify-content: space-between; gap: 0.6rem; padding: 0.6rem 0.8rem; border: 1px solid var(--border); border-radius: 10px; background: var(--card); text-decoration: none; color: var(--ink); }
  .docrow .dtitle { font-family: var(--serif); }
  .docrow .ddate { color: var(--ink-dim); font-size: 0.78rem; white-space: nowrap; }
  .empty { color: var(--ink-dim); font-style: italic; }
  footer { text-align: center; color: var(--ink-dim); font-size: 0.78rem; margin-top: 2rem; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="https://commonplace.bisks.net/">← commonplace</a>
  <h1>{{TITLE}}</h1>
  <div class="sub">{{DESCRIPTION}}</div>
  <div class="doclist">{{DOCLIST_HTML}}</div>
  <footer>written with commonplace, a tiny standard.site editor on bisks.net</footer>
</div>
</body>
</html>
