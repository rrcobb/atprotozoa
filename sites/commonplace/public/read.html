<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}} — commonplace</title>
<meta name="description" content="{{DESCRIPTION}}" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#c15b3f" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

<meta property="og:type" content="article" />
<meta property="og:title" content="{{TITLE}}" />
<meta property="og:description" content="{{DESCRIPTION}}" />
<meta property="og:image" content="{{OG_IMAGE}}" />
<meta property="og:url" content="{{URL}}" />
<meta name="twitter:card" content="summary_large_image" />

<style>
  :root {
    --paper: #f6f1e6; --paper-dim: #ece3d2; --ink: #2b2420; --ink-dim: #6b5e50;
    --rust: #c15b3f; --rust-dark: #9a4530; --card: #fffaf0; --border: #ddccae;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); line-height: 1.6; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 1.5rem 1.1rem 3rem; }
  a.back { font-size: 0.85rem; color: var(--ink-dim); text-decoration: none; }
  a.back:hover { text-decoration: underline; }
  article { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.4rem; margin-top: 1rem; }
  h1 { font-family: var(--serif); font-size: 1.9rem; margin: 0 0 0.3rem; }
  .meta { color: var(--ink-dim); font-size: 0.85rem; margin-bottom: 1rem; }
  .meta a { color: var(--ink-dim); }
  .cover { width: 100%; max-height: 22rem; object-fit: cover; border-radius: 10px; margin-bottom: 1rem; }
  .body { font-size: 1.08rem; white-space: pre-wrap; }
  .tags { margin-top: 1.2rem; display: flex; flex-wrap: wrap; gap: 0.3rem; }
  .tag-chip { font-family: var(--mono); font-size: 0.74rem; background: var(--paper-dim); border: 1px solid var(--border); border-radius: 999px; padding: 0.15rem 0.6rem; color: var(--ink-dim); }
  .pub-note { margin-top: 1.5rem; padding-top: 0.9rem; border-top: 1px dashed var(--border); font-size: 0.85rem; color: var(--ink-dim); }
  footer { text-align: center; color: var(--ink-dim); font-size: 0.78rem; margin-top: 2rem; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="https://commonplace.bisks.net/">← commonplace</a>
  <article>
    {{COVER_HTML}}
    <h1>{{TITLE}}</h1>
    <div class="meta">by <a href="https://bsky.app/profile/{{HANDLE}}" target="_blank" rel="noopener">@{{HANDLE}}</a> · {{DATE}}</div>
    <div class="body">{{BODY_HTML}}</div>
    <div class="tags">{{TAGS_HTML}}</div>
    <div class="pub-note">{{PUB_NOTE_HTML}}</div>
  </article>
  <footer>written with commonplace, a tiny standard.site editor on bisks.net</footer>
</div>
</body>
</html>
