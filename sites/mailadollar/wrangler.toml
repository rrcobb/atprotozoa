name = "atprotozoa-mailadollar"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site with one dynamic route. Type an author's name: the client
# hits the public AppView (app.bsky.actor.searchActors, CORS *, no auth) to
# see if they're on Bluesky, scans their bio for a tip link (paypal.me,
# venmo, cash.app, ko-fi, buymeacoffee, patreon), and falls back to prebuilt
# web-search links plus a printable "mail an actual dollar" IOU card
# (generated client-side on <canvas>, no payment processing anywhere).
#
# /s/<name> is a server-rendered unfurl (same recipe as sites/didscope) so a
# shared search gets its own og:title instead of one generic card for every
# link — see src/index.ts.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [
  { pattern = "bisks.net/mailadollar", zone_name = "bisks.net" },
  { pattern = "bisks.net/mailadollar/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
