name = "atprotozoa-recant"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @dulanyw.bsky.social tagged the bot after the NYT story on Tristan
# Buckmaster's Navier-Stokes claims, where OpenAI said it was "categorically"
# impossible for its model to have been influenced by anything Buckmaster had
# done — a lot of people had already assumed OpenAI was in the wrong. The ask:
# a form for anyone who jumped to that conclusion to publicly recant.
#
# Same shape as sites/duohaunt: net.bisks.recant.apology records are written
# by the browser straight to the *author's own* PDS (see
# notes/50-oauth-scopes.md's minimal-scope rule — this site's OAuth scope is
# just repo:net.bisks.recant.apology?action=create, nothing else). The public
# wall of everyone's apologies is rebuilt entirely client-side in
# public/lib/global-wall.js: com.atproto.sync.listReposByCollection finds
# every repo that's ever written one, then one com.atproto.sync.getRepo CAR
# download per repo pulls that repo's whole apology history (bulk read, not a
# paginated listRecords walk — 2026-08-25 standing order in
# sites/buildthis/builder/INSTRUCTIONS.md), topped up live by a
# wss://jetstream subscription. No backend of recant's own, no KV, no DO.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [
  { pattern = "recant.bisks.net/*", zone_name = "bisks.net" },
]

# /a/<did>/<rkey> (src/index.ts) is dynamic — a per-apology unfurl page with
# personalized og:title/og:description/og:url, same recipe as sites/didscope's
# /s/<handle> — so run_worker_first is needed for that route to see the
# request before the static-asset router would otherwise serve index.html for
# every path.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true
