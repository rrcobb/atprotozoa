name = "atprotozoa-mootkombat"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Enter a Bluesky handle
# (or pass ?h=): it reads the public AppView anonymously (resolveHandle,
# getProfile, getFollows, getFollowers, getProfiles, getAuthorFeed — all
# CORS *, no auth) to build a "moot ladder" — your moots (mutuals) sorted by
# follower count, smallest first, your biggest moot last as the final boss
# (the picks are randomized within each difficulty bucket, so the lineup
# varies run to run). Fight your way up the ladder in a Smash-style canvas
# fighter: floating stage + platforms, double jump, dash (arrow keys/WASD to
# move, W/Space to jump, Shift to dash, J punch, K kick, hold L to block).
# Hits deal percent damage and knockback that scales with it — enough percent
# and a hit sends you flying clean off the stage's blast zones for the KO.
# Each opponent's difficulty is log-scaled from their followers vs yours and
# wears their own avatar as their head. Every bout opens with a taunt: the
# moot's own highest-liked bisk. Lose a bout and you get exactly one retry
# against that moot; lose the retry and the run ends. lib/moots.js is
# copied+trimmed from thunderdome/lib/thunderdome.js and moot-bingo/lib/moots.js,
# with immortals/immortal.js's getProfiles followersCount backfill folded in
# (copy, don't abstract).
main = "src/index.ts"

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# mootkombat.bisks.net is being retired to free a slot against the zone's
# custom-domain cap (see notes/20-deploy.md). Migrated to bisks.net/games/mootkombat
# as part of the new games/ cluster. See notes/40-new-site-playbook.md
# ("Why paths, not subdomains").
routes = [
  { pattern = "mootkombat.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/games/mootkombat", zone_name = "bisks.net" },
  { pattern = "bisks.net/games/mootkombat/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
