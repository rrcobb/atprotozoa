name = "atprotozoa-mootkombat"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Enter a Bluesky handle
# (or pass ?h=): it reads the public AppView anonymously (resolveHandle,
# getProfile, getFollows, getFollowers, getProfiles, getAuthorFeed — all
# CORS *, no auth) to build a "moot ladder" — your moots (mutuals) sorted by
# follower count, smallest first, your biggest moot last as the final boss.
# Fight your way up the ladder, stick figure vs stick figure, in a canvas
# fighter (arrow keys/WASD to move, J punch, K kick, hold L to block). Each
# opponent's difficulty is log-scaled from their followers vs yours. Every
# bout opens with a taunt: the moot's own highest-liked skeet. Lose a bout
# and you get exactly one retry against that moot; lose the retry and the
# run ends. lib/moots.js is copied+trimmed from thunderdome/lib/thunderdome.js
# and moot-bingo/lib/moots.js, with immortals/immortal.js's getProfiles
# followersCount backfill folded in (copy, don't abstract).
assets = { directory = "./public" }

routes = [{ pattern = "mootkombat.bisks.net", custom_domain = true }]
