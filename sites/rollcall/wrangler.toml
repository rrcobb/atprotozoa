name = "atprotozoa-rollcall"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser. Paste a Bluesky list
# link: pulls the list curator's repo as one CAR (com.atproto.sync.getRepo,
# see public/lib/car.js) to get every listitem in one request instead of
# paginating app.bsky.graph.getList, then for each member DID resolves its
# DID document (plc.directory / did:web well-known) for the current handle,
# checks hosting status via the relay's com.atproto.sync.getRepoStatus, and
# batches profile text/avatar via app.bsky.actor.getProfiles (25 at a time).
# Produces a table: DID, handle, status (live/removed/suspended/taken
# down/deactivated), bio + avatar when available. Forked from
# sites/listcheck (copy, don't abstract) for the handle-resolution shell.

routes = [
  { pattern = "rollcall.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
