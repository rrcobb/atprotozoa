name = "atprotozoa-botwasteland"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Reads Bluesky's public
# AppView (resolveHandle / getFollows / getFollowers / getProfiles, all
# anonymous, CORS *) to build a handle's SimCluster (self + moots, via
# lib/cluster.js — copied from sites/simcluster-levels/public/lib/cluster.js,
# copy don't abstract), then recasts every real person in it as a "bot" with
# a made-up DID and a made-up PDS hostname (.invalid TLD — never resolves,
# never could be mistaken for real) and lets a generated feed run forever in
# the browser tab. No account is created, no credential is touched, nothing
# is ever posted anywhere — see the disclaimer banner in index.html. This is
# the closest honest version of "give every bot in the cluster its own real
# account through its own PDS": that ask needs a secret per bot, which
# builder/INSTRUCTIONS.md forbids the builder from ever holding.

routes = [
  { pattern = "botwasteland.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
