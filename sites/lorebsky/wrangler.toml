# Everything runs client-side (public/index.html): it reads one thread from
# Bluesky's public AppView (getPostThread, anonymous, CORS *) and renders it
# like a lore.kernel.org mailing-list archive page. The Worker only forwards
# to the static assets.
name = "atprotozoa-lorebsky"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [{ pattern = "lorebsky.bisks.net/*", zone_name = "bisks.net" }]

[assets]
directory = "./public"
binding = "ASSETS"
