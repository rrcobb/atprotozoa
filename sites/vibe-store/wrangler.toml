name = "atprotozoa-vibe-store"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Path route on the shared zone, not a dedicated custom domain — the zone hit
# a Cloudflare custom-domain cap (see notes/20-deploy.md and
# notes/40-new-site-playbook.md). Two entries: the bare path (no trailing
# slash) and everything under it.
routes = [
  { pattern = "bisks.net/vibe-store", zone_name = "bisks.net" },
  { pattern = "bisks.net/vibe-store/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
