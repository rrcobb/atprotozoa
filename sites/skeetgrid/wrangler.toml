name = "atprotozoa-skeetgrid"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Path-mounted at bisks.net/skeetgrid — new sites default to a path route on
# the shared zone, not a dedicated custom domain (the zone hit a Cloudflare
# custom-domain cap; see notes/20-deploy.md and notes/40-new-site-playbook.md,
# "Why paths, not subdomains"). routes MUST stay above [assets] — in TOML,
# keys after a table header join that table, so a routes line below [assets]
# silently becomes assets.routes (same gotcha called out in
# buildthis/logs/wrangler.toml).
routes = [
  { pattern = "bisks.net/skeetgrid", zone_name = "bisks.net" },
  { pattern = "bisks.net/skeetgrid/*", zone_name = "bisks.net" },
]

# run_worker_first: /skeetgrid/s/<handle> is dynamic (personalized OG tags
# per share), and every request needs the "/skeetgrid" mount prefix stripped
# before it reaches the ASSETS binding.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
