name = "atprotozoa-hashdo"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser, state lives in
# localStorage. A todo list where every item gets a small "optimistic" hash
# the moment it's created: try a 2-hex-char id, and only grow it a character
# at a time if that id collides with one already in the list. Subtasks
# reference their parent by typing `parent:[hash]` (or `parent:hash`) inside
# the todo text — the app strips the token out and threads the item under
# its parent. @jazzkid.xyz's idea, approved by @bisks.net.
assets = { directory = "./public" }

routes = [{ pattern = "hashdo.bisks.net/*", zone_name = "bisks.net" }]
