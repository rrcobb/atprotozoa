name = "atprotozoa-allophones"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @words.bsky.social asked (replying in a thread about mino.mobi/sharp, which
# mints single-syllable English words) for a "comprehensive list of every
# possible syllable" assigned a meaning, covering "all possible points of
# articulation and resonance chambers," as a clickable playable chart. That's
# a combinatorial space (11 places x 8 manners x voicing, crossed with a full
# vowel trapezoid, crossed with an optional coda) too large to hand-write a
# dictionary for, so meanings are generated from a syllable's own phonetic
# features (place/manner/voicing/height/backness/rounding/nasalization) —
# comprehensive by construction, not by enumeration. All client-side; no
# state, no API calls, nothing dynamic for a Worker to do.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
routes = [
  { pattern = "allophones.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
