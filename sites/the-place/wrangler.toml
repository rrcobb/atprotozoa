name = "atprotozoa-the-place"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @minormobius.bsky.social's idea, tagged by @norvid-studies.bsky.social: "a
# bot that makes one website a day but it's like The Place and everybody's
# prompts make changes to the one big site for that day." This IS that site —
# a shared r/place-style pixel canvas. One canvas, shared by everyone who loads
# the page, no login. It resets at 00:00 UTC; the finished grid is archived so
# yesterday's (and every past day's) canvas stays viewable at /?day=YYYY-MM-DD.
#
# The canvas lives in a single Durable Object instance (name "global") holding
# the pixel grid + per-day archive in its transactional storage — the one bit
# of shared, durable, single-writer state this idea needs. Everything else
# (palette, countdown, share card) is client-side in public/index.html.
#
# Path route on the shared bisks.net zone, not a dedicated custom domain —
# the-place.bisks.net never provisioned (the zone hit Cloudflare's custom-domain
# cap, see notes/20-deploy.md), so it's mounted at bisks.net/the-place. The
# Worker strips the /the-place prefix before routing to the DO / ASSETS (see
# src/index.ts).
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes
# (same gotcha called out in sites/logs and sites/didscope).
routes = [
  { pattern = "bisks.net/the-place", zone_name = "bisks.net" },
  { pattern = "bisks.net/the-place/*", zone_name = "bisks.net" },
]

# The Worker runs first for everything now: it must strip the /the-place mount
# prefix before the asset router (which has no idea it isn't at the domain root)
# ever sees the request. (Was run_worker_first = ["/", "/api/*"] on the old
# subdomain; those root-relative patterns don't match the mounted paths.)
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "CANVAS"
class_name = "Canvas"

# new_sqlite_classes, not new_classes: the legacy KV-backed DO storage needs
# Workers Paid; SQLite-backed DOs are the free-plan-compatible option, and this
# account is on Free. Using new_classes here is why this site's first deploy
# failed silently (script + route never got created, so the custom domain
# never resolved). Same fix applied to sites/ratioed and sites/mootrider.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Canvas"]
