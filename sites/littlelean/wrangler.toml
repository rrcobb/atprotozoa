name = "atprotozoa-littlelean"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# A tiny Lean 4 subset, interpreted in the browser (public/lib/lean.js).
# Nothing server-side: the Worker only forwards to static assets.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
routes = [
  { pattern = "littlelean.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
