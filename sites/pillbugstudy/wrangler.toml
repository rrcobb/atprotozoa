name = "atprotozoa-pillbugstudy"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @isolyth.dev asked for a keyhole peek into their own study: they're a
# giant pillbug hunched over a desk, crying about their sins (their real
# posts, fetched from the AppView). Quote-posted their earlier "beat up a
# buddy" ask as context, but this is its own site — nobody's swinging
# anything, they're just watching themselves cry. Brand-new site, served at
# the root of its own hostname: no bisks.net/<name> path route needed.
routes = [
  { pattern = "pillbugstudy.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
