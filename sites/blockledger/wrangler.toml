name = "atprotozoa-blockledger"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Everything real runs client-side (public/index.html + public/lib/*.js).
# The Worker's only job is /s/<handle> — a distinct, shareable per-result URL
# (see notes/45-sharing-and-virality.md tier 4) whose og:title/description
# carry the already-computed edge count instead of recomputing it server-side.
# A real crawl here means one PDS listRecords fetch per mutual, which is far
# too slow for an unfurl bot's timeout — same reasoning as sites/metamoots.
routes = [{ pattern = "blockledger.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /s/<handle> is dynamic, so the Worker must run before the
# static-asset router, same as sites/didscope and sites/metamoots.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
