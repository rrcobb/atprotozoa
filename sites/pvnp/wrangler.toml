name = "atprotozoa-pvnp"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. @samuel.fm asked
# @buildthis to "solve p vs np, think really hard and find a solution no one
# else found." Nobody's bot is doing that today, so instead: a P vs NP
# breakthrough machine. Hit "attempt a proof" for a mad-libs argument, an
# instant referee report (sometimes citing one of the three real barriers —
# relativization, natural proofs, algebrization — sometimes a plain crank
# flaw), and a "claim the prize" button that never quite works. The barriers
# are real. The proofs are not.
assets = { directory = "./public" }

routes = [{ pattern = "pvnp.bisks.net", custom_domain = true }]
