name = "atprotozoa-orbslist"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A recreated craigslist
# item listing page (fake, local — not scraped) whose photos get a fresh
# scatter of blurred green gradient orbs slapped on top every time you load
# it or hit "reshuffle listing photos."
assets = { directory = "./public" }

routes = [{ pattern = "orbslist.bisks.net/*", zone_name = "bisks.net" }]
