name = "atprotozoa-trigrams"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# The Worker: redirects / -> /firehose, serves public/ via ASSETS, and hosts
# /api/search (an authenticated searchPosts proxy — see src/index.ts and
# notes/71). Everything else in /rich and /firehose runs in the browser.
assets = { directory = "./public", binding = "ASSETS" }

# routes MUST stay above [vars] — in TOML, keys after a table header join that
# table, so a routes line below [vars] silently becomes vars.routes.
routes = [{ pattern = "trigrams.bisks.net/*", zone_name = "bisks.net" }]

[vars]
# The buildthis bot's DID, used as the createSession identifier for the search
# proxy (reusing that bot's app-password). Stable across handle changes.
BOT_IDENTIFIER = "did:plc:wlj4p2kazhifag6w4nanjnee"

# Secret (set with `wrangler secret put`, never in this file):
#   BOT_APP_PASSWORD -> the buildthis bot's app-password (createSession).

# Pending trebuchet strikes, keyed by target DID — /launcher checks this on
# login so a struck poster sees the crash-in animation next time they sign
# in. Deliberately no `id =`: this builder has no Cloudflare credentials to
# run `wrangler kv namespace create` by hand, but modern Wrangler
# (--x-provision/--x-auto-create, both default true) auto-provisions a draft
# binding like this on the first real `wrangler deploy` using CI's
# CLOUDFLARE_API_TOKEN, then writes the real id back into this file. See
# sites/griftmax/wrangler.toml for the same pattern working already.
[[kv_namespaces]]
binding = "STRIKES"
