<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rich — trigrams — bisks.net</title>
    <!-- bisks.net "specimen sheet" identity: bone paper, oxblood ink, one
         vermilion accent, mono display + a serif only for quoted post text.
         Cards are catalog specimens, not mino's rounded green pills. -->
    <style>
      :root {
        --paper: #efe9dd;      /* warm bone */
        --paper2: #e7dfcf;     /* slightly deeper for specimen fill */
        --ink: #1c1712;        /* near-black, warm */
        --muted: #6f6455;      /* aged ink */
        --faint: #b3a892;      /* rule lines / hairlines */
        --accent: #d1402a;     /* vermilion */
        --accent-ink: #8f2417; /* darker accent for text on paper */
        --err: #8f2417;
      }
      * { box-sizing: border-box; }
      html { background: var(--paper); }
      body {
        margin: 0;
        color: var(--ink);
        background:
          /* faint horizontal ledger rule + paper grain */
          repeating-linear-gradient(
            to bottom, transparent 0, transparent 27px,
            rgba(120, 96, 60, 0.05) 27px, rgba(120, 96, 60, 0.05) 28px
          ),
          var(--paper);
        font-family: "Courier New", ui-monospace, Menlo, monospace;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      .wrap { max-width: 660px; margin: 0 auto; padding: 2.75rem 1.25rem 6rem; }

      /* Masthead: a catalog header with a heavy rule under it. */
      header {
        border-bottom: 2px solid var(--ink);
        padding-bottom: 0.6rem;
        margin-bottom: 0.4rem;
        display: flex; align-items: flex-end; justify-content: space-between;
        gap: 1rem; flex-wrap: wrap;
      }
      h1 {
        font-family: "Courier New", ui-monospace, monospace;
        font-weight: 700; font-size: 1.35rem; letter-spacing: -0.01em;
        margin: 0; text-transform: uppercase;
      }
      h1 a { color: inherit; text-decoration: none; }
      h1 .slash { color: var(--accent); }
      .who {
        font-size: 0.72rem; color: var(--muted); letter-spacing: 0.02em;
        text-transform: uppercase;
      }
      .who a { color: var(--accent-ink); }
      .intro {
        color: var(--muted); margin: 0.9rem 0 1.6rem; font-size: 0.9rem;
        max-width: 52ch;
      }
      .intro b { color: var(--ink); font-weight: 700; }

      /* Query bar: a form line with a hairline underline, terminal feel. */
      .bar {
        display: flex; gap: 0; align-items: stretch; flex-wrap: wrap;
        margin-bottom: 2rem; border: 1.5px solid var(--ink);
        max-width: 30rem;
      }
      input[type="text"] {
        font-family: inherit; font-size: 0.95rem; letter-spacing: 0.01em;
        padding: 0.6rem 0.7rem; border: none; background: transparent;
        color: var(--ink); flex: 1; min-width: 8rem; outline: none;
      }
      input[type="text"]::placeholder { color: var(--faint); }
      button {
        font-family: inherit; font-size: 0.78rem; font-weight: 700;
        letter-spacing: 0.06em; text-transform: uppercase;
        padding: 0.6rem 1rem; border: none; border-left: 1.5px solid var(--ink);
        background: var(--accent); color: var(--paper); cursor: pointer;
      }
      button:hover { background: var(--accent-ink); }
      button:disabled { opacity: 0.45; cursor: default; }
      .status {
        font-size: 0.74rem; color: var(--muted); letter-spacing: 0.01em;
        margin-top: 0.5rem; width: 100%;
      }

      /* Specimen cards: thin full frame, catalog number in the corner, the
         trigram as the specimen label, the post as the collection note. */
      .card {
        position: relative;
        border: 1.5px solid var(--ink);
        background: var(--paper2);
        padding: 1.15rem 1.25rem 1rem;
        margin-bottom: 1.15rem;
        animation: rise 0.3s ease both;
        box-shadow: 3px 3px 0 rgba(28, 23, 18, 0.12);
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: none; }
      }
      .card h2 {
        font-family: "Courier New", ui-monospace, monospace;
        font-size: 1.2rem; font-weight: 700; line-height: 1.25;
        margin: 0 0 0.6rem; word-break: break-word; letter-spacing: -0.01em;
      }
      .card h2 .tag {
        display: block; margin-top: 0.35rem;
        font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase;
        color: var(--accent-ink); font-weight: 700;
      }
      /* the quoted post — the ONE place a serif appears, as a collection note */
      .card .body {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 0.98rem; line-height: 1.5;
        color: var(--muted); margin: 0 0 0.75rem; word-break: break-word;
        padding-left: 0.85rem; border-left: 2px solid var(--faint);
      }
      .card .body b { color: var(--ink); font-weight: 700; }
      .card a.perma {
        font-size: 0.72rem; letter-spacing: 0.03em; text-transform: uppercase;
        color: var(--accent-ink); text-decoration: none; font-weight: 700;
      }
      .card a.perma:hover { color: var(--accent); }

      .err { color: var(--err); font-weight: 700; }
      footer {
        margin-top: 3rem; padding-top: 0.6rem; border-top: 1px solid var(--faint);
        color: var(--muted); font-size: 0.72rem; letter-spacing: 0.02em;
      }
      footer a { color: var(--accent-ink); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1><a href="/firehose/">trigrams</a> <span class="slash">/</span> rich</h1>
        <span class="who" id="who"></span>
      </header>
      <p class="intro">
        The three-word phrases someone used <b>exactly once</b> that <b>no one
        else on Bluesky has ever posted</b> — hapax legomena, little fingerprints
        that are theirs alone. Type any handle.
      </p>

      <div id="app"></div>

      <footer>
        method cribbed with thanks from
        <a href="https://github.com/minormobius/agent01">mino.mobi</a> ·
        <a href="https://bisks.net">bisks.net</a>
      </footer>
    </div>

    <script type="module">
      import {
        scan,
        verify,
        resolveActorFull,
        richness,
        surprise,
      } from "../lib/unique.js";

      const app = document.getElementById("app");
      const who = document.getElementById("who");

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, (c) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );
      }
      function highlight(text, phrase) {
        const escaped = escapeHtml(text);
        const sep = "[^\\p{L}\\p{N}']+";
        const pat = phrase
          .split(" ")
          .map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"))
          .join(sep);
        try {
          return escaped.replace(new RegExp("(" + pat + ")", "iu"), "<b>$1</b>");
        } catch {
          return escaped;
        }
      }
      const postUrl = (did, uri) =>
        `https://bsky.app/profile/${did}/post/${uri.split("/").pop()}`;

      // Open read — no login. Type any handle, see their rich trigrams.
      function startView(prefill, msg) {
        app.innerHTML = `
          ${msg ? `<p class="err">${escapeHtml(msg)}</p>` : ""}
          <div class="bar">
            <input id="handle" type="text" placeholder="a bluesky handle"
                   value="${escapeHtml(prefill || "")}" style="max-width:16rem" />
            <button id="go">find rich trigrams</button>
            <span class="status" id="status"></span>
          </div>
          <div id="results"></div>`;
        const input = document.getElementById("handle");
        const go = () => {
          const handle = input.value.trim();
          if (handle) run(handle);
        };
        document.getElementById("go").onclick = go;
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") go();
        });
      }

      async function run(handleInput) {
        const btn = document.getElementById("go");
        const status = document.getElementById("status");
        const results = document.getElementById("results");
        btn.disabled = true;
        results.innerHTML = "";

        status.textContent = "resolving…";
        let actor;
        try {
          actor = await resolveActorFull(handleInput);
          who.textContent = `@${actor.handle}`;
        } catch (e) {
          status.innerHTML = `<span class="err">${escapeHtml(e.message)}</span>`;
          btn.disabled = false;
          return;
        }

        status.textContent = "scanning posts…";
        let scanRes;
        try {
          scanRes = await scan(actor, {
            mode: "trigram",
            onPage: (p, posts) => (status.textContent = `scanning… ${posts} posts, page ${p}`),
          });
        } catch (e) {
          status.innerHTML = `<span class="err">scan failed: ${escapeHtml(e.message)}</span>`;
          btn.disabled = false;
          return;
        }

        // Only bother verifying candidates that pass the taste filter — this both
        // shrinks the search budget and means every verified hit is show-worthy.
        const cands = scanRes.candidates.filter((c) => richness(c.g) >= 0);
        status.textContent =
          `${scanRes.posts} posts · ${cands.length} candidate trigrams (used once, passed filter) · verifying against the network…`;

        // Collect verified uniques (dedup near-dup slices of one post).
        const byPost = new Map();
        let checked = 0;
        await verify(actor, cands, {
          onVerdict: (v) => {
            checked++;
            if (v.status === "unique" && v.mine && !byPost.has(v.post.uri)) {
              byPost.set(v.post.uri, v);
            }
            status.textContent =
              `checked ${checked}/${cands.length} · ${byPost.size} unique trigram${byPost.size === 1 ? "" : "s"} found`;
          },
        });

        const uniques = [...byPost.values()];
        if (uniques.length === 0) {
          status.textContent = `done · no globally-unique trigrams this pass.`;
          results.innerHTML =
            `<p class="status">nothing surfaced. try again — the search index can be incomplete.</p>`;
          btn.disabled = false;
          return;
        }

        // Rank by SURPRISE: a unique trigram made of COMMON parts is the good kind.
        // 2 more searches per survivor (its component bigrams) — cheap, few of them.
        let scored = 0;
        const ranked = [];
        for (const v of uniques) {
          const s = await surprise(v.g);
          ranked.push({ v, s: s.score });
          scored++;
          status.textContent = `scoring surprise… ${scored}/${uniques.length}`;
        }
        ranked.sort((a, b) => b.s - a.s);

        results.innerHTML = "";
        for (const { v, s } of ranked) renderCard(results, v, s);

        status.textContent =
          `done · ${ranked.length} unique trigram${ranked.length === 1 ? "" : "s"}, ranked by surprise` +
          (scanRes.scannedAll ? "" : " · (hit the post-scan cap; older posts not scanned)");
        btn.disabled = false;
      }

      function renderCard(container, v, surpriseScore) {
        const card = document.createElement("article");
        card.className = "card";
        const post = v.post;
        const tag =
          surpriseScore != null
            ? `3-gram · surprise ${surpriseScore.toFixed(1)}`
            : "3-gram · yours alone";
        card.innerHTML =
          `<h2>${escapeHtml(v.g)} <span class="tag">${tag}</span></h2>` +
          `<p class="body">${highlight(post.text, v.g)}</p>` +
          `<a class="perma" href="${postUrl(post.did, post.uri)}" target="_blank" rel="noopener">see the one post →</a>`;
        container.appendChild(card);
      }

      // Allow ?handle=foo.bsky.social to deep-link a scan; default to bisks.net.
      const preset = new URLSearchParams(location.search).get("handle");
      startView(preset || "bisks.net");
      if (preset) run(preset);
    </script>
  </body>
</html>
