name = "atprotozoa-overcommit"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Live Jetstream v2 firehose, turned into a Tony-Hawk-style skate combo meter —
# every real post is a "trick" bolted onto the current chain, chain length
# drives the multiplier, and a genuine rate spike in the firehose (same
# rolling-z trick sites/kolpelor uses) lands the run's biggest combo. Pure
# client-side WebSocket (public/app.js); the Worker here only exists to serve
# the static shell. Built for @cee.wtf, who asked for "the coding agent AI
# equivalent of an indy nosebone 50/50 fs rail grind" — a trick you can't
# actually land (you can't grab mid-grind), so the build is the maximalist
# version: stack every flashy thing (live ingestion, procedural combo names,
# scoring, spike detection, share cards) into one showoff run.
routes = [{ pattern = "overcommit.bisks.net/*", zone_name = "bisks.net" }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
