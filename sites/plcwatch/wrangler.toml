name = "atprotozoa-plcwatch"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Daily-slot build (2026-09-08, no specific requester) — the "PLC audit log
# watcher" idea from notes/ideas/bot-ideas-riff.md ("free, public, nobody's
# watching it. Who migrated PDS, who rotated keys, who changed handles.").
# Built as a page rather than a cron/bot: plc.directory's own export endpoint
# (https://plc.directory/export) is CORS-open and free, so the whole thing
# runs client-side (public/app.js) polling straight from the visitor's
# browser — no server state, no shared backend, nothing persisted.
routes = [
  { pattern = "plcwatch.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
