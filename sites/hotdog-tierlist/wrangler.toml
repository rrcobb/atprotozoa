name = "atprotozoa-hotdog-tierlist"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site; the crawl and per-member searches run in the browser
# against the public AppView.
routes = [
  { pattern = "hotdog-tierlist.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
