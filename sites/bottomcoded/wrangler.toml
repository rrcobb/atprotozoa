name = "atprotozoa-bottomcoded"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site with one dynamic route: /s/<handle> (src/index.ts) renders
# a personalized og:title/og:description for shared results, then falls
# through to ASSETS for everything else. Type a Bluesky handle at the root:
# it reads Bluesky's public AppView anonymously (resolveHandle, getProfile,
# getAuthorFeed, CORS *) to pull that handle's latest ~100 authored posts and
# scores each for "bottom to top" posting energy (public/lib/energy.js).

# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [{ pattern = "bottomcoded.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /s/<handle> is dynamic (personalized OG tags per share),
# so the Worker must run BEFORE the static-asset router.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
