name = "atprotozoa-netris"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @7778777.online tagged the bot: "battle netris, play competitive tetris
# against online atproto friends." Same shape as sites/bigwalk: type a
# handle, pull the moots pool (public AppView, no auth —
# public/lib/cluster.js, copied verbatim), and drop everyone connected into
# one shared Durable Object room (idFromName(handle)). Where bigwalk raced
# distance, netris runs N simultaneous Tetris boards — one per player,
# simulated client-side against a server-broadcast shared piece-bag seed so
# everyone gets the identical piece order — and the DO relays attack garbage
# between boards and tracks who's still alive.
#
# Single canonical host, own subdomain — no path-mount alongside it (per
# notes/40-new-site-playbook.md, 2026-07-31: a plain subdomain route no
# longer costs a custom-domain slot).
routes = [
  { pattern = "netris.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/n/*"]

[[durable_objects.bindings]]
name = "MATCH"
class_name = "Match"

# new_sqlite_classes, not new_classes — legacy KV-backed DOs need Workers
# Paid; this account is on Free. See sites/the-place/wrangler.toml.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Match"]
