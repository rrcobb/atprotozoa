name = "atprotozoa-netris"
compatibility_date = "2025-01-01"

# netris is a static browser-local game. The board engine and history live in
# the browser; there is no room authority or server state.
#
# Single canonical host, own subdomain — no path-mount alongside it (per
# notes/40-new-site-playbook.md, 2026-07-31: a plain subdomain route no
# longer costs a custom-domain slot).
routes = [
  { pattern = "netris.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Match"]

[[migrations]]
tag = "v2"
deleted_classes = ["Match"]
