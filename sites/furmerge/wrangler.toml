name = "atprotozoa-furmerge"
compatibility_date = "2025-01-01"

# Pure static site — a 2048-style merge game where tiles are cat breeds
# ordered least to most fluffy (Sphynx -> Persian). Whole game runs
# client-side in public/game.js. No secrets, no server, no build step.
main = "src/index.ts"

# Path route on the shared bisks.net zone, mounted in the games/ cluster —
# see notes/40-new-site-playbook.md ("Clusters: grouping related sites
# under a shared path segment").
routes = [
  { pattern = "bisks.net/games/furmerge", zone_name = "bisks.net" },
  { pattern = "bisks.net/games/furmerge/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
