name = "atprotozoa-beyondbsky"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# An explainer written in reply to @alexbenzer.com's question about whether
# communities want their own app. Pure static — the Worker just serves assets.
#
# Own subdomain via a hostname route (the *.bisks.net wildcard DNS record + ACM
# wildcard cert cover it, so this needs no custom-domain slot). No path route:
# this site never had one, so there is no legacy URL to keep alive and no mount
# prefix to strip. See notes/20-deploy.md.
routes = [
  { pattern = "beyondbsky.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
