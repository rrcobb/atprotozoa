name = "atprotozoa-rotcast"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Everything runs client-side (see public/index.html): fetches the two fixed
# cohosts' profiles from the public AppView, opens a short-lived Jetstream
# WebSocket to book a random live post as the "surprise special guest," and
# writes a generated brainrot podcast transcript around it. The one server
# surface is /e/<ep>/<guestHandle>/<line> — a real, distinct URL per
# generated episode so each share gets its own og:title/description instead
# of every link unfurling to one generic card (same reasoning as didscope's
# /s/<handle>, this site's lineage). No re-fetching happens server-side; the
# client already computed everything and just hands it to the URL.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [{ pattern = "rotcast.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /e/... is dynamic (personalized OG tags per episode), so
# the Worker must run before the static-asset router.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
