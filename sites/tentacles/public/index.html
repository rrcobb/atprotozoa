<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tentacles of ATProto</title>
<meta name="description" content="Enter a Bluesky handle. Tentacles reach out to its DID, PDS, signing key, collections, AppView profile and PLC history." />
<meta property="og:title" content="Tentacles of ATProto" />
<meta property="og:description" content="Every account is a creature with tentacles into the network. Enter a handle and watch them reach." />
<meta property="og:url" content="https://tentacles.bisks.net/" />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary" />
<style>
  :root { --bg:#07080c; --ink:#e6eef2; --dim:#7f8c95; --t:#4fd1c5; --hot:#ff7ab8; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,sans-serif; min-height:100vh; display:flex; flex-direction:column; }
  header { padding:20px 16px 4px; text-align:center; }
  h1 { margin:0; font-size:26px; letter-spacing:.04em; }
  .sub { color:var(--dim); margin:4px 0 12px; }
  form { display:flex; gap:8px; justify-content:center; padding:0 16px; }
  input { background:#10141b; color:var(--ink); border:1px solid #2a3340; border-radius:8px; padding:9px 12px; width:min(320px,70vw); font:inherit; }
  button { background:var(--t); color:#052; border:0; border-radius:8px; padding:9px 16px; font:inherit; font-weight:600; cursor:pointer; }
  #status { text-align:center; color:var(--dim); min-height:1.5em; margin:8px 0 0; }
  #status.err { color:var(--hot); }
  #stage { position:relative; width:min(900px,100%); margin:0 auto; flex:1; }
  svg { width:100%; height:auto; display:block; }
  .tent { fill:none; stroke:var(--t); stroke-linecap:round; opacity:.8; }
  .node text { fill:var(--ink); font-size:13px; text-anchor:middle; }
  .node .k { fill:var(--t); font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
  .node .v { fill:var(--dim); font-size:12px; }
  .node circle { fill:#10141b; stroke:var(--t); stroke-width:2; }
  .node { cursor:pointer; }
  .node:hover circle { stroke:var(--hot); }
  #detail { margin:0 auto; width:min(900px,100%); padding:8px 16px; color:var(--dim); font-size:13px; min-height:3em; word-break:break-all; }
  #detail b { color:var(--ink); }
  footer { text-align:center; color:var(--dim); font-size:12px; padding:14px; }
  footer a { color:var(--dim); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>T<span id="cee" style="cursor:pointer">E</span>NTACLES OF ATPROTO</h1>
  <p class="sub">every account is a creature. enter a handle and watch it reach.</p>
  <form id="f"><input id="handle" placeholder="alice.bsky.social" autocomplete="off" autocapitalize="off" spellcheck="false" /><button type="submit">reach</button></form>
  <p id="status"></p>
</header>
<div id="stage"><svg id="svg" viewBox="0 0 900 640" aria-label="tentacle diagram"></svg></div>
<div id="detail">tap a tentacle tip for details.</div>
<footer>
  <a href="https://rateyourbuild.bisks.net/site/tentacles">rate this on rateyourbuild →</a> ·
  <a href="https://bsky.app/intent/compose?text=Tentacles%20of%20ATProto%20https%3A%2F%2Ftentacles.bisks.net%2F">share on Bluesky</a> ·
  <a href="https://kata.mino.mobi/tentacle">inspired by minormobius's tentacle</a><br />
  November is #NaNoFoMo: <a href="https://nanofomo.bisks.net/">pledge not to foom →</a>
</footer>
<script type="module" src="app.js"></script>
<script src="lib/visits.js" data-site="tentacles" data-into="footer"></script>
<script src="lib/handle-typeahead.js"></script>
<script>if (window.attachHandleTypeahead) window.attachHandleTypeahead(document.getElementById('handle'));</script>
</body>
</html>
