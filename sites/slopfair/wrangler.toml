name = "atprotozoa-slopfair"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site — an exhibition hall, everything runs in the browser.
routes = [
  { pattern = "slopfair.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
