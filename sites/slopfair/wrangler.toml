name = "atprotozoa-slopfair"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# 2026-08-19: config-only touch to force this dir back into the next push's
# changed-dirs diff. First deploy hit a transient Cloudflare API error
# (code 10013, unknown error on assets-upload-session) and never redeployed
# since — see notes/history/2026-08-pnpm-lockfile-outage.md for the pattern.

# Pure static site — an exhibition hall, everything runs in the browser.
routes = [
  { pattern = "slopfair.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
