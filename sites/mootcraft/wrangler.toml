name = "atprotozoa-mootcraft"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. Type a Bluesky handle
# and it reads the public AppView (getFollows / getFollowers / a
# getProfiles batch, all anonymous, CORS *) to pull that handle's moots
# (mutuals, widened to follows if too small — moots-graph logic copied from
# grand-moot-auto/lib/cluster.js, itself from pacmoot, mootdrone,
# clustercrawl, simcluster: copy, don't abstract). Then it fetches a handful
# of recent posts (getAuthorFeed) from the player and each moot and buries
# them as ore veins in a first-person voxel mine (real WebGL 3D, three.js
# via CDN import map, same pattern as grand-moot-auto/cowlick/beesky). Dig
# through dirt and stone with a raycast-and-hold pickaxe; each ore block you
# break pays out ore equal to that post's likeCount. No server, no build
# step.
main = "src/index.ts"

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# joins the games/ cluster alongside grand-moot-auto, pacmoot, moottris,
# etc. See notes/40-new-site-playbook.md ("Clusters", "Why paths, not
# subdomains").
routes = [
  { pattern = "mootcraft.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/games/mootcraft", zone_name = "bisks.net" },
  { pattern = "bisks.net/games/mootcraft/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
