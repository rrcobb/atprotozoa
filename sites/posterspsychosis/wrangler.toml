name = "atprotozoa-posterspsychosis"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Everything runs client-side (see public/index.html): resolve a handle,
# pull real profile stats from the public AppView, and turn them into a
# fake diagnosis + a printable Rx pad. The one server surface is /s/<handle>
# (src/index.ts) — a real per-person URL with personalized og:title/description
# baked in server-side, same pattern as sites/didscope, so a shared diagnosis
# unfurls as that person's card instead of one generic cached embed for
# everyone. No secrets, no auth.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes
# (same gotcha called out in buildthis/logs/wrangler.toml).
routes = [{ pattern = "posterspsychosis.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /s/<handle> is dynamic (personalized OG tags per share), so
# the Worker must run BEFORE the static-asset router, same as sites/logs.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
