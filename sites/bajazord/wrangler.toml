name = "atprotozoa-bajazord"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Everything runs client-side (see public/index.html + public/app.js) EXCEPT
# the OG/share unfurl: a plain static site serves the same og:title/description
# no matter which handle picked which three parts, so Bluesky's link-unfurl
# cache would show one generic card forever (same fix as sites/didscope). The
# Worker renders /z/<seed> with the seed's three assembled parts baked into
# og:title/og:description/og:url server-side, then falls through to ASSETS.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [{ pattern = "bajazord.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /z/<seed> is dynamic (personalized OG tags per seed), so
# the Worker must run BEFORE the static-asset router, same as sites/didscope.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
