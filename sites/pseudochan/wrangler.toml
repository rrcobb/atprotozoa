name = "atprotozoa-pseudochan"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @kitto.nekoweb.org: "pseudo-imageboard (pull posts from a user for a
# catalog/index, render post and responses in an imageboard style. Sub
# tags/DIDs (swappable?) for post IDs)". Public reads only: the author's repo
# comes straight from their PDS (lib/car.js), replies come from the public
# AppView's getPostThread. No OAuth, nothing written anywhere.

routes = [
  { pattern = "pseudochan.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
