name = "atprotozoa-topchicken"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser. Type a Bluesky handle:
# it reads Bluesky's public AppView anonymously (getFollows, getFollowers,
# getAuthorFeed, CORS *) to build that handle's network (follows ∪
# followers), scans each member's posts from the previous UTC day, and
# crowns whoever's post got the most likes "top chicken" for that handle.
# See public/lib/*.js.

routes = [
  { pattern = "topchicken.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/topchicken", zone_name = "bisks.net" },
  { pattern = "bisks.net/topchicken/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
