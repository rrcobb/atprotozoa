name = "atprotozoa-bskyxp"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# bskyxp (bskyxp.bisks.net): a real, working Bluesky client — real OAuth login,
# real home timeline, real posting/liking/reposting/replying — skinned entirely
# as a Windows-XP-era "Bluesky Social" launcher: a silver Luna-theme window with
# a grid of garish clip-art-style icons for every action, requested by
# @vibecode.rodeo off a screenshot of exactly that UI. See public/app.js for the
# client (talks straight to the public AppView, public.api.bsky.app) and
# public/lib/oauth.js for the OAuth flow (PKCE + DPoP, straight to the user's
# own PDS — this Worker never sees a token).
#
# Plain hostname route (not custom_domain = true) — the wildcard *.bisks.net
# DNS + cert mean this resolves without being registered in advance. See
# notes/40-new-site-playbook.md.
routes = [
  { pattern = "bskyxp.bisks.net/*", zone_name = "bisks.net" },
]

# run_worker_first: the Worker renders per-profile and per-post OG tags
# dynamically (so shared links unfurl with the real person/post, not a
# generic card), and serves the SPA shell for client-side routes. Without it
# the assets router would serve static files directly and neither the OG
# injection nor the SPA fallback would ever run.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true

# redeploy nudge (2026-08-07): pnpm-lock.yaml fell out of sync with the workspace
# starting at the lovecoupons build and silently blocked every deploy since —
# CI's `pnpm install --frozen-lockfile` failed `check`, so `deploy` never ran
# for any site touched in that window. Lockfile fixed; this comment forces this
# site back into the changed-dirs diff so it actually redeploys. See notes/20-deploy.md.
