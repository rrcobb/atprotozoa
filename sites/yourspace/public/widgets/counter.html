<!doctype html><meta charset="utf-8"><body style="margin:0;display:grid;place-items:center;height:100vh;font:12px monospace;color:#333;background:transparent"><div style="text-align:center">you are visitor<div id="n" style="font:700 30px monospace;background:#000;color:#0f0;padding:2px 10px;letter-spacing:4px;margin-top:4px"></div><small>(counted in your browser only)</small></div><script>
// Sandboxed iframes have an opaque origin, so localStorage may throw; fall back to a session count.
let n=1;try{const k="hits:"+new URLSearchParams(location.search).get("k");n=(+localStorage.getItem(k)||0)+1;localStorage.setItem(k,n)}catch(e){}
document.getElementById("n").textContent=String(n).padStart(6,"0");
</script>
