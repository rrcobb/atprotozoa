name = "atprotozoa-murmuration"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# A real-time boids flocking sim (separation/alignment/cohesion, mouse as a
# predator) running entirely in the browser. Optionally: type a Bluesky
# handle and the flock becomes that account's follows — one bird per DID,
# color/size seeded from a hash of the DID so the same account always draws
# the same flock. No server state, no secrets. Daily-slot build, nobody in
# particular asked; the fluoddity-flavored physics-toy corner of the repo
# (everzoom/cowlick/lavalamp/turtle-garden) hadn't done flocking yet.

routes = [
  { pattern = "murmuration.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
