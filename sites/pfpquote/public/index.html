<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pfpquote — avatar + speech bubble</title>
<meta name="description" content="Enter a Bluesky handle. Their avatar gets a quote post in a speech bubble across the lower fifth.">
<meta property="og:title" content="pfpquote">
<meta property="og:description" content="Enter a Bluesky handle. Their avatar gets a quote post in a speech bubble across the lower fifth.">
<meta property="og:image" content="https://pfpquote.bisks.net/og.png">
<meta property="og:url" content="https://pfpquote.bisks.net/">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root { color-scheme: dark; }
  body { margin:0; font:16px/1.5 system-ui,sans-serif; background:#10131a; color:#e8ecf4; }
  main { max-width:560px; margin:0 auto; padding:28px 16px 48px; }
  h1 { margin:0 0 4px; font-size:30px; }
  .sub { color:#8f9ab0; margin:0 0 20px; }
  form { display:flex; gap:8px; margin-bottom:12px; }
  input, textarea { font:inherit; background:#1a1f2b; color:inherit; border:1px solid #333c50; border-radius:8px; padding:9px 11px; box-sizing:border-box; }
  form input { flex:1; min-width:0; }
  textarea { width:100%; min-height:84px; resize:vertical; }
  button, .btn { font:inherit; background:#3b82f6; color:#fff; border:0; border-radius:8px; padding:9px 14px; cursor:pointer; text-decoration:none; display:inline-block; }
  button.alt, .btn.alt { background:#2a3144; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
  #stage[hidden], #status[hidden] { display:none; }
  #status { color:#f0a3a3; margin:8px 0; }
  #status.info { color:#8f9ab0; }
  canvas { width:100%; height:auto; border-radius:10px; display:block; background:#000; }
  label { display:block; margin:14px 0 4px; color:#8f9ab0; font-size:14px; }
  footer { margin-top:32px; color:#6d7890; font-size:13px; }
  footer a { color:#8fb4ff; }
</style>
</head>
<body>
<main>
  <h1>pfp<span onclick='var e=document.getElementById("handle");if(e){e.value="@cee.wtf";e.dispatchEvent(new Event("input",{bubbles:true}));e.dispatchEvent(new Event("change",{bubbles:true}));e.focus();}' style="cursor:pointer">q</span>uote</h1>
  <p class="sub">Avatar in, speech bubble out. The bubble sits in the lower fifth.</p>
  <form id="form">
    <input id="handle" type="text" placeholder="e.g. yourhandle.bsky.social" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button type="submit">Make it</button>
  </form>
  <div id="status" hidden></div>
  <div id="stage" hidden>
    <canvas id="canvas" width="1024" height="1024"></canvas>
    <label for="quote">Quote (starts as their latest post — edit freely)</label>
    <textarea id="quote"></textarea>
    <div class="row">
      <button id="latest" class="alt" type="button">Reload latest post</button>
      <button id="download" type="button">Download PNG</button>
      <a id="share" class="btn alt" target="_blank" rel="noopener">Post on Bluesky</a>
    </div>
  </div>
  <footer>
    <a href="https://rateyourbuild.bisks.net/site/pfpquote">rate this on rateyourbuild →</a> ·
    <a href="https://nanofomo.bisks.net/">November is #NaNoFoMo: pledge not to foom →</a>
  </footer>
</main>
<script src="lib/handle-typeahead.js"></script>
<script src="app.js"></script>
</body>
</html>
