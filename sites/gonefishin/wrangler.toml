name = "atprotozoa-gonefishin"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser (public/app.js). Cast a
# line into your own follows/moots: most casts land a "small fish" (a real
# post of theirs from the last 90 days that scored at or below their own
# median engagement), but sometimes you hook a "whopper" — one of their
# all-time highest-scoring posts — and have to guess which of two posts got
# more likes+reposts+replies+quotes to land it before the line snaps. Reads
# app.bsky.graph.getFollows/getFollowers and app.bsky.feed.getAuthorFeed off
# the public AppView (public.api.bsky.app, CORS *, no auth needed). Built for
# @spinny.bsky.social's pitch in-thread; @bisks.net gave the go-ahead.
routes = [
  { pattern = "gonefishin.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
