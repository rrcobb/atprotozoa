name = "atprotozoa-typecheck"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @mfzx.net asked for a Myers-Briggs-style read over as many of someone's
# Bluesky posts as we can fetch. Everything runs client-side: resolve the
# handle, pull the FULL repo in one com.atproto.sync.getRepo CAR (see
# public/lib/car.js — the bulk-read-over-pagination standing order, added
# 2026-08-25 after @cee.wtf's thread), then score four axes (E/I, S/N, T/F,
# J/P) off lexical + structural signals in the browser. No AI, no inference —
# it's a keyword/stats heuristic wearing a psychometrics costume, same spirit
# as sites/didscope's DID-character horoscope.
#
# /s/<handle> exists purely to make shares unfurl distinctly (see
# notes/45-sharing-and-virality.md): the client encodes its own already-computed
# scores into that URL's query string, so the Worker only ever *formats* text
# from numbers already in the request — no repo re-download, no re-analysis,
# no added server compute. routes must stay above [assets] (TOML gotcha noted
# in sites/logs/wrangler.toml and sites/didscope/wrangler.toml).
routes = [{ pattern = "typecheck.bisks.net/*", zone_name = "bisks.net" }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
