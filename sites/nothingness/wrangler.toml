name = "atprotozoa-nothingness"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @fromthewestmeadow.com asked for a site that "really demonstrates the
# concept of nothingness." Mostly static — a void of a homepage — but the
# one bit of real infrastructure is a genuinely shared global counter: every
# visitor's "Generate Nothing" click increments one number everyone sees,
# which is the joke (real distributed state, spent entirely on counting
# nothing). See notes/40-new-site-playbook.md.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
routes = [
  { pattern = "nothingness.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "VOID"
class_name = "Void"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Void"]
