name = "atprotozoa-hypebuddy"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @isolyth.dev asked for a "beat up a buddy" physics game with @mfzx.net as
# the buddy — their real avatar as the ragdoll's head. Once it was live,
# @mfzx.net said they weren't thrilled with it, so @bisks.net asked for a
# turn toward something positive: same ragdoll toy, now a celebration —
# confetti and cheers instead of damage. Split out to its own site/hostname
# at @isolyth.dev's later request, so this positive game and the restored
# beatupbuddy.bisks.net (see sites/beatupbuddy) aren't sharing one address.
routes = [
  { pattern = "hypebuddy.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
