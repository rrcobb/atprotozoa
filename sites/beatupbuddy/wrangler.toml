name = "atprotozoa-beatupbuddy"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @isolyth.dev asked for a "beat up a buddy" physics game with @mfzx.net as
# the buddy — their real avatar as the ragdoll's head, one of their real
# posts as a speech-bubble cry every time they take a hit. Brand-new site,
# served at the root of its own hostname: no bisks.net/<name> path route,
# no prefix-stripping needed.
routes = [
  { pattern = "beatupbuddy.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
