name = "atprotozoa-beatupbuddy"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @isolyth.dev asked for a "beat up a buddy" physics game with @mfzx.net as
# the buddy — their real avatar as the ragdoll's head. Once it was live,
# @mfzx.net said they weren't thrilled with it, so @bisks.net asked for a
# turn toward something positive: same ragdoll toy, now a celebration —
# confetti and cheers instead of damage. Brand-new site, served at the root
# of its own hostname: no bisks.net/<name> path route, no prefix-stripping
# needed. (Kept the "beatupbuddy" technical name/subdomain for link
# stability even though the content is now "hype up buddy".)
routes = [
  { pattern = "beatupbuddy.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
