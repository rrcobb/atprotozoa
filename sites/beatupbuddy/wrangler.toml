name = "atprotozoa-beatupbuddy"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @isolyth.dev asked for a "beat up a buddy" physics game with @mfzx.net as
# the buddy — their real avatar as the ragdoll's head. Once it was live,
# @mfzx.net said they weren't thrilled with it, so @bisks.net asked for a
# turn toward something positive — that positive version now lives at
# sites/hypebuddy. @isolyth.dev then asked for this address to go back to
# being a beat-up game, citing consent given on @mfzx.net's behalf; that
# wasn't good enough, so it went back generic instead — a drawn dummy, no
# real avatar, no real posts. @mfzx.net has since tagged the bot directly,
# more than once, stating their own enthusiastic consent in their own words
# — that's the consent that actually counts here, so the real avatar/posts
# are back. Served at the root of its own hostname: no bisks.net/<name> path
# route, no prefix-stripping needed.
routes = [
  { pattern = "beatupbuddy.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
