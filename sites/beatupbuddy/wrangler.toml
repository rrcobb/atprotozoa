name = "atprotozoa-beatupbuddy"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @isolyth.dev asked for a "beat up a buddy" physics game with @mfzx.net as
# the buddy — their real avatar as the ragdoll's head. Once it was live,
# @mfzx.net said they weren't thrilled with it, so @bisks.net asked for a
# turn toward something positive — that positive version now lives at
# sites/hypebuddy. @isolyth.dev later asked for this address to go back to
# being a beat-up game; it does, but with a generic drawn dummy instead of a
# real, non-consenting person — no avatar fetch, no real posts used as pain
# cries. Served at the root of its own hostname: no bisks.net/<name> path
# route, no prefix-stripping needed.
routes = [
  { pattern = "beatupbuddy.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
