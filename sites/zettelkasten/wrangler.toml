name = "atprotozoa-zettelkasten"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site — notes, links, tags, and the graph view all run in the
# browser (localStorage). The Worker just forwards to the static-asset router.
routes = [
  { pattern = "zettelkasten.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
