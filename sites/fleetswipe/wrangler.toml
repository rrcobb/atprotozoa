name = "atprotozoa-fleetswipe"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Daily-slot build (2026-09-06, no specific requester) — a broad pass turned
# into: swipe through the whole bisks.net fleet, Tinder-style. Right keeps a
# site in "your fleet," left skips it. Pure static site, everything runs in
# the browser (public/app.js), no server state.
#
# Card data comes from sites/fleetswipe/sync-fleet.mjs, same source apex's
# gallery / receipts / rateyourbuild / orrery all read from sites/*/site.json
# — see that script's header to refresh it. Snapshot, not a live view.
routes = [
  { pattern = "fleetswipe.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
