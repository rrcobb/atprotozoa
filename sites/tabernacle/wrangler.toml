name = "atprotozoa-tabernacle"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser, no server surface. A mock-
# liturgical "Tabernacle of the Unliked Post": you laughed at a post and scrolled
# by without liking it, so you must bring three drafts as offerings (sin,
# purification, goodwill) to atone. Compose the three offering-posts, complete the
# rite, and receive a generated Certificate of Atonement. Deadpan biblical-tech
# tone, per @vgel.me's tabernacle post (tagged by @gracekind.net). It's a bit.
main = "src/index.ts"

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# tabernacle.bisks.net is being retired to free a slot against the zone's
# custom-domain cap (see notes/20-deploy.md). Migrated to bisks.net/tabernacle
# instead. See notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "tabernacle.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/tabernacle", zone_name = "bisks.net" },
  { pattern = "bisks.net/tabernacle/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
