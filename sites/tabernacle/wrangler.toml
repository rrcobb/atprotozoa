name = "atprotozoa-tabernacle"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser, no server surface. A mock-
# liturgical "Tabernacle of the Unliked Post": you laughed at a post and scrolled
# by without liking it, so you must bring three drafts as offerings (sin,
# purification, goodwill) to atone. Compose the three offering-posts, complete the
# rite, and receive a generated Certificate of Atonement. Deadpan biblical-tech
# tone, per @vgel.me's tabernacle post (tagged by @gracekind.net). It's a bit.
assets = { directory = "./public" }

routes = [{ pattern = "tabernacle.bisks.net", custom_domain = true }]
