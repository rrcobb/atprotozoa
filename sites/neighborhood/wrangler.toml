name = "atprotozoa-neighborhood"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. It reads Bluesky's public
# AppView (getFollows / getFollowers / getAuthorFeed, all anonymous, CORS *) to
# work out a handle's "neighborhood" (mutuals), then plays two games seeded from
# it. The monopoly view also reads the live firehose (Jetstream) for rent.
# index.html is the hub; /guess and /monopoly are the two games as paths.
assets = { directory = "./public" }

routes = [{ pattern = "neighborhood.bisks.net", custom_domain = true }]
