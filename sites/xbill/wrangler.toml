name = "atprotozoa-xbill"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @cee.wtf (quoted, tagged by @shimmermathlabs.com): "build a site that grabs
# a users entire bsky repo, and then gives a readout of how much a similar
# fetch would cost using the X API cost of $5 per 1000 posts fetched and $10
# per 1,000 user profiles fetched." Enter a handle, we download their entire
# repo in one shot (com.atproto.sync.getRepo, see public/lib/car.js) instead
# of paginating, tally every app.bsky.feed.post record as it streams past,
# and price it against X's read-API rate card: $5/1000 posts + one $10/1000
# profile lookup for the handle itself. The dollar total ticks up live as the
# repo CAR is walked. No OAuth: everything here is public reads.

routes = [
  { pattern = "xbill.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
