name = "atprotozoa-hivemind"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Theme-box tick, theme "helping the swarm do well on its homework
# assignment": a virtual hive where you feed and care for a digital bee that
# grows stronger and smarter as it solves math problems and learns new
# words, with rewards and a leaderboard so the swarm studies together.
#
# All game state lives client-side in localStorage (a bee is a per-browser
# pet, no login) — the one thing that needs a server is the shared
# leaderboard, so "the swarm" is actually visible. One Durable Object
# ("global", same shape as sites/quotehof's tracker) holds the top scores.
routes = [
  { pattern = "hivemind.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "HIVE"
class_name = "Hive"

# new_sqlite_classes, not new_classes — legacy KV-backed DOs need Workers
# Paid; this account is on Free. See notes/20-deploy.md.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hive"]
