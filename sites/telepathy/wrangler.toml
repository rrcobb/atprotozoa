# @shimmermathlabs.com asked for a telepathy test: "i'm thinking really hard
# of the queen of clubs. see if people can guess that card (out of 52 card
# deck). if so congratulate and send them to homoskeeter" — their post was
# itself signed "sent telepathically via homoskeeter.bisks.net", so the
# target card was already broadcast in the ask. This plays it straight
# anyway: pick a card, get color/suit/rank feedback like Wordle tiles, and
# since the target never changes, everyone gets there within 52 guesses.
#
# Brand-new site, entirely static/client-side — no server state needed, so
# the Worker is a plain ASSETS passthrough. Served at the root of its own
# hostname, no bisks.net/<name> path route.
name = "atprotozoa-telepathy"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [
  { pattern = "telepathy.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
