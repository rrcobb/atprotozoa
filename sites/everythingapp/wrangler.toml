name = "atprotozoa-everythingapp"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @fromthewestmeadow.com's thread: "LinkedIn becomes the everything app, the
# way you socialize, the way you get hired, how you do your taxes, if you get
# to keep your child, who gets to eat." This is that feed — a scrolling,
# procedurally generated LinkedIn timeline where every life function has been
# absorbed into Endorsements, Premium tiers, and Profile Completeness, played
# perfectly straight in LinkedIn's own corporate-cheerful voice.
#
# Brand-new site — served at the root of its own hostname, no
# bisks.net/<name> path route and no prefix-stripping needed.
routes = [
  { pattern = "everythingapp.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = false
