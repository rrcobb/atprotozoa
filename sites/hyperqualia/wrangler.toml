name = "atprotozoa-hyperqualia"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Brand-new site, own subdomain, no mount-prefix stripping needed — see
# notes/40-new-site-playbook.md ("Subdomains again").
#
# A d3 visualization of a thread by @fubarchitect.com: the idea that "the
# primary mind facing output is probably something higher dimensional with
# narrative as the accessible slice of it," paired with hyperqualia (their
# term) and the observation that religious practice and endogenous chemistry
# both seem to reach for it. Concretely: a rotating 4D tesseract, a real
# hyperplane slice computed live off its rotated edge set (not faked), and a
# handful of labeled "inducers" that only enter the visible cross-section —
# and the scrolling narrative line — when the slicing plane actually reaches
# them. Pure static/client-side, no server state.
routes = [{ pattern = "hyperqualia.bisks.net/*", zone_name = "bisks.net" }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
