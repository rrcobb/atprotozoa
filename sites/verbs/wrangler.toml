name = "atprotozoa-verbs"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# A style guide, issued in reply to a thread asking for a list of verbs
# acceptable for describing the activities of strange machines. Pure static
# site: a ruled list (approved / caution / forbidden), a verb-checker that
# rules on whatever you type, and a sentence generator. Sibling of declined —
# same mock-bureaucratic committee energy, different subject.

# Back on its own subdomain (2026-07-31). The zone's custom-domain cap is no
# longer the constraint: a wildcard `*.bisks.net` DNS record plus an ACM
# wildcard cert now cover every subdomain, so a plain hostname *route* works
# without consuming a custom-domain slot (routes cap at 1000/zone, custom
# domains at 100). See notes/20-deploy.md.
#
# The old bisks.net/verbs path route stays so existing shared links keep
# working; src/index.ts strips that prefix only when it's actually present.
routes = [
  { pattern = "verbs.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/verbs", zone_name = "bisks.net" },
  { pattern = "bisks.net/verbs/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
