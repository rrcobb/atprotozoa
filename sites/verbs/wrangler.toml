name = "atprotozoa-verbs"
compatibility_date = "2025-01-01"

# A style guide, issued in reply to a thread asking for a list of verbs
# acceptable for describing the activities of strange machines. Pure static
# site: a ruled list (approved / caution / forbidden), a verb-checker that
# rules on whatever you type, and a sentence generator. Sibling of declined —
# same mock-bureaucratic committee energy, different subject.
assets = { directory = "./public" }

routes = [{ pattern = "verbs.bisks.net", custom_domain = true }]
