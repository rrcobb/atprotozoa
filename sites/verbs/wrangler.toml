name = "atprotozoa-verbs"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# A style guide, issued in reply to a thread asking for a list of verbs
# acceptable for describing the activities of strange machines. Pure static
# site: a ruled list (approved / caution / forbidden), a verb-checker that
# rules on whatever you type, and a sentence generator. Sibling of declined —
# same mock-bureaucratic committee energy, different subject.

# Path route on the shared bisks.net zone, not a dedicated custom domain —
# verbs.bisks.net is being retired to free a slot against the zone's
# custom-domain cap (see notes/20-deploy.md). Migrated to bisks.net/verbs
# instead. See notes/40-new-site-playbook.md ("Why paths, not subdomains").
routes = [
  { pattern = "bisks.net/verbs", zone_name = "bisks.net" },
  { pattern = "bisks.net/verbs/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
