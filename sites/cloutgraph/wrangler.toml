name = "atprotozoa-cloutgraph"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser. Type a Bluesky handle
# (crawls its mutuals) or paste an app.bsky.graph.list link (crawls its
# members), then reads Bluesky's public AppView + each member's own PDS
# (all anonymous, CORS *) to build a directed liker->author like-graph over
# that pool, PMI-weight the edges, run HITS, and rank the pool by "network
# clout" = geometric mean of authority and hub score. See public/lib/*.js.

routes = [
  { pattern = "cloutgraph.bisks.net/*", zone_name = "bisks.net" },
  { pattern = "bisks.net/cloutgraph", zone_name = "bisks.net" },
  { pattern = "bisks.net/cloutgraph/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
