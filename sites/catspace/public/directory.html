<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>the catspace directory</title>
<meta name="description" content="every cat with a catspace page, newest first." />

<meta property="og:type" content="website" />
<meta property="og:title" content="the catspace directory" />
<meta property="og:description" content="every cat with a catspace page, newest first." />
<meta property="og:image" content="https://catspace.bisks.net/og.png" />
<meta property="og:url" content="https://catspace.bisks.net/directory" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="stylesheet" href="/style.css" />
<link rel="stylesheet" href="/directory.css" />
</head>
<body data-theme="bubblegum">
<canvas id="sparkles"></canvas>

<div class="marquee-wrap">
  <div class="marquee">🐱✨ <span id="cat-count">···</span> CATS AND COUNTING ✨🐱&nbsp;&nbsp;&nbsp;&nbsp;</div>
</div>

<header class="site-head">
  <h1 class="wordmark small"><a href="/">cat<span class="blink">space</span></a></h1>
  <nav class="topnav"><a href="/">home</a><a href="/directory">directory</a></nav>
</header>

<main class="wrap">
  <section class="card">
    <h2>the directory</h2>
    <p class="status" id="dir-status">scanning the network for cats…</p>
    <div class="cat-grid" id="cat-grid"><p class="empty">loading…</p></div>
  </section>
</main>

<footer class="site-foot">
  every cat found live off the network via <code>listReposByCollection</code> + Jetstream —
  no directory database, just what's already in everyone's own PDS ·
  <a href="https://bisks.net">bisks.net</a> · part of <a href="https://bisks.net">atprotozoa</a>
</footer>

<script type="module">
  import { initSparkles } from "/lib/sparkles.js";
  import { GlobalIndex } from "/lib/global-index.js";
  initSparkles();

  const esc = (s) =>
    String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

  const gridEl = document.getElementById("cat-grid");
  const countEl = document.getElementById("cat-count");
  const statusEl = document.getElementById("dir-status");

  function card(cat) {
    const href = `/cat/${encodeURIComponent(cat.handle)}`;
    const photo = cat.photoUrl
      ? `<img class="dir-photo" src="${esc(cat.photoUrl)}" alt="${esc(cat.catName)}" loading="lazy" />`
      : `<div class="dir-photo-placeholder">🐈</div>`;
    return `<a class="dir-card" href="${href}">${photo}<span class="dir-name">${esc(cat.catName)}</span><span class="dir-handle">@${esc(cat.handle)}</span></a>`;
  }

  function render(snap) {
    countEl.textContent = String(snap.catCount).padStart(3, "0");
    const errPart = snap.error ? ` · ${esc(snap.error)}` : "";
    statusEl.textContent = snap.backfillDone
      ? `${snap.catCount} cats found so far · ${snap.connected ? "watching live" : "reconnecting…"}${errPart}`
      : `scanning the network for cats… ${snap.catCount} found so far${errPart}`;
    gridEl.innerHTML = snap.cats.length
      ? snap.cats.map(card).join("")
      : `<p class="empty">no cats yet — <a href="/">be the first!</a></p>`;
  }

  const index = new GlobalIndex({ onUpdate: render });
  index.start();
</script>
</body>
</html>
