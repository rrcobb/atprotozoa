name = "atprotozoa-catspace"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# catspace (catspace.bisks.net): MySpace for cats. @me.jamespicone.name asked
# for it in a reply, @bisks.net gave the go-ahead. Each cat's profile is a
# net.bisks.catspace.profile record ("self") in its owner's own PDS — this
# Worker never stores the profile content itself. Directory, visitor counters,
# and guestbook aggregation are intentionally omitted: durable data belongs in
# users' own PDS records, not in a site database.
#
# New site, single canonical host — no legacy bisks.net/<name> path route.
routes = [
  { pattern = "catspace.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Registry"]

[[migrations]]
tag = "v2-remove-registry"
deleted_classes = ["Registry"]

[observability]
enabled = true

# 2026-08-13: redeploy kick — pnpm-lock.yaml was out of sync when this site first shipped (see notes/history/2026-08-pnpm-lockfile-outage.md), so CI's check job failed and this Worker never actually deployed. Config-only touch to pull it back into this push's changed-dirs diff.
