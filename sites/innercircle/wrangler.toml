# Everything runs client-side (public/index.html + lib/*.js): map a handle's
# mutuals via one CAR download of its own repo (follows) plus constellation's
# backlink index (followers), then rank those mutuals purely from
# constellation backlinks to the handle's own posts — no mutual's repo ever
# gets downloaded (2026-09-16, @heika.dog, in two passes: first to use
# constellation "wherever it was faster," then to remove the whole-repo
# mutual scan entirely). The same CAR read that finds the handle's follows
# also carries its posts, and buildCircle reuses those rather than
# downloading the same repo again (lib/topmutuals.js's fetchOwnRepo/
# mutualsOf/buildCircle). For whoever makes the ranked top 40, one targeted
# com.atproto.repo.getRecord fetches the real text of their earliest reply
# each way. The only server surface is
# /summary/<handle>/<circleSize>/<bothWaysCount> (src/index.ts): a distinct,
# shareable URL per result with personalized OG tags built straight from the
# path segments — no server-side recompute of the (expensive) ranking pass,
# same trick mootrace/dial-a-mutual use.
name = "atprotozoa-innercircle"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [{ pattern = "innercircle.bisks.net/*", zone_name = "bisks.net" }]

# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes
# (same gotcha called out in buildthis/logs/wrangler.toml).
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
