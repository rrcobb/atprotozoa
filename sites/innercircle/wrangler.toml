# Everything runs client-side (public/index.html + lib/*.js): resolve a
# handle's mutuals off the public AppView (lib/topmutuals.js's mutualsOf,
# copied and trimmed from mootrace's lib/mutuals.js), then rank them by
# replies via constellation.microcosm.blue's backlink index — asking who
# replied to each of the searched handle's own posts, rather than downloading
# every mutual's whole repo just to count (2026-09-16, @heika.dog). Only the
# mutuals who make the ranked cut then get their whole repo downloaded as one
# CAR (lib/car.js + lib/identity.js, copied from mootrace/backscroll — see
# notes/40-new-site-playbook.md's cee.wtf bulk-read order), scanned for their
# earliest reply to every other did they've ever replied to. The top 40 by
# reply count become the "inner circle"; that same earliest-reply data
# renders the top-40 x top-40 grid with no second repo download. Falls back
# to scanning every mutual directly if constellation is unreachable. The only
# server surface is /summary/<handle>/<circleSize>/<pairsConnected>
# (src/index.ts): a distinct, shareable URL per result with personalized OG
# tags built straight from the path segments — no server-side recompute of
# the (expensive) repo scan, same trick mootrace/dial-a-mutual use.
name = "atprotozoa-innercircle"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [{ pattern = "innercircle.bisks.net/*", zone_name = "bisks.net" }]

# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes
# (same gotcha called out in buildthis/logs/wrangler.toml).
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
