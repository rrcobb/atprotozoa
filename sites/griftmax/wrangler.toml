name = "atprotozoa-griftmax"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @antiali.as, replying in the thread where buildthis built griftindex (a
# leaderboard that greps every site for six blunt "touches something real"
# signals — live AppView fetch, firehose/Jetstream, full-repo CAR download,
# real atproto OAuth, browser-owned ascensions, live Jetstream — and scores 0-6, no
# LLM judgment), asked for "the worst possible website to get a perfect
# griftindex score. Be excellent." So: the ugliest, gaudiest memecoin-grift
# skin we could build ($GRIFT, "ascension," a fake presale that never ends),
# wrapped around six genuinely real integrations underneath — nothing here is
# faked to trip the regex, every signal is the actual mechanic the button
# does. At build time, nobody in the fleet had ever scored above 4/6 (grep
# `sites/griftindex/public/data/scores.json` — storage had ZERO hits across
# every site) which makes a real 6/6 an actual first, not a gimme.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [
  { pattern = "griftmax.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AscensionEngine"]

[[migrations]]
tag = "v2"
deleted_classes = ["AscensionEngine"]
