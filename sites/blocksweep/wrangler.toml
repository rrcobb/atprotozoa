name = "atprotozoa-blocksweep"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser. Paste a Bluesky list
# link: pulls the list curator's repo as one CAR (com.atproto.sync.getRepo,
# see public/lib/car.js, forked from sites/rollcall) to get every
# app.bsky.graph.listitem in one request instead of paginating
# app.bsky.graph.getList, shows the full membership, then — once signed in —
# bulk-creates a real app.bsky.graph.block record for every member the user
# didn't uncheck. Forked from sites/rollcall (list-membership half) and
# sites/blocknotes (OAuth + block-write half) — copy, don't abstract.

routes = [
  { pattern = "blocksweep.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
