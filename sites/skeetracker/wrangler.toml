name = "atprotozoa-skeetracker"
compatibility_date = "2025-01-01"

# Pure static site — everything runs in the browser. A tiny step-sequencer
# tracker (Renoise/FastTracker-ish): pattern grid, custom Web Audio synths as
# instruments, JSON song export minified+gzipped+base64'd and chunked to fit
# Bluesky's grapheme limit so a song can be posted as a bisk thread — and
# loaded back by pasting a link to that thread. No secrets, no server; song
# threads are read straight from the public AppView (public.api.bsky.app).
# Built after @fubarchitect.com asked @buildthis for a web tracker with synths
# and shareable-via-bisk songs.
assets = { directory = "./public" }

routes = [{ pattern = "skeetracker.bisks.net/*", zone_name = "bisks.net" }]
