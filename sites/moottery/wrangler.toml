name = "atprotozoa-moottery"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Pure static site — the game runs entirely in the browser (reads Bluesky's
# public AppView, anonymous, CORS *). The Worker only proxies avatar images
# for the share-card canvas (cdn.bsky.app sends no CORS header — see
# src/index.ts) and renders per-case /s/<handles> share pages.
routes = [
  { pattern = "moottery.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
