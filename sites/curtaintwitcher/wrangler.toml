name = "atprotozoa-curtaintwitcher"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @fromthewestmeadow.com: "Make a fake Nextdoor-style social app where users
# post increasingly paranoid neighborhood updates, reply in character, and
# vote on whether each complaint is real or completely unhinged."
#
# One Durable Object ("global") holds the whole shared feed — a hand-written
# seed of escalating posts plus whatever anyone submits — same single-writer
# shape as sites/guestbet's Market DO this was copied from. Every post gets
# 1-3 auto-generated in-character neighbor replies (keyword-matched templates,
# no LLM call, no secret needed) and two vote buttons, REAL vs UNHINGED,
# tallied into a town-wide "paranoia meter." No login: an opaque id in
# localStorage sent as X-Client-Id, same anonymous-identity shape as guestbet.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [{ pattern = "curtaintwitcher.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /api/* (the DO) and /p/<id> (per-post OG unfurl) are both
# dynamic, so the Worker must run before the static-asset router.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "BOARD"
class_name = "Board"

# new_sqlite_classes, not new_classes — legacy KV-backed DOs need Workers
# Paid; this account is on Free. See sites/the-place/wrangler.toml.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Board"]
