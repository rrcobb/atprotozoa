<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>handlecast — today's forecast for your handle</title>
<meta name="description" content="A daily weather forecast for any Bluesky handle. Sky, temperature, wind, and an advisory.">
<meta property="og:title" content="handlecast">
<meta property="og:description" content="A daily weather forecast for any Bluesky handle.">
<meta property="og:url" content="https://handlecast.bisks.net/">
<meta name="twitter:card" content="summary">
<style>
:root{color-scheme:light dark;--bg:#0f1b2d;--fg:#e8f0fb;--mut:#8ea3c0;--card:#18283f;--acc:#6cb6ff}
@media(prefers-color-scheme:light){:root{--bg:#eef4fb;--fg:#12233a;--mut:#56708f;--card:#fff;--acc:#1a73d9}}
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;display:flex;flex-direction:column;align-items:center}
main{width:min(560px,92vw);padding:2rem 0 1rem}
h1{margin:0 0 .2rem;font-size:2rem}
p.sub{color:var(--mut);margin:0 0 1.2rem}
form{display:flex;gap:.5rem}
input{flex:1;padding:.6rem .8rem;border-radius:8px;border:1px solid var(--mut);background:var(--card);color:var(--fg);font:inherit}
button{padding:.6rem 1rem;border:0;border-radius:8px;background:var(--acc);color:#fff;font:inherit;cursor:pointer}
#out{margin-top:1.4rem;background:var(--card);border-radius:14px;padding:1.2rem 1.4rem}
#out[hidden]{display:none}
.big{font-size:3.5rem;line-height:1}
.temp{font-size:1.6rem;font-weight:700}
dl{display:grid;grid-template-columns:auto 1fr;gap:.2rem 1rem;margin:.8rem 0}
dt{color:var(--mut)}dd{margin:0}
a{color:var(--acc)}
footer{padding:1rem 0 2rem;color:var(--mut);font-size:.85rem;text-align:center}
</style>
</head>
<body>
<main>
<h1>handle<span id="seed" style="cursor:pointer">c</span>ast</h1>
<p class="sub">today's forecast for any Bluesky handle.</p>
<form id="f">
<input id="handle" placeholder="you.bsky.social" autocomplete="off" autocapitalize="none" spellcheck="false">
<button>forecast</button>
</form>
<section id="out" hidden>
<div class="big" id="icon"></div>
<div><span class="temp" id="temp"></span> · <span id="sky"></span></div>
<dl><dt>wind</dt><dd id="wind"></dd><dt>chance of posting</dt><dd id="pop"></dd><dt>advisory</dt><dd id="adv"></dd></dl>
<a id="share" target="_blank" rel="noopener">post this forecast →</a>
</section>
</main>
<footer>
<div>forecast is for <span id="day"></span> (UTC) and changes at midnight.</div>
<div><a href="https://rateyourbuild.bisks.net/site/handlecast">rate this on rateyourbuild →</a></div>
<div>November is #NaNoFoMo: <a href="https://nanofomo.bisks.net/">pledge not to foom →</a></div>
</footer>
<script type="module" src="app.js"></script>
</body>
</html>
