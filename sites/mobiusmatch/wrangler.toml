name = "atprotozoa-mobiusmatch"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Everything still runs client-side (see public/index.html) EXCEPT the OG/share
# unfurl, which has a small server surface: the Worker renders /s/<key>
# (src/index.ts) with per-match og:title/og:description/og:url baked
# server-side, then falls through to ASSETS for everything else. A 7-question
# quiz matches the visitor to one of ~42 curated mino.mobi sites, pulled from
# mino.mobi's own deploy-registry.json and sorted into 7 categories (see
# public/data/mino-sites.json and ./sync-mino.mjs). Built for @norvid-studies
# after they pitched "which mobius website is best for you" and bisks.net
# asked the bot to give it a go, pulling the latest list from mino.mobi. No
# secrets, no OAuth.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes
# (same gotcha called out in buildthis/logs/wrangler.toml).
routes = [{ pattern = "mobiusmatch.bisks.net/*", zone_name = "bisks.net" }]

# run_worker_first: /s/<key> is dynamic (personalized OG tags per match), so
# the Worker must run BEFORE the static-asset router, same as sites/didscope.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
