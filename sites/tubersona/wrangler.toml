name = "atprotozoa-tubersona"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# A static, browser-only toy. Every dig, patch, and share card is computed
# and stored (localStorage) in the browser; the Worker only serves assets.
#
# 2026-09-26: first deploy 404'd (falls through to the *.bisks.net/* fallback
# Worker, so the route below never got created — config and dry-run are both
# clean). Same symptom as sites/chatcontrol the day before; likely the zone's
# 1000-route cap, since this and chatcontrol's rename are the only two NEW
# route creations attempted since the last one that worked. See
# notes/20-deploy.md's "Route cap likely hit again" before re-deploying blind.
routes = [
  { pattern = "tubersona.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
