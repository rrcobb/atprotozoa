# @fromthewestmeadow.com asked for a Wikipedia clone with atproto login,
# articles, histories, talk pages, and profiles — edits gated by "Shimmer Math
# Labs' Simcluster Checker": bisks.net's mutuals ("members") or a mutual of one
# of those mutuals ("1-hop adjacent"). See src/index.ts for the checker logic.
#
# New site, canonical host only (no legacy bisks.net/<name> path route) — see
# notes/40-new-site-playbook.md.
name = "atprotozoa-clusterpedia"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [
  { pattern = "clusterpedia.bisks.net/*", zone_name = "bisks.net" },
]

# The Worker runs first for everything: it forwards /api/* to a KV-backed
# derived index and server-renders per-article OG tags for GET /wiki/<slug>;
# everything else falls through to the ASSETS binding. The PDS records remain
# authoritative; the index is intentionally best-effort.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[kv_namespaces]]
binding = "WIKI_STATE"

# Keep the old class migration history until the retired storage has been
# explicitly deleted. The live site uses only the KV binding above.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Wiki"]

[[migrations]]
tag = "v2"
deleted_classes = ["Wiki"]
