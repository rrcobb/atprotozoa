name = "atprotozoa-moistchicken"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site — everything runs in the browser. Type a Bluesky handle:
# it reads Bluesky's public AppView anonymously (getFollows, getFollowers,
# getAuthorFeed, getProfile, CORS *) to build that handle's network (follows
# ∪ followers), sums up likes across every post each member made in the
# rolling last 24 hours, and crowns whoever racked up the most total likes
# "moist chicken" — unless they have more followers than @gracekind.net, in
# which case they're disqualified and the next-highest total wins instead.
# See public/lib/*.js. Forked from sites/topchicken (copy, don't abstract).

routes = [
  { pattern = "bisks.net/moistchicken", zone_name = "bisks.net" },
  { pattern = "bisks.net/moistchicken/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
