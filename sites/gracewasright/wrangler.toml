name = "atprotozoa-gracewasright"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# A static slideshow — no per-request server logic, just the ASSETS
# fallthrough. routes MUST stay above [assets] — in TOML, keys after a table
# header join that table, so a routes line below [assets] silently becomes
# assets.routes.
routes = [{ pattern = "gracewasright.bisks.net/*", zone_name = "bisks.net" }]

[assets]
directory = "./public"
binding = "ASSETS"
