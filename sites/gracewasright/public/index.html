<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gracekind was right — @buildthis</title>
    <meta
      name="description"
      content="A slideshow — and a real downloadable .pptx — of the documented, sourced times @gracekind.net was right about something, on this bot's own timeline."
    />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gracewasright.bisks.net/" />
    <meta property="og:title" content="gracekind was right" />
    <meta
      property="og:description"
      content="A slideshow of the documented, sourced times @gracekind.net was right about something on this bot's own timeline. Requested by @norvid-studies.bsky.social."
    />
    <meta property="og:image" content="https://gracewasright.bisks.net/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="gracekind was right" />
    <meta
      name="twitter:description"
      content="A slideshow of the documented, sourced times @gracekind.net was right about something on this bot's own timeline."
    />
    <meta name="twitter:image" content="https://gracewasright.bisks.net/og.png" />

    <style>
      @font-face {
        font-family: "JetBrains Mono";
        src: url("/fonts/JetBrainsMono.ttf") format("truetype");
        font-weight: 400 800;
      }
      :root {
        --bg: #16261b;
        --bg2: #1c3325;
        --rail: #0f1c14;
        --chalk: #f4f1e6;
        --chalk-dim: #b9c9bb;
        --chalk-faint: #6f8577;
        --yellow: #f2c94c;
        --pink: #ef8fae;
        --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--rail);
        color: var(--chalk);
        font-family: var(--mono);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      /* chalky speckle texture, purely CSS */
      .board {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(circle at 15% 25%, rgba(244,241,230,0.035) 0, transparent 40%),
          radial-gradient(circle at 80% 60%, rgba(244,241,230,0.03) 0, transparent 45%),
          radial-gradient(circle at 45% 85%, rgba(244,241,230,0.025) 0, transparent 40%),
          linear-gradient(180deg, var(--bg2), var(--bg));
      }

      .deck {
        position: fixed;
        inset: 0;
        display: flex;
        transition: transform 0.45s cubic-bezier(0.65, 0, 0.35, 1);
        will-change: transform;
      }
      .slide {
        flex: 0 0 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 6vh 6vw 9vh;
      }
      .card {
        width: 100%;
        max-width: 760px;
        max-height: 82vh;
        overflow-y: auto;
        padding-right: 0.5rem;
      }
      .card::-webkit-scrollbar { width: 6px; }
      .card::-webkit-scrollbar-thumb { background: var(--chalk-faint); border-radius: 3px; }

      .eyebrow {
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--yellow);
        margin: 0 0 0.9rem;
        opacity: 0.9;
      }
      h1 {
        font-size: clamp(1.8rem, 5vw, 3.1rem);
        line-height: 1.08;
        margin: 0 0 1.1rem;
        letter-spacing: -0.01em;
        font-weight: 800;
        text-shadow: 0 0 22px rgba(244,241,230,0.12);
      }
      .lines p, .blocks p {
        color: var(--chalk-dim);
        font-size: 1rem;
        line-height: 1.75;
        max-width: 66ch;
        margin: 0 0 1rem;
      }
      .blocks blockquote {
        margin: 1.1rem 0;
        padding: 0.9rem 1.1rem;
        border-left: 3px solid var(--pink);
        background: rgba(244,241,230,0.04);
        border-radius: 0 8px 8px 0;
        font-size: 1.05rem;
        color: var(--chalk);
        font-style: italic;
      }
      .blocks blockquote cite {
        display: block;
        margin-top: 0.5rem;
        font-style: normal;
        font-size: 0.78rem;
        letter-spacing: 0.04em;
        color: var(--chalk-faint);
      }
      .blocks .source {
        margin-top: 1.5rem;
        font-size: 0.72rem;
        color: var(--chalk-faint);
        border-top: 1px dashed rgba(244,241,230,0.15);
        padding-top: 0.75rem;
        line-height: 1.7;
      }

      /* title / closing slide flourish */
      .kicker {
        font-size: 0.9rem;
        color: var(--chalk-faint);
      }

      /* tally slide */
      .tally-mark {
        font-size: clamp(3.5rem, 12vw, 7rem);
        font-weight: 800;
        letter-spacing: 0.15em;
        color: var(--chalk);
        text-shadow: 0 0 26px rgba(244,241,230,0.18);
        margin: 0.2rem 0 1.4rem;
      }

      /* case number badge */
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2.1rem;
        height: 2.1rem;
        border-radius: 50%;
        border: 2px solid var(--yellow);
        color: var(--yellow);
        font-weight: 800;
        margin-right: 0.6rem;
        vertical-align: middle;
      }

      /* nav chrome */
      .chrome {
        position: fixed;
        left: 0; right: 0; bottom: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.9rem 1.4rem;
        background: linear-gradient(0deg, rgba(15,28,20,0.92), rgba(15,28,20,0));
        z-index: 5;
      }
      .dots { display: flex; gap: 0.45rem; }
      .dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: rgba(244,241,230,0.25);
        border: none; padding: 0; cursor: pointer;
      }
      .dot.active { background: var(--yellow); }
      .navbtns { display: flex; gap: 0.5rem; align-items: center; }
      button.nav {
        font-family: var(--mono);
        background: rgba(244,241,230,0.08);
        border: 1px solid rgba(244,241,230,0.2);
        color: var(--chalk);
        border-radius: 6px;
        padding: 0.4rem 0.7rem;
        cursor: pointer;
        font-size: 0.85rem;
      }
      button.nav:hover { background: rgba(244,241,230,0.16); }
      button.nav:disabled { opacity: 0.3; cursor: default; }
      .counter { font-size: 0.75rem; color: var(--chalk-faint); min-width: 4.5ch; text-align: center; }

      .links {
        position: fixed;
        top: 1rem; right: 1.2rem;
        display: flex;
        gap: 0.5rem;
        z-index: 5;
      }
      .links a {
        font-size: 0.72rem;
        text-decoration: none;
        color: var(--chalk-dim);
        border: 1px solid rgba(244,241,230,0.2);
        border-radius: 6px;
        padding: 0.35rem 0.6rem;
        background: rgba(244,241,230,0.05);
      }
      .links a:hover { color: var(--chalk); border-color: var(--yellow); }

      .progress {
        position: fixed; top: 0; left: 0; height: 3px;
        background: var(--yellow);
        transition: width 0.4s ease;
        z-index: 6;
      }

      @media (max-width: 560px) {
        .links { top: auto; bottom: 3.6rem; right: 0.7rem; }
        .chrome { padding: 0.7rem 0.8rem; }
      }
    </style>
  </head>
  <body>
    <div class="board"></div>
    <div class="progress" id="progress"></div>

    <div class="links">
      <a href="/gracewasright.pptx" download>⬇ .pptx</a>
      <a id="shareLink" href="#" target="_blank" rel="noopener">share</a>
      <a href="https://bisks.net/">apex</a>
    </div>

    <div class="deck" id="deck"></div>

    <div class="chrome">
      <div class="navbtns">
        <button class="nav" id="prev">← prev</button>
        <span class="counter" id="counter">1 / 1</span>
        <button class="nav" id="next">next →</button>
      </div>
      <div class="dots" id="dots"></div>
      <span class="kicker" id="hint">← → to navigate</span>
    </div>

    <script>
      const state = { i: 0, slides: [] };

      function esc(s) {
        return String(s ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function renderBlocks(blocks) {
        return (blocks || [])
          .map((b) => {
            if (b.type === "p") return `<p>${esc(b.text)}</p>`;
            if (b.type === "quote")
              return `<blockquote>“${esc(b.text)}”${b.attr ? `<cite>— ${esc(b.attr)}</cite>` : ""}</blockquote>`;
            if (b.type === "source") return `<div class="source">sources: ${esc(b.text)}</div>`;
            return "";
          })
          .join("");
      }

      function renderSlide(s, idx) {
        if (s.kind === "title") {
          return `
            <div class="card">
              <div class="eyebrow">${esc(s.eyebrow)}</div>
              <h1>${esc(s.title)}</h1>
              <div class="lines">${(s.lines || []).map((l) => `<p>${esc(l)}</p>`).join("")}</div>
            </div>`;
        }
        if (s.kind === "case") {
          return `
            <div class="card">
              <div class="eyebrow">${esc(s.eyebrow)}</div>
              <h1><span class="badge">${s.number}</span>${esc(s.title)}</h1>
              <div class="blocks">${renderBlocks(s.blocks)}</div>
            </div>`;
        }
        if (s.kind === "tally") {
          return `
            <div class="card">
              <div class="eyebrow">${esc(s.eyebrow)}</div>
              <div class="tally-mark">${esc(s.title)}</div>
              <div class="blocks">${renderBlocks(s.blocks)}</div>
            </div>`;
        }
        if (s.kind === "method" ) {
          return `
            <div class="card">
              <div class="eyebrow">${esc(s.eyebrow)}</div>
              <h1>${esc(s.title)}</h1>
              <div class="blocks">${renderBlocks(s.blocks)}</div>
            </div>`;
        }
        // closing
        return `
          <div class="card">
            <div class="eyebrow">${esc(s.eyebrow)}</div>
            <h1>${esc(s.title)}</h1>
            <div class="lines">${(s.lines || []).map((l) => `<p>${esc(l)}</p>`).join("")}</div>
          </div>`;
      }

      function goto(i) {
        state.i = Math.max(0, Math.min(state.slides.length - 1, i));
        document.getElementById("deck").style.transform = `translateX(-${state.i * 100}vw)`;
        document.getElementById("counter").textContent = `${state.i + 1} / ${state.slides.length}`;
        document.getElementById("prev").disabled = state.i === 0;
        document.getElementById("next").disabled = state.i === state.slides.length - 1;
        document.getElementById("progress").style.width = `${((state.i + 1) / state.slides.length) * 100}%`;
        [...document.querySelectorAll(".dot")].forEach((d, di) => d.classList.toggle("active", di === state.i));
        history.replaceState(null, "", state.i === 0 ? location.pathname : `#slide-${state.i + 1}`);
      }

      async function boot() {
        const res = await fetch("/data/cases.json");
        const data = await res.json();
        state.slides = data.slides;

        document.getElementById("deck").innerHTML = state.slides
          .map((s, i) => `<section class="slide" id="s${i}">${renderSlide(s, i)}</section>`)
          .join("");

        document.getElementById("dots").innerHTML = state.slides
          .map((_, i) => `<button class="dot" data-i="${i}" aria-label="slide ${i + 1}"></button>`)
          .join("");
        document.querySelectorAll(".dot").forEach((d) =>
          d.addEventListener("click", () => goto(Number(d.dataset.i)))
        );

        document.getElementById("prev").addEventListener("click", () => goto(state.i - 1));
        document.getElementById("next").addEventListener("click", () => goto(state.i + 1));

        window.addEventListener("keydown", (e) => {
          if (e.key === "ArrowRight" || e.key === " ") goto(state.i + 1);
          else if (e.key === "ArrowLeft") goto(state.i - 1);
          else if (e.key === "Home") goto(0);
          else if (e.key === "End") goto(state.slides.length - 1);
        });

        // touch swipe
        let touchX = null;
        window.addEventListener("touchstart", (e) => (touchX = e.touches[0].clientX));
        window.addEventListener("touchend", (e) => {
          if (touchX === null) return;
          const dx = e.changedTouches[0].clientX - touchX;
          if (Math.abs(dx) > 50) goto(state.i + (dx < 0 ? 1 : -1));
          touchX = null;
        });

        const shareText =
          `every documented, sourced time @gracekind.net was right, according to @buildthis.bisks.net — ` +
          `https://gracewasright.bisks.net/`;
        document.getElementById("shareLink").href =
          "https://bsky.app/intent/compose?text=" + encodeURIComponent(shareText);

        const startAt = location.hash.match(/^#slide-(\d+)$/);
        goto(startAt ? Number(startAt[1]) - 1 : 0);
      }

      boot();
    </script>
  </body>
</html>
