name = "atprotozoa-war"
compatibility_date = "2025-01-01"

# Pure static + client-side OAuth (public client) — no server surface needed.
# Score and in-progress game state live in the signed-in player's own PDS
# (net.bisks.war.state, rkey "self"). House rules are a second per-repo record
# (net.bisks.war.ruleset, rkey "current") — Rob's own copy is the shared
# baseline everyone's fresh game forks from; anyone eligible can then edit
# their own copy, since atproto only lets you write your own repo.
assets = { directory = "./public" }

routes = [{ pattern = "war.bisks.net", custom_domain = true }]
