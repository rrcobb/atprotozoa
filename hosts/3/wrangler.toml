name = "atprotozoa-host-3"
main = "../src/index.ts"
compatibility_date = "2025-01-01"

# Serves group 3 of the hosted sites (fallback/sites.json). No routes:
# fallback holds *.bisks.net/* and passes each request here over a service
# binding. See "Hosted sites" in notes/20-deploy.md.
workers_dev = false

[vars]
GROUP = "3"

# ../build.mjs copies each group-3 site's public/ into .build/<name>/.
[build]
command = "node ../build.mjs 3"

# run_worker_first must stay true. .build/ holds every site in the group side
# by side, so without it the asset router would answer a.bisks.net/b/index.html
# with site b's page on site a's origin, before the Worker's hostname mapping
# ever ran.
[assets]
directory = "./.build"
binding = "ASSETS"
run_worker_first = true

# One data point per request, keyed by site, for sites/stats. See VISITS in
# ../src/index.ts and notes/86-stats.md.
[[analytics_engine_datasets]]
binding = "VISITS"
dataset = "bisks_hosted_requests"
